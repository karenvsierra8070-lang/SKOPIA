
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrones Decrecientes - Skopia</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--crema:#fdfbf5;--crema-mid:#f5f0e3;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;--oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;--sombra:rgba(39,43,0,0.08);--sombra-md:rgba(39,43,0,0.12);--sidebar-w:310px;--topbar-h:64px;--radius:14px;--radius-sm:8px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,0.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,0.1) 0%,transparent 50%);}
a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}ul{list-style:none;}input{font-family:inherit;}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--oliva-oscuro);color:var(--crema);display:flex;flex-direction:column;z-index:900;transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
.sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.sidebar-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--oliva-claro);}
.sidebar-username{font-family:'Patrick Hand',cursive;font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-program{font-size:.75rem;color:var(--oliva-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-search{padding:12px 14px;flex-shrink:0;}
.sidebar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:var(--crema);font-size:.85rem;outline:none;transition:border .2s;}
.sidebar-search input::placeholder{color:rgba(255,255,255,0.35);}
.sidebar-search input:focus{border-color:var(--oliva-claro);}
.sidebar-search-wrap{position:relative;}
.sidebar-search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:.8rem;}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--oliva-medio) transparent;}
.sidebar-nav::-webkit-scrollbar{width:5px;}.sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}
.menu-group-label{padding:14px 18px 6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);display:flex;align-items:center;gap:8px;}
.menu-group-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
.menu-cat{user-select:none;}
.menu-cat-btn{width:100%;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--crema);transition:background .2s;text-align:left;}
.menu-cat-btn:hover{background:rgba(255,255,255,0.06);}
.menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
.menu-cat-btn .chevron{margin-left:auto;font-size:.6rem;transition:transform .25s;color:var(--oliva-claro);}
.menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
.menu-cat-children{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.menu-cat.open>.menu-cat-children{max-height:2000px;}
.menu-sub{user-select:none;}
.menu-sub-btn{width:100%;padding:8px 18px 8px 44px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:rgba(253,251,245,0.75);transition:all .2s;text-align:left;}
.menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,0.04);}
.menu-sub-btn .chevron{margin-left:auto;font-size:.55rem;transition:transform .25s;opacity:.5;}
.menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
.menu-sub-children{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.menu-sub.open>.menu-sub-children{max-height:800px;}
.menu-link{display:block;padding:7px 18px 7px 62px;font-size:.78rem;color:rgba(253,251,245,0.55);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu-link:hover{color:var(--crema);background:rgba(255,255,255,0.06);padding-left:68px;}
.menu-link::before{content:'›';margin-right:6px;color:var(--oliva-claro);font-weight:700;}
.menu-link.active{color:#fff;background:rgba(255,255,255,0.1);padding-left:68px;}
.menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
.menu-note{padding:8px 18px 8px 44px;font-size:.72rem;color:rgba(253,251,245,0.35);font-style:italic;}
.menu-no-result{padding:20px 18px;text-align:center;font-size:.8rem;color:rgba(255,255,255,0.3);display:none;}
.menu-no-result.show{display:block;}
.sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-footer a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:rgba(253,251,245,0.6);transition:all .2s;}
.sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,0.06);}
.sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:899;opacity:0;visibility:hidden;transition:all .3s;}
.sidebar-overlay.active{opacity:1;visibility:visible;}
.main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .35s cubic-bezier(.4,0,.2,1);}
.main-wrap.expanded{margin-left:0;}
.topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(253,251,245,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,0.06);display:flex;align-items:center;padding:0 28px;gap:16px;}
.topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.1rem;color:var(--oliva-oscuro);transition:background .2s;flex-shrink:0;}
.topbar-toggle:hover{background:rgba(39,43,0,0.06);}
.topbar-breadcrumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--oliva-medio);flex-wrap:wrap;}
.topbar-breadcrumb a{color:var(--oliva-medio);transition:color .2s;}.topbar-breadcrumb a:hover{color:var(--oliva-oscuro);}
.topbar-breadcrumb .sep{opacity:.4;}.topbar-breadcrumb .current{color:var(--oliva-oscuro);font-weight:600;}
.topbar-clock{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--oliva-oscuro);letter-spacing:1px;flex-shrink:0;}
.page-content{padding:24px 28px 120px;max-width:900px;margin:0 auto;}
.game-header{text-align:center;margin-bottom:24px;}
.game-header h1{font-family:'Patrick Hand',cursive;font-size:2.2rem;margin-bottom:6px;}
.game-header p{color:var(--oliva-medio);font-size:.92rem;}
.progress-track{width:100%;height:6px;background:var(--oliva-super);border-radius:3px;margin-bottom:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--oliva-medio);border-radius:3px;transition:width .5s ease;width:0%;}
.card{background:#fff;border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px var(--sombra);margin-bottom:20px;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin-bottom:20px;}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px;}
.start-btn{background:var(--oliva-oscuro);color:var(--crema);border:none;padding:12px 32px;border-radius:28px;font-size:1rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.start-btn:hover{background:var(--oliva-medio);transform:translateY(-2px);}
.ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.ex-num{font-weight:600;font-size:1rem;}
.ex-score{font-family:'Orbitron',monospace;font-size:.9rem;color:var(--oliva-medio);}
.ex-context{font-size:.95rem;line-height:1.6;background:var(--crema);padding:18px;border-radius:12px;border-left:4px solid var(--oliva-medio);margin-bottom:18px;}
.ex-question{font-size:1.05rem;font-weight:500;margin-bottom:16px;}
.hint-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:.82rem;font-weight:500;color:var(--oliva-medio);background:rgba(90,97,51,0.08);border:1px solid rgba(90,97,51,0.15);transition:all .2s;margin-bottom:14px;}
.hint-btn:hover:not(:disabled){background:rgba(90,97,51,0.15);}
.hint-btn:disabled{opacity:.5;cursor:not-allowed;}
.hint-box{display:none;background:rgba(33,150,243,0.08);border-left:4px solid #2196F3;padding:14px 18px;border-radius:8px;margin-bottom:16px;font-size:.9rem;line-height:1.5;animation:fadeSlide .3s ease;}
.hint-box.show{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.exercise-table{width:100%;border-collapse:collapse;margin:20px 0;background-color:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px var(--sombra);}
.exercise-table th,.exercise-table td{padding:12px 15px;text-align:center;border:1px solid var(--oliva-palido);}
.exercise-table th{background-color:var(--oliva-medio);color:white;font-weight:600;font-size:.88rem;}
.exercise-table tr:nth-child(even){background-color:var(--crema);}
.exercise-table td{font-size:.9rem;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.opt-btn{background:#fff;border:2px solid var(--oliva-palido);border-radius:10px;padding:14px 16px;font-size:.92rem;color:var(--oliva-oscuro);transition:all .2s;display:flex;align-items:flex-start;gap:10px;text-align:left;line-height:1.4;}
.opt-btn:hover:not(:disabled):not(.correct):not(.incorrect){border-color:var(--oliva-claro);background:var(--crema);transform:translateY(-2px);}
.opt-btn:disabled{cursor:default;}
.opt-btn .opt-letter{font-weight:700;color:var(--oliva-medio);font-size:1rem;flex-shrink:0;width:24px;}
.opt-btn.correct{border-color:#4CAF50;background:rgba(76,175,80,0.08);}
.opt-btn.incorrect{border-color:#F44336;background:rgba(244,67,54,0.08);}
.opt-btn.correct .opt-letter{color:#4CAF50;}
.opt-btn.incorrect .opt-letter{color:#F44336;}
.feedback{display:none;padding:16px 18px;border-radius:10px;margin-top:18px;animation:fadeSlide .3s ease;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(76,175,80,0.08);border-left:4px solid #4CAF50;}
.feedback.fail{background:rgba(244,67,54,0.08);border-left:4px solid #F44336;}
.feedback h4{margin-bottom:6px;font-size:1rem;}
.feedback p{font-size:.88rem;line-height:1.5;}
.next-btn{background:var(--oliva-medio);color:#fff;padding:10px 24px;border-radius:24px;font-size:.92rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;margin-top:18px;}
.next-btn:hover:not(:disabled){background:var(--oliva-oscuro);transform:translateY(-2px);}
.next-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.results-card{text-align:center;padding:36px 28px;}
.results-card .icfes-level{display:inline-block;padding:6px 18px;border-radius:20px;font-size:.82rem;font-weight:600;margin-bottom:14px;}
.results-card .icfes-level.low{background:rgba(244,67,54,0.1);color:#d32f2f;}
.results-card .icfes-level.mid{background:rgba(255,152,0,0.1);color:#e65100;}
.results-card .icfes-level.high{background:rgba(76,175,80,0.1);color:#2e7d32;}
.results-card .icfes-level.top{background:rgba(39,43,0,0.08);color:var(--oliva-oscuro);}
.results-card h2{font-family:'Patrick Hand',cursive;font-size:2rem;margin-bottom:10px;}
.results-card .score-big{font-family:'Orbitron',monospace;font-size:2.4rem;font-weight:700;color:var(--oliva-medio);margin:12px 0;}
.results-card .icfes-msg{font-size:.92rem;line-height:1.6;color:#555;max-width:560px;margin:0 auto 24px;}
.results-card .pts-earned{font-size:.88rem;color:var(--oliva-medio);margin-bottom:20px;}
.restart-btn{background:var(--oliva-oscuro);color:var(--crema);padding:10px 24px;border-radius:24px;font-size:.92rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.restart-btn:hover{background:var(--oliva-medio);transform:translateY(-2px);}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--oliva-medio);font-size:.88rem;margin-left:16px;transition:color .2s;}
.back-link:hover{color:var(--oliva-oscuro);}
.panda-wrap{position:fixed;bottom:20px;left:20px;z-index:800;display:flex;align-items:flex-end;gap:10px;transition:opacity .3s,transform .3s;}
.panda-wrap.hidden{opacity:0;transform:translateY(20px);pointer-events:none;}
.panda-speech{background:#fff;padding:12px 16px;border-radius:14px 14px 14px 4px;box-shadow:0 4px 16px var(--sombra);font-size:.85rem;line-height:1.4;max-width:220px;position:relative;animation:fadeSlide .4s ease;}
.panda-speech::after{content:'';position:absolute;bottom:6px;left:-8px;border-width:6px 8px 6px 0;border-style:solid;border-color:transparent #fff transparent transparent;}
.panda-face{width:56px;height:52px;background:#fff;border-radius:50%;border:2.5px solid #333;position:relative;flex-shrink:0;animation:pandaBounce 2s ease-in-out infinite;}
@keyframes pandaBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.panda-ear{width:16px;height:16px;background:#333;border-radius:50%;position:absolute;top:-6px;}
.panda-ear.l{left:4px;}.panda-ear.r{right:4px;}
.panda-eye{width:11px;height:13px;background:#333;border-radius:50%;position:absolute;top:17px;}
.panda-eye.l{left:11px;}.panda-eye.r{right:11px;}
.panda-eye::after{content:'';width:4px;height:4px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;}
.panda-nose{width:7px;height:4px;background:#333;border-radius:50%;position:absolute;bottom:13px;left:50%;transform:translateX(-50%);}
.panda-mouth{width:12px;height:6px;border-bottom:2px solid #666;border-radius:0 0 50% 50%;position:absolute;bottom:7px;left:50%;transform:translateX(-50%);}
.medal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:5000;display:none;place-items:center;}
.medal-overlay.active{display:grid;}
.medal-box{background:#fff;border-radius:var(--radius);padding:36px 32px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:medalIn .4s ease;}
@keyframes medalIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.medal-icon{font-size:3.5rem;color:#f9a825;margin-bottom:14px;animation:medalSpin .6s ease .2s both;}
@keyframes medalSpin{from{transform:rotate(-30deg) scale(0);}to{transform:rotate(0) scale(1);}}
.medal-box h3{font-family:'Patrick Hand',cursive;font-size:1.6rem;color:var(--oliva-oscuro);margin-bottom:8px;}
.medal-name{font-size:1rem;color:#555;margin-bottom:6px;}
.medal-pts{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;color:var(--oliva-medio);margin-bottom:22px;}
.medal-close{background:var(--oliva-oscuro);color:var(--crema);padding:10px 32px;border-radius:24px;font-size:.92rem;font-weight:600;transition:all .2s;}
.medal-close:hover{background:var(--oliva-medio);}
.toast{position:fixed;bottom:24px;right:24px;background:#fff;padding:14px 20px;border-radius:var(--radius-sm);border-left:4px solid var(--oliva-medio);box-shadow:0 8px 24px var(--sombra-md);z-index:6000;font-size:.88rem;transform:translateY(100px);opacity:0;transition:all .35s ease;max-width:380px;}
.toast.show{transform:translateY(0);opacity:1;}
@media(max-width:768px){
    .sidebar{transform:translateX(calc(-1 * var(--sidebar-w)));}.sidebar.open{transform:translateX(0);}
    .main-wrap{margin-left:0!important;}
    .topbar{padding:0 16px;}
    .page-content{padding:16px 16px 120px;}
    .options{grid-template-columns:1fr;}
    .panda-wrap{bottom:12px;left:12px;}
    .panda-speech{max-width:170px;font-size:.8rem;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="dashboard.html"><img src="logo.jpeg" alt="Skopia" class="sidebar-logo"></a>
        <span class="sidebar-username" id="sidebar-username">Cargando...</span>
        <span class="sidebar-program" id="sidebar-program"></span>
    </div>
    <div class="sidebar-search"><div class="sidebar-search-wrap"><i class="fas fa-search"></i><input type="text" id="sidebar-search" placeholder="Buscar contenido..." aria-label="Buscar contenido"></div></div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Menú de contenido"></nav>
    <div class="sidebar-footer">
        <a href="cuenta.html"><i class="fas fa-user-circle"></i> Mi Cuenta</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main-wrap" id="main-wrap">
    <header class="topbar">
        <button class="topbar-toggle" id="topbar-toggle" aria-label="Menú"><i class="fas fa-bars"></i></button>
        <div class="topbar-breadcrumb">
            <a href="dashboard.html">Dashboard</a><span class="sep"><i class="fas fa-chevron-right" style="font-size:.55rem"></i></span>
            <a href="lab-logico-matematico.html">Lab. Lógico Matemático</a><span class="sep"><i class="fas fa-chevron-right" style="font-size:.55rem"></i></span>
            <span class="current">Patrones Crecientes</span>
        </div>
        <span class="topbar-clock" id="top-clock">00:00:00</span>
    </header>

    <div class="page-content">
        <div class="game-header">
            <h1>Patrones Crecientes</h1>
            <p>Identifica la regla que sigue cada secuencia y completa el patrón</p>
        </div>

        <div class="card" id="video-section">
            <div class="video-wrap">
                <iframe src="https://www.youtube.com/embed/9JufaCi51IU" title="Video introductorio" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
            </div>
            <div style="text-align:center"><button class="start-btn" id="start-btn"><i class="fas fa-play"></i> Comenzar ejercicio</button></div>
        </div>

        <div class="card" id="exercise-section" style="display:none">
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="ex-top">
                <span class="ex-num" id="ex-num">Ejercicio 1 de 5</span>
                <span class="ex-score" id="ex-score">0 / 5</span>
            </div>
            <div class="ex-context" id="ex-context"></div>
            <div class="ex-question" id="ex-question"></div>
            <div id="ex-table"></div>
            <button class="hint-btn" id="hint-btn"><i class="fas fa-lightbulb"></i> Usar pista</button>
            <div class="hint-box" id="hint-box"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"><h4 id="fb-title"></h4><p id="fb-text"></p></div>
            <button class="next-btn" id="next-btn" disabled>Siguiente <i class="fas fa-arrow-right"></i></button>
        </div>

        <div class="card results-card" id="results-section" style="display:none">
            <div class="icfes-level" id="icfes-level"></div>
            <h2 id="res-title"></h2>
            <div class="score-big" id="res-score"></div>
            <p class="pts-earned" id="res-pts"></p>
            <p class="icfes-msg" id="icfes-msg"></p>
            <button class="restart-btn" id="restart-btn"><i class="fas fa-redo"></i> Volver a intentar</button>
            <a href="lab-logico-matematico.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al módulo</a>
        </div>
    </div>
</div>

<div class="panda-wrap" id="panda-wrap">
    <div class="panda-speech" id="panda-speech">Hola, yo te ayudo a resolver patrones</div>
    <div class="panda-face">
        <div class="panda-ear l"></div><div class="panda-ear r"></div>
        <div class="panda-eye l"></div><div class="panda-eye r"></div>
        <div class="panda-nose"></div><div class="panda-mouth"></div>
    </div>
</div>

<div class="medal-overlay" id="medal-overlay">
    <div class="medal-box">
        <div class="medal-icon"><i class="fas fa-medal"></i></div>
        <h3>Misión Completada</h3>

function initSearch(){const i=document.getElementById('sidebar-search'),nr=document.getElementById('menu-no-result');i.addEventListener('input',()=>{const q=i.value.toLowerCase().trim(),nav=document.getElementById('sidebar-nav'),cats=nav.querySelectorAll('.menu-cat');let any=false;cats.forEach(cat=>{const cn=cat.dataset.name||'';const subs=cat.querySelectorAll('.menu-sub');const dl=cat.querySelectorAll(':scope>.menu-cat-children>.menu-link');let cm=cn.includes(q),sh=false;subs.forEach(sub=>{const sn=sub.dataset.name||'';const lks=sub.querySelectorAll('.menu-link');let sm=sn.includes(q),lv=false;lks.forEach(lk=>{const ln=lk.dataset.name||'';const show=!q||ln.includes(q)||sm||cm;lk.classList.toggle('hidden',!show);if(show)lv=true;});sub.classList.toggle('hidden',!lv&&!sm&&!cm&&q);if(sm||lv)sh=true;if(sm||lv)sub.classList.add('open');else sub.classList.remove('open');});dl.forEach(lk=>{const ln=lk.dataset.name||'';const show=!q||ln.includes(q)||cm;lk.classList.toggle('hidden',!show);if(show)sh=true;});cat.classList.toggle('hidden',!sh&&!cm&&q);if(cm||sh)any=true;if(cm||sh)cat.classList.add('open');});nr.classList.toggle('show',!any&&q.length>0);});}

const icfesMsg={0:{level:"Nivel Inferior",cls:"low",title:"Necesitas reforzar los fundamentos",msg:"Tu desempeño se ubica en el nivel más bajo. Se recomienda repasar los conceptos básicos de progresiones aritméticas y geométricas."},1:{level:"Nivel Mínimo",cls:"low",title:"Aún no alcanzas el nivel esperado",msg:"Tu desempeño indica que identificas algunos elementos de los patrones, pero necesitas mayor dominio en la identificación de reglas."},2:{level:"Nivel Insuficiente",cls:"mid",title:"Vas por buen camino, pero falta práctica",msg:"Tu desempeño está por debajo del nivel aceptable. Puedes identificar patrones simples, pero fallas en los más complejos."},3:{level:"Nivel Aceptable",cls:"mid",title:"Alcanzaste el mínimo requerido",msg:"Has alcanzado el nivel mínimo de competencia en esta habilidad. Demuestras comprensión básica de patrones crecientes."},4:{level:"Nivel Avanzado",cls:"high",title:"Buen desempeño",msg:"Demuestras capacidad para identificar distintos tipos de patrones crecientes. Continúa practicando para consolidar esta habilidad."},5:{level:"Nivel Sobresaliente",cls:"top",title:"Excelente desempeño",msg:"Demuestras dominio completo en la identificación y extrapolación de patrones crecientes. Esta habilidad es fundamental para el Saber Pro."}};

const pandaMsgs={start:["Vamos a resolver patrones, tú puedes.","Identifica la regla oculta en cada secuencia.","Concentración, cada patrón tiene su lógica."],correct:["Muy bien, respuesta correcta.","Excelente, tu lógica es impecable.","Genial, sigue así.","Así se hace.","Brillante, sigamos."],incorrect:["No te preocupes, analiza de nuevo la secuencia.","Casi, revisa bien los incrementos.","Ánimo, el siguiente lo tienes seguro."],hint:["Usar pistas también es parte de aprender.","Bien, ahora analiza la pista con calma."],goodEnd:["Lo lograste, eres un experto en patrones.","Increíble resultado, estoy orgulloso."],badEnd:["No te desanimes, la práctica hace al maestro.","Cada intento te acerca más al éxito."]};

const MC={5:{title:"Gana tu primer juego",pts:50},6:{title:"Usa una pista o ayuda en un juego",pts:30},10:{title:"Completa 3 misiones seguidas",pts:50},13:{title:"Gana 3 juegos distintos",pts:60},17:{title:"Obtén 500 estrellas acumuladas",pts:50},19:{title:"Repite un juego hasta mejorar tu resultado",pts:30},26:{title:"Suma 1000 estrellas totales",pts:50},32:{title:"Completa todos los juegos de un módulo",pts:100},37:{title:"Gana un juego sin usar pistas",pts:50},39:{title:"Completa 10 misiones seguidas sin fallar",pts:100},43:{title:"Consigue 3000 estrellas",pts:120},44:{title:"Estudia 10 días seguidos",pts:130},45:{title:"Completa 10 misiones",pts:140},53:{title:"Gana 4000 estrellas",pts:130},61:{title:"Consigue 6000 estrellas",pts:160},62:{title:"Estudia 20 días seguidos",pts:170},67:{title:"Termina 20 misiones",pts:160},73:{title:"Gana 8000 estrellas",pts:160},74:{title:"Termina 25 misiones",pts:170},80:{title:"Termina 30 misiones",pts:170},81:{title:"Gana 10,000 estrellas",pts:190},91:{title:"Llega a 20,000 estrellas",pts:200},92:{title:"Termina 50 misiones",pts:190},94:{title:"Termina todas las rutas al 100%",pts:200},95:{title:"Obtén todas las medallas",pts:190},96:{title:"Consigue 25,000 estrellas",pts:200},97:{title:"Cumple todas las misiones básicas e intermedias",pts:190},98:{title:"Mantente activo 30 días seguidos",pts:200},99:{title:"Llega a 30,000 estrellas",pts:200},100:{title:"Maestro del Saber Pro",pts:200}};

const MODULE_GAMES=['patrones-crecientes','patrones-decrecientes','secuencias-visuales','corregir-argumento','detectar-falacias','completar-tablas','relacion-causa-efecto','cambiar-datos','contradicciones'];
const STAR_THRESHOLDS=[{id:17,n:500},{id:26,n:1000},{id:43,n:3000},{id:53,n:4000},{id:61,n:6000},{id:73,n:8000},{id:81,n:10000},{id:91,n:20000},{id:96,n:25000},{id:99,n:30000}];
const MISSION_COUNT_THRESHOLDS=[{id:45,n:10},{id:67,n:20},{id:74,n:25},{id:80,n:30},{id:92,n:50}];
const STREAK_THRESHOLDS=[{id:44,n:10},{id:62,n:20},{id:98,n:30}];

let uid=null, userStats={}, completedMissions={}, gameBest=null;
let exercises=[], curIdx=0, score=0, usedHints=false, answered=false;
const $=id=>document.getElementById(id);

renderMenu();initSearch();initSidebar();

function updateClock(){const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0'),s=String(n.getSeconds()).padStart(2,'0');$('top-clock').textContent=`${h}:${m}:${s}`;}
updateClock();setInterval(updateClock,1000);

function pandaSay(msg){const el=$('panda-speech');el.style.animation='none';el.offsetHeight;el.style.animation='fadeSlide .4s ease';el.textContent=msg;}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function loadFirebaseData(){
    if(!uid)return;
    try{const s=await getDoc(doc(db,'users',uid,'stats','main'));if(s.exists())userStats=s.data();}catch(e){}
    userStats.totalStars=userStats.totalStars||0;userStats.gamesWon=userStats.gamesWon||0;userStats.gamesWonList=userStats.gamesWonList||[];userStats.consecutiveSuccesses=userStats.consecutiveSuccesses||0;userStats.currentStreak=userStats.currentStreak||0;userStats.longestStreak=userStats.longestStreak||0;userStats.lastStudyDate=userStats.lastStudyDate||null;userStats.totalMissionsCompleted=userStats.totalMissionsCompleted||0;userStats.totalDays=userStats.totalDays||0;
    try{const s=await getDocs(collection(db,'users',uid,'missions'));s.forEach(d=>{if(d.data().completed)completedMissions[d.id]=true;});}catch(e){}
    try{const s=await getDoc(doc(db,'users',uid,'gameScores','patrones-decrecientes'));if(s.exists())gameBest=s.data();}catch(e){}
}

async function saveStats(updates){if(!uid)return;try{await setDoc(doc(db,'users',uid,'stats','main'),updates,{merge:true});}catch(e){console.warn('Error guardando stats',e);}}
async function completeMissionInDB(id){if(!uid||completedMissions[`mission_${id}`])return;completedMissions[`mission_${id}`]=true;try{await setDoc(doc(db,'users',uid,'missions',`mission_${id}`),{completed:true,completedAt:serverTimestamp()});}catch(e){console.warn('Error guardando misión',e);}}

async function saveGameScore(sc,hints){
    if(!uid)return;const prev=gameBest?.bestScore||0;
    try{await setDoc(doc(db,'users',uid,'gameScores','patrones-decrecientes'),{bestScore:Math.max(prev,sc),lastScore:sc,timesPlayed:(gameBest?.timesPlayed||0)+1,usedHints:hints},{merge:true});}catch(e){}
    try{await setDoc(doc(db,'users',uid,'progress','patrones-decrecientes'),{status:sc>=3?'completed':'in_progress',lastVisited:serverTimestamp()},{merge:true});}catch(e){}
}

async function saveTodayInteraction(){
    if(!uid)return;const today=new Date().toISOString().split('T')[0];
    try{await setDoc(doc(db,'users',uid,'interactions',today),{secondsSpent:1800},{merge:true});}catch(e){}
}

async function updateStreak(){
    if(!uid)return;const today=new Date().toISOString().split('T')[0];const last=userStats.lastStudyDate;
    let newStreak=userStats.currentStreak||0;let newDays=userStats.totalDays||0;let newLongest=userStats.longestStreak||0;
    if(last===today){}else{const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().split('T')[0];if(last===yStr){newStreak++;}else{newStreak=1;newDays++;}newLongest=Math.max(newLongest,newStreak);}
    return{currentStreak:newStreak,longestStreak:newLongest,totalDays:newDays,lastStudyDate:today};
}

async function checkAndCompleteMissions(correctCount,hintsUsed){
    const won=correctCount>=3;const newMissions=[];const ptsEarned=correctCount*20;
    let newStars=userStats.totalStars+ptsEarned;

    // === FIX: Separar primera victoria de mejora de puntaje ===
    const hadWonBefore=(userStats.gamesWon||0)>0;
    const prevBest=gameBest?.bestScore||0;
    const improved=correctCount>prevBest;

    // Misión 5: Primera vez que ganas CUALQUIER juego
    if(won&&!hadWonBefore&&!completedMissions.mission_5){newMissions.push(5);}
    // Misión 19: Ya habías ganado antes Y mejoraste tu puntaje
    if(won&&hadWonBefore&&improved&&!completedMissions.mission_19){newMissions.push(19);}

    // Misión 6: Usaste pista
    if(hintsUsed&&!completedMissions.mission_6){newMissions.push(6);}
    // Misión 37: Ganaste sin pistas
    if(won&&!hintsUsed&&!completedMissions.mission_37){newMissions.push(37);}

    let newGamesList=[...(userStats.gamesWonList||[])];
    if(won&&!newGamesList.includes('patrones-decrecientes')){newGamesList.push('patrones-decrecientes');}
    if(newGamesList.length>=3&&!completedMissions.mission_13){newMissions.push(13);}
    if(MODULE_GAMES.every(g=>newGamesList.includes(g))&&!completedMissions.mission_32){newMissions.push(32);}
    let newConsecutive=userStats.consecutiveSuccesses||0;if(won)newConsecutive++;else newConsecutive=0;
    if(newConsecutive>=3&&!completedMissions.mission_10){newMissions.push(10);}
    if(newConsecutive>=10&&!completedMissions.mission_39){newMissions.push(39);}
    let newTotalMissions=(userStats.totalMissionsCompleted||0)+newMissions.length;
    let missionPts=0;newMissions.forEach(id=>{if(MC[id])missionPts+=MC[id].pts;});newStars+=missionPts;
    STAR_THRESHOLDS.forEach(t=>{if(newStars>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    MISSION_COUNT_THRESHOLDS.forEach(t=>{if(newTotalMissions>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    const streakData=await updateStreak();
    STREAK_THRESHOLDS.forEach(t=>{if((streakData?.currentStreak||0)>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    if(newTotalMissions>=84&&!completedMissions.mission_97){newMissions.push(97);newStars+=MC[97].pts;newTotalMissions++;}
    if(newTotalMissions>=95&&!completedMissions.mission_94){newMissions.push(94);newStars+=MC[94].pts;newTotalMissions++;}
    if(newTotalMissions>=100&&!completedMissions.mission_95){newMissions.push(95);newStars+=MC[95].pts;newTotalMissions++;}
    if(newTotalMissions>=100&&!completedMissions.mission_100){newMissions.push(100);newStars+=MC[100].pts;newTotalMissions++;}
    await saveStats({totalStars:newStars,gamesWon:userStats.gamesWon+(won?1:0),gamesWonList:newGamesList,consecutiveSuccesses:newConsecutive,totalMissionsCompleted:newTotalMissions,...(streakData||{})});
    for(const mid of newMissions){await completeMissionInDB(mid);showMedal(mid);}
    return{ptsEarned,missionPts,totalNewPts:ptsEarned+missionPts,newStars,newTotalMissions};
}

let medalQueue=[];
function showMedal(id){medalQueue.push(id);if(medalQueue.length===1)renderNextMedal();}
function renderNextMedal(){
    if(!medalQueue.length){$('medal-overlay').classList.remove('active');return;}
    const id=medalQueue[0];const m=MC[id]||{title:'Misión completada',pts:0};
    if(!m){medalQueue.shift();renderNextMedal();return;}
    $('medal-name').textContent=m.title;
    $('medal-pts').textContent=`+${m.pts} puntos`;
    $('medal-overlay').classList.add('active');
}
 $('medal-close').addEventListener('click',()=>{medalQueue.shift();renderNextMedal();});

async function startGame(){
    exercises=shuffle(bank).slice(0,5);curIdx=0;score=0;usedHints=false;answered=false;
    $('video-section').style.display='none';$('exercise-section').style.display='block';$('results-section').style.display='none';
    pandaSay(pandaMsgs.start[Math.floor(Math.random()*pandaMsgs.start.length)]);
    loadExercise();await saveTodayInteraction();
}

function loadExercise(){
    const ex=exercises[curIdx];
    $('ex-num').textContent=`Ejercicio ${curIdx+1} de ${exercises.length}`;
    $('ex-score').textContent=`${score} / ${exercises.length}`;
    $('progress-fill').style.width=`${(curIdx/exercises.length)*100}%`;
    $('ex-context').textContent=ex.context;$('ex-question').textContent=ex.question;
    $('ex-table').innerHTML=ex.image;$('hint-box').classList.remove('show');$('hint-box').textContent=ex.strategy;$('hint-btn').disabled=false;
    const optCont=$('options');optCont.innerHTML='';
    ex.options.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.innerHTML=`<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;btn.addEventListener('click',()=>selectAnswer(i,ex.correctAnswer));optCont.appendChild(btn);});
    $('feedback').classList.remove('show','ok','fail');$('next-btn').disabled=true;answered=false;
}

function selectAnswer(selected,correct){
    if(answered)return;answered=true;
    const btns=document.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);btns[correct].classList.add('correct');
    const fb=$('feedback');const ex=exercises[curIdx];
    if(selected===correct){score++;$('ex-score').textContent=`${score} / ${exercises.length}`;fb.className='feedback show ok';$('fb-title').textContent='¡Correcto!';pandaSay(pandaMsgs.correct[Math.floor(Math.random()*pandaMsgs.correct.length)]);}
    else{btns[selected].classList.add('incorrect');fb.className='feedback show fail';$('fb-title').textContent='Incorrecto';pandaSay(pandaMsgs.incorrect[Math.floor(Math.random()*pandaMsgs.incorrect.length)]);}
    $('fb-text').innerHTML=ex.solution;$('next-btn').disabled=false;$('hint-btn').disabled=true;
}

function nextExercise(){curIdx++;if(curIdx<exercises.length){loadExercise();}else{showResults();}}

async function showResults(){
    $('exercise-section').style.display='none';$('results-section').style.display='block';$('progress-fill').style.width='100%';
    const info=icfesMsg[score];$('icfes-level').className=`icfes-level ${info.cls}`;$('icfes-level').textContent=info.level;$('res-title').textContent=info.title;$('res-score').textContent=`${score} / 5`;$('icfes-msg').textContent=info.msg;
    // FIX: Checkear misiones ANTES de guardar el nuevo score,
    // así gameBest sigue siendo el valor anterior y la lógica funciona bien
    const missionData=await checkAndCompleteMissions(score,usedHints);
    // Ahora sí guardar el nuevo score
    await saveGameScore(score,usedHints);
    $('res-pts').textContent=`+${missionData.totalNewPts} puntos (Total: ${missionData.newStars} estrellas)`;
    if(score>=4){pandaSay(pandaMsgs.goodEnd[Math.floor(Math.random()*pandaMsgs.goodEnd.length)]);}else{pandaSay(pandaMsgs.badEnd[Math.floor(Math.random()*pandaMsgs.badEnd.length)]);}
}

 $('start-btn').addEventListener('click',startGame);
 $('next-btn').addEventListener('click',nextExercise);
 $('hint-btn').addEventListener('click',()=>{$('hint-box').classList.add('show');$('hint-btn').disabled=true;usedHints=true;pandaSay(pandaMsgs.hint[Math.floor(Math.random()*pandaMsgs.hint.length)]);});
 $('restart-btn').addEventListener('click',startGame);
 $('logout-btn').addEventListener('click',async()=>{try{await signOut(auth);window.location.href='index.html';}catch(e){console.error(e);}});

onAuthStateChanged(auth,async(user)=>{
    if(user){uid=user.uid;$('sidebar-username').textContent=user.displayName||user.email||'Usuario';await loadFirebaseData();}
    else{window.location.href='index.html';}
});
</script>
