<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta de Porcentajes y Razones - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --crema: #fdfbf5;
            --crema-mid: #f5f0e3;
            --oliva-oscuro: #272b00;
            --oliva-medio: #5a6133;
            --oliva-claro: #bec092;
            --oliva-palido: #d4d6b0;
            --oliva-super: #e8e9d4;
            --sombra: rgba(39,43,0,0.08);
            --sombra-md: rgba(39,43,0,0.12);
            --sidebar-w: 310px;
            --topbar-h: 72px;
            --radius: 14px;
            --radius-sm: 8px;
            --card-a:#7a6a2e;--card-b:#5a6133;--card-c:#3e6b3a;--card-d:#3d4a1e;--card-e:#6e7e3e;
            --dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{
            font-family:'Roboto',sans-serif;
            background:var(--crema);
            color:var(--oliva-oscuro);
            min-height:100vh;
            overflow-x:hidden;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(190,192,146,0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(90,97,51,0.1) 0%, transparent 50%);
        }
        a{text-decoration:none;color:inherit;}
        button{cursor:pointer;border:none;background:none;font-family:inherit;}
        ul{list-style:none;}
        input{font-family:inherit;}

        /* ===== SIDEBAR - COPIA EXACTA DEL DASHBOARD ===== */
        .sidebar{
            position:fixed;top:0;left:0;
            width:var(--sidebar-w);height:100vh;
            background:var(--oliva-oscuro);
            color:var(--crema);
            display:flex;flex-direction:column;
            z-index:900;
            transition:transform .35s cubic-bezier(.4,0,.2,1);
            overflow:hidden;
        }
        .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
        .sidebar-header{
            padding:20px 18px 14px;
            border-bottom:1px solid rgba(255,255,255,0.08);
            flex-shrink:0;
        }
        .sidebar-logo{
            width:48px;height:48px;border-radius:50%;
            object-fit:cover;margin-bottom:8px;
            border:2px solid var(--oliva-claro);
        }
        .sidebar-username{
            font-family:'Patrick Hand',cursive;
            font-size:1.25rem;display:block;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .sidebar-program{
            font-size:.75rem;color:var(--oliva-claro);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .sidebar-search{padding:12px 14px;flex-shrink:0;}
        .sidebar-search input{
            width:100%;padding:9px 12px 9px 34px;
            border-radius:var(--radius-sm);
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.06);
            color:var(--crema);font-size:.85rem;
            outline:none;transition:border .2s;
        }
        .sidebar-search input::placeholder{color:rgba(255,255,255,0.35);}
        .sidebar-search input:focus{border-color:var(--oliva-claro);}
        .sidebar-search-wrap{position:relative;}
        .sidebar-search-wrap i{
            position:absolute;left:11px;top:50%;transform:translateY(-50%);
            color:rgba(255,255,255,0.3);font-size:.8rem;
        }
        .sidebar-nav{
            flex:1;overflow-y:auto;overflow-x:hidden;
            padding:8px 0;
            scrollbar-width:thin;
            scrollbar-color:var(--oliva-medio) transparent;
        }
        .sidebar-nav::-webkit-scrollbar{width:5px;}
        .sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}

        .menu-group-label{
            padding:14px 18px 6px;
            font-size:.65rem;font-weight:700;
            text-transform:uppercase;letter-spacing:2px;
            color:var(--oliva-claro);
            display:flex;align-items:center;gap:8px;
        }
        .menu-group-label::after{
            content:'';flex:1;height:1px;
            background:rgba(255,255,255,0.08);
        }

        .menu-cat{user-select:none;}
        .menu-cat-btn{
            width:100%;padding:10px 18px;
            display:flex;align-items:center;gap:10px;
            font-size:.88rem;font-weight:600;
            color:var(--crema);transition:background .2s;
            text-align:left;
        }
        .menu-cat-btn:hover{background:rgba(255,255,255,0.06);}
        .menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
        .menu-cat-btn .chevron{
            margin-left:auto;font-size:.6rem;
            transition:transform .25s;color:var(--oliva-claro);
        }
        .menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
        .menu-cat-children{
            max-height:0;overflow:hidden;
            transition:max-height .35s ease;
        }
        .menu-cat.open>.menu-cat-children{max-height:2000px;}

        .menu-sub{user-select:none;}
        .menu-sub-btn{
            width:100%;padding:8px 18px 8px 44px;
            display:flex;align-items:center;gap:8px;
            font-size:.8rem;font-weight:500;
            color:rgba(253,251,245,0.75);transition:all .2s;
            text-align:left;
        }
        .menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,0.04);}
        .menu-sub-btn .chevron{
            margin-left:auto;font-size:.55rem;
            transition:transform .25s;opacity:.5;
        }
        .menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
        .menu-sub-children{
            max-height:0;overflow:hidden;
            transition:max-height .3s ease;
        }
        .menu-sub.open>.menu-sub-children{max-height:800px;}

        .menu-link{
            display:block;padding:7px 18px 7px 62px;
            font-size:.78rem;color:rgba(253,251,245,0.55);
            transition:all .2s;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis;
        }
        .menu-link:hover{
            color:var(--crema);background:rgba(255,255,255,0.06);
            padding-left:68px;
        }
        .menu-link::before{
            content:'›';margin-right:6px;
            color:var(--oliva-claro);font-weight:700;
        }
        .menu-link.active{color:#fff;background:rgba(255,255,255,0.1);padding-left:68px;}
        .menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
        .menu-no-result{
            padding:20px 18px;text-align:center;
            font-size:.8rem;color:rgba(255,255,255,0.3);
            display:none;
        }
        .menu-no-result.show{display:block;}
        .menu-note{
            padding:8px 18px 8px 44px;
            font-size:.72rem;color:rgba(253,251,245,0.35);
            font-style:italic;
        }

        .sidebar-footer{
            flex-shrink:0;padding:10px 0;
            border-top:1px solid rgba(255,255,255,0.08);
        }
        .sidebar-footer a{
            display:flex;align-items:center;gap:10px;
            padding:9px 18px;font-size:.82rem;
            color:rgba(253,251,245,0.6);transition:all .2s;
        }
        .sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,0.06);}
        .sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}

        .sidebar-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.45);
            z-index:899;opacity:0;visibility:hidden;
            transition:all .3s;
        }
        .sidebar-overlay.active{opacity:1;visibility:visible;}
        /* ===== FIN SIDEBAR - COPIA EXACTA DEL DASHBOARD ===== */

        .main-wrap{
            margin-left:var(--sidebar-w);
            min-height:100vh;
            transition:margin-left .35s cubic-bezier(.4,0,.2,1);
        }
        .main-wrap.expanded{margin-left:0;}

        .topbar{
            position:sticky;top:0;z-index:100;
            height:var(--topbar-h);
            background:rgba(253,251,245,0.85);
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(39,43,0,0.06);
            display:flex;align-items:center;
            padding:0 28px;gap:16px;
        }
        .topbar-toggle{
            width:40px;height:40px;border-radius:var(--radius-sm);
            display:grid;place-items:center;
            font-size:1.1rem;color:var(--oliva-oscuro);
            transition:background .2s;flex-shrink:0;
        }
        .topbar-toggle:hover{background:rgba(39,43,0,0.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{
            font-family:'Patrick Hand',cursive;
            font-size:1.5rem;line-height:1.2;
        }
        .topbar-greeting .breadcrumb{
            font-size:.82rem;color:var(--oliva-medio);
        }
        .topbar-greeting .breadcrumb span{color:var(--oliva-oscuro);font-weight:600;}
        .topbar-right{
            display:flex;align-items:center;gap:10px;flex-shrink:0;
        }
        .topbar-clock{
            font-family:'Orbitron',monospace;
            font-size:1.15rem;font-weight:700;
            color:var(--oliva-oscuro);letter-spacing:1px;
        }
        .topbar-stars{
            display:flex;align-items:center;gap:5px;
            padding:8px 14px;border-radius:var(--radius-sm);
            background:rgba(201,162,39,.1);
            font-family:'Orbitron',monospace;
            font-size:.88rem;font-weight:700;color:var(--dorado);
        }
        .topbar-stars i{font-size:.8rem;}

        /* ===== HERO PANDA ===== */
        .hero{position:relative;padding:40px 32px 32px;overflow:hidden;}
        .hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--oliva-oscuro) 0%,var(--oliva-medio) 60%,var(--card-c) 100%);z-index:0;}
        .hero-bamboo{position:absolute;bottom:0;left:0;right:0;height:100%;z-index:1;opacity:.06;overflow:hidden;}
        .bamboo-stalk{position:absolute;bottom:0;width:6px;background:repeating-linear-gradient(to top,var(--crema) 0px,var(--crema) 18px,transparent 18px,transparent 22px);border-radius:3px;}
        .hero-content{position:relative;z-index:2;display:flex;align-items:center;gap:32px;}
        .panda-wrap{flex-shrink:0;position:relative;}
        .panda-svg{width:140px;height:160px;animation:pandaBob 3s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(0,0,0,.2));}
        @keyframes pandaBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .panda-speech{position:absolute;top:-10px;right:-20px;background:var(--crema);padding:10px 16px;border-radius:16px 16px 4px 16px;font-size:.78rem;font-weight:500;color:var(--oliva-oscuro);box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:200px;line-height:1.4;animation:speechIn .5s .3s both;}
        .panda-speech::after{content:'';position:absolute;bottom:-6px;left:16px;width:12px;height:12px;background:var(--crema);transform:rotate(45deg);border-radius:0 0 3px 0;}
        @keyframes speechIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
        .hero-text{flex:1;color:var(--crema);}
        .hero-text h1{font-family:'Patrick Hand',cursive;font-size:2.2rem;line-height:1.15;margin-bottom:6px;}
        .hero-text p{font-size:.92rem;opacity:.8;line-height:1.5;max-width:480px;}
        .hero-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.12);font-size:.78rem;font-weight:500;color:var(--dorado-claro);}
        .hero-badge i{font-size:.7rem;}
        .hero-particles{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;}
        .h-particle{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(253,251,245,.15);animation:floatUp linear infinite;}
        @keyframes floatUp{0%{transform:translateY(100%) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh) scale(.5);opacity:0}}

        /* ===== PROGRESS BAR ===== */
        .route-progress{padding:0 32px 24px;}
        .rp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
        .rp-label{font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:8px;}
        .rp-label i{color:var(--oliva-medio);}
        .rp-count{font-family:'Orbitron',monospace;font-size:.82rem;color:var(--oliva-medio);font-weight:700;}
        .rp-bar{width:100%;height:10px;border-radius:5px;background:var(--oliva-super);overflow:hidden;box-shadow:inset 0 1px 3px rgba(39,43,0,.08);}
        .rp-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--oliva-medio),var(--dorado));transition:width 1.2s cubic-bezier(.4,0,.2,1);width:0;}
        .rp-detail{display:flex;justify-content:space-between;margin-top:6px;font-size:.72rem;color:var(--oliva-claro);}

        /* ===== SUBTOPIC CARDS ===== */
        .topics-grid{padding:0 32px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .topic-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 12px var(--sombra);transition:transform .25s,box-shadow .25s;opacity:0;transform:translateY(16px);animation:cardIn .5s forwards;border:1px solid rgba(39,43,0,.04);}
        .topic-card:nth-child(2){animation-delay:.08s;}.topic-card:nth-child(3){animation-delay:.16s;}.topic-card:nth-child(4){animation-delay:.24s;}.topic-card:nth-child(5){animation-delay:.32s;}
        @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
        .topic-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px var(--sombra-md);}
        .tc-top{padding:20px 20px 16px;display:flex;align-items:flex-start;gap:14px;}
        .tc-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15);}
        .tc-info{flex:1;min-width:0;}
        .tc-info h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;line-height:1.2;margin-bottom:3px;}
        .tc-info p{font-size:.78rem;color:var(--oliva-medio);line-height:1.35;}
        .tc-status{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
        .tc-badge{padding:4px 10px;border-radius:12px;font-size:.68rem;font-weight:600;letter-spacing:.3px;}
        .tc-badge.done{background:rgba(39,43,0,.08);color:var(--oliva-oscuro);}
        .tc-badge.avail{background:rgba(90,97,51,.08);color:var(--oliva-medio);}
        .tc-score{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;color:var(--oliva-oscuro);}
        .tc-score small{font-size:.65rem;font-weight:400;color:var(--oliva-claro);display:block;text-align:right;}
        .tc-bar{height:4px;background:var(--oliva-super);margin:0 20px;overflow:hidden;}
        .tc-bar-fill{height:100%;border-radius:2px;transition:width 1s ease;width:0;}
        .tc-actions{padding:14px 20px;display:flex;gap:10px;border-top:1px solid rgba(39,43,0,.04);}
        .tc-btn{flex:1;padding:10px 14px;border-radius:var(--radius-sm);font-size:.8rem;font-weight:600;text-align:center;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
        .tc-btn.study{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .tc-btn.study:hover{background:var(--oliva-palido);}
        .tc-btn.exam{background:var(--oliva-oscuro);color:var(--crema);}
        .tc-btn.exam:hover{background:var(--oliva-medio);}
        .tc-btn i{font-size:.75rem;}

        /* ===== PRACTICE EXAM ===== */
        .practice-section{padding:0 32px 32px;}
        .practice-card{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));border-radius:var(--radius);padding:28px 32px;display:flex;align-items:center;gap:24px;color:var(--crema);box-shadow:0 6px 24px rgba(39,43,0,.2);opacity:0;transform:translateY(16px);animation:cardIn .5s .4s forwards;position:relative;overflow:hidden;}
        .practice-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);}
        .practice-card::after{content:'';position:absolute;bottom:-60px;right:60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.03);}
        .practice-icon{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.5rem;flex-shrink:0;position:relative;z-index:1;}
        .practice-info{flex:1;position:relative;z-index:1;}
        .practice-info h3{font-family:'Patrick Hand',cursive;font-size:1.35rem;margin-bottom:4px;}
        .practice-info p{font-size:.85rem;opacity:.7;line-height:1.4;}
        .practice-btn{padding:14px 28px;border-radius:var(--radius-sm);background:var(--dorado);color:var(--oliva-oscuro);font-weight:700;font-size:.88rem;transition:all .25s;flex-shrink:0;position:relative;z-index:1;display:flex;align-items:center;gap:8px;white-space:nowrap;}
        .practice-btn:hover{background:var(--dorado-claro);transform:scale(1.03);}

        /* ===== MISSIONS PANEL ===== */
        .missions-section{padding:0 32px 40px;}
        .missions-panel{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:0 2px 12px var(--sombra);opacity:0;transform:translateY(16px);animation:cardIn .5s .5s forwards;}
        .missions-panel h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
        .missions-panel h3 i{color:var(--dorado);font-size:.9rem;}
        .mission-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:6px;transition:background .2s;}
        .mission-item:hover{background:var(--crema);}
        .mission-dot{width:32px;height:32px;border-radius:50%;background:var(--oliva-super);flex-shrink:0;display:grid;place-items:center;font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;color:var(--oliva-medio);border:2px solid var(--oliva-palido);}
        .mission-dot.done{background:var(--oliva-oscuro);color:var(--dorado-claro);border-color:var(--oliva-oscuro);}
        .mission-text{flex:1;font-size:.85rem;min-width:0;line-height:1.3;}
        .mission-text .m-pts{font-size:.7rem;color:var(--oliva-claro);margin-left:6px;font-weight:500;}
        .mission-check{color:var(--dorado);font-size:.9rem;opacity:0;transition:opacity .3s;}
        .mission-check.show{opacity:1;}
        .mission-empty{text-align:center;padding:24px 0;color:var(--oliva-claro);font-size:.88rem;}

        /* ===== MODAL CELEBRACIÓN DE MISIÓN ===== */
        .mission-modal-overlay{
            position:fixed;inset:0;
            background:rgba(39,43,0,.55);
            backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
            z-index:7000;display:none;place-items:center;
            animation:modalBgIn .3s ease;
        }
        .mission-modal-overlay.active{display:grid;}
        @keyframes modalBgIn{from{opacity:0}to{opacity:1}}
        .mission-modal{
            background:#fff;border-radius:20px;
            padding:0;max-width:420px;width:92%;
            box-shadow:0 24px 80px rgba(39,43,0,.25);
            text-align:center;overflow:hidden;
            animation:modalPopIn .45s cubic-bezier(.17,.67,.29,1.2);
            position:relative;
        }
        @keyframes modalPopIn{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .mission-modal-top{
            background:linear-gradient(135deg,var(--oliva-oscuro) 0%,var(--oliva-medio) 70%,var(--card-c) 100%);
            padding:36px 28px 32px;position:relative;overflow:hidden;
        }
        .mission-modal-top::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);}
        .mission-modal-top::after{content:'';position:absolute;bottom:-40px;left:40%;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.04);}
        .mm-star{
            width:72px;height:72px;margin:0 auto 16px;border-radius:50%;
            background:rgba(201,162,39,.15);display:grid;place-items:center;
            position:relative;z-index:1;animation:starPulse 1.5s ease-in-out infinite;
        }
        @keyframes starPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,162,39,.3)}50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(201,162,39,0)}}
        .mm-star i{font-size:2rem;color:var(--dorado-claro);}
        .mm-title{font-family:'Patrick Hand',cursive;font-size:1.55rem;color:var(--crema);line-height:1.2;position:relative;z-index:1;margin-bottom:4px;}
        .mm-subtitle{font-size:.82rem;color:rgba(253,251,245,.65);position:relative;z-index:1;}
        .mm-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
        .mm-confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;animation:confettiFall 2.5s ease-out forwards;}
        @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:1;}100%{transform:translateY(260px) rotate(720deg) scale(.4);opacity:0;}}
        .mission-modal-body{padding:28px 28px 24px;}
        .mm-mission-name{font-size:1.05rem;font-weight:600;color:var(--oliva-oscuro);line-height:1.4;margin-bottom:16px;}
        .mm-pts-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;}
        .mm-pts-badge{
            display:inline-flex;align-items:center;gap:6px;

function renderMenu() {
    const nav = document.getElementById('sidebar-nav');
    let html = '<div class="menu-no-result" id="menu-no-result">Sin resultados</div>';
    menuData.forEach(g => {
        html += `<div class="menu-group-label"><i class="fas ${g.icon}"></i> ${g.group}</div>`;
        g.cats.forEach(cat => {
            html += `<div class="menu-cat" data-name="${cat.title.toLowerCase()}">`;
            html += `<button class="menu-cat-btn" aria-expanded="false"><i class="cat-icon fas ${cat.icon}"></i><span>${cat.title}</span><i class="fas fa-chevron-right chevron"></i></button>`;
            html += '<div class="menu-cat-children">';
            if (cat.note) html += `<div class="menu-note">${cat.note}</div>`;
            if (cat.subs) cat.subs.forEach(sub => {
                html += `<div class="menu-sub" data-name="${sub.title.toLowerCase()}"><button class="menu-sub-btn" aria-expanded="false"><span>${sub.title}</span><i class="fas fa-chevron-right chevron"></i></button><div class="menu-sub-children">`;
                if (sub.links) sub.links.forEach(lk => {
                    html += `<a href="${lk.url}" class="menu-link${lk.url==='porcentajes-razones.html'?' active':''}" data-name="${lk.label.toLowerCase()}">${lk.label}</a>`;
                });
                html += '</div></div>';
            });
            if (cat.links && cat.links.length) cat.links.forEach(lk => {
                html += `<a href="${lk.url}" class="menu-link" data-name="${lk.label.toLowerCase()}">${lk.label}</a>`;
            });
            html += '</div></div>';
        });
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.menu-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const cat = btn.parentElement;
            const wasOpen = cat.classList.contains('open');
            cat.parentElement.querySelectorAll(':scope > .menu-cat.open').forEach(s => {
                if (s !== cat) { s.classList.remove('open'); s.querySelector('.menu-cat-btn').setAttribute('aria-expanded', 'false'); }
            });
            cat.classList.toggle('open', !wasOpen);
            btn.setAttribute('aria-expanded', String(!wasOpen));
        });
    });
    nav.querySelectorAll('.menu-sub-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const sub = btn.parentElement;
            const wasOpen = sub.classList.contains('open');
            sub.parentElement.querySelectorAll(':scope > .menu-sub.open').forEach(s => { if (s !== sub) s.classList.remove('open'); });
            sub.classList.toggle('open', !wasOpen);
            btn.setAttribute('aria-expanded', String(!wasOpen));
        });
    });
}

function initSearch() {
    const input = document.getElementById('sidebar-search');
    const noRes = document.getElementById('menu-no-result');
    input.addEventListener('input', () => {
        const q = input.value.toLowerCase().trim();
        const cats = document.querySelectorAll('.menu-cat');
        let anyVisible = false;
        cats.forEach(cat => {
            const catName = cat.dataset.name || '';
            const subs = cat.querySelectorAll('.menu-sub');
            const directLinks = cat.querySelectorAll(':scope > .menu-cat-children > .menu-link');
            let catMatch = catName.includes(q);
            let subHasVisible = false;
            subs.forEach(sub => {
                const subName = sub.dataset.name || '';
                const links = sub.querySelectorAll('.menu-link');
                let subMatch = subName.includes(q);
                let linkVisible = false;
                links.forEach(lk => {
                    const ln = lk.dataset.name || '';
                    const show = !q || ln.includes(q) || subMatch || catMatch;
                    lk.classList.toggle('hidden', !show);
                    if (show) linkVisible = true;
                });
                sub.classList.toggle('hidden', !linkVisible && !subMatch && !catMatch && q);
                if (subMatch || linkVisible) subHasVisible = true;
            });
            directLinks.forEach(lk => {
                const ln = lk.dataset.name || '';
                const show = !q || ln.includes(q) || catMatch;
                lk.classList.toggle('hidden', !show);
                if (show) subHasVisible = true;
            });
            cat.classList.toggle('hidden', !subHasVisible && !catMatch && !!q);
            if (subHasVisible || catMatch) anyVisible = true;
        });
        noRes.classList.toggle('show', !anyVisible && !!q);
    });
}

    const rcTopics=Object.keys(rcData).filter(k=>k!=='avg'&&k!=='completed');
    const rcAvgs=rcTopics.map(k=>rcData[k].avg).filter(a=>a>0);

async function checkAndCompleteMissions(){
    if(!uid)return;
    const streak=userData.streak||{current:0};
    const completed=SUBTOPICS.filter(s=>examData[s.id]&&examData[s.id].correct>=PASS_THRESHOLD);
    const count=completed.length;
    const avg=count>0?Math.round(completed.reduce((a,s)=>a+(examData[s.id].bestScore||0),0)/count):0;

    let allExamAttempts=0;
    const allExams=userData.exams||{};
    for(const key of Object.keys(allExams)){allExamAttempts+=(allExams[key].attempts||0);}
    const totalQuestions=allExamAttempts*QUESTIONS_PER_EXAM;

    let exams240=0,exams250=0,exams300=0;
    for(const key of Object.keys(allExams)){const ex=allExams[key];if((ex.bestScore||0)>=240)exams240++;if((ex.bestScore||0)>=250)exams250++;if((ex.bestScore||0)>=300)exams300++;}

    let routes250=0;
    for(const mod of ALL_MODULES){if(routeData[mod]&&routeData[mod].avg>=250)routes250++;}
    const rcComplete=routeData.RC?.completed||false;
    const lcComplete=routeData.LC?.completed||false;
    const ccComplete=routeData.CC?.completed||false;
    let routesComplete=0;if(rcComplete)routesComplete++;if(lcComplete)routesComplete++;if(ccComplete)routesComplete++;
    const rcAvg=routeData.RC?.avg||0;

    const practiceCount=Object.keys(userData.practiceExams||{}).filter(k=>userData.practiceExams[k].completed).length;

    const checks=[
        {id:4, cond:false, _was:false},
        {id:9, cond:false, _was:false},
        {id:17, cond:false, _was:false},
        {id:36, cond:false, _was:false},
        {id:41, cond:false, _was:false},
        {id:43, cond:false, _was:false},
        {id:53, cond:false, _was:false},
        {id:54, cond:false, _was:false},
        {id:57, cond:false, _was:false},
        {id:61, cond:false, _was:false},
        {id:63, cond:false, _was:false},
        {id:64, cond:false, _was:false},
        {id:67, cond:false, _was:false},
        {id:68, cond:false, _was:false},
        {id:69, cond:false, _was:false},
        {id:73, cond:false, _was:false},
        {id:81, cond:false, _was:false},
        {id:86, cond:false, _was:false},
        {id:88, cond:false, _was:false},
        {id:89, cond:false, _was:false},
        {id:90, cond:false, _was:false},
        {id:91, cond:false, _was:false},
        {id:92, cond:false, _was:false},
        {id:94, cond:false, _was:false},
        {id:95, cond:false, _was:false},
        {id:96, cond:false, _was:false},
        {id:97, cond:false, _was:false},
        {id:98, cond:false, _was:false},
        {id:99, cond:false, _was:false},
        {id:100, cond:false, _was:false}
    ];

    function evalConditions(){
        const s=userData.stars||0;
        const cm=Object.keys(missionData).filter(k=>missionData[k].completed).length;
        checks[0].cond= count===5&&completed.every(x=>(examData[x.id].correct||0)>=PASS_THRESHOLD);
        checks[1].cond= s>=200;
        checks[2].cond= s>=500;
        checks[3].cond= s>=2000;
        checks[4].cond= exams240>=5;
        checks[5].cond= s>=3000;
        checks[6].cond= s>=4000;
        checks[7].cond= rcAvg>=200;
        checks[8].cond= routes250>=3;
        checks[9].cond= s>=6000;
        checks[10].cond= count===5&&completed.every(x=>(examData[x.id].bestScore||0)>=MAX_SCORE);
        checks[11].cond= totalQuestions>=1000;
        checks[12].cond= cm>=20;
        checks[13].cond= avg>=250;
        checks[14].cond= exams250>=5;
        checks[15].cond= s>=8000;
        checks[16].cond= s>=10000;
        checks[17].cond= s>=15000;
        checks[18].cond= exams300>=1;
        checks[19].cond= cm>=40;
        checks[20].cond= practiceCount>=1;
        checks[21].cond= s>=20000;
        checks[22].cond= cm>=50;
        checks[23].cond= routesComplete===3;
        checks[24].cond= cm>=100;
        checks[25].cond= s>=25000;
        checks[26].cond= cm>=75;
        checks[27].cond= (streak.current||0)>=30;
        checks[28].cond= s>=30000;
        checks[29].cond= cm>=100&&routesComplete===3&&s>=30000;
    }

    for(const c of checks){c._was=missionData[c.id]?.completed||false;}
    evalConditions();

    const batch=writeBatch(db);
    let newOnes=[];
    for(const c of checks){
        if(c._was)continue;
        if(!c.cond)continue;
        const info=getMissionInfo(c.id);
        missionData[c.id]={completed:true,completedAt:new Date().toISOString()};
        batch.set(doc(db,'users',uid,'missions','mission_'+c.id),{completed:true,completedAt:new Date().toISOString()});
        newOnes.push({title:info.title,points:info.points||0});
    }

    if(newOnes.length>0){

        for(const mid of Object.keys(missionData)){if(missionData[mid].completed)totalStars+=(getMissionInfo(parseInt(mid)).points||0);}
        userData.stars=totalStars;
        batch.update(doc(db,'users',uid),{stars:totalStars,totalMissionsCompleted:Object.keys(missionData).filter(k=>missionData[k].completed).length});
        try{await batch.commit();}catch(e){console.error('Error batch:',e);}
        const toShow=newOnes.splice(0,3);
        missionQueue.push(...newOnes);
        showMissionModal(toShow);

        for(let i=0;i<3;i++){
            evalConditions();
            let more=[];const batch2=writeBatch(db);
            for(const c of checks){
                if(missionData[c.id]?.completed)continue;if(!c.cond)continue;
                const info=getMissionInfo(c.id);
                missionData[c.id]={completed:true,completedAt:new Date().toISOString()};
                batch2.set(doc(db,'users',uid,'missions','mission_'+c.id),{completed:true,completedAt:new Date().toISOString()});
                userData.stars+=info.points||0;
                more.push({title:info.title,points:info.points||0});
            }
            if(more.length===0)break;
            let totalS=0;for(const mid of Object.keys(missionData)){if(missionData[mid].completed)totalS+=(getMissionInfo(parseInt(mid)).points||0);}
            userData.stars=totalS;
            batch2.update(doc(db,'users',uid),{stars:totalS,totalMissionsCompleted:Object.keys(missionData).filter(k=>missionData[k].completed).length});
            try{await batch2.commit();}catch(e){break;}
            missionQueue.push(...more);
        }
        document.getElementById('top-stars').textContent=userData.stars||0;
    }
}

    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    const yKey=`${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
    if(streak.lastDate===yKey)streak.current=(streak.current||0)+1;
    else if(streak.lastDate!==today)streak.current=1;
    streak.lastDate=today;streak.totalDays=(streak.totalDays||0)+1;
    userData.streak=streak;
    try{await updateDoc(doc(db,'users',uid),{streak});}catch(e){}
}

/* ===== INICIO ===== */
onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='index.html';return;}
    uid=user.uid;
    try{
        await loadAllData();
        document.getElementById('sidebar-username').textContent = userData.name || userData.nombre || userData.displayName || 'Estudiante';
        document.getElementById('sidebar-program').textContent = userData.program || userData.programa || '';
        renderPage();
        await updateStreak();
        await saveRouteState();
        await checkAndCompleteMissions();
    }catch(err){
        console.error('Error cargando datos:',err);
        document.getElementById('page-content').innerHTML=`<div class="loading-spinner"><p style="color:var(--rojo-suave)">Error al cargar tus datos. Recarga la pagina.</p></div>`;
    }
});
</script>
