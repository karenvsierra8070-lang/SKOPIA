<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regla de Tres - Leyendo - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root{--crema:#fdfbf5;--crema-mid:#f5f0e3;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;--oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;--sombra:rgba(39,43,0,.08);--sombra-md:rgba(39,43,0,.12);--sidebar-w:310px;--topbar-h:72px;--radius:14px;--radius-sm:8px;--dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;--verde:#3e6b3a;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,.1) 0%,transparent 50%);}
        a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}ul{list-style:none;}input{font-family:inherit;}
        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--oliva-oscuro);color:var(--crema);display:flex;flex-direction:column;z-index:900;transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
        .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
        .sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
        .sidebar-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--oliva-claro);}
        .sidebar-username{font-family:'Patrick Hand',cursive;font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-program{font-size:.75rem;color:var(--oliva-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-search{padding:12px 14px;flex-shrink:0;}
        .sidebar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--crema);font-size:.85rem;outline:none;transition:border .2s;}
        .sidebar-search input::placeholder{color:rgba(255,255,255,.35);}
        .sidebar-search input:focus{border-color:var(--oliva-claro);}
        .sidebar-search-wrap{position:relative;}
        .sidebar-search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:.8rem;}
        .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--oliva-medio) transparent;}
        .sidebar-nav::-webkit-scrollbar{width:5px;}.sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}
        .menu-group-label{padding:14px 18px 6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);display:flex;align-items:center;gap:8px;}
        .menu-group-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
        .menu-cat{user-select:none;}
        .menu-cat-btn{width:100%;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--crema);transition:background .2s;text-align:left;}
        .menu-cat-btn:hover{background:rgba(255,255,255,.06);}
        .menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
        .menu-cat-btn .chevron{margin-left:auto;font-size:.6rem;transition:transform .25s;color:var(--oliva-claro);}
        .menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
        .menu-cat-children{max-height:0;overflow:hidden;transition:max-height .35s ease;}
        .menu-cat.open>.menu-cat-children{max-height:2000px;}
        .menu-sub{user-select:none;}
        .menu-sub-btn{width:100%;padding:8px 18px 8px 44px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:rgba(253,251,245,.75);transition:all .2s;text-align:left;}
        .menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,.04);}
        .menu-sub-btn .chevron{margin-left:auto;font-size:.55rem;transition:transform .25s;opacity:.5;}
        .menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
        .menu-sub-children{max-height:0;overflow:hidden;transition:max-height .3s ease;}
        .menu-sub.open>.menu-sub-children{max-height:800px;}
        .menu-link{display:block;padding:7px 18px 7px 62px;font-size:.78rem;color:rgba(253,251,245,.55);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .menu-link:hover{color:var(--crema);background:rgba(255,255,255,.06);padding-left:68px;}
        .menu-link::before{content:'›';margin-right:6px;color:var(--oliva-claro);font-weight:700;}
        .menu-link.active{color:#fff;background:rgba(255,255,255,.1);padding-left:68px;}
        .menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
        .menu-no-result{padding:20px 18px;text-align:center;font-size:.8rem;color:rgba(255,255,255,.3);display:none;}
        .menu-no-result.show{display:block;}
        .menu-note{padding:8px 18px 8px 44px;font-size:.72rem;color:rgba(253,251,245,.35);font-style:italic;}
        .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);}
        .sidebar-footer a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:rgba(253,251,245,.6);transition:all .2s;}
        .sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,.06);}
        .sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:899;opacity:0;visibility:hidden;transition:all .3s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}
        .main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .35s cubic-bezier(.4,0,.2,1);}
        .main-wrap.expanded{margin-left:0;}
        .topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(253,251,245,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,.06);display:flex;align-items:center;padding:0 28px;gap:16px;}
        .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.1rem;color:var(--oliva-oscuro);transition:background .2s;flex-shrink:0;}
        .topbar-toggle:hover{background:rgba(39,43,0,.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{font-family:'Patrick Hand',cursive;font-size:1.5rem;line-height:1.2;}
        .topbar-greeting .sub{font-size:.82rem;color:var(--oliva-medio);}
        .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
        .topbar-clock{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;color:var(--oliva-oscuro);letter-spacing:1px;}
        .topbar-stars{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:rgba(201,162,39,.1);font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;color:var(--dorado);}
        .topbar-stars i{font-size:.75rem;}
        .theory{padding:28px 32px 40px;}
        .theory-section{display:none;animation:fadeUp .4s ease;}
        .theory-section.active{display:block;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        @keyframes medalPop{from{opacity:0;transform:scale(.65) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .comp-box{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));color:var(--crema);border-radius:var(--radius);padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden;}
        .comp-box::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);}
        .comp-box h2{font-family:'Patrick Hand',cursive;font-size:1.4rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .comp-box h2 i{color:var(--dorado-claro);}
        .comp-box p{font-size:.88rem;line-height:1.6;opacity:.85;}
        .panda-msg{background:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;box-shadow:0 2px 12px var(--sombra);border-left:4px solid var(--dorado);display:flex;gap:16px;align-items:flex-start;}
        .panda-msg img{width:56px;height:64px;flex-shrink:0;}
        .panda-msg p{font-size:.9rem;line-height:1.55;color:var(--oliva-oscuro);}
        .panda-msg p strong{color:var(--oliva-medio);}
        .formula-card{background:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;box-shadow:0 2px 10px var(--sombra);border:1px solid rgba(39,43,0,.04);}
        .formula-card h3{font-family:'Patrick Hand',cursive;font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--oliva-medio);}
        .formula-card h3 i{font-size:.9rem;}
        .formula-card .katex-display{margin:12px 0;font-size:1.05rem;}
        .formula-card .formula-note{font-size:.82rem;color:var(--oliva-claro);margin-top:8px;line-height:1.4;}
        .no-entiendo-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;background:var(--oliva-super);color:var(--oliva-medio);font-size:.82rem;font-weight:600;transition:all .2s;margin-top:12px;}
        .no-entiendo-btn:hover{background:var(--oliva-palido);transform:translateY(-1px);}
        .type-card{background:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;box-shadow:0 2px 10px var(--sombra);border-left:4px solid var(--oliva-medio);}
        .type-card h4{font-size:.95rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .type-card h4 i{color:var(--oliva-medio);font-size:.85rem;}
        .type-card p{font-size:.85rem;line-height:1.5;color:#444;}
        .popup-overlay{position:fixed;inset:0;background:rgba(39,43,0,.5);backdrop-filter:blur(4px);z-index:5000;display:none;place-items:center;padding:20px;}
        .popup-overlay.active{display:grid;}
        .popup-box{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(39,43,0,.25);animation:popIn .3s ease;}
        .popup-header{background:var(--oliva-oscuro);color:var(--crema);padding:20px 24px;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;gap:12px;}
        .popup-header img{width:40px;height:46px;}
        .popup-header div h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;}
        .popup-header div p{font-size:.78rem;opacity:.7;}
        .popup-close{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--crema);font-size:.9rem;transition:background .2s;}
        .popup-close:hover{background:rgba(255,255,255,.15);}
        .popup-body{padding:24px;}
        .popup-body p{font-size:.9rem;line-height:1.6;margin-bottom:14px;}
        .popup-body .katex-display{margin:14px 0;font-size:1rem;}
        .popup-example{background:var(--crema);border-radius:var(--radius-sm);padding:16px 18px;margin:14px 0;border:1px solid rgba(39,43,0,.06);}
        .popup-example h4{font-size:.88rem;font-weight:700;color:var(--oliva-medio);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
        .popup-example p{font-size:.85rem;line-height:1.5;margin-bottom:8px;}
        .nav-buttons{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
        .nav-btn{padding:14px 28px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:8px;}
        .nav-btn.primary{background:var(--oliva-oscuro);color:var(--crema);}
        .nav-btn.primary:hover{background:var(--oliva-medio);transform:translateY(-2px);box-shadow:0 4px 16px rgba(39,43,0,.2);}
        .nav-btn.secondary{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .nav-btn.secondary:hover{background:var(--oliva-palido);}
        .nav-btn.dorado{background:var(--dorado);color:var(--oliva-oscuro);}
        .nav-btn.dorado:hover{background:var(--dorado-claro);transform:translateY(-2px);}
        .review-menu{background:#fff;border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px var(--sombra);display:none;}
        .review-menu.active{display:block;animation:fadeUp .4s ease;}
        .review-menu h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .review-menu h3 i{color:var(--dorado);}
        .review-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:8px;border:1.5px solid var(--oliva-super);cursor:pointer;transition:all .2s;}
        .review-item:hover{border-color:var(--oliva-medio);background:rgba(90,97,51,.04);transform:translateX(4px);}
        .review-item i.ri-icon{width:36px;height:36px;border-radius:10px;background:var(--oliva-super);display:grid;place-items:center;color:var(--oliva-medio);font-size:.9rem;flex-shrink:0;}
        .review-item .ri-text{flex:1;}
        .review-item .ri-text h4{font-size:.9rem;font-weight:600;}
        .review-item .ri-text p{font-size:.75rem;color:var(--oliva-claro);}
        .review-item .ri-arrow{color:var(--oliva-claro);font-size:.75rem;}
        .toast{position:fixed;bottom:24px;right:24px;background:#fff;padding:14px 20px;border-radius:var(--radius-sm);border-left:4px solid var(--dorado);box-shadow:0 8px 24px var(--sombra-md);z-index:6000;font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .35s ease;max-width:380px;display:flex;align-items:center;gap:10px;}
        .toast.show{transform:translateY(0);opacity:1;}
        .toast i{color:var(--dorado);font-size:1rem;}
        .medal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:8000;display:none;place-items:center;padding:20px;}
        .medal-overlay.active{display:grid;}
        .medal-box{background:#fff;border-radius:var(--radius);padding:40px 36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35);animation:medalPop .45s cubic-bezier(.2,.8,.3,1.2);}
        .medal-box .medal-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--dorado),#e8c84a);display:grid;place-items:center;margin:0 auto 20px;font-size:2.2rem;color:var(--oliva-oscuro);box-shadow:0 8px 28px rgba(201,162,39,.4);}
        .medal-box h3{font-family:'Patrick Hand',cursive;font-size:1.5rem;color:var(--oliva-oscuro);margin-bottom:4px;}
        .medal-box .medal-pts{font-family:'Orbitron',monospace;font-size:2rem;font-weight:700;color:var(--dorado);margin:12px 0 4px;}
        .medal-box .medal-label{font-size:.72rem;color:var(--oliva-claro);margin-bottom:24px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}
        .medal-box .medal-btn{padding:12px 40px;border-radius:28px;background:var(--oliva-oscuro);color:var(--crema);font-size:.92rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
        .medal-box .medal-btn:hover{background:var(--oliva-medio);transform:translateY(-2px);}
        .loading-spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:16px;}
        .spinner{width:32px;height:32px;border:3px solid var(--oliva-super);border-top-color:var(--oliva-medio);border-radius:50%;animation:spin .7s linear infinite;}
        .panda-mini{width:56px;height:64px;flex-shrink:0;}
        .kw-table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0;font-size:.85rem;overflow:hidden;border-radius:var(--radius-sm);border:1px solid var(--oliva-palido);}
        .kw-table thead{background:var(--oliva-oscuro);color:var(--crema);}
        .kw-table thead th{padding:12px 14px;text-align:left;font-weight:600;font-size:.8rem;letter-spacing:.5px;}
        .kw-table tbody td{padding:10px 14px;border-bottom:1px solid var(--oliva-super);color:#444;line-height:1.5;}
        .kw-table tbody tr:last-child td{border-bottom:none;}
        .kw-table tbody tr:hover{background:rgba(90,97,51,.04);}
        .kw-word{font-weight:700;color:var(--oliva-medio);font-style:italic;}
        .kw-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;vertical-align:middle;}
        .kw-tag.dir{background:rgba(62,107,58,.1);color:var(--verde);}
        .kw-tag.inv{background:rgba(184,92,56,.1);color:var(--rojo-suave);}
        .aleatorio-box{background:linear-gradient(135deg,rgba(90,97,51,.06),rgba(201,162,39,.06));border:2px solid var(--oliva-palido);border-radius:var(--radius);padding:24px 26px;margin:16px 0;}
        .ab-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
        .ab-label i{color:var(--dorado);}
        .ab-enunciado{font-size:.95rem;line-height:1.65;color:var(--oliva-oscuro);margin-bottom:18px;padding:14px 18px;background:#fff;border-radius:var(--radius-sm);border-left:4px solid var(--dorado);font-weight:500;}
        .ab-pasos{display:flex;flex-direction:column;gap:10px;}
        .ab-paso{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--oliva-super);}
        .ab-paso-num{width:28px;height:28px;border-radius:50%;background:var(--oliva-oscuro);color:var(--crema);display:grid;place-items:center;font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;flex-shrink:0;}
        .ab-paso-text{font-size:.87rem;line-height:1.55;color:#444;flex:1;}
        .ab-paso-text strong{color:var(--oliva-medio);}
        .hl{background:rgba(201,162,39,.15);padding:1px 6px;border-radius:4px;font-weight:600;color:var(--oliva-oscuro);}
        .verde{color:var(--verde)!important;font-weight:600;}
        .rojo{color:var(--rojo-suave)!important;font-weight:600;}
        .metodo-card{background:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;box-shadow:0 2px 10px var(--sombra);border-top:4px solid var(--dorado);position:relative;overflow:hidden;}
        .metodo-card::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:linear-gradient(135deg,transparent 50%,rgba(201,162,39,.06) 50%);}
        .metodo-card h4{font-family:'Patrick Hand',cursive;font-size:1.1rem;color:var(--oliva-oscuro);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
        .metodo-card h4 i{color:var(--dorado);font-size:.9rem;}
        .metodo-card .mc-sub{font-size:.78rem;color:var(--oliva-claro);margin-bottom:12px;font-style:italic;}
        .metodo-card p{font-size:.87rem;line-height:1.6;color:#444;margin-bottom:10px;}
        .metodo-card ol{padding-left:20px;margin:8px 0;}
        .metodo-card li{font-size:.85rem;line-height:1.6;color:#444;margin-bottom:6px;}
        .metodo-card li::marker{color:var(--oliva-medio);font-weight:700;}
        .mc-ejemplo{background:var(--crema);border-radius:var(--radius-sm);padding:14px 18px;margin-top:10px;border:1px solid rgba(39,43,0,.06);}
        .mc-ejemplo h5{font-size:.82rem;font-weight:700;color:var(--oliva-medio);margin-bottom:6px;}
        .mc-ejemplo p{font-size:.84rem;margin-bottom:4px;}
        @media(max-width:768px){
            .sidebar{transform:translateX(calc(-1 * var(--sidebar-w)));}.sidebar.open{transform:translateX(0);}
            .main-wrap{margin-left:0!important;}.topbar{padding:0 16px;}
            .theory{padding:20px 16px 32px;}.comp-box{padding:20px;}
            .panda-msg{flex-direction:column;align-items:center;text-align:center;}
            .kw-table{font-size:.78rem;}.kw-table thead th,.kw-table tbody td{padding:8px 10px;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;}}
    </style>
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="dashboard.html"><img src="logo.jpeg" alt="Skopia" class="sidebar-logo"></a>
        <span class="sidebar-username" id="sidebar-username">Cargando...</span>
        <span class="sidebar-program" id="sidebar-program"></span>

    disparador:{title:'El Disparador de Comparación',sub:'Tu radar para detectar regla de tres',html:'<p>El <strong>disparador de comparación</strong> es la palabra o frase que te avisa que dos magnitudes están relacionadas proporcionalmente. Cuando la leas, tu cerebro debe encender la alarma: "¡Acá hay regla de tres!"</p><p>Estas palabras aparecen tanto en textos como en tablas. Si las ves junto a datos numéricos, ya tienes el 80% del problema resuelto: solo falta plantear la proporción.</p><div class="popup-example"><h4><i class="fas fa-lightbulb"></i> Ejemplo</h4><p>"La fábrica produce <strong>120 unidades por cada</strong> turno de 8 horas."</p><p>El disparador es <strong>"por cada"</strong>. Te dice que hay una relación entre unidades y turnos.</p></div>'},
    tendencia:{title:'Análisis de Tendencia',sub:'El truco definitivo para no confundir directa con inversa',html:'<p>Cuando tengas dudas, haz esta pregunta mágica:</p><p style="text-align:center;font-size:1.1rem;font-weight:700;color:var(--oliva-medio);margin:16px 0;">"Si la primera magnitud SUBE... ¿la segunda qué hace?"</p><p>Si la respuesta es "también sube" = <strong>Proporción Directa</strong>. Si la respuesta es "baja" = <strong>Proporción Inversa</strong>.</p><div class="popup-example"><h4><i class="fas fa-check-circle"></i> Directa</h4><p>Más horas trabajando → más dinero ganas. Ambas suben.</p></div><div class="popup-example"><h4><i class="fas fa-times-circle" style="color:var(--rojo-suave)"></i> Inversa</h4><p>Más trabajadores → menos días para terminar. Una sube, la otra baja.</p></div>'},
    rastreo:{title:'Método de Rastreo de Magnitudes',sub:'Cómo no perderte en un texto largo',html:'<p>En textos continuos (párrafos largos), las magnitudes están escondidas entre palabras. El rastreo consiste en:</p><ol style="padding-left:20px;margin:10px 0;"><li style="margin-bottom:8px;"><strong>Leer una vez rápido</strong> sin detenerte en números.</li><li style="margin-bottom:8px;"><strong>Subrayar solo las magnitudes</strong> (las cosas que se pueden medir o contar).</li><li style="margin-bottom:8px;"><strong>Identificar el disparador</strong> que las conecta.</li><li style="margin-bottom:8px;"><strong>Ubicar la pregunta</strong> (¿qué te piden calcular?).</li></ol><p>Con esos 4 datos ya puedes plantear la regla de tres sin volver a leer el texto.</p>'},

/* === EJEMPLOS ALEATORIOS === */
function rng(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function fmt(n){return n.toLocaleString('es-CO');}

function generarEjemplo(){
    const plantillas=[
        {tipo:'directa',gen:()=>{
            const op1=rng(4,12),piezas1=rng(80,200)*10,op2=rng(op1+3,op1+15);
            const resp=Math.round((op2*piezas1)/op1);
            return{
                enunciado:`En una fábrica, ${op1} operarios producen ${fmt(piezas1)} piezas en un turno. Si se contratan ${op2} operarios para el mismo turno, ¿cuántas piezas se producirán en total?`,
                m1:'Operarios',v1:op1,m2:'Piezas',v2:piezas1,
                inc:op2,incM:'Piezas',
                esq:`${op1} operarios → ${fmt(piezas1)} piezas\n${op2} operarios → x piezas`,
                calc:`x = (${op2} × ${fmt(piezas1)}) ÷ ${op1}`,
                resp:fmt(resp),esDirecta:true
            };
        }},
        {tipo:'directa',gen:()=>{
            const km1=rng(200,800),litros1=rng(15,50),km2=rng(km1+100,km1+600);
            const resp=Math.round((km2*litros1)/km1);
            return{
                enunciado:`Un vehículo recorre ${fmt(km1)} kilómetros con ${litros1} litros de combustible. En un viaje de ${fmt(km2)} kilómetros, ¿cuántos litros se necesitarán?`,
                m1:'Kilómetros',v1:km1,m2:'Litros',v2:litros1,
                inc:km2,incM:'Litros',
                esq:`${fmt(km1)} km → ${litros1} litros\n${fmt(km2)} km → x litros`,
                calc:`x = (${fmt(km2)} × ${litros1}) ÷ ${fmt(km1)}`,
                resp:fmt(resp),esDirecta:true
            };
        }},
        {tipo:'inversa',gen:()=>{
            const trab1=rng(5,18),dias1=rng(12,35),trab2=rng(2,trab1-1);
            const resp=Math.round((trab1*dias1)/trab2);
            return{
                enunciado:`Una obra se termina en ${dias1} días con ${trab1} trabajadores. Si el contratista solo dispone de ${trab2} trabajadores, ¿cuántos días tardará en completar la misma obra?`,
                m1:'Trabajadores',v1:trab1,m2:'Días',v2:dias1,
                inc:trab2,incM:'Días',
                esq:`${trab1} trabajadores → ${dias1} días\n${trab2} trabajadores → x días`,
                calc:`x = (${trab1} × ${dias1}) ÷ ${trab2}`,
                resp:fmt(resp),esDirecta:false
            };
        }}
    ];
    const elegida=plantillas[rng(0,plantillas.length-1)];
    return elegida.gen();
}

function renderEjemploAleatorio(){
    const e=generarEjemplo();
    const tendenciaTxt=e.esDirecta
        ?`<span class="verde">A más ${e.m1.toLowerCase()}, más ${e.m2.toLowerCase()}</span>`
        :`<span class="rojo">A más ${e.m1.toLowerCase()}, menos ${e.m2.toLowerCase()}</span>`;
    const tipoLabel=e.esDirecta?'<span class="kw-tag dir">Directa</span>':'<span class="kw-tag inv">Inversa</span>';
    const esquemaLineas=e.esq.split('\n').map(l=>`<div>${l}</div>`).join('');
    $('ej-aleatorio').innerHTML=`
        <div class="ab-label"><i class="fas fa-dice"></i> Ejemplo aleatorio — recarga la página para ver otro ${tipoLabel}</div>
        <div class="ab-enunciado">${e.enunciado}</div>
        <div class="ab-pasos">
            <div class="ab-paso"><div class="ab-paso-num">1</div><div class="ab-paso-text"><strong>Reconocer magnitudes:</strong> La primera es <span class="hl">${e.m1}</span> y la segunda es <span class="hl">${e.m2}</span>.</div></div>
            <div class="ab-paso"><div class="ab-paso-num">2</div><div class="ab-paso-text"><strong>Análisis de tendencia:</strong> ${tendenciaTxt}. Es proporción <strong>${e.esDirecta?'directa':'inversa'}</strong>.</div></div>
            <div class="ab-paso"><div class="ab-paso-num">3</div><div class="ab-paso-text"><strong>Ubicar la pregunta:</strong> Nos piden hallar <span class="hl">${e.incM}</span> cuando <span class="hl">${e.m1}</span> = ${fmt(e.inc)}.</div></div>
            <div class="ab-paso"><div class="ab-paso-num">4</div><div class="ab-paso-text"><strong>Plantear esquema:</strong><div style="background:var(--crema);padding:8px 12px;border-radius:6px;margin-top:6px;font-family:monospace;font-size:.85rem;">${esquemaLineas}</div></div></div>
            <div class="ab-paso"><div class="ab-paso-num">5</div><div class="ab-paso-text"><strong>${e.esDirecta?'Multiplicar cruzado':'Multiplicar en X y dividir por el opuesto'}:</strong><br>${e.calc}<br><strong>Respuesta: ${e.resp}</strong></div></div>
        </div>`;
}

async function updateStreak(){if(!uid)return;const today=new Date().toISOString().split('T')[0];const last=userStats.lastStudyDate;let newStreak=userStats.currentStreak||0,newDays=userStats.totalDays||0,newLongest=userStats.longestStreak||0;if(last===true){}else{const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().split('T')[0];if(last===yStr){newStreak++;}else if(last!==today){newStreak=1;newDays++;}newLongest=Math.max(newLongest,newStreak);}return{currentStreak:newStreak,longestStreak:newLongest,totalDays:newDays,lastStudyDate:today};}

/* === VERIFICAR MISIONES === */
async function checkAndCompleteTheoryMissions(){
    const newMissions=[];let newStars=userStats.totalStars;
    const realCount=Object.keys(completedMissions).filter(k=>completedMissions[k]).length;
    let newTotalMissions=Math.max(realCount,userStats.totalMissionsCompleted||0);
    if(!completedMissions['mission_3'])newMissions.push(3);
    if(!completedMissions['mission_14'])newMissions.push(14);
    if(!usedNoEntiendo&&!completedMissions['mission_24'])newMissions.push(24);
    if(newMissions.length>=3&&!completedMissions['mission_10'])newMissions.push(10);
    let missionPts=0;newMissions.forEach(id=>{if(MC[id])missionPts+=MC[id].pts;});newStars+=missionPts;newTotalMissions+=newMissions.length;
    STAR_THRESHOLDS.forEach(t=>{if(newStars>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    MISSION_COUNT_THRESHOLDS.forEach(t=>{if(newTotalMissions>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    const streakData=await updateStreak();
    STREAK_THRESHOLDS.forEach(t=>{if((streakData?.currentStreak||0)>=t.n&&!completedMissions[`mission_${t.id}`]){newMissions.push(t.id);missionPts+=MC[t.id].pts;newStars+=MC[t.id].pts;newTotalMissions++;}});
    if(newTotalMissions>=84&&!completedMissions['mission_97']){newMissions.push(97);missionPts+=MC[97].pts;newStars+=MC[97].pts;newTotalMissions++;}
    if(newTotalMissions>=95&&!completedMissions['mission_94']){newMissions.push(94);missionPts+=MC[94].pts;newStars+=MC[94].pts;newTotalMissions++;}
    if(newTotalMissions>=100&&!completedMissions['mission_95']){newMissions.push(95);missionPts+=MC[95].pts;newStars+=MC[95].pts;newTotalMissions++;}
    if(newTotalMissions>=100&&!completedMissions['mission_100']){newMissions.push(100);missionPts+=MC[100].pts;newStars+=MC[100].pts;newTotalMissions++;}
    await saveStats({totalStars:newStars,totalMissionsCompleted:newTotalMissions,...(streakData||{})});
    for(const mid of newMissions){await completeMissionInDB(mid);showMedal(mid);}
    $('top-stars').textContent=newStars;
}

        <div class="formula-card"><h3><i class="fas fa-3" style="color:var(--dorado)"></i> ¿Análisis de Tendencia?</h3><p style="font-size:.87rem;color:#444;">Una vez tengas las dos magnitudes, determina si son directas o inversas con esta regla de oro:</p>
        <div style="background:linear-gradient(135deg,rgba(62,107,58,.08),rgba(201,162,39,.06));padding:16px 20px;border-radius:var(--radius-sm);margin:12px 0;text-align:center;font-size:1rem;line-height:1.6;"><strong>"Si la primera magnitud SUBE...<br>¿la segunda SUBE o BAJA?"</strong></div>
        <ul style="padding-left:20px;margin:10px 0;"><li style="font-size:.85rem;line-height:1.7;color:#444;margin-bottom:4px;">Si SUBE también → <strong class="verde">Proporción Directa</strong> (multiplicación cruzada normal).</li><li style="font-size:.85rem;line-height:1.7;color:#444;margin-bottom:4px;">Si BAJA → <strong class="rojo">Proporción Inversa</strong> (multiplicar en X, dividir por el opuesto).</li></ul>
        <button class="no-entiendo-btn" onclick="openNoEntiendo('tendencia')"><i class="fas fa-question-circle"></i> No entiendo la tendencia</button></div>

        <div class="aleatorio-box" id="ej-aleatorio"></div>

        <div class="nav-buttons"><button class="nav-btn secondary" onclick="goSection(1)"><i class="fas fa-arrow-left"></i> Atrás</button><button class="nav-btn primary" onclick="goSection(3)"><i class="fas fa-arrow-right"></i> Tipos de Preguntas ICFES</button></div>
    </section>

    <!-- SECCIÓN 3: TIPOS DE PREGUNTAS -->
    <section class="theory-section" data-section="3">
        <div class="panda-msg"><div class="panda-mini">${PM}</div><p><strong>Paso 3:</strong> El ICFES repite ciertos formatos de pregunta. Si los reconoces, ya sabes qué hacer antes de leer completo.</p></div>
        <div class="type-card"><h4><i class="fas fa-table"></i> Tipo 1: Datos en Tabla</h4><p>Te dan una tabla con 2 columnas de datos. Te piden un valor intermedio que no aparece. <strong>Técnica:</strong> Toma cualquier fila como base y plantea la proporción con la fila que necesitas.</p></div>
        <div class="type-card"><h4><i class="fas fa-chart-bar"></i> Tipo 2: Datos en Gráfica</h4><p>Un gráfico de barras o líneas relaciona dos variables. Te piden estimar un valor que no está directamente marcado. <strong>Técnica:</strong> Lee los ejes (tus magnitudes), toma 2 puntos claros y plantea.</p></div>
        <div class="type-card"><h4><i class="fas fa-file-alt"></i> Tipo 3: Enunciado Puro</h4><p>Solo texto, sin tabla ni gráfica. Las magnitudes están escondidas entre palabras. <strong>Técnica:</strong> Aplica el rastreo de magnitudes que veremos en la siguiente sección.</p></div>
        <div class="type-card"><h4><i class="fas fa-receipt"></i> Tipo 4: Recibo o Factura</h4><p>Un recibo con precios, cantidades e IVA. Te piden hallar un precio unitario o el costo de otra cantidad. <strong>Técnica:</strong> Identifica la fila del subtotal como tu base proporcional.</p></div>
        <div class="type-card"><h4><i class="fas fa-balance-scale"></i> Tipo 5: Comparación de Dos Situaciones</h4><p>Dos escenarios similares pero con un dato cambiado. Te piden comparar los resultados. <strong>Técnica:</strong> Usa el método del Texto Espejo para detectar si el cambio invirtió la proporción.</p></div>
        <div class="nav-buttons"><button class="nav-btn secondary" onclick="goSection(2)"><i class="fas fa-arrow-left"></i> Atrás</button><button class="nav-btn primary" onclick="goSection(4)"><i class="fas fa-arrow-right"></i> Métodos de Lectura</button></div>
    </section>

    <!-- SECCIÓN 4: MÉTODOS DE LECTURA -->
    <section class="theory-section" data-section="4">
        <div class="panda-msg"><div class="panda-mini">${PM}</div><p><strong>Paso 4:</strong> Estos son los 4 métodos que te enseñan a extraer la regla de tres de cualquier formato que te pongan.</p></div>

        <div class="metodo-card">
            <h4><i class="fas fa-crosshairs"></i> Método de "Rastreo de Magnitudes" en Textos Continuos</h4>
            <p class="mc-sub">Para párrafos largos donde los datos están escondidos</p>
            <ol><li><strong>Lectura de exploración:</strong> Lee el párrafo una vez rápido sin detenerte en números. ¿De qué trata?</li>
            <li><strong>Subrayado selectivo:</strong> En la segunda lectura, subraya SOLO los sustantivos que acompañan a números (esas son tus magnitudes).</li>
            <li><strong>Identificar el disparador:</strong> Busca las palabras clave ("por cada", "repartidos entre", etc.) que conectan las magnitudes.</li>
            <li><strong>Ubicar la pregunta:</strong> Encuentra el "¿cuánto?" y determina cuál magnitud es la incógnita.</li>
            <li><strong>Plantear:</strong> Con las 2 magnitudes, el dato conocido y la incógnita, arma el esquema de regla de tres.</li></ol>
            <button class="no-entiendo-btn" onclick="openNoEntiendo('rastreo')"><i class="fas fa-question-circle"></i> No entiendo</button>
        </div>

        <div class="metodo-card">
            <h4><i class="fas fa-chart-line"></i> Método de Conversión de Gráficos a Esquema Proporcional</h4>
            <p class="mc-sub">Para cuando te ponen una gráfica y debes extraer la proporción</p>
            <ol><li><strong>Leer los ejes:</strong> El eje X y el eje Y son tus dos magnitudes. Anótalas.</li>
            <li><strong>Tomar 2 puntos claros:</strong> Busca dos barras o puntos que tengan su valor escrito (no estimes).</li>
            <li><strong>Plantear la proporción:</strong> Esos 2 puntos forman tu fila conocida: "X₁ → Y₁".</li>
            <li><strong>Usar el dato pedido:</strong> La pregunta te dará un valor en uno de los ejes. Ese es tu segunda fila.</li>
            <li><strong>Resolver:</strong> Aplica la regla de tres normal. La gráfica solo fue tu fuente de datos.</li></ol>
            <button class="no-entiendo-btn" onclick="openNoEntiendo('grafico')"><i class="fas fa-question-circle"></i> No entiendo</button>
        </div>

        <div class="metodo-card">
            <h4><i class="fas fa-clone"></i> Método del "Texto Espejo" (Comparación de Enunciados)</h4>
            <p class="mc-sub">Para cuando dos preguntas se ven iguales pero dan resultados distintos</p>
            <p>El ICFES usa esto para confundir. Te pone dos opciones o dos preguntas que parecen idénticas pero una palabra cambia todo.</p>
            <ol><li><strong>Pon los dos enunciados uno al lado del otro</strong> (mentalmente o en el borrador).</li>
            <li><strong>Compara palabra por palabra</strong> hasta encontrar la diferencia.</li>
            <li><strong>Pregúntate:</strong> ¿Esa diferencia cambia la tendencia? ¿Convierte una directa en inversa?</li>
            <li><strong>Resuelve cada uno por separado</strong> con su tipo correcto de proporción.</li></ol>
            <div class="mc-ejemplo"><h5>Texto Espejo en acción</h5><p><strong>Enunciado A:</strong> "Si 5 máquinas <span class="verde">producen</span> 100 unidades..." → Directa (más máquinas, más producción).</p><p><strong>Enunciado B:</strong> "Si 5 máquinas <span class="rojo">tardan</span> 100 horas..." → Inversa (más máquinas, menos horas).</p><p>¡Una sola palabra cambió el tipo de proporción!</p></div>
            <button class="no-entiendo-btn" onclick="openNoEntiendo('espejo')"><i class="fas fa-question-circle"></i> No entiendo</button>
        </div>

        <div class="formula-card"><h3><i class="fas fa-star" style="color:var(--dorado)"></i> Resumen rápido de los 4 métodos</h3>
        <table class="kw-table"><thead><tr><th>Si te dan...</th><th>Usa este método</th><th>Primer paso</th></tr></thead><tbody>
        <tr><td><strong>Un párrafo largo</strong></td><td>Rastreo de Magnitudes</td><td>Lectura rápida → subrayar sustantivos con números</td></tr>
        <tr><td><strong>Una gráfica</strong></td><td>Conversión a Esquema</td><td>Leer ejes → tomar 2 puntos claros</td></tr>
        <tr><td><strong>Dos enunciados parecidos</strong></td><td>Texto Espejo</td><td>Comparar palabra por palabra</td></tr>
        <tr><td><strong>Una tabla</strong></td><td>Proporción directa desde fila</td><td>Tomar una fila completa como base</td></tr>
        </tbody></table></div>

        <div class="nav-buttons"><button class="nav-btn secondary" onclick="goSection(3)"><i class="fas fa-arrow-left"></i> Atrás</button><button class="nav-btn dorado" onclick="goSection(5)"><i class="fas fa-flag-checkered"></i> Finalizar teoría</button></div>
    </section>

    <!-- SECCIÓN 5: FINALIZAR -->
    <section class="theory-section" data-section="5">
        <div class="panda-msg"><div class="panda-mini">${PM}</div><p><strong>¡Llegamos al final de la lectura!</strong> Ya tienes las herramientas para detectar proporciones en cualquier formato que te ponga el ICFES. Recuerda: el 90% del trabajo es leer bien y clasificar. La operación matemática es lo más fácil.</p></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
            <button class="nav-btn dorado" onclick="window.location.href='regla-tres2.html'" style="font-size:1rem;padding:16px 36px;"><i class="fas fa-play-circle"></i> Quiero ver la explicación</button>
            <button class="nav-btn secondary" onclick="goSection(6)" style="font-size:1rem;padding:16px 36px;"><i class="fas fa-book"></i> Prefiero repasar</button>
        </div>
    </section>

    <!-- SECCIÓN 6: REPASAR -->
    <section class="theory-section" data-section="6">
        <div class="review-menu active"><h3><i class="fas fa-map-signs"></i> ¿Qué quieres repasar?</h3>
        <div class="review-item" onclick="goSection(1)"><i class="ri-icon fas fa-search"></i><div class="ri-text"><h4>Disparadores de Comparación</h4><p>Palabras de proporción directa e inversa</p></div><i class="ri-arrow fas fa-chevron-right"></i></div>
        <div class="review-item" onclick="goSection(2)"><i class="ri-icon fas fa-list-ol"></i><div class="ri-text"><h4>Técnica de 3 Pasos + Ejemplo Aleatorio</h4><p>Magnitudes, pregunta, tendencia</p></div><i class="ri-arrow fas fa-chevron-right"></i></div>
        <div class="review-item" onclick="goSection(3)"><i class="ri-icon fas fa-th-list"></i><div class="ri-text"><h4>Tipos de Preguntas del ICFES</h4><p>Tabla, gráfica, texto, recibo, comparación</p></div><i class="ri-arrow fas fa-chevron-right"></i></div>
        <div class="review-item" onclick="goSection(4)"><i class="ri-icon fas fa-crosshairs"></i><div class="ri-text"><h4>Métodos de Lectura</h4><p>Rastreo, conversión de gráficos, texto espejo</p></div><i class="ri-arrow fas fa-chevron-right"></i></div>
        <div style="margin-top:20px;"><button class="nav-btn dorado" onclick="window.location.href='regla-tres2.html'"><i class="fas fa-play-circle"></i> Ir a Ver la Explicación</button></div></div>
    </section>
    </div>`;
