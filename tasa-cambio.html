  {type:"info",title:"Dato Inventado #DI-090",desc:"Conclusión con dato no presente",content:`<table class="doc-table"><tr><th>Trimestre</th><th>Remesas</th></tr><tr><td>T1</td><td>$1.000M</td></tr><tr><td>T2</td><td>$1.200M</td></tr></table><div class="doc-conclusion bad">Conclusión: Las remesas del T3 fueron de $1.400M, manteniendo la tendencia.</div>`,correct:false,fbOk:"Correcto al rechazar. La tabla no tiene datos del T3. El analista inventó un dato.",fbErr:"Error. No se pueden inventar datos que no están en la tabla."}
]},
{d:27,b:4,t:"Proporcionalidad compuesta en informes",
 c:"Relacionar tres variables simultáneas en un reporte de remesas (Moneda A, Moneda B y Tiempo). Si cambian dos variables, la tercera se ajusta proporcionalmente.",
 ej:"Si 5 USD = 20 EUR = $20.000 COP<br>Entonces 15 USD = 60 EUR = $60.000 COP (todo triplica)<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Triplicar solo una variable y no las demás.",
 docs:[
  {type:"info",title:"Informe de Tres Variables #IT-012",desc:"Proporcionalidad compuesta",content:`<p>Relación: 10 USD = 9 EUR = $42.000 COP</p><div class="doc-paso"><div class="dp-num">1</div><div>Para 30 USD: 27 EUR = $126.000 COP</div></div><div class="doc-conclusion ok">Conclusión: Las tres equivalencias se triplican correctamente.</div>`,correct:true,fbOk:"Correcto. Al triplicar USD, todas las equivalencias se triplican proporcionalmente.",fbErr:"Error. La proporcionalidad compuesta está bien aplicada."},
  {type:"form",title:"Tres Variables #TV-034",desc:"Complete la equivalencia",content:`<p>Relación base: 4 GBP = 5 USD = $22.000 COP<br><br>Para 20 GBP, ¿cuántos USD y COP corresponden?</p><div class="doc-input-wrap"><label>USD:</label><input type="text" class="doc-input" id="f-input" placeholder="USD" style="width:100px;"></div>`,answer:"25",check:v=>parseInt(v.replace(/\D/g,""))===25,fbOk:"Correcto: 20/4 = 5 veces la base. 5 × 5 = 25 USD.",fbErr:"Incorrecto. Factor = 20/4 = 5. USD = 5 × 5 = 25."},
  {type:"info",title:"Error Parcial #EP-056",desc:"Solo triplicó una variable",content:`<p>Base: 8 USD = 7 EUR = $35.000 COP<br>"Para 24 USD: 7 EUR = $105.000 COP"</p><div class="doc-conclusion bad">Conclusión: Solo el COP cambia, el EUR se mantiene.</div>`,correct:false,fbOk:"Correcto al rechazar. Si USD triplica, EUR y COP también deben triplicar: 21 EUR y $105.000 COP.",fbErr:"Error. Todas las variables deben ajustarse proporcionalmente."},
  {type:"info",title:"Tiempo como Variable #TV-078",desc:"Cuarta variable implícita",content:`<p>"Si 10 operarios procesan 500 giros en 5 horas, entonces 20 operarios procesan 1.000 giros en 5 horas."</p><div class="doc-conclusion ok">Conclusión: Al duplicar operarios, se duplica el volumen en el mismo tiempo.</div>`,correct:true,fbOk:"Correcto. Es proporcionalidad directa entre operarios y volumen (manteniendo tiempo constante).",fbErr:"Error. La proporcionalidad es correcta."}
]},
{d:28,b:4,t:"Auditoría de estadísticas oficiales",
 c:"Filtrar gráficos distorsionados que alteran las proporciones visuales de las tasas. Un gráfico con ejes truncados o escalas inconsistentes puede engañar al lector.",
 ej:"Barra A: valor 100 (altura 50px)<br>Barra B: valor 110 (altura 100px)<br><span style='color:var(--sello-rojo);font-weight:700;'>Distorsión:</span> 10% de diferencia se muestra como 100% de diferencia visual.",
 docs:[
  {type:"info",title:"Gráfico Distorsionado #GD-012",desc:"Eje truncado que exagera",content:`<p>Un gráfico de barras muestra la tasa de cambio de 4.000 a 4.050, pero el eje Y empieza en 3.900, haciendo que la diferencia se vea enorme.</p><div class="doc-conclusion bad">Conclusión: "La tasa tuvo un cambio dramático y sin precedentes."</div>`,correct:false,fbOk:"Correcto al rechazar. El cambio es de solo 1,25% (50/4.000). El eje truncado exagera visualmente la diferencia.",fbErr:"Error. Un eje truncado puede distorsionar la percepción del cambio."},
  {type:"info",title:"Gráfico Correcto #GC-034",desc:"Eje completo y proporcional",content:`<p>"El gráfico muestra la tasa de 3.800 a 4.200 con eje Y desde 0. El crecimiento visual es proporcional al crecimiento real de 10,5%."</p><div class="doc-conclusion ok">Conclusión: La representación gráfica es proporcional y no engañosa.</div>`,correct:true,fbOk:"Correcto. Un eje que empieza en 0 muestra las proporciones reales.",fbErr:"Error. El análisis del gráfico es correcto."},
  {type:"info",title:"Escala Inconsistente #EI-056",desc:"Barras con escalas diferentes",content:`<p>"Barra de Enero usa escala de 0 a 100. Barra de Febrero usa escala de 0 a 1.000. Se concluye que Febrero fue 10 veces mayor."</p><div class="doc-conclusion bad">Conclusión: Febrero es 10 veces mayor basado en las barras.</div>`,correct:false,fbOk:"Correcto al rechazar. No se pueden comparar barras con escalas diferentes.",fbErr:"Error. Las escalas deben ser iguales para comparar visualmente."},
  {type:"form",title:"Detección de Distorsión #DD-078",desc:"¿Qué porcentaje real de cambio hay?",content:`<p>Un gráfico muestra barras de 3.950 a 4.050 COP/USD pero el eje empieza en 3.900. ¿Cuál es la variación porcentual real?</p><div class="doc-input-wrap"><label>Variación %:</label><input type="text" class="doc-input" id="f-input" placeholder="%"></div>`,answer:"2.53",check:v=>{const n=parseFloat(v.replace(/%/g,"").replace(",","."));return Math.abs(n-2.53)<0.1;},fbOk:"Correcto: (4.050-3.950)/3.950 × 100 = 2,53%.",fbErr:"Incorrecto. (4.050-3.950)/3.950 × 100 = 100/3.950 ≈ 2,53%."},
  {type:"info",title:"Validación de Proporción #VP-090",desc:"Proporción visual correcta",content:`<p>"El gráfico con eje desde 0 muestra que la barra de $120M es exactamente el doble de alta que la de $60M. La proporción visual coincide con la real."</p><div class="doc-conclusion ok">Conclusión: El gráfico representa fielmente la proporción.</div>`,correct:true,fbOk:"Correcto. Con eje desde 0, las proporciones visuales son fieles.",fbErr:"Error. La validación es correcta."}
]},
{d:29,b:4,t:"Ensayo general para el cierre",
 c:"Auditoría exprés combinando tablas, porcentajes y razones simples. Todo lo de los 4 bloques en documentos rápidos.",
 ej:"Último día de práctica. Revisa rápido pero con precisión.",
 docs:[
  {type:"form",title:"Auditoría Final #AF-001",desc:"Complete la tabla",content:`<table class="doc-table"><tr><th>USD</th><th>COP</th><th>Tasa</th></tr><tr><td>20</td><td>$86.000</td><td>4.300</td></tr><tr><td>35</td><td class="blank">???</td><td>4.300</td></tr></table><div class="doc-input-wrap"><label>Valor faltante (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"150500",check:v=>parseInt(v.replace(/\D/g,""))===150500,fbOk:"Correcto: 35 × 4.300 = $150.500.",fbErr:"Incorrecto. Tasa = 4.300. 35 × 4.300 = $150.500."},
  {type:"info",title:"Porcentajes Sucesivos #PS-012",desc:"Doble descuento",content:`<p>"Descuento del 20% + 10%. Factor: 0,80 × 0,90 = 0,72. Descuento real: 28%."</p><div class="doc-conclusion ok">Conclusión: El cálculo es correcto.</div>`,correct:true,fbOk:"Correcto. 0,80 × 0,90 = 0,72. Descuento 28%, no 30%.",fbErr:"Error. El cálculo es correcto."},

]},
/* --- DÍA 30: EXAMEN FINAL --- */
{d:30,b:0,t:"El Examen de Auditoría Mayor",
 c:"Simulacro final sin red de seguridad. Evaluará aleatoriamente todo lo aprendido. No hay pista, no hay circular detallada. Solo tu conocimiento.",
 ej:"Confía en lo que aprendiste. Cada documento puede ser de cualquier bloque.",
 docs:generateFinalExam()}
];

/* Generar examen final con preguntas aleatorias de todos los bloques */
function generateFinalExam(){
    const pool=[];
    /* Tomar documentos de días previos al azar */
    const usedDays=[1,4,8,10,12,15,17,19,22,24,26,28];
    usedDays.forEach(dd=>{
        const day=DAYS.find(x=>x.d===dd);
        if(day){
            const idx=Math.floor(Math.random()*day.docs.length);
            pool.push({...day.docs[idx]});
        }
    });
    /* Asegurar 5 documentos */
    while(pool.length<5){
        const rd=DAYS[Math.floor(Math.random()*29)];
        const ri=Math.floor(Math.random()*rd.docs.length);
        if(!pool.find(p=>p.title===rd.docs[ri].title))pool.push({...rd.docs[ri]});
    }
    return pool.slice(0,5);
}

/* ============================================================
   ESTADO DEL JUEGO
   ============================================================ */
let state={dia:0,docIdx:0,warnings:0,correctos:0,incorrectos:0,timeLeft:60,timer:null,processed:[]};
const $=id=>document.getElementById(id);
const GA=()=>document.getElementById('game-area');

/* ============================================================
   RENDERIZADO DE PANTALLAS
   ============================================================ */

function showIntro(){
    GA().innerHTML=`
    <div class="screen active intro-screen">
        <div class="intro-icon"><i class="fas fa-stamp"></i></div>
        <h2>Inspectoría de Tasas Cambiarias</h2>
        <p>Eres un Analista de Datos y Control Cambiario. Tu misión: auditar documentos ciudadanos verificando que la lógica matemática sea impecable, siguiendo el estándar del ICFES Saber Pro.</p>
        <div class="intro-rules">
            <h3><i class="fas fa-gavel"></i> Manual de Operaciones</h3>
            <ul>
                <li>Sobrevive <strong>30 días hábiles</strong> de auditoría para cobrar tu sueldo y ascender.</li>
                <li>Tienes <strong>60 segundos</strong> por día para procesar todos los documentos.</li>
                <li>Acumulas <strong>3 advertencias</strong> y eres <strong>Despedido</strong>.</li>
                <li>Aprobar un documento con <strong>falacia matemática crítica</strong> = <strong>Arresto inmediato</strong>.</li>
                <li>Semana 1: 3 docs/día. Semana 2-3: 4 docs/día. Semana 4: 5 docs/día.</li>
            </ul>
        </div>
        <button class="btn-start" onclick="startGame()"><i class="fas fa-play"></i> Iniciar Jornada</button>
    </div>`;
}

function showDiaStart(){
    const dia=DAYS[state.dia-1];
    const bloqueNombres={1:"Proporciones y Razones",2:"Porcentajes Básicos",3:"Porcentajes Sucesivos",4:"Tablas y Gráficas",0:"Examen Final"};
    GA().innerHTML=`
    <div class="screen active dia-start">
        <div class="ds-num">${String(state.dia).padStart(2,'0')}</div>
        <div class="ds-label">Día de ${state.dia<30?'Auditoría':'Examen Final'}</div>
        ${dia.b?`<div class="ds-bloque">Bloque ${dia.b}: ${bloqueNombres[dia.b]}</div>`:'<div class="ds-bloque">Sin red de seguridad</div>'}
    </div>`;
    setTimeout(()=>showCircular(),1200);
}

function showCircular(){
    const dia=DAYS[state.dia-1];
    let ejHtml=dia.ej;
    GA().innerHTML=`
    <div class="screen active">
        <div class="circular">
            <div class="cir-header">
                <i class="fas fa-book-open"></i>
                <h3>Circular del Día</h3>
                <span class="cir-dia">Día ${state.dia}</span>
            </div>
            <p><strong>${dia.t}</strong></p>
            <p>${dia.c}</p>
            <div class="cir-ejemplo">
                <h4><i class="fas fa-lightbulb"></i> Ejemplo</h4>
                <p>${ejHtml}</p>
            </div>
        </div>
        <div style="text-align:center;margin-top:16px;">
            <button class="btn-start" onclick="startDay()" style="font-size:.95rem;padding:14px 36px;"><i class="fas fa-briefcase"></i> Abrir Bandeja de Entrada</button>
        </div>
    </div>`;
}

function startDay(){
    state.docIdx=0;
    state.processed=[];
    startTimer();
    renderDay();
}

function renderDay(){
    const dia=DAYS[state.dia-1];
    const docs=dia.docs;
    const totalDocs=docs.length;

    /* Stats */
    const warningsHtml=Array.from({length:3},(_, i)=>`<div class="warn-dot${i<state.warnings?' active':''}"></div>`).join('');

    let html=`
    <div class="stats-bar">
        <div class="stat-card"><div class="sc-label">Día</div><div class="sc-val dia">${state.dia}/30</div></div>
        <div class="stat-card"><div class="sc-label">Docs</div><div class="sc-val">${state.docIdx}/${totalDocs}</div></div>
        <div class="stat-card"><div class="sc-label">Aciertos</div><div class="sc-val">${state.correctos}</div></div>
    </div>
    <div class="clock-bar">
        <span class="cb-label">Turno</span>
        <div class="cb-track"><div class="cb-fill${state.timeLeft<=10?' low':''}" id="cb-fill" style="width:${(state.timeLeft/60)*100}%"></div></div>
        <span class="cb-time${state.timeLeft<=10?' low':''}" id="cb-time">${state.timeLeft}s</span>
    </div>
    <div class="warnings">${warningsHtml}</div>`;

    /* Bandeja de sobres */
    html+=`<div class="bandeja">`;
    docs.forEach((doc,i)=>{
        let cls='sobre';
        if(i<state.docIdx)cls+=' processed';
        else if(i===state.docIdx)cls+=' current';
        html+=`<div class="${cls}" title="${doc.title}"><i class="fas fa-envelope${i===state.docIdx?'-open-text':''}"></i></div>`;
    });
    html+=`</div>`;

    /* Documento actual o final del día */
    if(state.docIdx<totalDocs){
        const doc=docs[state.docIdx];
        html+=renderDocumento(doc);
    } else {
        html+=`<div style="text-align:center;padding:30px 0;">
            <i class="fas fa-check-circle" style="font-size:2rem;color:var(--sello-verde);margin-bottom:12px;"></i>
            <p style="font-size:1.1rem;font-weight:700;color:var(--oficina-texto);">Día ${state.dia} completado</p>
            <p style="font-size:.85rem;color:var(--tinta-lig);margin-top:6px;">Todos los documentos procesados.</p>
        </div>`;
    }

    GA().innerHTML=html;

    /* Enfocar input si es formulario */
    const inp=document.getElementById('f-input');
    if(inp)setTimeout(()=>inp.focus(),100);
}

function renderDocumento(doc){
    const typeIcon=doc.type==='form'?'fa-file-pen':doc.type==='info'?'fa-file-lines':'fa-file-shield';
    const typeLabel=doc.type==='form'?'Formulario Incompleto':'Informe de Terceros';
    const typeClass=doc.type==='form'?'form':'info';

    let actionsHtml='';
    if(doc.type==='form'){
        actionsHtml=`<button class="act-btn enviar" id="btn-enviar" onclick="submitForm()"><i class="fas fa-paper-plane"></i> Enviar a Carpeta Segura</button>`;
    } else {
        actionsHtml=`
        <button class="act-btn rechazar" onclick="decideDoc(false)"><i class="fas fa-trash"></i> Papelera (Rechazar)</button>
        <button class="act-btn aprobar" onclick="decideDoc(true)"><i class="fas fa-folder-plus"></i> Carpeta Segura (Aprobar)</button>`;
    }

    return `
    <div class="documento" id="doc-activo">
        <div class="doc-header">
            <div class="dh-icon ${typeClass}"><i class="fas ${typeIcon}"></i></div>
            <div>
                <h4>${doc.title}</h4>
                <p>${typeLabel} — ${doc.desc}</p>
            </div>
        </div>
        <div class="doc-body">${doc.content}</div>
        <div class="doc-feedback" id="doc-fb"></div>
        <div class="doc-actions" id="doc-actions">${actionsHtml}</div>
    </div>`;
}

/* ============================================================
   LÓGICA DEL JUEGO
   ============================================================ */

function startTimer(){
    clearInterval(state.timer);
    state.timeLeft=60;
    state.timer=setInterval(()=>{
        if(document.hidden)return;
        state.timeLeft--;
        const fill=document.getElementById('cb-fill');
        const time=document.getElementById('cb-time');
        if(fill)fill.style.width=`${(state.timeLeft/60)*100}%`;
        if(time)time.textContent=`${state.timeLeft}s`;
        if(state.timeLeft<=10){if(fill)fill.classList.add('low');if(time)time.classList.add('low');}
        if(state.timeLeft<=0){clearInterval(state.timer);timeUp();}
    },1000);
}

function timeUp(){
    const dia=DAYS[state.dia-1];
    if(state.docIdx<dia.docs.length){
        /* Contar docs no procesados como errores */
        const remaining=dia.docs.length-state.docIdx;
        state.warnings+=remaining;
        state.incorrectos+=remaining;
        showToast(`Tiempo agotado. ${remaining} documento(s) sin procesar.`);
    }
    endDay();
}

function submitForm(){
    const inp=document.getElementById('f-input');
    if(!inp)return;
    const val=inp.value.trim();
    if(!val){showFeedback(false,'Escribe un valor en la casilla.');return;}
    const doc=DAYS[state.dia-1].docs[state.docIdx];
    const isCorrect=doc.check(val);
    showFeedback(isCorrect, isCorrect?doc.fbOk:doc.fbErr);
    processResult(isCorrect, doc);
}

function decideDoc(approved){
    const doc=DAYS[state.dia-1].docs[state.docIdx];
    const isCorrect=(approved===doc.correct);
    showFeedback(isCorrect, isCorrect?doc.fbOk:doc.fbErr);
    processResult(isCorrect, doc);
}

function processResult(isCorrect, doc){
    /* Deshabilitar acciones */
    const actions=document.getElementById('doc-actions');
    if(actions)actions.innerHTML='';

    if(isCorrect){
        state.correctos++;
    } else {
        state.incorrectos++;
        state.warnings++;

        /* Verificar negligencia grave: aprobar documento con falacia cuando debía rechazarse */
        if(doc.type==='info' && !doc.correct){
            /* El usuario aprobó un documento incorrecto = negligencia grave */
            clearInterval(state.timer);
            showArrest(doc);
            return;
        }
    }

    /* Marcar sobre como procesado */
    const sobres=document.querySelectorAll('.sobre');
    if(sobres[state.docIdx])sobres[state.docIdx].classList.add('processed');
    if(sobres[state.docIdx])sobres[state.docIdx].classList.remove('current');

    state.docIdx++;
    state.processed.push(state.docIdx);

    /* Siguiente doc o fin del día */
    setTimeout(()=>{
        const dia=DAYS[state.dia-1];
        if(state.docIdx<dia.docs.length){
            renderDay();
        } else {
            endDay();
        }
    },1500);
}

function showFeedback(ok, msg){
    const fb=document.getElementById('doc-fb');
    if(!fb)return;
    fb.className=`doc-feedback show ${ok?'ok':'err'}`;
    fb.innerHTML=`<i class="fas ${ok?'fa-check-circle':'fa-times-circle'}" style="margin-right:6px;"></i> ${msg}`;
}

function showArrest(doc){
    GA().innerHTML+=`
    <div class="memorando">
        <i class="fas fa-handcuffs"></i>
        <h3>ARRESTADO / DESTITUIDO</h3>
        <p>Aprobaste un documento que contenía una <strong>falacia matemática crítica</strong>.</p>
        <p style="margin-top:8px;font-size:.82rem;color:#ff9999;">"${doc.title}" — El procedimiento era incorrecto y lo aprobaste.</p>
        <p style="margin-top:12px;">Has sido destituido de tu cargo por negligencia grave.</p>
    </div>`;
    setTimeout(()=>showResults(false),2500);
}

function showVolante(){
    const remaining=3-state.warnings;
    let html=`<div class="volante"><h4><i class="fas fa-exclamation-triangle"></i> Volante de Advertencia</h4><p>`;
    if(remaining>0){
        html+=`Documento procesado incorrectamente. Te quedan <strong>${remaining} advertencia(s)</strong> antes del despido.`;
    } else {
        html+=`Has alcanzado el límite de 3 advertencias.`;
    }
    html+=`</p></div>`;
    return html;
}

function endDay(){
    clearInterval(state.timer);

    if(state.warnings>=3){
        GA().innerHTML=`
        <div class="memorando">
            <i class="fas fa-user-slash"></i>
            <h3>DESPEDIDO</h3>
            <p>Acumulaste 3 advertencias. Has sido despedido de la Inspectoría.</p>
            <p style="margin-top:8px;">Llegaste al día ${state.dia} de 30.</p>
        </div>`;
        setTimeout(()=>showResults(false),2000);
        return;
    }

    if(state.dia>=30){
        setTimeout(()=>showResults(true),1000);
        return;
    }

    /* Avanzar al siguiente día */
    state.dia++;
    state.warnings=0; /* Resetear advertencias por día */
    showDiaStart();
}

function showResults(won){
    const totalDocs=state.correctos+state.incorrectos;
    const pct=totalDocs>0?Math.round((state.correctos/totalDocs)*100):0;
    const icon=won?'fa-trophy':'fa-skull-crossbones';
    const title=won?'Auditor Senior':'Fin de la Jornada';
    const sub=won?'Superaste los 30 días. Tu sueldo completo está garantizado.':`Llegaste al día ${state.dia} de 30. Te recomendamos repasar los conceptos.`;

    GA().innerHTML=`
    <div class="screen active results-screen">
        <div class="rs-icon ${won?'win':'lose'}"><i class="fas ${icon}"></i></div>
        <h2 class="${won?'win':'lose'}">${title}</h2>
        <p class="rs-sub">${sub}</p>
        <div class="rs-stats">
            <div><div class="rs-val">${state.dia}</div><div class="rs-lbl">Días</div></div>
            <div><div class="rs-val">${state.correctos}</div><div class="rs-lbl">Correctos</div></div>
            <div><div class="rs-val">${pct}%</div><div class="rs-lbl">Precisión</div></div>
        </div>
        <div class="rs-btns">
            <a href="porcentajes-razones.html" class="rs-btn sec"><i class="fas fa-th-list"></i> Ir a los demás temas</a>
            <a href="tasa-cambio-examen.html" class="rs-btn pri"><i class="fas fa-pen-alt"></i> Ir al examen ICFES</a>
        </div>
    </div>`;
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg){
    let t=document.getElementById('game-toast');
    if(!t){
        t=document.createElement('div');
        t.id='game-toast';
        t.style.cssText='position:fixed;bottom:20px;right:20px;background:#fff;padding:12px 18px;border-radius:8px;border-left:4px solid var(--sello-rojo);box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:9000;font-size:.84rem;color:var(--tinta);transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px;';
        document.body.appendChild(t);
    }
    t.textContent=msg;
    t.style.transform='translateY(0)';
    t.style.opacity='1';
    setTimeout(()=>{t.style.transform='translateY(80px)';t.style.opacity='0';},3500);
}

/* ============================================================
   INICIO
   ============================================================ */
function startGame(){
    state={dia:1,docIdx:0,warnings:0,correctos:0,incorrectos:0,timeLeft:60,timer:null,processed:[]};
    showDiaStart();
}

showIntro();
</script>
