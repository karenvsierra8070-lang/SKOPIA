<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspectoría de Tasas Cambiarias - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root {
            --parche:#f5f0e1;--parche-osc:#e8dcc8;--tinta:#1a1a18;--tinta-mid:#3d3a32;--tinta-lig:#6b6555;
            --sello-verde:#2d5a27;--sello-verde-bg:#d4edda;--sello-rojo:#8b2020;--sello-rojo-bg:#f8d7da;
            --dorado:#b8962e;--dorado-claro:#f0e4b8;--carpeta:#5c4a1e;--carpeta-bg:#f5ecd0;
            --papelera:#555;--papelera-bg:#e0ddd5;--alerta-bg:#fff3cd;--alerta-bd:#ffc107;
            --oficina:#2c2c28;--oficina-claro:#3d3d36;--oficina-texto:#d4cfc0;
            --radius:12px;--radius-sm:8px;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Roboto',sans-serif;background:var(--oficina);color:var(--oficina-texto);min-height:100vh;overflow-x:hidden;}
        a{color:inherit;text-decoration:none;}button{cursor:pointer;border:none;background:none;font-family:inherit;}

        /* FONDO OFICINA */
        .oficina-bg{position:fixed;inset:0;z-index:0;
            background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 41px),
            repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 41px),
            radial-gradient(ellipse at 50% 30%,rgba(184,150,46,.06) 0%,transparent 60%),
            linear-gradient(180deg,#2c2c28 0%,#222220 100%);}
        .lamp{position:fixed;top:-10px;left:50%;transform:translateX(-50%);width:300px;height:200px;background:radial-gradient(ellipse,rgba(245,240,225,.07) 0%,transparent 70%);z-index:1;pointer-events:none;}

        /* CONTENEDOR PRINCIPAL */
        .game-wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column;}

        /* HEADER */
        .g-header{text-align:center;padding:24px 0 20px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:20px;}
        .g-header h1{font-family:'Patrick Hand',cursive;font-size:1.8rem;color:var(--dorado-claro);line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.3);}
        .g-header .sub{font-size:.78rem;color:var(--tinta-lig);margin-top:4px;letter-spacing:1px;text-transform:uppercase;}
        .g-back{position:absolute;left:16px;top:28px;display:flex;align-items:center;gap:6px;color:var(--oficina-texto);font-size:.82rem;opacity:.6;transition:opacity .2s;}
        .g-back:hover{opacity:1;}

        /* STATS BAR */
        .stats-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
        .stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:12px 14px;text-align:center;}
        .stat-card .sc-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tinta-lig);margin-bottom:4px;}
        .stat-card .sc-val{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;color:var(--dorado-claro);}
        .stat-card .sc-val.dia{color:var(--oficina-texto);}
        .stat-card .sc-val.alerta{color:var(--sello-rojo);}

        /* RELOJ */
        .clock-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:10px 16px;background:rgba(255,255,255,.03);border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.05);}
        .clock-bar .cb-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-lig);white-space:nowrap;}
        .clock-bar .cb-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
        .clock-bar .cb-fill{height:100%;background:var(--dorado);border-radius:4px;transition:width .3s linear;}
        .clock-bar .cb-fill.low{background:var(--sello-rojo);animation:pulse-bar .5s ease infinite alternate;}
        @keyframes pulse-bar{from{opacity:.7}to{opacity:1}}
        .clock-bar .cb-time{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;min-width:50px;text-align:right;}
        .clock-bar .cb-time.low{color:var(--sello-rojo);}

        /* ADVETENCIAS */
        .warnings{display:flex;gap:8px;margin-bottom:16px;justify-content:center;}
        .warn-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--sello-rojo);background:transparent;transition:all .3s;}
        .warn-dot.active{background:var(--sello-rojo);box-shadow:0 0 8px rgba(139,32,32,.5);}

        /* CIRCULAR DEL DÍA */
        .circular{background:var(--parche);border-radius:var(--radius);padding:24px 22px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 0 60px rgba(0,0,0,.04);position:relative;overflow:hidden;border:1px solid var(--parche-osc);}
        .circular::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--dorado) 0,var(--dorado) 8px,transparent 8px,transparent 16px);}
        .circular .cir-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--parche-osc);}
        .circular .cir-header i{font-size:1.1rem;color:var(--dorado);}
        .circular .cir-header h3{font-family:'Patrick Hand',cursive;font-size:1.15rem;color:var(--tinta);}
        .circular .cir-header .cir-dia{margin-left:auto;font-family:'Orbitron',monospace;font-size:.75rem;background:var(--dorado);color:#fff;padding:3px 10px;border-radius:10px;}
        .circular p{font-size:.88rem;line-height:1.65;color:var(--tinta-mid);margin-bottom:10px;}
        .circular p strong{color:var(--tinta);}
        .circular .cir-ejemplo{background:rgba(184,150,46,.08);border:1px solid rgba(184,150,46,.2);border-radius:var(--radius-sm);padding:14px 16px;margin-top:10px;}
        .circular .cir-ejemplo h4{font-size:.82rem;font-weight:700;color:var(--carpeta);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
        .circular .cir-ejemplo h4 i{font-size:.7rem;}
        .circular .cir-ejemplo p{font-size:.84rem;margin-bottom:6px;}
        .circular .katex-display{margin:10px 0;font-size:.95rem;}

        /* BANDEJA DE SOBRES */
        .bandeja{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;justify-content:center;padding:10px 0;}
        .sobre{width:60px;height:44px;background:linear-gradient(135deg,var(--parche),var(--parche-osc));border-radius:4px;border:1px solid var(--parche-osc);display:grid;place-items:center;cursor:pointer;transition:all .25s;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.2);}
        .sobre:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.3);}
        .sobre.processed{opacity:.35;pointer-events:none;transform:scale(.9);}
        .sobre.current{border-color:var(--dorado);box-shadow:0 0 0 2px var(--dorado),0 4px 12px rgba(0,0,0,.3);transform:translateY(-4px);}
        .sobre i{font-size:.9rem;color:var(--tinta-mid);}
        .sobre.current i{color:var(--dorado);}

        /* DOCUMENTO ACTIVO */
        .documento{background:var(--parche);border-radius:var(--radius);box-shadow:0 6px 30px rgba(0,0,0,.4);overflow:hidden;animation:slideDoc .35s ease;border:1px solid var(--parche-osc);}
        @keyframes slideDoc{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .doc-header{padding:14px 20px;border-bottom:1px solid var(--parche-osc);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.02);}
        .doc-header .dh-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:.95rem;flex-shrink:0;}
        .doc-header .dh-icon.form{background:var(--carpeta-bg);color:var(--carpeta);}
        .doc-header .dh-icon.info{background:#e8f0fe;color:#1a56db;}
        .doc-header .dh-icon.alert{background:var(--sello-rojo-bg);color:var(--sello-rojo);}
        .doc-header div{flex:1;min-width:0;}
        .doc-header div h4{font-size:.9rem;font-weight:700;color:var(--tinta);}
        .doc-header div p{font-size:.72rem;color:var(--tinta-lig);}
        .doc-body{padding:20px 22px;}
        .doc-body p{font-size:.88rem;line-height:1.6;color:var(--tinta-mid);margin-bottom:12px;}
        .doc-body p strong{color:var(--tinta);}
        .doc-body .doc-paso{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:.86rem;line-height:1.5;color:var(--tinta-mid);}
        .doc-body .doc-paso .dp-num{width:22px;height:22px;border-radius:50%;background:var(--tinta);color:var(--parche);display:grid;place-items:center;font-size:.65rem;font-weight:700;flex-shrink:0;}
        .doc-body .doc-conclusion{padding:12px 16px;border-radius:var(--radius-sm);margin:12px 0;font-size:.86rem;line-height:1.5;font-weight:500;}
        .doc-body .doc-conclusion.ok{background:var(--sello-verde-bg);border:1px solid var(--sello-verde);color:var(--sello-verde);}
        .doc-body .doc-conclusion.bad{background:var(--sello-rojo-bg);border:1px solid var(--sello-rojo);color:var(--sello-rojo);}

        /* TABLA DENTRO DE DOCUMENTO */
        .doc-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem;}
        .doc-table th{background:var(--tinta);color:var(--parche);padding:8px 12px;text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;}
        .doc-table td{padding:8px 12px;border-bottom:1px solid var(--parche-osc);color:var(--tinta-mid);}
        .doc-table tr:nth-child(even) td{background:rgba(0,0,0,.02);}
        .doc-table .blank{background:rgba(184,150,46,.12)!important;font-weight:700;color:var(--carpeta);border:2px dashed var(--dorado);}
        .doc-table .error-cell{background:var(--sello-rojo-bg)!important;color:var(--sello-rojo);font-weight:700;}

        /* INPUT PARA FORMULARIO */
        .doc-input-wrap{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap;}
        .doc-input-wrap label{font-size:.85rem;font-weight:600;color:var(--tinta);white-space:nowrap;}
        .doc-input{padding:8px 12px;border:2px dashed var(--dorado);border-radius:var(--radius-sm);font-size:.95rem;font-family:'Orbitron',monospace;width:140px;background:rgba(184,150,46,.05);color:var(--tinta);outline:none;transition:border .2s;}
        .doc-input:focus{border-style:solid;border-color:var(--carpeta);background:rgba(184,150,46,.1);}

        /* ACCIONES */
        .doc-actions{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--parche-osc);background:rgba(0,0,0,.015);flex-wrap:wrap;}
        .act-btn{padding:12px 24px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:160px;}
        .act-btn.aprobar{background:var(--sello-verde);color:#fff;box-shadow:0 3px 10px rgba(45,90,39,.3);}
        .act-btn.aprobar:hover{background:#247020;transform:translateY(-2px);box-shadow:0 6px 16px rgba(45,90,39,.4);}
        .act-btn.rechazar{background:var(--sello-rojo);color:#fff;box-shadow:0 3px 10px rgba(139,32,32,.3);}
        .act-btn.rechazar:hover{background:#a02020;transform:translateY(-2px);box-shadow:0 6px 16px rgba(139,32,32,.4);}
        .act-btn.enviar{background:var(--dorado);color:#fff;box-shadow:0 3px 10px rgba(184,150,46,.3);}
        .act-btn.enviar:hover{background:#9a7e24;transform:translateY(-2px);}
        .act-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

        /* VOLANTE DE ADVERTENCIA */
        .volante{background:var(--sello-rojo-bg);border:2px solid var(--sello-rojo);border-radius:var(--radius);padding:20px 22px;margin:16px 0;text-align:center;animation:shakeVolante .4s ease;}
        @keyframes shakeVolante{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
        .volante h4{color:var(--sello-rojo);font-size:1rem;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
        .volante p{font-size:.85rem;color:var(--tinta-mid);line-height:1.5;}

        /* MEMORANDO DE NEGLIGENCIA */
        .memorando{background:linear-gradient(135deg,#1a0000,#3a0000);border:2px solid var(--sello-rojo);border-radius:var(--radius);padding:28px 24px;margin:16px 0;text-align:center;animation:fadeInRed .5s ease;}
        @keyframes fadeInRed{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
        .memorando i{font-size:2.5rem;color:var(--sello-rojo);margin-bottom:12px;}
        .memorando h3{color:#ff6b6b;font-family:'Patrick Hand',cursive;font-size:1.5rem;margin-bottom:8px;}
        .memorando p{color:#cc8888;font-size:.9rem;line-height:1.5;margin-bottom:6px;}

        /* PANTALLAS: INTRO, DIA-START, RESULTADOS */
        .screen{display:none;animation:fadeUp .4s ease;}
        .screen.active{display:block;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        .intro-screen{text-align:center;padding:40px 0;}
        .intro-screen .intro-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--dorado),#d4a830);display:grid;place-items:center;margin:0 auto 20px;font-size:2.5rem;color:var(--oficina);box-shadow:0 8px 30px rgba(184,150,46,.3);}
        .intro-screen h2{font-family:'Patrick Hand',cursive;font-size:2rem;color:var(--dorado-claro);margin-bottom:8px;}
        .intro-screen p{font-size:.9rem;color:var(--oficina-texto);max-width:500px;margin:0 auto 12px;line-height:1.6;opacity:.8;}
        .intro-screen .intro-rules{text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:20px;margin:24px auto;max-width:500px;}
        .intro-screen .intro-rules h3{font-family:'Patrick Hand',cursive;font-size:1.1rem;color:var(--dorado-claro);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .intro-screen .intro-rules li{font-size:.84rem;line-height:1.6;color:var(--oficina-texto);opacity:.75;padding:4px 0;padding-left:18px;position:relative;list-style:none;}
        .intro-screen .intro-rules li::before{content:'';position:absolute;left:0;top:12px;width:8px;height:8px;border-radius:50%;background:var(--dorado);}
        .btn-start{padding:16px 48px;border-radius:var(--radius-sm);background:var(--dorado);color:var(--oficina);font-size:1.05rem;font-weight:700;transition:all .25s;display:inline-flex;align-items:center;gap:10px;margin-top:20px;box-shadow:0 4px 20px rgba(184,150,46,.3);}
        .btn-start:hover{background:#d4a830;transform:translateY(-3px);box-shadow:0 8px 30px rgba(184,150,46,.4);}

        .dia-start{text-align:center;padding:30px 0;}
        .dia-start .ds-num{font-family:'Orbitron',monospace;font-size:4rem;font-weight:900;color:var(--dorado-claro);line-height:1;text-shadow:0 4px 20px rgba(184,150,46,.3);}
        .dia-start .ds-label{font-size:.8rem;text-transform:uppercase;letter-spacing:3px;color:var(--tinta-lig);margin-top:4px;}
        .dia-start .ds-bloque{font-family:'Patrick Hand',cursive;font-size:1.2rem;color:var(--oficina-texto);margin-top:12px;opacity:.7;}

        .results-screen{text-align:center;padding:20px 0;}
        .results-screen .rs-icon{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:2.5rem;box-shadow:0 6px 24px rgba(0,0,0,.3);}
        .results-screen .rs-icon.win{background:linear-gradient(135deg,var(--dorado),#d4a830);color:var(--oficina);}
        .results-screen .rs-icon.lose{background:linear-gradient(135deg,var(--sello-rojo),#c03030);color:#fff;}
        .results-screen h2{font-family:'Patrick Hand',cursive;font-size:1.8rem;margin-bottom:6px;}
        .results-screen h2.win{color:var(--dorado-claro);}
        .results-screen h2.lose{color:#ff6b6b;}
        .results-screen .rs-sub{font-size:.9rem;color:var(--oficina-texto);opacity:.7;margin-bottom:24px;line-height:1.5;}
        .rs-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:400px;margin:0 auto 28px;}
        .rs-stats div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:14px 10px;}
        .rs-stats .rs-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;color:var(--dorado-claro);}
        .rs-stats .rs-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-lig);margin-top:2px;}
        .rs-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .rs-btn{padding:14px 28px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:700;transition:all .25s;display:flex;align-items:center;gap:8px;}
        .rs-btn.sec{background:rgba(255,255,255,.06);color:var(--oficina-texto);border:1px solid rgba(255,255,255,.1);}
        .rs-btn.sec:hover{background:rgba(255,255,255,.1);}
        .rs-btn.pri{background:var(--dorado);color:var(--oficina);box-shadow:0 4px 16px rgba(184,150,46,.3);}
        .rs-btn.pri:hover{background:#d4a830;transform:translateY(-2px);}

        /* FEEDBACK INLINE */
        .doc-feedback{padding:12px 16px;border-radius:var(--radius-sm);margin:12px 22px;font-size:.85rem;line-height:1.5;display:none;animation:fadeUp .3s ease;}
        .doc-feedback.show{display:block;}
        .doc-feedback.ok{background:var(--sello-verde-bg);color:var(--sello-verde);border:1px solid var(--sello-verde);}
        .doc-feedback.err{background:var(--sello-rojo-bg);color:var(--sello-rojo);border:1px solid var(--sello-rojo);}

        /* RESPONSIVE */
        @media(max-width:600px){
            .game-wrap{padding:12px 10px 30px;}
            .g-header h1{font-size:1.4rem;}
            .stats-bar{grid-template-columns:1fr 1fr 1fr;gap:6px;}
            .stat-card{padding:8px 6px;}
            .stat-card .sc-val{font-size:1rem;}
            .circular{padding:18px 16px;}
            .doc-actions{flex-direction:column;}
            .act-btn{min-width:100%;}
            .rs-stats{grid-template-columns:1fr;max-width:200px;}
            .rs-btns{flex-direction:column;align-items:center;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;}}
    </style>
</head>
<body>

<div class="oficina-bg"></div>
<div class="lamp"></div>

<div class="game-wrap">
    <a href="porcentajes-razones.html" class="g-back"><i class="fas fa-arrow-left"></i> Volver</a>

    <header class="g-header">
        <h1><i class="fas fa-stamp" style="margin-right:6px;"></i> Inspectoría de Tasas Cambiarias</h1>
        <p class="sub">Simulador ICFES Saber Pro</p>
    </header>

    <div id="game-area"></div>
</div>

<script>
/* ============================================================
   DATOS COMPLETOS DE LOS 30 DÍAS
   ============================================================ */
const DAYS=[
/* --- BLOQUE 1: DÍAS 1-7 --- */
{d:1,b:1,t:"Razón constante básica",
 c:"Si 1 USD = $4.000 COP, la conversión se hace multiplicando, nunca sumando. La razón es un factor multiplicativo constante.",
 ej:`Si un ciudadano declara haber convertido 150 USD a pesos colombianos:<br><strong>Paso 1:</strong> Identificar la razón: 1 USD = $4.000 COP<br><strong>Paso 2:</strong> Multiplicar: 150 × 4.000 = <strong>$600.000 COP</strong><br><br><span style="color:var(--sello-rojo);font-weight:700;">Error común del ICFES:</span> Sumar 150 + 4.000 = $4.150. ¡Eso es absurdo!`,
 docs:[
  {type:"form",title:"Solicitud de Declaración Cambiaria #001",desc:"Ciudadano declara conversión de divisas",content:`<p>El señor Carlos Méndez presenta su declaración de cambio por la conversión de <strong>250 USD</strong> a pesos colombianos. Complete el campo faltante aplicando la tasa oficial.</p><p style="font-size:.82rem;color:var(--tinta-lig);">Tasa oficial: 1 USD = $4.000 COP</p><div class="doc-input-wrap"><label>Equivalente en COP:</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"1000000",check:v=>parseInt(v.replace(/\D/g,""))===1000000,fbOk:"Correcto: 250 × 4.000 = $1.000.000 COP.",fbErr:"Incorrecto. Debes multiplicar 250 × 4.000 = $1.000.000, no sumar."},
  {type:"info",title:"Informe de Control #A-012",desc:"Analista junior reportó conversión",content:`<p>El analista junior reportó lo siguiente:</p><div class="doc-paso"><div class="dp-num">1</div><div>Un turista convirtió 80 USD a pesos colombianos.</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Aplicó la tasa: 1 USD = $4.000 COP.</div></div><div class="doc-paso"><div class="dp-num">3</div><div>Resultado reportado: <strong>$320.000 COP</strong> (80 × 4.000).</div></div><div class="doc-conclusion ok">Conclusión del informe: La conversión es matemáticamente correcta.</div>`,correct:true,fbOk:"Correcto. El analista aplicó la razón multiplicativa correctamente.",fbErr:"Error de criterio. El procedimiento es correcto: 80 × 4.000 = $320.000."},
  {type:"info",title:"Memorando de Queja #Q-003",desc:"Ciudadano reclama por cálculo de giro",content:`<p>La señora López reclama que el giro de 200 USD solo le dio $204.000 COP. Su queja dice:</p><div class="doc-paso"><div class="dp-num">1</div><div>"Me dijeron que la tasa era 4.000, así que debería recibir 200 + 4.000 = $4.200.000."</div></div><div class="doc-conclusion bad">Conclusión de la queja: El banco le robó el dinero porque le dio mucho menos de lo esperado.</div>`,correct:false,fbOk:"Correcto al rechazar. La ciudadana confundió multiplicación con suma. 200 × 4.000 = $800.000, no 200 + 4.000.",fbErr:"Error. La ciudadana usó suma en vez de multiplicación. Eso es un error conceptual grave."}
]},
{d:2,b:1,t:"La trampa de la función lineal",
 c:"Diferenciar entre una relación proporcional directa (multiplicar por constante) y una suma fija de valores. El ICFES mezcla ambas para confundir.",
 ej:`Caso A (proporcional): 5 USD → $20.000 COP (factor 4.000).<br>Caso B (suma fija): "Se cobra $5.000 por transacción más la tasa".<br><br><span style="color:var(--sello-rojo);font-weight:700;">Trampa:</span> Creer que ambos casos funcionan igual. En el Caso B, no puedes simplemente multiplicar.`,
 docs:[
  {type:"info",title:"Reporte de Tarifa #T-045",desc:"Analista evaluó estructura de cobro",content:`<p>Un casa de cambio cobra $3.000 COP fijos por comisión de transacción más la conversión a tasa de 4.000 COP/USD.</p><p>El analista reportó que por 10 USD el cliente paga:</p><div class="doc-paso"><div class="dp-num">1</div><div>Conversión: 10 × 4.000 = $40.000</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Más comisión: $40.000 + $3.000 = <strong>$43.000</strong></div></div><div class="doc-conclusion ok">Conclusión: El cálculo es correcto.</div>`,correct:true,fbOk:"Correcto. Primero multiplica, luego suma la comisión fija.",fbErr:"Error. El procedimiento es correcto: se separa la conversión proporcional de la suma fija."},
  {type:"form",title:"Formulario de Giro #G-089",desc:"Complete el total a pagar",content:`<p>Un cliente envía 25 USD. La casa de cambio cobra $5.000 COP de comisión fija más la conversión a tasa de 4.000 COP/USD.</p><div class="doc-input-wrap"><label>Total a pagar (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"105000",check:v=>parseInt(v.replace(/\D/g,""))===105000,fbOk:"Correcto: (25 × 4.000) + 5.000 = $105.000 COP.",fbErr:"Incorrecto. Calcula: 25 × 4.000 = $100.000 de conversión, más $5.000 de comisión = $105.000."},
  {type:"info",title:"Auditoría Interna #AI-017",desc:"Verificación de procedimiento",content:`<p>Un analista procesó un giro de 30 USD con comisión fija de $5.000 COP. Reportó:</p><div class="doc-paso"><div class="dp-num">1</div><div>Total: 30 × (4.000 + 5.000) = 30 × 9.000 = <strong>$270.000</strong></div></div><div class="doc-conclusion bad">Conclusión: El cliente debe pagar $270.000 COP.</div>`,correct:false,fbOk:"Correcto al rechazar. El analista sumó la comisión a la tasa antes de multiplicar. Debe ser: (30 × 4.000) + 5.000 = $125.000.",fbErr:"Error. El analista cometió un error grave: sumó la comisión fija a la tasa unitaria antes de multiplicar."}
]},
{d:3,b:1,t:"Proporcionalidad inversa",
 c:"Si un servicio duplica su rapidez, el costo por tasa operativa no se duplica de la misma forma si la regla es inversa. En proporcionalidad inversa: más rapidez = menos costo por unidad de tiempo.",
 ej:`Si 2 operarios procesan 100 giros en 5 horas a un costo de $50.000/hora:<br>4 operarios (doble rapidez) → 2.5 horas → Costo total: 2.5 × $50.000 = <strong>$125.000</strong> (no $250.000).`,
 docs:[
  {type:"info",title:"Informe de Eficiencia #IE-023",desc:"Análisis de costos operativos",content:`<p>Un centro de cambios procesa 200 giros con 4 operarios en 6 horas, a un costo de $40.000/hora.</p><p>El supervisor sugiere que con 8 operarios (el doble), el costo total se duplicaría a $480.000.</p><div class="doc-paso"><div class="dp-num">1</div><div>Actual: 6 horas × $40.000 = $240.000</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Con doble operarios: 3 horas × $40.000 = <strong>$120.000</strong></div></div><div class="doc-conclusion ok">Conclusión del analista: El costo se reduce a la mitad, no se duplica, por proporcionalidad inversa.</div>`,correct:true,fbOk:"Correcto. Al duplicar operarios, el tiempo se reduce a la mitad. El costo total baja.",fbErr:"Error. El análisis es correcto: proporcionalidad inversa significa que más rapidez = menos tiempo = menor costo total."},
  {type:"form",title:"Cálculo de Presupuesto #P-034",desc:"Complete el costo con nueva dotación",content:`<p>Actualmente: 3 operarios, 8 horas, $35.000/hora. Se contratan 6 operarios (doble). Complete el nuevo costo total.</p><div class="doc-input-wrap"><label>Nuevo costo total (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"140000",check:v=>parseInt(v.replace(/\D/g,""))===140000,fbOk:"Correcto: Con doble operarios, tiempo = 4 horas. 4 × $35.000 = $140.000.",fbErr:"Incorrecto. Doble operarios → mitad de tiempo (4h). Costo: 4 × $35.000 = $140.000."},
  {type:"info",title:"Memorando de Costos #MC-056",desc:"Propuesta de ampliación de personal",content:`<p>Propuesta: "Si pasamos de 2 a 6 operarios (triple), el costo operativo mensual de $180.000 se triplica a $540.000."</p><div class="doc-conclusion bad">Conclusión: Se recomienda NO ampliar personal porque el costo se triplica.</div>`,correct:false,fbOk:"Correcto al rechazar. Triple personal = un tercio del tiempo. Costo: $180.000 / 3 = $60.000, no $540.000.",fbErr:"Error. El autor asumió proporcionalidad directa cuando es inversa."}
]},
{d:4,b:1,t:"Constante de proporcionalidad en tablas",
 c:"Encontrar el valor unitario (y/x) cuando los datos vienen en una tabla desordenada. La constante debe ser la misma para todas las filas.",
 ej:`Tabla de conversión USD → COP:<br>5 USD = $20.000 → constante = 20.000/5 = 4.000<br>12 USD = $48.000 → constante = 48.000/12 = 4.000<br>Si una fila dice 8 USD = $36.000 → 36.000/8 = 4.500 → <span style="color:var(--sello-rojo);font-weight:700;">ERROR: constante diferente</span>`,
 docs:[
  {type:"info",title:"Tabla de Tasas #TT-078",desc:"Verificación de consistencia",content:`<table class="doc-table"><tr><th>USD</th><th>COP</th><th>Constante</th></tr><tr><td>10</td><td>$40.000</td><td>4.000</td></tr><tr><td>25</td><td>$100.000</td><td>4.000</td></tr><tr><td>7</td><td>$28.000</td><td>4.000</td></tr></table><div class="doc-conclusion ok">Conclusión: Todas las filas tienen constante 4.000. La tabla es consistente.</div>`,correct:true,fbOk:"Correcto. 40.000/10 = 100.000/25 = 28.000/7 = 4.000 en todas las filas.",fbErr:"Error. La tabla es perfectamente consistente."},
  {type:"form",title:"Tabla Incompleta #TI-091",desc:"Complete el valor faltante",content:`<table class="doc-table"><tr><th>USD</th><th>COP</th></tr><tr><td>15</td><td>$60.000</td></tr><tr><td>22</td><td>$88.000</td></tr><tr><td>9</td><td class="blank">???</td></tr></table><p style="margin-top:10px;font-size:.84rem;">Use la constante de proporcionalidad para completar.</p><div class="doc-input-wrap"><label>Valor faltante (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"36000",check:v=>parseInt(v.replace(/\D/g,""))===36000,fbOk:"Correcto: Constante = 60.000/15 = 4.000. Entonces 9 × 4.000 = $36.000.",fbErr:"Incorrecto. La constante es 4.000 (60.000÷15). Entonces 9 × 4.000 = $36.000."},
  {type:"info",title:"Auditoría de Tabla #AT-102",desc:"Dato sospechoso en reporte",content:`<table class="doc-table"><tr><th>USD</th><th>COP</th><th>Constante</th></tr><tr><td>20</td><td>$80.000</td><td>4.000</td></tr><tr><td>11</td><td class="error-cell">$49.500</td><td class="error-cell">4.500</td></tr><tr><td>30</td><td>$120.000</td><td>4.000</td></tr></table><div class="doc-conclusion bad">Conclusión del informe: "La tabla es correcta, la pequeña diferencia es un error de redondeo aceptable."</div>`,correct:false,fbOk:"Correcto al rechazar. La fila del medio tiene constante 4.500, no 4.000. No es redondeo, es un error de $4.500.",fbErr:"Error. La constante 4.500 en la fila del medio es un error real, no redondeo."}
]},
{d:5,b:1,t:"Ampliación de escalas",
 c:"Calcular el valor equivalente cuando cambian las unidades base de la moneda extranjera. Si la tasa cambia, el factor cambia proporcionalmente.",
 ej:`Si 1 USD = $4.000 COP, entonces:<br>10 USD = $40.000 COP<br>0,5 USD = $2.000 COP<br>1.000 USD = $4.000.000 COP<br><span style="color:var(--sello-rojo);font-weight:700;">Trampa:</span> Si la tasa sube a $4.200, NO puedes usar la tasa vieja.`,
 docs:[
  {type:"form",title:"Conversión Escalada #CE-045",desc:"Calcule con nueva tasa",content:`<p>La tasa cambió de $4.000 a $4.200 COP por USD. Un ciudadano necesita convertir 500 USD. Complete el monto en pesos.</p><div class="doc-input-wrap"><label>Monto en COP:</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"2100000",check:v=>parseInt(v.replace(/\D/g,""))===2100000,fbOk:"Correcto: 500 × 4.200 = $2.100.000 COP con la nueva tasa.",fbErr:"Incorrecto. Con la nueva tasa de $4.200: 500 × 4.200 = $2.100.000 COP."},
  {type:"info",title:"Reporte de Actualización #RA-067",desc:"Analista usó tasa anterior",content:`<p>Un analista procesó una conversión de 300 USD el día que la tasa subió de $4.000 a $4.200 COP.</p><div class="doc-paso"><div class="dp-num">1</div><div>Calculó: 300 × 4.000 = $1.200.000 COP</div></div><div class="doc-conclusion bad">Conclusión: "La conversión es correcta usando la tasa estándar."</div>`,correct:false,fbOk:"Correcto al rechazar. Usó la tasa vieja ($4.000) cuando ya había cambiado a $4.200. Debería ser $1.260.000.",fbErr:"Error. El analista usó la tasa anterior. Con la nueva tasa: 300 × 4.200 = $1.260.000."},
  {type:"info",title:"Validación de Escala #VE-089",desc:"Conversión de fracción de dólar",content:`<p>Un turista tiene un remanente de 0,75 USD. A tasa de $4.000 COP/USD:</p><div class="doc-paso"><div class="dp-num">1</div><div>El analista calculó: 0,75 × 4.000 = $3.000 COP</div></div><div class="doc-conclusion ok">Conclusión: La conversión de la fracción es correcta.</div>`,correct:true,fbOk:"Correcto. 0,75 × 4.000 = $3.000 COP. La proporción se mantiene con fracciones.",fbErr:"Error de criterio. El cálculo es correcto."}
]},
{d:6,b:1,t:"Razones equivalentes",
 c:"Validar si dos ciudadanos hicieron la misma proporción con diferentes montos. Dos razones son equivalentes si al simplificar dan el mismo valor.",
 ej:`Ciudadano A: 50 USD → $200.000 (razón = 200.000/50 = 4.000)<br>Ciudadano B: 120 USD → $480.000 (razón = 480.000/120 = 4.000)<br>→ <strong>Misma proporción</strong> a pesar de montos diferentes.`,
 docs:[
  {type:"info",title:"Comparación de Giros #CG-034",desc:"¿Misma tasa aplicada?",content:`<p>Giro 1: 40 USD → $164.000 COP (razón = 4.100)<br>Giro 2: 75 USD → $307.500 COP (razón = 4.100)</p><div class="doc-conclusion ok">Conclusión: Ambos giros usaron la misma tasa de cambio.</div>`,correct:true,fbOk:"Correcto. 164.000/40 = 307.500/75 = 4.100. Razones equivalentes.",fbErr:"Error. Ambas razones dan 4.100, son equivalentes."},
  {type:"info",title:"Denuncia de Discriminación #DD-056",desc:"Ciudadano reclama trato desigual",content:`<p>"A mí me cambiaron 100 USD a $420.000 pero a mi vecino 200 USD a $800.000. Me cobraron más."</p><div class="doc-paso"><div class="dp-num">1</div><div>Mío: 420.000/100 = 4.200 COP/USD</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Vecino: 800.000/200 = 4.000 COP/USD</div></div><div class="doc-conclusion bad">Conclusión del reclamante: "Ambos pagaron lo mismo, me están engañando."</div>`,correct:false,fbOk:"Correcto al rechazar. Las tasas son DIFERENTES (4.200 vs 4.000). El reclamante pagó más por dólar.",fbErr:"Error. Las razones NO son equivalentes: 4.200 ≠ 4.000."},
  {type:"form",title:"Verificación de Tasa #VT-078",desc:"Complete si las razones coinciden",content:`<p>Giro A: 60 USD → $252.000 COP<br>Giro B: 90 USD → <span style="border-bottom:2px dashed var(--dorado);font-weight:700;">?</span> COP<br><br>Si usan la misma tasa, ¿cuánto corresponde al Giro B?</p><div class="doc-input-wrap"><label>Giro B en COP:</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"378000",check:v=>parseInt(v.replace(/\D/g,""))===378000,fbOk:"Correcto: Tasa = 252.000/60 = 4.200. Entonces 90 × 4.200 = $378.000.",fbErr:"Incorrecto. La tasa es 4.200 (252.000÷60). Para 90 USD: 90 × 4.200 = $378.000."}
]},
{d:7,b:1,t:"Prueba de fuego: Razones directas",
 c:"Auditoría mixta que combina todos los conceptos del bloque: razón constante, función lineal vs proporcional, y tablas.",
 ej:"Hoy toca poner a prueba todo lo aprendido. Revisa cada documento con cuidado, aplicando los conceptos de los días 1 a 6.",
 docs:[
  {type:"form",title:"Auditoría Integral #AI-001",desc:"Complete la tabla con razones consistentes",content:`<table class="doc-table"><tr><th>EUR</th><th>COP</th></tr><tr><td>20</td><td>$86.000</td></tr><tr><td>35</td><td>$150.500</td></tr><tr><td>50</td><td class="blank">???</td></tr></table><div class="doc-input-wrap"><label>Valor faltante (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"215000",check:v=>parseInt(v.replace(/\D/g,""))===215000,fbOk:"Correcto: Tasa = 86.000/20 = 4.300. Entonces 50 × 4.300 = $215.000.",fbErr:"Incorrecto. La constante es 4.300 (86.000÷20). Entonces 50 × 4.300 = $215.000."},
  {type:"info",title:"Informe Mixto #IM-023",desc:"Validación de múltiples conceptos",content:`<p>Un analista reportó: "Para convertir 150 USD a COP con tasa de $4.000 y comisión fija de $8.000, el total es 150 × (4.000 + 8.000) = $1.800.000."</p><div class="doc-conclusion bad">Conclusión: El cálculo es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. Error de función lineal: sumó comisión a la tasa antes de multiplicar. Correcto: (150 × 4.000) + 8.000 = $608.000.",fbErr:"Error grave. El analista sumó la comisión fija a la tasa unitaria."},
  {type:"info",title:"Validación Cruzada #VC-045",desc:"Dos giros, misma tasa",content:`<p>Giro X: 80 USD → $336.000 COP<br>Giro Y: 120 USD → $504.000 COP</p><div class="doc-conclusion ok">Conclusión: Ambos giros aplican la misma tasa de cambio de 4.200 COP/USD.</div>`,correct:true,fbOk:"Correcto. 336.000/80 = 504.000/120 = 4.200. Razones equivalentes.",fbErr:"Error. Ambas razones dan 4.200, son equivalentes."}
]},
/* --- BLOQUE 2: DÍAS 8-14 --- */
{d:8,b:2,t:"¿Qué es realmente un porcentaje?",
 c:"El porcentaje es una razón con denominador 100. 15% = 15/100 = 0,15. Se aplica multiplicando, nunca sumando el porcentaje al 100% como si fuera suma aritmética.",
 ej:"Si una remesa de $1.000.000 tiene una comisión del 3%:<br>Comisión = 1.000.000 × 0,03 = <strong>$30.000</strong><br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Pensar que 3% de 1.000.000 es 1.000.000 + 3 = $1.000.003.",
 docs:[
  {type:"form",title:"Liquidación de Comisión #LC-012",desc:"Calcule la comisión porcentual",content:`<p>Una remesa de $2.500.000 COP tiene una comisión del 2,5% sobre el monto. Calcule el valor de la comisión.</p><div class="doc-input-wrap"><label>Comisión (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"62500",check:v=>parseInt(v.replace(/\D/g,""))===62500,fbOk:"Correcto: 2.500.000 × 0,025 = $62.500 COP.",fbErr:"Incorrecto. 2,5% = 0,025. Entonces 2.500.000 × 0,025 = $62.500."},
  {type:"info",title:"Queja de Usuario #QU-034",desc:"Ciudadano no entiende el descuento",content:`<p>"Me dijeron que el descuento era del 5% en mi giro de $800.000. Deberían descontarme $5, no $40.000."</p><div class="doc-conclusion bad">Conclusión del ciudadano: El banco está cobrando de más.</div>`,correct:false,fbOk:"Correcto al rechazar. 5% de 800.000 = 800.000 × 0,05 = $40.000. El ciudadano confundió porcentaje con valor absoluto.",fbErr:"Error. 5% significa 5 de cada 100, no 5 pesos."},
  {type:"info",title:"Cálculo de Retención #CR-056",desc:"Verificación de porcentaje aplicado",content:`<p>Retención del 4‰ (4 por mil) sobre una operación de $5.000.000 COP.</p><div class="doc-paso"><div class="dp-num">1</div><div>4‰ = 4/1.000 = 0,004</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Retención: 5.000.000 × 0,004 = <strong>$20.000</strong></div></div><div class="doc-conclusion ok">Conclusión: El cálculo de la retención es correcto.</div>`,correct:true,fbOk:"Correcto. 4 por mil = 0,004. 5.000.000 × 0,004 = $20.000.",fbErr:"Error. El cálculo es correcto."}
]},
{d:9,b:2,t:"Aumentos porcentuales sencillos",
 c:"Para aumentar un valor en un porcentaje, se multiplica por (1 + porcentaje). Aumentar 15% = multiplicar por 1,15.",
 ej:"Tarifa de $50.000 con aumento del 15%:<br>$50.000 × 1,15 = <strong>$57.500</strong><br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> $50.000 + 15 = $50.015",
 docs:[
  {type:"form",title:"Actualización de Tarifa #AT-023",desc:"Calcule la nueva tarifa",content:`<p>La tarifa de giro internacional de $120.000 COP aumenta un 18%. Calcule la nueva tarifa.</p><div class="doc-input-wrap"><label>Nueva tarifa (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"141600",check:v=>parseInt(v.replace(/\D/g,""))===141600,fbOk:"Correcto: 120.000 × 1,18 = $141.600 COP.",fbErr:"Incorrecto. Aumento del 18%: 120.000 × 1,18 = $141.600."},
  {type:"info",title:"Reporte de Ajuste #RA-045",desc:"Analista aplicó aumento",content:`<p>Tarifa original: $85.000. Aumento del 12%.</p><div class="doc-paso"><div class="dp-num">1</div><div>Nueva tarifa: 85.000 × 0,12 = $10.200 de aumento</div></div><div class="doc-paso"><div class="dp-num">2</div><div>Total: 85.000 + 10.200 = <strong>$95.200</strong></div></div><div class="doc-conclusion ok">Conclusión: El aumento se calculó correctamente.</div>`,correct:true,fbOk:"Correcto. 85.000 × 0,12 = 10.200. 85.000 + 10.200 = $95.200.",fbErr:"Error. El procedimiento es correcto."},
  {type:"info",title:"Memorando de Tarifa #MT-067",desc:"Error en aumento",content:`<p>"La tarifa de $200.000 sube 25%, así que la nueva es $200.025."</p><div class="doc-conclusion bad">Conclusión: El ajuste tarifario es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. Sumó 25 en vez de calcular 25%. Correcto: 200.000 × 1,25 = $250.000.",fbErr:"Error. El autor sumó 25 pesos en vez de aplicar 25%."}
]},
{d:10,b:2,t:"Descuentos porcentuales sencillos",
 c:"Para descontar, se multiplica por (1 - porcentaje). Descuento del 20% = multiplicar por 0,80. El factor decimal restante es lo que realmente se paga.",
 ej:"Producto de $150.000 con 20% de descuento:<br>$150.000 × 0,80 = <strong>$120.000</strong><br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> 150.000 - 20 = $149.980",
 docs:[
  {type:"form",title:"Aplicación de Descuento #AD-034",desc:"Calcule el precio con descuento",content:`<p>Un paquete de viaje de $3.200.000 COP tiene un descuento del 15% para residentes. Calcule el precio final.</p><div class="doc-input-wrap"><label>Precio final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"2720000",check:v=>parseInt(v.replace(/\D/g,""))===2720000,fbOk:"Correcto: 3.200.000 × 0,85 = $2.720.000 COP.",fbErr:"Incorrecto. Descuento 15% → factor 0,85. 3.200.000 × 0,85 = $2.720.000."},
  {type:"info",title:"Promoción Turística #PT-056",desc:"Validación de descuento",content:`<p>"Giro de $500.000 con 30% de descuento para nuevos clientes: $500.000 × 0,30 = $150.000 de descuento. Precio final: $350.000."</p><div class="doc-conclusion ok">Conclusión: El descuento está bien calculado.</div>`,correct:true,fbOk:"Correcto. 500.000 × 0,30 = 150.000 descuento. 500.000 - 150.000 = $350.000.",fbErr:"Error. El cálculo es correcto."},
  {type:"info",title:"Reclamo de Descuento #RD-078",desc:"Ciudadano dice que le cobraron de más",content:`<p>"Me ofrecieron 10% de descuento en mi giro de $400.000. Debería pagar $400.000 - 10 = $399.990."</p><div class="doc-conclusion bad">Conclusión: El banco le debe los $360.000 de diferencia.</div>`,correct:false,fbOk:"Correcto al rechazar. 10% de 400.000 = 40.000. Precio real: 400.000 - 40.000 = $360.000. No $399.990.",fbErr:"Error. El ciudadano confundió 10% con 10 pesos."}
]},
{d:11,b:2,t:"El valor base oculto",
 c:"Hallar el 100% original conociendo el valor final tras un aumento o descuento. Se divide el final entre el factor: Valor Inicial = Valor Final / (1 ± r).",
 ej:"Si después de un aumento del 20% el precio es $60.000:<br>Valor original = 60.000 / 1,20 = <strong>$50.000</strong><br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> 60.000 - 20% de 60.000 = 48.000 (¡base equivocada!)",
 docs:[
  {type:"form",title:"Valor Original #VO-023",desc:"Halle el precio antes del aumento",content:`<p>Un giro después de un aumento del 25% cobra $125.000 COP. ¿Cuál era el valor original antes del aumento?</p><div class="doc-input-wrap"><label>Valor original (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"100000",check:v=>parseInt(v.replace(/\D/g,""))===100000,fbOk:"Correcto: 125.000 / 1,25 = $100.000 COP.",fbErr:"Incorrecto. El factor de aumento 25% es 1,25. Original = 125.000 / 1,25 = $100.000."},
  {type:"info",title:"Informe de Reversión #IR-045",desc:"Analista calculó valor original",content:`<p>"Un producto con descuento del 20% cuesta $80.000. Valor original: 80.000 / 0,80 = $100.000."</p><div class="doc-conclusion ok">Conclusión: El cálculo del valor original es correcto.</div>`,correct:true,fbOk:"Correcto. Descuento 20% → factor 0,80. 80.000 / 0,80 = $100.000.",fbErr:"Error. El procedimiento es correcto."},
  {type:"info",title:"Auditoría de Base #AB-067",desc:"Error de base en reversión",content:`<p>"El precio con IVA del 19% es $119.000. Sin IVA: 119.000 - 19% = 119.000 - 22.610 = $96.390."</p><div class="doc-conclusion bad">Conclusión: La base gravable es $96.390.</div>`,correct:false,fbOk:"Correcto al rechazar. El 19% se calculó sobre $119.000 (valor final), no sobre el original. Correcto: 119.000 / 1,19 = $100.000.",fbErr:"Error. Se restó el 19% del valor final en vez de dividir por 1,19."}
]},
{d:12,b:2,t:"Puntos porcentuales vs. Porcentaje",
 c:"Puntos porcentuales = resta directa de dos porcentajes. Variación porcentual = aplicar la fórmula de variación. El ICFES pone ambas opciones como distractores.",
 ej:"La tasa pasó del 8% al 11%.<br>Puntos porcentuales: 11% - 8% = <strong>3 pp</strong><br>Variación porcentual: (11-8)/8 × 100 = <strong>37,5%</strong><br><span style='color:var(--sello-rojo);font-weight:700;'>Son cosas distintas.</span>",
 docs:[
  {type:"info",title:"Informe de Tasa #IT-012",desc:"Reporte de cambio en comisión",content:`<p>"La comisión del banco subió del 2% al 5%. Esto representa un aumento de 3 puntos porcentuales."</p><div class="doc-conclusion ok">Conclusión del informe: La interpretación es correcta.</div>`,correct:true,fbOk:"Correcto. 5% - 2% = 3 puntos porcentuales. La resta directa es válida para pp.",fbErr:"Error. La afirmación es correcta."},
  {type:"info",title:"Análisis de Variación #AV-034",desc:"Confusión entre pp y %",content:`<p>"La tasa de interés pasó del 10% al 12%. Esto significa que la tasa aumentó un 2%."</p><div class="doc-conclusion bad">Conclusión: El aumento es del 2%.</div>`,correct:false,fbOk:"Correcto al rechazar. Son 2 puntos porcentuales, NO 2%. La variación porcentual sería (12-10)/10 × 100 = 20%.",fbErr:"Error. 2% sería 2% de 10% = 0,2%. Son 2 puntos porcentuales."},
  {type:"form",title:"Cálculo de Variación #CV-056",desc:"Complete la variación porcentual real",content:`<p>La tasa de cambio preferencial pasó del 4% al 6%. ¿Cuál es la variación porcentual respecto al valor inicial?</p><div class="doc-input-wrap"><label>Variación %:</label><input type="text" class="doc-input" id="f-input" placeholder="%"></div>`,answer:"50",check:v=>parseFloat(v.replace(/%/g,"").replace(",","."))===50,fbOk:"Correcto: (6-4)/4 × 100 = 50%. La tasa creció un 50% respecto al 4% inicial.",fbErr:"Incorrecto. (6-4)/4 × 100 = 2/4 × 100 = 50%. No es 2% ni 2 puntos porcentuales."}
]},
{d:13,b:2,t:"Comparación de proporciones mediante porcentajes",
 c:"Para saber cuál de dos transacciones representa mayor proporción de ganancia, calcula el porcentaje de cada una y compara. No compares valores absolutos cuando las bases son diferentes.",
 ej:"Giro A: ganancia de $200 sobre $1.000 → 20%<br>Giro B: ganancia de $500 sobre $5.000 → 10%<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Decir que B fue mejor porque $500 > $200.",
 docs:[
  {type:"info",title:"Comparación de Rendimiento #CR-023",desc:"¿Qué giro fue más rentable?",content:`<p>Giro X: Ganancia $300 sobre inversión de $2.000 (15%)<br>Giro Y: Ganancia $800 sobre inversión de $8.000 (10%)</p><div class="doc-conclusion ok">Conclusión: El Giro X fue más rentable proporcionalmente (15% vs 10%).</div>`,correct:true,fbOk:"Correcto. 300/2.000 = 15% vs 800/8.000 = 10%. X es más rentable a pesar de menor ganancia absoluta.",fbErr:"Error. Se debe comparar por porcentaje, no por valor absoluto."},
  {type:"info",title:"Informe de Ranking #IR-045",desc:"Ranking incorrecto de rendimiento",content:`<p>"La sucursal Norte ganó $1.000 y la Sur ganó $500, así que Norte fue el doble de eficiente."</p><div class="doc-conclusion bad">Conclusión: Norte es el doble de eficiente que Sur.</div>`,correct:false,fbOk:"Correcto al rechazar. Sin conocer las bases (inversión de cada sucursal), no se puede determinar la eficiencia.",fbErr:"Error. No se pueden comparar ganancias absolutas sin conocer la inversión de cada una."},
  {type:"form",title:"Cálculo de Proporción #CP-067",desc:"¿Qué transacción tiene mayor porcentaje?",content:`<p>T1: Comisión de $180 sobre giro de $1.200<br>T2: Comisión de $250 sobre giro de $2.000<br><br>¿Cuál tiene mayor porcentaje de comisión? Escriba 1 o 2.</p><div class="doc-input-wrap"><label>Respuesta:</label><input type="text" class="doc-input" id="f-input" placeholder="1 o 2" style="width:80px;"></div>`,answer:"1",check:v=>v.trim()==="1",fbOk:"Correcto. T1: 180/1.200 = 15%. T2: 250/2.000 = 12,5%. T1 tiene mayor porcentaje.",fbErr:"Incorrecto. T1 = 15%, T2 = 12,5%. T1 tiene mayor porcentaje de comisión."}
]},
{d:14,b:2,t:"Prueba de fuego: Porcentajes únicos",
 c:"Auditoría de cálculos de porcentajes únicos en formularios. Combina: porcentaje básico, aumentos, descuentos y valor base oculto.",
 ej:"Revisa cada documento aplicando lo aprendido en los días 8 a 13.",
 docs:[
  {type:"form",title:"Auditoría de Porcentajes #AP-001",desc:"Complete el valor original",content:`<p>Un formulario muestra que después de un descuento del 40%, el cliente pagó $54.000 COP. ¿Cuál era el precio original?</p><div class="doc-input-wrap"><label>Precio original (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"90000",check:v=>parseInt(v.replace(/\D/g,""))===90000,fbOk:"Correcto: 54.000 / 0,60 = $90.000 COP.",fbErr:"Incorrecto. Descuento 40% → factor 0,60. Original = 54.000 / 0,60 = $90.000."},
  {type:"info",title:"Informe de Tarifa #IT-012",desc:"Aumento mal aplicado",content:`<p>"La tarifa de $70.000 sube 30%. Nueva tarifa: $70.000 + 30 = $70.030."</p><div class="doc-conclusion bad">Conclusión: El ajuste es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. 30% no es 30 pesos. Correcto: 70.000 × 1,30 = $91.000.",fbErr:"Error. Se sumó 30 en vez de aplicar 30%."},
  {type:"info",title:"Validación de Descuento #VD-034",desc:"Descuento calculado correctamente",content:`<p>"Giro de $250.000 con 12% de descuento: 250.000 × 0,12 = $30.000 de descuento. Precio final: $220.000."</p><div class="doc-conclusion ok">Conclusión: El descuento está bien aplicado.</div>`,correct:true,fbOk:"Correcto. 250.000 × 0,12 = 30.000. 250.000 - 30.000 = $220.000.",fbErr:"Error. El cálculo es correcto."},
  {type:"info",title:"Análisis de Puntos % #AP-056",desc:"Puntos porcentuales o variación",content:`<p>"La tasa de comisión pasó del 3% al 7%. Esto es un aumento del 4%."</p><div class="doc-conclusion bad">Conclusión: Correcto, subió 4%.</div>`,correct:false,fbOk:"Correcto al rechazar. Son 4 puntos porcentuales, no 4%. La variación porcentual sería (7-3)/3 × 100 = 133,3%.",fbErr:"Error. Confundió puntos porcentuales con variación porcentual."}
]},
/* --- BLOQUE 3: DÍAS 15-21 --- */
{d:15,b:3,t:"La gran falacia de los porcentajes sucesivos",
 c:"Un descuento del 10% seguido de otro 10% NO es un 20%. Se multiplican los factores: 0,90 × 0,90 = 0,81, es decir, un 19% de descuento real.",
 ej:"$100.000 con doble 10%:<br>Después del 1°: 100.000 × 0,90 = $90.000<br>Después del 2°: 90.000 × 0,90 = $81.000<br>Factor: 0,90 × 0,90 = 0,81 → <strong>19% de descuento, no 20%</strong>",
 docs:[
  {type:"info",title:"Promoción Doble #PD-012",desc:"Doble descuento del 10%",content:`<p>"Promoción: doble 10% de descuento. El cliente recibe 20% de descuento total."</p><div class="doc-conclusion bad">Conclusión: El descuento total es del 20%.</div>`,correct:false,fbOk:"Correcto al rechazar. 0,90 × 0,90 = 0,81. El descuento real es 19%, no 20%. ¡La base cambia!",fbErr:"Error. Los porcentajes sucesivos no se suman."},
  {type:"form",title:"Cálculo de Doble Descuento #CD-034",desc:"Calcule el precio real",content:`<p>Un giro de $500.000 tiene un descuento del 15% seguido de otro 10%. ¿Cuánto paga el cliente?</p><div class="doc-input-wrap"><label>Precio final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"382500",check:v=>parseInt(v.replace(/\D/g,""))===382500,fbOk:"Correcto: 500.000 × 0,85 × 0,90 = $382.500.",fbErr:"Incorrecto. 0,85 × 0,90 = 0,765. 500.000 × 0,765 = $382.500."},
  {type:"info",title:"Validación de Oferta #VO-056",desc:"Oferta con descuentos encadenados",content:`<p>"Descuento del 5% + descuento del 5% = 10% total. Se aplicó 0,95 × 0,95 = 0,9025, dando 9,75% de descuento real."</p><div class="doc-conclusion ok">Conclusión: El cálculo con factores es correcto.</div>`,correct:true,fbOk:"Correcto. 0,95 × 0,95 = 0,9025. El descuento real es 9,75%, no 10%.",fbErr:"Error. El análisis es correcto."},
  {type:"info",title:"Memorando de Falacia #MF-078",desc:"Suma directa de porcentajes",content:`<p>"Aumento del 8% seguido de aumento del 12% = aumento total del 20%."</p><div class="doc-conclusion bad">Conclusión: El aumento total es 20%.</div>`,correct:false,fbOk:"Correcto al rechazar. 1,08 × 1,12 = 1,2096. El aumento real es 20,96%, no 20%.",fbErr:"Error. Los porcentajes sucesivos se multiplican, no se suman."}
]},
{d:16,b:3,t:"Efecto base en aumentos sucesivos",
 c:"Un aumento del 20% sobre un valor que ya subió un 10% se calcula sobre el nuevo subtotal, no sobre el original.",
 ej:"$100.000 → +10% = $110.000 → +20% sobre $110.000 = $132.000<br>Factor: 1,10 × 1,20 = 1,32<br><span style='color:var(--sello-rojo);font-weight:700;'>No es 1 + 0,10 + 0,20 = 1,30 ($130.000)</span>",
 docs:[
  {type:"form",title:"Aumentos Encadenados #AE-023",desc:"Calcule el precio final",content:`<p>Una tarifa de $200.000 COP aumenta 15% en enero y luego 20% en febrero. ¿Cuál es el precio final?</p><div class="doc-input-wrap"><label>Precio final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"276000",check:v=>parseInt(v.replace(/\D/g,""))===276000,fbOk:"Correcto: 200.000 × 1,15 × 1,20 = $276.000.",fbErr:"Incorrecto. 1,15 × 1,20 = 1,38. 200.000 × 1,38 = $276.000."},
  {type:"info",title:"Reporte de Ajuste #RA-045",desc:"Error de base en aumento",content:`<p>"La tarifa de $50.000 sube 10% y luego 10%. Factor: 1 + 0,10 + 0,10 = 1,20. Precio final: $60.000."</p><div class="doc-conclusion bad">Conclusión: El cálculo es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. Se sumaron los porcentajes. Correcto: 1,10 × 1,10 = 1,21. Precio: $60.500.",fbErr:"Error. Los porcentajes sucesivos no se suman."},
  {type:"info",title:"Validación de Factores #VF-067",desc:"Aumentos aplicados correctamente",content:`<p>"Precio base $80.000. Aumento 25% luego 10%. Factores: 1,25 × 1,10 = 1,375. Final: $110.000."</p><div class="doc-conclusion ok">Conclusión: El procedimiento con factores es correcto.</div>`,correct:true,fbOk:"Correcto. 1,25 × 1,10 = 1,375. 80.000 × 1,375 = $110.000.",fbErr:"Error. El cálculo es correcto."},
  {type:"info",title:"Auditoría de Tarifa #AT-089",desc:"Base equivocada",content:`<p>"Subió 20% ($100→$120) y luego 5% sobre los $100 originales ($5). Total: $125."</p><div class="doc-conclusion bad">Conclusión: El segundo aumento es del 5% sobre el original.</div>`,correct:false,fbOk:"Correcto al rechazar. El 5% debe aplicarse sobre $120 (nueva base), no sobre $100. Correcto: 120 × 1,05 = $126.",fbErr:"Error. Cada porcentaje se aplica sobre el subtotal anterior."}
]},
{d:17,b:3,t:"Aumento y descuento compensado",
 c:"Subir 50% y luego bajar 50% NO devuelve al valor original. El descuento se aplica sobre un valor mayor, así que se quita más de lo que se sumó.",
 ej:"$100.000 → +50% = $150.000 → -50% = $75.000<br>Factor: 1,50 × 0,50 = 0,75<br><span style='color:var(--sello-rojo);font-weight:700;'>¡Perdiste 25%! No vuelve al original.</span>",
 docs:[
  {type:"info",title:"Promoción Engañosa #PE-012",desc:"Sube y baja el mismo porcentaje",content:`<p>"Subimos 50% por inflación y luego bajamos 50% en oferta. El precio vuelve al original."</p><div class="doc-conclusion bad">Conclusión: El precio regresa a su valor inicial.</div>`,correct:false,fbOk:"Correcto al rechazar. 1,50 × 0,50 = 0,75. El precio queda en 75% del original, no en 100%.",fbErr:"Error. Esta es una de las falacias más comunes del ICFES."},
  {type:"form",title:"Cálculo Compensado #CC-034",desc:"¿Qué porcentaje del original queda?",content:`<p>Un precio sube 30% y luego baja 30%. ¿Qué porcentaje del precio original queda finalmente?</p><div class="doc-input-wrap"><label>Porcentaje %:</label><input type="text" class="doc-input" id="f-input" placeholder="%"></div>`,answer:"91",check:v=>parseFloat(v.replace(/%/g,"").replace(",","."))===91,fbOk:"Correcto: 1,30 × 0,70 = 0,91. Queda el 91% del original.",fbErr:"Incorrecto. 1,30 × 0,70 = 0,91 = 91%. No vuelve al 100%."},
  {type:"info",title:"Validación de Simetría #VS-056",desc:"¿Es simétrico el proceso?",content:`<p>"Si bajo 20% y luego subo 20%, recupero el valor original porque las operaciones son inversas."</p><div class="doc-conclusion bad">Conclusión: Las operaciones se anulan perfectamente.</div>`,correct:false,fbOk:"Correcto al rechazar. 0,80 × 1,20 = 0,96. Queda en 96%, pierde 4%. No se anulan.",fbErr:"Error. No se anulan porque la base cambia entre operaciones."},
  {type:"info",title:"Análisis de Factor #AF-078",desc:"Factor calculado correctamente",content:`<p>"Sube 100% y baja 50%. Factor: 2,00 × 0,50 = 1,00. Sí vuelve al original en este caso especial."</p><div class="doc-conclusion ok">Conclusión: En este caso particular el factor es 1,00.</div>`,correct:true,fbOk:"Correcto. 2,00 × 0,50 = 1,00. Este es el único caso donde se anulan: duplicar y reducir a la mitad.",fbErr:"Error. 2,00 × 0,50 = 1,00 es correcto. Es un caso especial."}
]},
{d:18,b:3,t:"Análisis de propuestas de ahorro",
 c:"Detectar errores donde los ciudadanos suman porcentajes directamente en sus reportes de ahorro. Si un paquete tiene descuentos del 10% + 15%, no es 25%.",
 ej:"Paquete turístico: 10% descuento temprano + 15% descuento temporada.<br>Error: 10% + 15% = 25% → factor 0,75<br>Correcto: 0,90 × 0,85 = 0,765 → <strong>23,5% de descuento real</strong>",
 docs:[
  {type:"info",title:"Propuesta de Ahorro #PA-023",desc:"Ciudadano suma descuentos",content:`<p>"Mi paquete tiene 8% de descuento por pronto pago y 12% por volumen. Total: 20% de descuento."</p><div class="doc-conclusion bad">Conclusión: El ahorro total es del 20%.</div>`,correct:false,fbOk:"Correcto al rechazar. 0,92 × 0,88 = 0,8096. El descuento real es 19,04%, no 20%.",fbErr:"Error. Los descuentos sucesivos no se suman."},
  {type:"form",title:"Cálculo de Ahorro Real #CA-045",desc:"¿Cuánto paga realmente?",content:`<p>Giro de $400.000 con descuento del 5% por fidelidad y 10% por monto alto. ¿Cuánto paga?</p><div class="doc-input-wrap"><label>Pago final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"342000",check:v=>parseInt(v.replace(/\D/g,""))===342000,fbOk:"Correcto: 400.000 × 0,95 × 0,90 = $342.000.",fbErr:"Incorrecto. 0,95 × 0,90 = 0,855. 400.000 × 0,855 = $342.000."},
  {type:"info",title:"Validación de Paquete #VP-067",desc:"Descuentos aplicados con factores",content:`<p>"Descuento del 20% + adicional del 10%. Se aplicó: 0,80 × 0,90 = 0,72. Descuento real: 28%."</p><div class="doc-conclusion ok">Conclusión: El cálculo con factores es correcto.</div>`,correct:true,fbOk:"Correcto. 0,80 × 0,90 = 0,72. Descuento real 28%, no 30%.",fbErr:"Error. El análisis es correcto."},
  {type:"info",title:"Informe de Ahorro #IA-089",desc:"Error en reporte de ahorro",content:`<p>"Con descuentos del 15% y 15%, el cliente ahorra 30%. Se verificó: 0,85 × 0,85 = 0,7225, es decir 27,75%."</p><div class="doc-conclusion bad">Conclusión: El ahorro es de 30% como se anunció.</div>`,correct:false,fbOk:"Correcto al rechazar. El propio informe demuestra que es 27,75%, no 30%. Se contradice.",fbErr:"Error. El informe se contradice a sí mismo."}
]},
{d:19,b:3,t:"Porcentajes de variaciones temporales",
 c:"Comparar el cambio porcentual de dos trimestres con bases diferentes. Un aumento mayor en valor absoluto puede ser menor en porcentaje si la base es más grande.",
 ej:"Trimestre 1: de $100 a $120 → +20%<br>Trimestre 2: de $200 a $230 → +15%<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Decir que T2 creció más porque +30 > +20.",
 docs:[
  {type:"info",title:"Comparación Trimestral #CT-012",desc:"¿Qué trimestre creció más?",content:`<p>T1: Remesas de $5.000M a $6.000M (+$1.000M)<br>T2: Remesas de $8.000M a $9.200M (+$1.200M)</p><div class="doc-conclusion bad">Conclusión: T2 creció más porque $1.200M > $1.000M.</div>`,correct:false,fbOk:"Correcto al rechazar. T1: +20% (1.000/5.000). T2: +15% (1.200/8.000). T1 creció más en porcentaje.",fbErr:"Error. Se deben comparar porcentajes, no valores absolutos."},
  {type:"form",title:"Variación Trimestral #VT-034",desc:"Calcule la variación porcentual",content:`<p>Las exportaciones pasaron de $12.000M a $15.600M en un trimestre. ¿Cuál fue la variación porcentual?</p><div class="doc-input-wrap"><label>Variación %:</label><input type="text" class="doc-input" id="f-input" placeholder="%"></div>`,answer:"30",check:v=>parseFloat(v.replace(/%/g,"").replace(",","."))===30,fbOk:"Correcto: (15.600-12.000)/12.000 × 100 = 30%.",fbErr:"Incorrecto. (15.600-12.000)/12.000 × 100 = 3.600/12.000 × 100 = 30%."},
  {type:"info",title:"Informe de Crecimiento #IC-056",desc:"Análisis correcto de variaciones",content:`<p>"Mes A: de $50M a $60M (+20%). Mes B: de $30M a $39M (+30%). Aunque en valor absoluto A subió más ($10M vs $9M), B tuvo mayor crecimiento porcentual."</p><div class="doc-conclusion ok">Conclusión: El análisis compara correctamente ambos criterios.</div>`,correct:true,fbOk:"Correcto. El informe distingue entre valor absoluto y variación porcentual.",fbErr:"Error. El análisis es correcto."},
  {type:"info",title:"Memorando de Tendencia #MT-078",desc:"Conclusión opuesta a los datos",content:`<p>"Las remesas pasaron de $20M a $24M (+20%) y luego de $24M a $26,4M (+10%). El segundo periodo fue el de mayor crecimiento."</p><div class="doc-conclusion bad">Conclusión: El segundo periodo tuvo mayor crecimiento.</div>`,correct:false,fbOk:"Correcto al rechazar. 20% > 10%. El primer periodo tuvo mayor crecimiento porcentual.",fbErr:"Error. 20% es mayor que 10%."}
]},
{d:20,b:3,t:"Validación de ofertas turísticas",
 c:"Revisar si los cálculos de paquetes de viaje con doble descuento son coherentes. El orden de los descuentos NO importa para el resultado final (propiedad conmutativa).",
 ej:"$1.000.000 con 10% + 20%:<br>Orden A: 1.000.000 × 0,90 × 0,80 = $720.000<br>Orden B: 1.000.000 × 0,80 × 0,90 = $720.000<br><strong>Mismo resultado</strong> (la multiplicación es conmutativa)",
 docs:[
  {type:"info",title:"Oferta Turística #OT-012",desc:"¿El orden importa?",content:`<p>"El descuento de 10% debe aplicarse antes del 20% para obtener mejor precio."</p><div class="doc-conclusion bad">Conclusión: El orden de los descuentos afecta el resultado final.</div>`,correct:false,fbOk:"Correcto al rechazar. La multiplicación es conmutativa: 0,90 × 0,80 = 0,80 × 0,90 = 0,72. El orden no importa.",fbErr:"Error. El orden de descuentos sucesivos no afecta el resultado."},
  {type:"form",title:"Precio de Paquete #PP-034",desc:"Calcule el precio con doble descuento",content:`<p>Paquete de $2.000.000 con descuentos del 25% y 15%. ¿Cuánto paga el cliente?</p><div class="doc-input-wrap"><label>Precio final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"1275000",check:v=>parseInt(v.replace(/\D/g,""))===1275000,fbOk:"Correcto: 2.000.000 × 0,75 × 0,85 = $1.275.000.",fbErr:"Incorrecto. 0,75 × 0,85 = 0,6375. 2.000.000 × 0,6375 = $1.275.000."},
  {type:"info",title:"Validación de Promoción #VP-056",desc:"Descuento total calculado bien",content:`<p>"Paquete $3.000.000. Descuento 30% + 10%. Factor: 0,70 × 0,90 = 0,63. Precio: $1.890.000. Descuento real: 37%."</p><div class="doc-conclusion ok">Conclusión: Los cálculos son correctos.</div>`,correct:true,fbOk:"Correcto. 0,70 × 0,90 = 0,63. Descuento 37%, no 40%.",fbErr:"Error. El cálculo es correcto."},
  {type:"info",title:"Anuncio Engañoso #AE-089",desc:"Falso descuento total",content:`<p>"¡40% de descuento total! 20% de temporada + 20% de lanzamiento."</p><div class="doc-conclusion bad">Conclusión: El descuento total es 40%.</div>`,correct:false,fbOk:"Correcto al rechazar. 0,80 × 0,80 = 0,64. El descuento real es 36%, no 40%. El anuncio es engañoso.",fbErr:"Error. 20% + 20% ≠ 40% cuando son sucesivos."}
]},
{d:21,b:3,t:"Prueba de fuego: Porcentajes sucesivos",
 c:"Rechazar expedientes con trampas de porcentajes encadenados. Todo lo del bloque 3 combinado.",
 ej:"Aplica todo lo aprendido: factores multiplicadores, bases cambiantes, y la falacia de suma de porcentajes.",
 docs:[
  {type:"info",title:"Expediente Mixto #EM-001",desc:"Múltiples errores de porcentajes",content:`<p>"Subió 25% y luego bajó 25%. Volvió al precio original porque son operaciones inversas."</p><div class="doc-conclusion bad">Conclusión: Las operaciones se anulan.</div>`,correct:false,fbOk:"Correcto al rechazar. 1,25 × 0,75 = 0,9375. Queda en 93,75%, pierde 6,25%.",fbErr:"Error. No se anulan porque la base cambia."},
  {type:"form",title:"Cálculo Final #CF-012",desc:"Triple operación sucesiva",content:`<p>$300.000 COP. Aumento 10%, descuento 15%, aumento 5%. ¿Precio final?</p><div class="doc-input-wrap"><label>Precio final (COP):</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"295575",check:v=>parseInt(v.replace(/\D/g,""))===295575,fbOk:"Correcto: 300.000 × 1,10 × 0,85 × 1,05 = $295.575.",fbErr:"Incorrecto. 1,10 × 0,85 × 1,05 = 0,98525. 300.000 × 0,98525 = $295.575."},
  {type:"info",title:"Validación Completa #VC-034",desc:"Factores correctos",content:`<p>"Descuentos de 12%, 8% y 5%. Factor: 0,88 × 0,92 × 0,95 = 0,7691. Descuento real: 23,09%."</p><div class="doc-conclusion ok">Conclusión: El cálculo encadenado es correcto.</div>`,correct:true,fbOk:"Correcto. Los tres factores están bien multiplicados.",fbErr:"Error. El cálculo es correcto."},
  {type:"info",title:"Informe Final #IF-056",desc:"Suma de tres porcentajes",content:`<p>"Con descuentos del 10%, 8% y 7%, el ahorro total es 25% y el factor es 0,75."</p><div class="doc-conclusion bad">Conclusión: El ahorro total es 25%.</div>`,correct:false,fbOk:"Correcto al rechazar. 0,90 × 0,92 × 0,93 = 0,7696. Descuento real: 23,04%, no 25%.",fbErr:"Error. Se sumaron los porcentajes en vez de multiplicar los factores."},
  {type:"info",title:"Auditoría de Simetría #AS-078",desc:"¿Se anulan?",content:`<p>"Sube 200% y baja 66,67%. Factor: 3,00 × 0,3333 = 1,00. Vuelve al original."</p><div class="doc-conclusion ok">Conclusión: En este caso particular sí vuelve al original.</div>`,correct:true,fbOk:"Correcto. 3,00 × (1/3) = 1,00. Este caso especial sí se anula.",fbErr:"Error. 3 × 1/3 = 1 es correcto."}
]},
/* --- BLOQUE 4: DÍAS 22-29 --- */
{d:22,b:4,t:"Lectura de gráficos de línea cambiaria",
 c:"El punto más alto del gráfico NO significa el momento de mayor crecimiento o tasa de cambio. El crecimiento se mide por la pendiente (cambio entre puntos), no por el valor absoluto.",
 ej:"Mes 1: $100M, Mes 2: $180M (creció $80M)<br>Mes 5: $300M, Mes 6: $310M (creció $10M)<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Decir que el crecimiento fue mayor en el mes 6 porque $310M > $180M.",
 docs:[
  {type:"info",title:"Análisis de Gráfico #AG-012",desc:"Punto más alto vs mayor crecimiento",content:`<p>Un gráfico muestra: Ene=$200M, Feb=$350M, Mar=$380M, Abr=$400M.</p><div class="doc-conclusion bad">Conclusión: Abril fue el mes de mayor crecimiento porque tiene el valor más alto ($400M).</div>`,correct:false,fbOk:"Correcto al rechazar. El mayor crecimiento fue Feb (+$150M). Abril solo creció $20M. Valor alto ≠ mayor crecimiento.",fbErr:"Error. El valor absoluto no indica la tasa de cambio."},
  {type:"info",title:"Interpretación de Pendiente #IP-034",desc:"Pendiente correcta",content:`<p>"El tramo de Ene a Feb ($200M→$350M) tiene la mayor pendiente del gráfico, indicando el mayor crecimiento mensual."</p><div class="doc-conclusion ok">Conclusión: La interpretación de la pendiente es correcta.</div>`,correct:true,fbOk:"Correcto. La mayor pendiente indica el mayor cambio entre dos puntos consecutivos.",fbErr:"Error. La interpretación es correcta."},
  {type:"form",title:"Cálculo de Crecimiento #CC-056",desc:"¿Cuál mes tuvo mayor crecimiento porcentual?",content:`<p>Ene: $50M → Feb: $70M<br>Mar: $90M → Abr: $108M<br><br>Escriba el mes con mayor crecimiento %: Ene-Feb (1) o Mar-Abr (2)</p><div class="doc-input-wrap"><label>Respuesta:</label><input type="text" class="doc-input" id="f-input" placeholder="1 o 2" style="width:80px;"></div>`,answer:"1",check:v=>v.trim()==="1",fbOk:"Correcto. Ene-Feb: (70-50)/50 = 40%. Mar-Abr: (108-90)/90 = 20%. Ene-Feb creció más.",fbErr:"Incorrecto. Ene-Feb = 40%, Mar-Abr = 20%. Aunque en absoluto Mar-Abr subió más ($18M vs $20M)... espera, $20M>$18M pero 40%>20%."},
  {type:"info",title:"Reporte de Tendencia #RT-078",desc:"Confundió valor con crecimiento",content:`<p>"El pico del gráfico está en Julio ($500M), por lo que Julio fue el mes de mayor crecimiento económico."</p><div class="doc-conclusion bad">Conclusión: Julio = mayor crecimiento.</div>`,correct:false,fbOk:"Correcto al rechazar. El pico es el valor máximo, no necesariamente el de mayor crecimiento. Hay que ver la pendiente.",fbErr:"Error. Pico del gráfico ≠ mayor crecimiento."},
  {type:"info",title:"Validación Gráfica #VG-090",desc:"Análisis correcto de tramos",content:`<p>"El tramo May-Jun sube $20M y el tramo Jun-Jul baja $5M. La tasa de cambio positiva fue mayor en May-Jun."</p><div class="doc-conclusion ok">Conclusión: Correcto, $20M de subida > $5M de bajada en términos de cambio absoluto.</div>`,correct:true,fbOk:"Correcto. La interpretación del cambio absoluto por tramo es correcta.",fbErr:"Error. El análisis es correcto."}
]},
{d:23,b:4,t:"Pendiente vs. Valor absoluto",
 c:"La inclinación de una recta mide la velocidad del cambio. Una recta más inclinada indica cambio más rápido, independientemente de los valores absolutos.",
 ej:"Recta A: de 10 a 30 en 1 mes (pendiente 20)<br>Recta B: de 100 a 110 en 1 mes (pendiente 10)<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Decir que B creció más porque llegó a 110.",
 docs:[
  {type:"info",title:"Comparación de Rectas #CR-012",desc:"¿Qué recta crece más rápido?",content:`<p>Recta 1: de $50M a $80M en un mes.<br>Recta 2: de $200M a $220M en un mes.</p><div class="doc-conclusion bad">Conclusión: La Recta 2 crece más porque llegó a $220M.</div>`,correct:false,fbOk:"Correcto al rechazar. Recta 1: pendiente +$30M. Recta 2: pendiente +$20M. La Recta 1 crece más rápido.",fbErr:"Error. La pendiente (cambio) es lo que importa, no el valor final."},
  {type:"form",title:"Cálculo de Pendiente #CP-034",desc:"¿Cuál tiene mayor pendiente?",content:`<p>Línea A: sube 15 unidades en 3 periodos.<br>Línea B: sube 40 unidades en 10 periodos.<br><br>¿Cuál tiene mayor pendiente? Escriba A o B.</p><div class="doc-input-wrap"><label>Respuesta:</label><input type="text" class="doc-input" id="f-input" placeholder="A o B" style="width:80px;"></div>`,answer:"A",check:v=>v.trim().toUpperCase()==="A",fbOk:"Correcto. Pendiente A: 15/3 = 5. Pendiente B: 40/10 = 4. A tiene mayor pendiente.",fbErr:"Incorrecto. Pendiente A = 5, Pendiente B = 4. A > B."},
  {type:"info",title:"Informe de Velocidad #IV-056",desc:"Pendiente interpretada bien",content:`<p>"La línea de la tasa de cambio pasó de 3.800 a 4.200 en 2 meses (pendiente 200/mes), mientras que la del año anterior pasó de 3.500 a 4.000 en 5 meses (pendiente 100/mes). La primera línea crece más rápido."</p><div class="doc-conclusion ok">Conclusión: La comparación de pendientes es correcta.</div>`,correct:true,fbOk:"Correcto. 200/mes > 100/mes. La primera crece al doble de velocidad.",fbErr:"Error. El análisis es correcto."},
  {type:"info",title:"Error de Velocidad #EV-078",desc:"Confundió pendiente con valor",content:`<p>"La tasa llegó a 4.500 en el tramo final, así que ese fue el de mayor velocidad de cambio."</p><div class="doc-conclusion bad">Conclusión: Mayor valor = mayor velocidad de cambio.</div>`,correct:false,fbOk:"Correcto al rechazar. El valor final no indica la velocidad. Hay que calcular la pendiente del tramo.",fbErr:"Error. Valor final y pendiente son conceptos distintos."}
]},
{d:24,b:4,t:"Análisis de tablas comparativas de monedas",
 c:"Identificar errores donde se confunde el volumen total con el precio unitario. En tablas de monedas, siempre verificar qué columna es cuál.",
 ej:"Tabla: USD | Total COP | Tasa<br>10 | $40.000 | 4.000<br>Si alguien lee $40.000 como la tasa por dólar, comete un error de lectura.",
 docs:[
  {type:"info",title:"Lectura de Tabla #LT-012",desc:"Confundió total con unitario",content:`<table class="doc-table"><tr><th>USD</th><th>Total COP</th></tr><tr><td>5</td><td>$20.000</td></tr><tr><td>20</td><td>$80.000</td></tr></table><p>Conclusión del analista: "La tasa es $20.000 por dólar porque así dice la tabla."</p><div class="doc-conclusion bad">Conclusión: La tasa es $20.000 COP/USD.</div>`,correct:false,fbOk:"Correcto al rechazar. $20.000 es el TOTAL para 5 USD, no la tasa unitaria. Tasa = 20.000/5 = $4.000.",fbErr:"Error. Confundió el monto total con la tasa unitaria."},
  {type:"form",title:"Extracción de Datos #ED-034",desc:"¿Cuál es la tasa real?",content:`<table class="doc-table"><tr><th>EUR</th><th>Monto Total COP</th></tr><tr><td>15</td><td>$64.500</td></tr></table><div class="doc-input-wrap"><label>Tasa COP/EUR:</label><input type="text" class="doc-input" id="f-input" placeholder="$"></div>`,answer:"4300",check:v=>parseInt(v.replace(/\D/g,""))===4300,fbOk:"Correcto: 64.500 / 15 = $4.300 COP por EUR.",fbErr:"Incorrecto. La tasa es el total dividido por la cantidad: 64.500 / 15 = $4.300."},
  {type:"info",title:"Validación de Lectura #VL-056",desc:"Lectura correcta de tabla",content:`<table class="doc-table"><tr><th>GBP</th><th>Total COP</th><th>Tasa</th></tr><tr><td>8</td><td>$36.800</td><td>4.600</td></tr></table><p>"La tasa es 4.600 COP/GBP, verificada: 36.800/8 = 4.600."</p><div class="doc-conclusion ok">Conclusión: La lectura y verificación son correctas.</div>`,correct:true,fbOk:"Correcto. 36.800/8 = 4.600. La lectura es precisa.",fbErr:"Error. La interpretación es correcta."},
  {type:"info",title:"Error de Columna #EC-078",desc:"Leyó columna equivocada",content:`<table class="doc-table"><tr><th>Moneda</th><th>Cantidad</th><th>Tasa</th><th>Total</th></tr><tr><td>USD</td><td>25</td><td>4.100</td><td>$102.500</td></tr></table><p>"La tasa es $102.500 porque es el número más grande de la fila."</p><div class="doc-conclusion bad">Conclusión: La tasa es $102.500.</div>`,correct:false,fbOk:"Correcto al rechazar. La tasa es la columna 'Tasa' = 4.100. $102.500 es el total.",fbErr:"Error. Seleccionó la columna equivocada."},
  {type:"info",title:"Cruce de Datos #CD-090",desc:"Verificación cruzada correcta",content:`<p>"Tabla dice: 30 USD a tasa 4.200 = $126.000. Verificación: 30 × 4.200 = $126.000. Correcto."</p><div class="doc-conclusion ok">Conclusión: Los datos de la tabla son consistentes.</div>`,correct:true,fbOk:"Correcto. La multiplicación cruzada confirma los datos.",fbErr:"Error. La verificación es correcta."}
]},
{d:25,b:4,t:"Gráficos de barras de variación",
 c:"Las barras de crecimiento positivo y negativo deben interpretarse correctamente. Una barra más larga no siempre significa mayor impacto si las escalas son diferentes.",
 ej:"Barra A: +$50M (sobre base de $100M = 50%)<br>Barra B: +$80M (sobre base de $500M = 16%)<br><span style='color:var(--sello-rojo);font-weight:700;'>Error:</span> Decir que B tuvo mayor crecimiento porque la barra es más alta.",
 docs:[
  {type:"info",title:"Lectura de Barras #LB-012",desc:"Barra más alta = mayor crecimiento?",content:`<p>Barra de Enero: +$30M. Barra de Febrero: +$60M. La barra de Feb es el doble de alta.</p><div class="doc-conclusion bad">Conclusión: Febrero tuvo el doble de crecimiento que Enero.</div>`,correct:false,fbOk:"Correcto al rechazar. Sin conocer las bases, no se puede comparar crecimiento porcentual solo por la altura de la barra.",fbErr:"Error. Se necesitan las bases para comparar porcentajes."},
  {type:"info",title:"Interpretación Correcta #IC-034",desc:"Barras con contexto de base",content:`<p>"Sucursal Norte creció $20M (base $40M = 50%). Sur creció $35M (base $200M = 17,5%). Aunque la barra de Sur es más alta, Norte creció proporcionalmente más."</p><div class="doc-conclusion ok">Conclusión: La interpretación considera las bases correctamente.</div>`,correct:true,fbOk:"Correcto. Se comparan los porcentajes, no solo la altura de las barras.",fbErr:"Error. El análisis es correcto."},
  {type:"form",title:"Variación en Barras #VB-056",desc:"Calcule la variación porcentual",content:`<p>Una barra muestra variación de -$15M sobre una base de $60M. ¿Cuál es la variación porcentual?</p><div class="doc-input-wrap"><label>Variación %:</label><input type="text" class="doc-input" id="f-input" placeholder="%"></div>`,answer:"25",check:v=>Math.abs(parseFloat(v.replace(/%/g,"").replace(",","."))-(-25))<1||parseFloat(v.replace(/%/g,"").replace(",","."))===-25,fbOk:"Correcto: -15/60 × 100 = -25%. Una caída del 25%.",fbErr:"Incorrecto. -15/60 × 100 = -25%. Es negativo porque es una caída."},
  {type:"info",title:"Error de Signo #ES-078",desc:"Barra negativa mal interpretada",content:`<p>"La barra muestra -$10M, lo que significa que la tasa subió un 10%."</p><div class="doc-conclusion bad">Conclusión: Una barra negativa indica subida.</div>`,correct:false,fbOk:"Correcto al rechazar. Una barra negativa indica disminución, no subida.",fbErr:"Error. Barra negativa = disminución."}
]},
{d:26,b:4,t:"Informes con conclusiones falsas",
 c:"Detectar cuando un analista redacta una conclusión que contradice los datos de la tabla adjunta. La conclusión debe ser lógicamente consistente con los datos.",
 ej:"Tabla muestra: Tasa subió de 4.000 a 4.200.<br>Conclusión: "La tasa se mantuvo estable."<br><span style='color:var(--sello-rojo);font-weight:700;'>¡Contradicción directa!</span>",
 docs:[
  {type:"info",title:"Informe Contradictorio #IC-012",desc:"Conclusión opuesta a los datos",content:`<table class="doc-table"><tr><th>Mes</th><th>Tasa COP/USD</th></tr><tr><td>Ene</td><td>3.900</td></tr><tr><td>Feb</td><td>4.100</td></tr><tr><td>Mar</td><td>4.300</td></tr></table><div class="doc-conclusion bad">Conclusión: La tasa se ha mantenido estable durante el trimestre.</div>`,correct:false,fbOk:"Correcto al rechazar. La tabla muestra un aumento constante (3.900→4.100→4.300). No está estable.",fbErr:"Error. La conclusión contradice directamente los datos."},
  {type:"info",title:"Informe Coherente #IC-034",desc:"Conclusión respaldada por datos",content:`<table class="doc-table"><tr><th>Semana</th><th>Giros procesados</th></tr><tr><td>1</td><td>120</td></tr><tr><td>2</td><td>118</td></tr><tr><td>3</td><td>115</td></tr></table><div class="doc-conclusion ok">Conclusión: Hay una tendencia descendente en el volumen de giros.</div>`,correct:true,fbOk:"Correcto. Los datos muestran descenso (120→118→115) y la conclusión lo refleja.",fbErr:"Error. La conclusión es consistente con los datos."},
  {type:"info",title:"Falacia de Causalidad #FC-056",desc:"Conclusión no respaldada",content:`<table class="doc-table"><tr><th>Mes</th><th>Tasa</th><th>Giros</th></tr><tr><td>Ene</td><td>4.000</td><td>500</td></tr><tr><td>Feb</td><td>4.200</td><td>480</td></tr></table><div class="doc-conclusion bad">Conclusión: El aumento de la tasa causó directamente la caída en giros.</div>`,correct:false,fbOk:"Correcto al rechazar. La tabla muestra correlación, no causalidad. No se puede afirmar que una cosa causó la otra solo con estos datos.",fbErr:"Error. Correlación no implica causalidad."},
  {type:"info",title:"Informe Preciso #IP-078",desc:"Conclusión moderada y correcta",content:`<p>"Los datos muestran que mientras la tasa subió un 5%, los giros bajaron un 4%. Esto sugiere una posible relación, pero se requieren más datos para confirmar causalidad."</p><div class="doc-conclusion ok">Conclusión: El análisis es prudente y no asume causalidad.</div>`,correct:true,fbOk:"Correcto. El informe distingue entre correlación y causalidad.",fbErr:"Error. La conclusión es apropiada."},
