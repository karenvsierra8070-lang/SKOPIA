<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspectoría de Tasas Cambiarias - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root{--crema:#fdfbf5;--crema-mid:#f5f0e3;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;--oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;--sombra:rgba(39,43,0,.08);--sombra-md:rgba(39,43,0,.12);--radius:14px;--radius-sm:8px;--dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;--verde:#3e6b3a;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,.1) 0%,transparent 50%);}
        a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}

        .topbar{position:sticky;top:0;z-index:100;height:64px;background:rgba(253,251,245,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,.06);display:flex;align-items:center;padding:0 24px;gap:14px;}
        .topbar-toggle{width:38px;height:38px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1rem;color:var(--oliva-oscuro);transition:background .2s;}
        .topbar-toggle:hover{background:rgba(39,43,0,.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{font-family:'Patrick Hand',cursive;font-size:1.35rem;line-height:1.2;}
        .topbar-greeting .sub{font-size:.78rem;color:var(--oliva-medio);}
        .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
        .tb-stat{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;font-size:.78rem;font-weight:600;}
        .tb-stat.dia{background:rgba(90,97,51,.1);color:var(--oliva-medio);}
        .tb-stat.docs{background:rgba(201,162,39,.1);color:var(--dorado);font-family:'Orbitron',monospace;font-size:.72rem;}
        .tb-stat.alerta{background:rgba(184,92,56,.1);color:var(--rojo-suave);}
        .tb-stat.alerta.critico{background:var(--rojo-suave);color:#fff;animation:pulseAlert .6s ease infinite alternate;}
        @keyframes pulseAlert{from{opacity:.8}to{opacity:1}}

        .main{padding:24px;max-width:680px;margin:0 auto;}

        .screen{display:none;animation:fadeUp .4s ease;}
        .screen.active{display:block;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

        /* INTRO */
        .intro{text-align:center;padding:40px 0 20px;}
        .intro-icon{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));display:grid;place-items:center;margin:0 auto 18px;font-size:2.2rem;color:var(--crema);box-shadow:0 6px 24px rgba(39,43,0,.2);}
        .intro h2{font-family:'Patrick Hand',cursive;font-size:1.8rem;color:var(--oliva-oscuro);margin-bottom:8px;}
        .intro>p{font-size:.9rem;color:var(--oliva-medio);max-width:480px;margin:0 auto 16px;line-height:1.6;}
        .intro-rules{text-align:left;background:#fff;border-radius:var(--radius);padding:22px 24px;margin:20px auto;max-width:480px;box-shadow:0 2px 12px var(--sombra);}
        .intro-rules h3{font-family:'Patrick Hand',cursive;font-size:1.1rem;color:var(--oliva-medio);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .intro-rules h3 i{color:var(--dorado);}
        .intro-rules li{font-size:.84rem;line-height:1.7;color:#444;padding:3px 0 3px 20px;position:relative;list-style:none;}
        .intro-rules li::before{content:'';position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--dorado);}
        .intro-rules li strong{color:var(--oliva-oscuro);}
        .btn-start{display:inline-flex;align-items:center;gap:8px;padding:14px 40px;border-radius:var(--radius-sm);background:var(--oliva-oscuro);color:var(--crema);font-size:1rem;font-weight:600;transition:all .25s;margin-top:20px;box-shadow:0 4px 16px rgba(39,43,0,.15);}
        .btn-start:hover{background:var(--oliva-medio);transform:translateY(-2px);box-shadow:0 6px 20px rgba(39,43,0,.25);}

        /* DIA START */
        .dia-start{text-align:center;padding:50px 0 30px;}
        .dia-start .ds-num{font-family:'Orbitron',monospace;font-size:3.5rem;font-weight:900;color:var(--oliva-oscuro);line-height:1;}
        .dia-start .ds-label{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);margin-top:4px;}
        .dia-start .ds-bloque{font-family:'Patrick Hand',cursive;font-size:1.15rem;color:var(--oliva-medio);margin-top:12px;}

        /* CIRCULAR */
        .circular{background:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;box-shadow:0 2px 12px var(--sombra);border:1px solid rgba(39,43,0,.04);}
        .circular .cir-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--oliva-palido);}
        .circular .cir-hdr i{font-size:1rem;color:var(--dorado);}
        .circular .cir-hdr h3{font-family:'Patrick Hand',cursive;font-size:1.1rem;color:var(--oliva-oscuro);flex:1;}
        .circular .cir-hdr .cir-dia{font-family:'Orbitron',monospace;font-size:.7rem;background:var(--dorado);color:#fff;padding:3px 10px;border-radius:10px;}
        .circular p{font-size:.87rem;line-height:1.6;color:#444;margin-bottom:8px;}
        .circular p strong{color:var(--oliva-oscuro);}
        .cir-ej{background:var(--crema);border-radius:var(--radius-sm);padding:14px 16px;margin-top:10px;border:1px solid rgba(39,43,0,.06);}
        .cir-ej h4{font-size:.8rem;font-weight:700;color:var(--oliva-medio);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
        .cir-ej h4 i{font-size:.7rem;}
        .cir-ej p{font-size:.83rem;margin-bottom:4px;}
        .cir-ej p:last-child{margin-bottom:0;}

        /* RELOJ */
        .clock-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:8px 14px;background:#fff;border-radius:var(--radius-sm);box-shadow:0 1px 6px var(--sombra);border:1px solid rgba(39,43,0,.04);}
        .clock-bar .cb-label{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--oliva-claro);white-space:nowrap;font-weight:600;}
        .clock-bar .cb-track{flex:1;height:6px;background:var(--oliva-super);border-radius:3px;overflow:hidden;}
        .clock-bar .cb-fill{height:100%;background:var(--oliva-medio);border-radius:3px;transition:width 1s linear;}
        .clock-bar .cb-fill.low{background:var(--rojo-suave);}
        .clock-bar .cb-time{font-family:'Orbitron',monospace;font-size:.88rem;font-weight:700;color:var(--oliva-oscuro);min-width:40px;text-align:right;}
        .clock-bar .cb-time.low{color:var(--rojo-suave);}

        /* ADVERTENCIAS */
        .warnings{display:flex;gap:6px;margin-bottom:14px;justify-content:center;}
        .wdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rojo-suave);background:transparent;transition:all .3s;}
        .wdot.on{background:var(--rojo-suave);}

        /* BANDEJA */
        .bandeja{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;justify-content:center;}
        .sobre{width:50px;height:38px;background:#fff;border-radius:4px;border:1.5px solid var(--oliva-palido);display:grid;place-items:center;cursor:default;transition:all .25s;box-shadow:0 1px 4px var(--sombra);}
        .sobre.done{opacity:.3;transform:scale(.85);}
        .sobre.now{border-color:var(--dorado);box-shadow:0 0 0 2px var(--dorado-claro),0 2px 8px var(--sombra);transform:translateY(-2px);}
        .sobre i{font-size:.8rem;color:var(--oliva-claro);}
        .sobre.now i{color:var(--dorado);}

        /* DOCUMENTO */
        .documento{background:#fff;border-radius:var(--radius);box-shadow:0 2px 16px var(--sombra);overflow:hidden;animation:fadeUp .3s ease;border:1px solid rgba(39,43,0,.04);}
        .doc-hdr{padding:12px 18px;border-bottom:1px solid var(--oliva-super);display:flex;align-items:center;gap:10px;background:var(--crema);}
        .doc-hdr .dh-ico{width:34px;height:34px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:.85rem;flex-shrink:0;}
        .doc-hdr .dh-ico.form{background:var(--dorado-claro);color:var(--oliva-oscuro);}
        .doc-hdr .dh-ico.info{background:var(--oliva-super);color:var(--oliva-medio);}
        .doc-hdr div{flex:1;min-width:0;}
        .doc-hdr h4{font-size:.88rem;font-weight:700;color:var(--oliva-oscuro);}
        .doc-hdr p{font-size:.7rem;color:var(--oliva-claro);}
        .doc-body{padding:18px 20px;}
        .doc-body p{font-size:.86rem;line-height:1.55;color:#444;margin-bottom:10px;}
        .doc-body p strong{color:var(--oliva-oscuro);}
        .doc-body .dp{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;font-size:.84rem;line-height:1.5;color:#444;}
        .doc-body .dp-n{width:20px;height:20px;border-radius:50%;background:var(--oliva-oscuro);color:var(--crema);display:grid;place-items:center;font-size:.6rem;font-weight:700;flex-shrink:0;}
        .doc-conc{padding:10px 14px;border-radius:var(--radius-sm);margin:10px 0;font-size:.84rem;line-height:1.5;font-weight:500;}
        .doc-conc.ok{background:rgba(62,107,58,.08);border:1px solid rgba(62,107,58,.2);color:var(--verde);}
        .doc-conc.bad{background:rgba(184,92,56,.06);border:1px solid rgba(184,92,56,.15);color:var(--rojo-suave);}

        /* TABLA */
        .dtable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.8rem;}
        .dtable th{background:var(--oliva-oscuro);color:var(--crema);padding:7px 10px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;}
        .dtable th:first-child{border-radius:var(--radius-sm) 0 0 0;}
        .dtable th:last-child{border-radius:0 var(--radius-sm) 0 0;}
        .dtable td{padding:7px 10px;border-bottom:1px solid var(--oliva-super);color:#444;}
        .dtable tr:nth-child(even) td{background:rgba(232,233,212,.2);}
        .dtable .blank{background:rgba(201,162,39,.1)!important;font-weight:700;color:var(--oliva-medio);border:2px dashed var(--dorado);}
        .dtable .err{background:rgba(184,92,56,.08)!important;color:var(--rojo-suave);font-weight:700;}

        /* INPUT */
        .dinput-w{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap;}
        .dinput-w label{font-size:.84rem;font-weight:600;color:var(--oliva-oscuro);white-space:nowrap;}
        .dinput{padding:8px 12px;border:2px dashed var(--dorado);border-radius:var(--radius-sm);font-size:.92rem;font-family:'Orbitron',monospace;width:140px;background:rgba(201,162,39,.04);color:var(--oliva-oscuro);outline:none;transition:border .2s;}
        .dinput:focus{border-style:solid;border-color:var(--oliva-medio);}

        /* ACCIONES */
        .doc-acts{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--oliva-super);background:var(--crema);flex-wrap:wrap;}
        .act-btn{padding:11px 22px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:7px;flex:1;justify-content:center;min-width:140px;}
        .act-btn.ok{background:var(--verde);color:#fff;box-shadow:0 2px 8px rgba(62,107,58,.2);}
        .act-btn.ok:hover{background:#345a30;transform:translateY(-1px);}
        .act-btn.no{background:var(--rojo-suave);color:#fff;box-shadow:0 2px 8px rgba(184,92,56,.2);}
        .act-btn.no:hover{background:#9e4e2e;transform:translateY(-1px);}
        .act-btn.env{background:var(--dorado);color:#fff;box-shadow:0 2px 8px rgba(201,162,39,.25);}
        .act-btn.env:hover{background:#b08f22;transform:translateY(-1px);}
        .act-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

        /* FEEDBACK */
        .doc-fb{padding:11px 16px;border-radius:var(--radius-sm);margin:0 18px 0;font-size:.84rem;line-height:1.5;display:none;animation:fadeUp .25s ease;}
        .doc-fb.show{display:block;}
        .doc-fb.ok{background:rgba(62,107,58,.08);color:var(--verde);border:1px solid rgba(62,107,58,.15);}
        .doc-fb.err{background:rgba(184,92,56,.06);color:var(--rojo-suave);border:1px solid rgba(184,92,56,.12);}

        /* VOLANTE */
        .volante{background:var(--sello-rojo-bg,#f8d7da);border:2px solid var(--rojo-suave);border-radius:var(--radius);padding:18px 20px;margin:14px 0;text-align:center;animation:shakeV .4s ease;}
        @keyframes shakeV{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
        .volante h4{color:var(--rojo-suave);font-size:.95rem;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:6px;}
        .volante p{font-size:.83rem;color:#555;line-height:1.4;}

        /* GAME OVER */
        .gameover{background:#fff;border-radius:var(--radius);padding:30px 24px;margin:16px 0;text-align:center;box-shadow:0 4px 20px var(--sombra-md);animation:fadeUp .4s ease;border:2px solid var(--rojo-suave);}
        .gameover i{font-size:2.5rem;color:var(--rojo-suave);margin-bottom:10px;}
        .gameover h3{font-family:'Patrick Hand',cursive;font-size:1.5rem;color:var(--rojo-suave);margin-bottom:6px;}
        .gameover p{font-size:.88rem;color:#555;line-height:1.5;}

        /* DIA COMPLETADO */
        .day-done{text-align:center;padding:30px 0;background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px var(--sombra);}
        .day-done i{font-size:2rem;color:var(--verde);margin-bottom:8px;}
        .day-done h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;color:var(--oliva-oscuro);margin-bottom:4px;}
        .day-done p{font-size:.82rem;color:var(--oliva-claro);}

        /* RESULTADOS */
        .results{text-align:center;padding:30px 0;}
        .results .r-icon{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:2.2rem;box-shadow:0 4px 16px var(--sombra);}
        .results .r-icon.win{background:linear-gradient(135deg,var(--dorado),#e0c040);color:var(--oliva-oscuro);}
        .results .r-icon.lose{background:linear-gradient(135deg,var(--rojo-suave),#d07050);color:#fff;}
        .results h2{font-family:'Patrick Hand',cursive;font-size:1.6rem;margin-bottom:4px;}
        .results h2.w{color:var(--oliva-oscuro);}
        .results h2.l{color:var(--rojo-suave);}
        .results .r-sub{font-size:.88rem;color:var(--oliva-medio);margin-bottom:22px;line-height:1.5;}
        .r-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:360px;margin:0 auto 24px;}
        .r-stats div{background:#fff;border-radius:var(--radius-sm);padding:14px 8px;box-shadow:0 1px 6px var(--sombra);}
        .r-stats .rv{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;color:var(--oliva-oscuro);}
        .r-stats .rl{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--oliva-claro);margin-top:2px;}
        .r-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
        .r-btn{padding:13px 26px;border-radius:var(--radius-sm);font-size:.86rem;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:7px;}
        .r-btn.sec{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .r-btn.sec:hover{background:var(--oliva-palido);}
        .r-btn.pri{background:var(--dorado);color:#fff;box-shadow:0 3px 12px rgba(201,162,39,.25);}
        .r-btn.pri:hover{background:#b08f22;transform:translateY(-1px);}

        @media(max-width:600px){
            .main{padding:14px 12px;}
            .topbar{padding:0 14px;}
            .topbar-greeting h1{font-size:1.1rem;}
            .doc-acts{flex-direction:column;}
            .act-btn{min-width:100%;}
            .r-stats{grid-template-columns:1fr;max-width:160px;}
            .r-btns{flex-direction:column;align-items:center;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;}}
    </style>
</head>
<body>

<header class="topbar">
    <a href="porcentajes-razones.html" class="topbar-toggle" aria-label="Volver"><i class="fas fa-arrow-left"></i></a>
    <div class="topbar-greeting">
        <h1>Inspectoría de Tasas Cambiarias</h1>
        <p class="sub">Porcentajes y Razones <i class="fas fa-chevron-right" style="font-size:.45rem;margin:0 3px;opacity:.35"></i> Simulador</p>
    </div>
    <div class="topbar-right" id="tb-right"></div>
</header>

<main class="main" id="game-area"></main>

<script>
/* ============================================================
   DATOS COMPLETOS — 30 DÍAS
   ============================================================ */
const DAYS=[
{d:1,b:1,t:"Razón constante básica",c:"Si 1 USD = $4.000 COP, la conversión se hace multiplicando, nunca sumando. La razón es un factor multiplicativo constante.",ej:"Si un ciudadano declara haber convertido 150 USD:<br><strong>Paso 1:</strong> Razón: 1 USD = $4.000 COP<br><strong>Paso 2:</strong> 150 × 4.000 = <strong>$600.000 COP</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Error típico:</span> Sumar 150 + 4.000 = $4.150. ¡Absurdo!",docs:[
{type:"form",title:"Declaración Cambiaria #001",desc:"Complete la conversión",content:`<p>El señor Carlos Méndez declara conversión de <strong>250 USD</strong> a pesos colombianos.</p><p style="font-size:.82rem;color:var(--oliva-claro);">Tasa: 1 USD = $4.000 COP</p><div class="dinput-w"><label>Equivalente en COP:</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"1000000",check:v=>parseInt(v.replace(/\D/g,""))===1000000,fbOk:"Correcto: 250 × 4.000 = $1.000.000 COP.",fbErr:"Incorrecto. Debes multiplicar: 250 × 4.000 = $1.000.000."},
{type:"info",title:"Informe de Control #A-012",desc:"Analista junior reportó conversión",content:`<div class="dp"><div class="dp-n">1</div><div>Un turista convirtió 80 USD a pesos.</div></div><div class="dp"><div class="dp-n">2</div><div>Tasa: 1 USD = $4.000 COP.</div></div><div class="dp"><div class="dp-n">3</div><div>Resultado: <strong>$320.000 COP</strong> (80 × 4.000).</div></div><div class="doc-conc ok">Conclusión: La conversión es matemáticamente correcta.</div>`,correct:true,fbOk:"Correcto. 80 × 4.000 = $320.000. Razón aplicada bien.",fbErr:"Error de criterio. El procedimiento es correcto."},
{type:"info",title:"Queja #Q-003",desc:"Ciudadano reclama por cálculo",content:`<p>La señora López reclama: "Me dijeron tasa de 4.000, así que mis 200 USD deberían dar 200 + 4.000 = $4.200.000."</p><div class="doc-conc bad">Conclusión: El banco le robó el dinero.</div>`,correct:false,fbOk:"Correcto al rechazar. Confundió multiplicación con suma. 200 × 4.000 = $800.000.",fbErr:"Error. La ciudadana usó suma en vez de multiplicación."}
]},
{d:2,b:1,t:"La trampa de la función lineal",c:"Diferenciar entre proporcional directa (multiplicar por constante) y suma fija. El ICFES mezcla ambas para confundir.",ej:"Caso A (proporcional): 5 USD → $20.000 (factor 4.000).<br>Caso B (suma fija): $5.000 de comisión + la tasa.<br><span style='color:var(--rojo-suave);font-weight:700;'>Trampa:</span> Creer que ambos funcionan igual.",docs:[
{type:"info",title:"Reporte de Tarifa #T-045",desc:"Estructura de cobro mixta",content:`<p>Casa de cambio: $3.000 COP fijos + conversión a 4.000 COP/USD. Giro de 10 USD:</p><div class="dp"><div class="dp-n">1</div><div>Conversión: 10 × 4.000 = $40.000</div></div><div class="dp"><div class="dp-n">2</div><div>Total: $40.000 + $3.000 = <strong>$43.000</strong></div></div><div class="doc-conc ok">Conclusión: El cálculo es correcto.</div>`,correct:true,fbOk:"Correcto. Primero multiplica, luego suma la comisión fija.",fbErr:"Error. El procedimiento es correcto."},
{type:"form",title:"Formulario de Giro #G-089",desc:"Complete el total",content:`<p>Cliente envía 25 USD. Comisión fija $5.000 COP + tasa 4.000 COP/USD.</p><div class="dinput-w"><label>Total a pagar (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"105000",check:v=>parseInt(v.replace(/\D/g,""))===105000,fbOk:"Correcto: (25 × 4.000) + 5.000 = $105.000.",fbErr:"Incorrecto. 25 × 4.000 = $100.000 + $5.000 = $105.000."},
{type:"info",title:"Auditoría Interna #AI-017",desc:"Verificación de procedimiento",content:`<p>Giro de 30 USD con comisión fija $5.000 COP. El analista reportó:</p><div class="dp"><div class="dp-n">1</div><div>Total: 30 × (4.000 + 5.000) = 30 × 9.000 = <strong>$270.000</strong></div></div><div class="doc-conc bad">Conclusión: El cliente debe pagar $270.000.</div>`,correct:false,fbOk:"Correcto al rechazar. Sumó comisión a la tasa antes de multiplicar. Correcto: (30 × 4.000) + 5.000 = $125.000.",fbErr:"Error. Sumó la comisión a la tasa unitaria antes de multiplicar."}
]},
{d:3,b:1,t:"Proporcionalidad inversa",c:"Si se duplica la rapidez, el costo total no se duplica si la regla es inversa. Más rapidez = menos tiempo = menor costo total.",ej:"4 operarios → 6 horas → 6 × $40.000 = $240.000<br>8 operarios → 3 horas → 3 × $40.000 = $120.000<br><span style='color:var(--rojo-suave);font-weight:700;'>No se duplica, se reduce a la mitad.</span>",docs:[
{type:"info",title:"Informe de Eficiencia #IE-023",desc:"Costos operativos",content:`<p>4 operarios, 6 horas, $40.000/hora = $240.000. Con 8 operarios (doble):</p><div class="dp"><div class="dp-n">1</div><div>Tiempo se reduce a la mitad: 3 horas</div></div><div class="dp"><div class="dp-n">2</div><div>Costo: 3 × $40.000 = <strong>$120.000</strong></div></div><div class="doc-conc ok">Conclusión: El costo se reduce, no se duplica.</div>`,correct:true,fbOk:"Correcto. Proporcionalidad inversa: más operarios = menos tiempo = menor costo.",fbErr:"Error. El análisis es correcto."},
{type:"form",title:"Presupuesto #P-034",desc:"Complete el nuevo costo",content:`<p>Actual: 3 operarios, 8 horas, $35.000/hora. Se contratan 6 operarios (doble).</p><div class="dinput-w"><label>Nuevo costo total (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"140000",check:v=>parseInt(v.replace(/\D/g,""))===140000,fbOk:"Correcto: Doble operarios → 4 horas. 4 × $35.000 = $140.000.",fbErr:"Incorrecto. Doble operarios = mitad de tiempo (4h). 4 × $35.000 = $140.000."},
{type:"info",title:"Memorando #MC-056",desc:"Propuesta de ampliación",content:`<p>"Si pasamos de 2 a 6 operarios (triple), el costo mensual de $180.000 se triplica a $540.000."</p><div class="doc-conc bad">Conclusión: Se recomienda NO ampliar porque el costo se triplica.</div>`,correct:false,fbOk:"Correcto al rechazar. Triple personal = un tercio del tiempo. Costo: $180.000 / 3 = $60.000.",fbErr:"Error. Asumió proporcionalidad directa cuando es inversa."}
]},
{d:4,b:1,t:"Constante de proporcionalidad en tablas",c:"Encontrar el valor unitario (y/x) cuando los datos vienen en una tabla. La constante debe ser la misma para todas las filas.",ej:"5 USD = $20.000 → 20.000/5 = 4.000<br>12 USD = $48.000 → 48.000/12 = 4.000<br>Si 8 USD = $36.000 → 36.000/8 = 4.500 → <span style='color:var(--rojo-suave);font-weight:700;'>ERROR</span>",docs:[
{type:"info",title:"Tabla de Tasas #TT-078",desc:"Verificación de consistencia",content:`<table class="dtable"><tr><th>USD</th><th>COP</th><th>Constante</th></tr><tr><td>10</td><td>$40.000</td><td>4.000</td></tr><tr><td>25</td><td>$100.000</td><td>4.000</td></tr><tr><td>7</td><td>$28.000</td><td>4.000</td></tr></table><div class="doc-conc ok">Conclusión: Todas las filas tienen constante 4.000. Tabla consistente.</div>`,correct:true,fbOk:"Correcto. Todas las filas dan constante 4.000.",fbErr:"Error. La tabla es consistente."},
{type:"form",title:"Tabla Incompleta #TI-091",desc:"Complete el valor faltante",content:`<table class="dtable"><tr><th>USD</th><th>COP</th></tr><tr><td>15</td><td>$60.000</td></tr><tr><td>22</td><td>$88.000</td></tr><tr><td>9</td><td class="blank">???</td></tr></table><div class="dinput-w"><label>Valor faltante (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"36000",check:v=>parseInt(v.replace(/\D/g,""))===36000,fbOk:"Correcto: Constante = 60.000/15 = 4.000. 9 × 4.000 = $36.000.",fbErr:"Incorrecto. Constante 4.000. 9 × 4.000 = $36.000."},
{type:"info",title:"Auditoría de Tabla #AT-102",desc:"Dato sospechoso",content:`<table class="dtable"><tr><th>USD</th><th>COP</th><th>Constante</th></tr><tr><td>20</td><td>$80.000</td><td>4.000</td></tr><tr><td>11</td><td class="err">$49.500</td><td class="err">4.500</td></tr><tr><td>30</td><td>$120.000</td><td>4.000</td></tr></table><div class="doc-conc bad">Conclusión: "La diferencia es un error de redondeo aceptable."</div>`,correct:false,fbOk:"Correcto al rechazar. La fila del medio tiene constante 4.500, no 4.000. Error real de $4.500.",fbErr:"Error. 4.500 no es redondeo de 4.000."}
]},
{d:5,b:1,t:"Ampliación de escalas",c:"Calcular el valor equivalente cuando cambian las unidades base. Si la tasa cambia, el factor cambia proporcionalmente.",ej:"1 USD = $4.000 → 10 USD = $40.000<br>Si la tasa sube a $4.200: 500 USD × 4.200 = $2.100.000<br><span style='color:var(--rojo-suave);font-weight:700;'>No uses la tasa vieja.</span>",docs:[
{type:"form",title:"Conversión Escalada #CE-045",desc:"Calcule con nueva tasa",content:`<p>La tasa cambió de $4.000 a $4.200 COP/USD. Convierta 500 USD.</p><div class="dinput-w"><label>Monto en COP:</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"2100000",check:v=>parseInt(v.replace(/\D/g,""))===2100000,fbOk:"Correcto: 500 × 4.200 = $2.100.000 COP.",fbErr:"Incorrecto. Con nueva tasa: 500 × 4.200 = $2.100.000."},
{type:"info",title:"Reporte #RA-067",desc:"Usó tasa anterior",content:`<p>Conversión de 300 USD el día que la tasa subió a $4.200 COP.</p><div class="dp"><div class="dp-n">1</div><div>Calculó: 300 × 4.000 = $1.200.000 COP</div></div><div class="doc-conc bad">Conclusión: "La conversión es correcta usando la tasa estándar."</div>`,correct:false,fbOk:"Correcto al rechazar. Usó tasa vieja. Correcto: 300 × 4.200 = $1.260.000.",fbErr:"Error. Usó la tasa anterior cuando ya había cambiado."},
{type:"info",title:"Validación #VE-089",desc:"Conversión de fracción",content:`<p>Remanente de 0,75 USD. Tasa $4.000 COP/USD.</p><div class="dp"><div class="dp-n">1</div><div>0,75 × 4.000 = <strong>$3.000 COP</strong></div></div><div class="doc-conc ok">Conclusión: La conversión de la fracción es correcta.</div>`,correct:true,fbOk:"Correcto. 0,75 × 4.000 = $3.000. La proporción se mantiene.",fbErr:"Error. El cálculo es correcto."}
]},
{d:6,b:1,t:"Razones equivalentes",c:"Validar si dos ciudadanos hicieron la misma proporción con diferentes montos. Dos razones son equivalentes si al simplificar dan el mismo valor.",ej:"A: 50 USD → $200.000 (200.000/50 = 4.000)<br>B: 120 USD → $480.000 (480.000/120 = 4.000)<br>→ <strong>Misma proporción</strong>",docs:[
{type:"info",title:"Comparación #CG-034",desc:"¿Misma tasa?",content:`<p>Giro 1: 40 USD → $164.000 (razón = 4.100)<br>Giro 2: 75 USD → $307.500 (razón = 4.100)</p><div class="doc-conc ok">Conclusión: Ambos giros usaron la misma tasa de cambio.</div>`,correct:true,fbOk:"Correcto. 164.000/40 = 307.500/75 = 4.100. Razones equivalentes.",fbErr:"Error. Ambas razones dan 4.100."},
{type:"info",title:"Denuncia #DD-056",desc:"Reclamo de trato desigual",content:`<p>"A mí me cambiaron 100 USD a $420.000 pero a mi vecino 200 USD a $800.000. Me cobraron más."</p><div class="dp"><div class="dp-n">1</div><div>Mío: 420.000/100 = 4.200 COP/USD</div></div><div class="dp"><div class="dp-n">2</div><div>Vecino: 800.000/200 = 4.000 COP/USD</div></div><div class="doc-conc bad">Conclusión: "Ambos pagaron lo mismo."</div>`,correct:false,fbOk:"Correcto al rechazar. Las tasas son DIFERENTES (4.200 vs 4.000).",fbErr:"Error. 4.200 ≠ 4.000, no son equivalentes."},
{type:"form",title:"Verificación #VT-078",desc:"Complete con misma tasa",content:`<p>Giro A: 60 USD → $252.000 COP<br>Giro B: 90 USD → <span style="border-bottom:2px dashed var(--dorado);font-weight:700;">?</span> COP<br>Misma tasa. ¿Cuánto corresponde al Giro B?</p><div class="dinput-w"><label>Giro B en COP:</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"378000",check:v=>parseInt(v.replace(/\D/g,""))===378000,fbOk:"Correcto: Tasa = 252.000/60 = 4.200. 90 × 4.200 = $378.000.",fbErr:"Incorrecto. Tasa 4.200. 90 × 4.200 = $378.000."}
]},
{d:7,b:1,t:"Prueba de fuego: Razones directas",c:"Auditoría mixta: razón constante, función lineal vs proporcional, y tablas.",ej:"Revisa cada documento aplicando los conceptos de los días 1 a 6.",docs:[
{type:"form",title:"Auditoría Integral #AI-001",desc:"Complete la tabla",content:`<table class="dtable"><tr><th>EUR</th><th>COP</th></tr><tr><td>20</td><td>$86.000</td></tr><tr><td>35</td><td>$150.500</td></tr><tr><td>50</td><td class="blank">???</td></tr></table><div class="dinput-w"><label>Valor faltante (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"215000",check:v=>parseInt(v.replace(/\D/g,""))===215000,fbOk:"Correcto: Tasa = 86.000/20 = 4.300. 50 × 4.300 = $215.000.",fbErr:"Incorrecto. Constante 4.300. 50 × 4.300 = $215.000."},
{type:"info",title:"Informe Mixto #IM-023",desc:"Aumento mal aplicado",content:`<p>"Para convertir 150 USD con tasa $4.000 y comisión $8.000: 150 × (4.000 + 8.000) = $1.800.000."</p><div class="doc-conc bad">Conclusión: El cálculo es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. Sumó comisión a la tasa. Correcto: (150 × 4.000) + 8.000 = $608.000.",fbErr:"Error. Sumó la comisión a la tasa antes de multiplicar."},
{type:"info",title:"Validación Cruzada #VC-045",desc:"Dos giros misma tasa",content:`<p>Giro X: 80 USD → $336.000 COP<br>Giro Y: 120 USD → $504.000 COP</p><div class="doc-conc ok">Conclusión: Ambos aplican tasa de 4.200 COP/USD.</div>`,correct:true,fbOk:"Correcto. 336.000/80 = 504.000/120 = 4.200.",fbErr:"Error. Las razones son equivalentes."}
]},
{d:8,b:2,t:"¿Qué es realmente un porcentaje?",c:"El porcentaje es una razón con denominador 100. 15% = 0,15. Se aplica multiplicando, nunca sumando.",ej:"Remesa de $1.000.000 con comisión del 3%:<br>1.000.000 × 0,03 = <strong>$30.000</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Error:</span> 1.000.000 + 3 = $1.000.003",docs:[
{type:"form",title:"Liquidación #LC-012",desc:"Calcule la comisión",content:`<p>Remesa de $2.500.000 COP con comisión del 2,5%.</p><div class="dinput-w"><label>Comisión (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"62500",check:v=>parseInt(v.replace(/\D/g,""))===62500,fbOk:"Correcto: 2.500.000 × 0,025 = $62.500.",fbErr:"Incorrecto. 2,5% = 0,025. 2.500.000 × 0,025 = $62.500."},
{type:"info",title:"Queja #QU-034",desc:"No entiende el descuento",content:`<p>"Descuento del 5% en mi giro de $800.000. Deberían descontarme $5, no $40.000."</p><div class="doc-conc bad">Conclusión: El banco está cobrando de más.</div>`,correct:false,fbOk:"Correcto al rechazar. 5% de 800.000 = $40.000, no $5.",fbErr:"Error. 5% significa 5 de cada 100, no 5 pesos."},
{type:"info",title:"Retención #CR-056",desc:"Por mil correctamente aplicado",content:`<p>Retención 4‰ (4 por mil) sobre $5.000.000 COP.</p><div class="dp"><div class="dp-n">1</div><div>4‰ = 0,004</div></div><div class="dp"><div class="dp-n">2</div><div>5.000.000 × 0,004 = <strong>$20.000</strong></div></div><div class="doc-conc ok">Conclusión: Cálculo correcto.</div>`,correct:true,fbOk:"Correcto. 4 por mil = 0,004. 5.000.000 × 0,004 = $20.000.",fbErr:"Error. El cálculo es correcto."}
]},
{d:9,b:2,t:"Aumentos porcentuales sencillos",c:"Para aumentar, multiplica por (1 + porcentaje). Aumentar 15% = multiplicar por 1,15.",ej:"Tarifa $50.000 + 15%:<br>$50.000 × 1,15 = <strong>$57.500</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Error:</span> $50.000 + 15 = $50.015",docs:[
{type:"form",title:"Actualización #AT-023",desc:"Nueva tarifa",content:`<p>Tarifa de $120.000 COP aumenta 18%. Calcule la nueva tarifa.</p><div class="dinput-w"><label>Nueva tarifa (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"141600",check:v=>parseInt(v.replace(/\D/g,""))===141600,fbOk:"Correcto: 120.000 × 1,18 = $141.600.",fbErr:"Incorrecto. 120.000 × 1,18 = $141.600."},
{type:"info",title:"Reporte #RA-045",desc:"Aumento aplicado",content:`<p>Tarifa $85.000. Aumento 12%.</p><div class="dp"><div class="dp-n">1</div><div>85.000 × 0,12 = $10.200</div></div><div class="dp"><div class="dp-n">2</div><div>Total: 85.000 + 10.200 = <strong>$95.200</strong></div></div><div class="doc-conc ok">Conclusión: Aumento correcto.</div>`,correct:true,fbOk:"Correcto. 85.000 × 0,12 = 10.200. Total $95.200.",fbErr:"Error. El procedimiento es correcto."},
{type:"info",title:"Memorando #MT-067",desc:"Error de aumento",content:`<p>"Tarifa de $200.000 sube 25%. Nueva: $200.025."</p><div class="doc-conc bad">Conclusión: El ajuste es correcto.</div>`,correct:false,fbOk:"Correcto al rechazar. Sumó 25 en vez de 25%. Correcto: 200.000 × 1,25 = $250.000.",fbErr:"Error. Sumó 25 pesos en vez de aplicar 25%."}
]},
{d:10,b:2,t:"Descuentos porcentuales sencillos",c:"Para descontar, multiplica por (1 - porcentaje). Descuento 20% = multiplicar por 0,80.",ej:"$150.000 con 20% descuento:<br>150.000 × 0,80 = <strong>$120.000</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Error:</span> 150.000 - 20 = $149.980",docs:[
{type:"form",title:"Descuento #AD-034",desc:"Precio con descuento",content:`<p>Paquete de $3.200.000 COP con 15% descuento.</p><div class="dinput-w"><label>Precio final (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"2720000",check:v=>parseInt(v.replace(/\D/g,""))===2720000,fbOk:"Correcto: 3.200.000 × 0,85 = $2.720.000.",fbErr:"Incorrecto. Factor 0,85. 3.200.000 × 0,85 = $2.720.000."},
{type:"info",title:"Promoción #PT-056",desc:"Descuento validado",content:`<p>"Giro $500.000 con 30% descuento: 500.000 × 0,30 = $150.000 descuento. Final: $350.000."</p><div class="doc-conc ok">Conclusión: Descuento bien calculado.</div>`,correct:true,fbOk:"Correcto. 500.000 × 0,30 = 150.000. 500.000 - 150.000 = $350.000.",fbErr:"Error. El cálculo es correcto."},
{type:"info",title:"Reclamo #RD-078",desc:"Confundió porcentaje con valor",content:`<p>"10% descuento en $400.000. Debería pagar $400.000 - 10 = $399.990."</p><div class="doc-conc bad">Conclusión: El banco me debe la diferencia.</div>`,correct:false,fbOk:"Correcto al rechazar. 10% de 400.000 = 40.000. Pago real: $360.000.",fbErr:"Error. Confundió 10% con 10 pesos."}
]},
{d:11,b:2,t:"El valor base oculto",c:"Hallar el 100% original conociendo el valor final. Se divide entre el factor: VI = VF / (1 ± r).",ej:"Tras aumento del 20% el precio es $60.000:<br>Original = 60.000 / 1,20 = <strong>$50.000</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Error:</span> 60.000 - 20% de 60.000 = 48.000 (base equivocada)",docs:[
{type:"form",title:"Valor Original #VO-023",desc:"Halle el precio original",content:`<p>Después de aumento del 25% el precio es $125.000 COP. ¿Valor original?</p><div class="dinput-w"><label>Valor original (COP):</label><input type="text" class="dinput" id="f-input" placeholder="$"></div>`,answer:"100000",check:v=>parseInt(v.replace(/\D/g,""))===100000,fbOk:"Correcto: 125.000 / 1,25 = $100.000.",fbErr:"Incorrecto. Factor 1,25. Original = 125.000 / 1,25 = $100.000."},
{type:"info",title:"Reversión #IR-045",desc:"Cálculo correcto de original",content:`<p>"Producto con 20% descuento cuesta $80.000. Original: 80.000 / 0,80 = $100.000."</p><div class="doc-conc ok">Conclusión: El valor original es correcto.</div>`,correct:true,fbOk:"Correcto. 80.000 / 0,80 = $100.000.",fbErr:"Error. El procedimiento es correcto."},
{type:"info",title:"Base #AB-067",desc:"Error de base en reversión",content:`<p>"Precio con IVA 19%: $119.000. Sin IVA: 119.000 - 19% = 119.000 - 22.610 = $96.390."</p><div class="doc-conc bad">Conclusión: La base gravable es $96.390.</div>`,correct:false,fbOk:"Correcto al rechazar. Se restó 19% del final. Correcto: 119.000 / 1,19 = $100.000.",fbErr:"Error. Debe dividir por 1,19, no restar 19% del final."}
]},
{d:12,b:2,t:"Puntos porcentuales vs. Porcentaje",c:"Puntos porcentuales = resta directa. Variación porcentual = fórmula de variación. El ICFES pone ambas como distractores.",ej:"Tasa del 8% al 11%:<br>Puntos porcentuales: 11 - 8 = <strong>3 pp</strong><br>Variación: (11-8)/8 × 100 = <strong>37,5%</strong><br><span style='color:var(--rojo-suave);font-weight:700;'>Son cosas distintas.</span>",docs:[
{type:"info",title:"Tasa #IT-012",desc:"Puntos porcentuales",content:`<p>"La comisión subió del 2% al 5%. Aumento de 3 puntos porcentuales."</p><div class="doc-conc ok">Conclusión: La interpretación es correcta.</div>`,correct:true,fbOk:"Correcto. 5% - 2% = 3 pp. Resta directa válida.",fbErr:"Error. La afirmación es correcta."},
{type:"info",title:"Variación #AV-034",desc:"Confusión pp vs %",content:`<p>"Tasa del 10% al 12%. Aumentó un 2%."</p><div class="doc-conc bad">Conclusión: El aumento es del 2%.</div>`,correct:false,fbOk:"Correcto al rechazar. Son 2 pp, NO 2%. Variación = (12-10)/10 × 100 = 20%.",fbErr:"Error. 2 pp no es 2%."},
{type:"form",title:"Variación #CV-056",desc:"Calcule la variación porcentual",content:`<p>Tasa de 4% a 6%. ¿Variación porcentual respecto al inicial?</p><div class="dinput-w"><label>Variación %:</label><input type="text" class="dinput" id="f-input" placeholder="%"></div>`,answer:"50",check:v=>parseFloat(v.replace(/%/g,"").replace(",","."))===50,fbOk:"Correcto: (6-4)/4 × 100 = 50%.",fbErr:"Incorrecto. (6-4)/4 × 100 = 50%."}
]},
{d:13,b:2,t:"Comparación de proporciones mediante %",c:"Para saber cuál transacción representa mayor proporción, calcula el porcentaje de cada una. No compares valores absolutos con bases diferentes.",ej:"A: ganancia $200 sobre $1.000 → 20%<br>B: ganancia $500 sobre $5.000 → 10%<br><span style='color:var(--rojo-suave);font-weight:700;'>Error:</span> Decir que B fue mejor porque $500 > $200.",docs:[
{type:"info",title:"Rendimiento #CR-023",desc:"¿Más rentable?",content:`<p>X: $300 sobre $2.000 (15%). Y: $800 sobre $8.000 (10%).</p><div class="doc-conc ok">Conclusión: X fue más rentable proporcionalmente (15% vs 10%).</div>`,correct:true,fbOk:"Correcto. 15% > 10% a pesar de menor ganancia absoluta.",fbErr:"Error. Se compara por porcentaje."},
{type:"info",title:"Ranking #IR-045",desc:"Ranking incorrecto",content:`<p>"Norte ganó $1.000 y Sur $500, así que Norte es el doble de eficiente."</p><div class="doc-conc bad">Conclusión: Norte es el doble de eficiente.</div>`,correct:false,fbOk:"Correcto al rechazar. Sin conocer las bases de inversión, no se puede determinar eficiencia.",fbErr:"Error. No se pueden comparar ganancias sin las bases."},
{type:"form",title:"Proporción #CP-067",desc:"¿Mayor porcentaje?",content:`<p>T1: Comisión $180 sobre $1.200<br>T2: Comisión $250 sobre $2.000<br>¿Cuál tiene mayor %? Escriba 1 o 2.</p><div class="dinput-w"><label>Respuesta:</label><input type="text" class="dinput" id="f-input" placeholder="1 o 2" style="width:80px;"></div>`,answer:"1",check:v=>v.trim()==="1",fbOk:"Correcto. T1: 15%. T2: 12,5%. T1 tiene mayor porcentaje.",fbErr:"Incorrecto. T1=15%, T2=12,5%. T1 gana."}
]},
{d:14,b:2,t:"Prueba de fuego: Porcentajes únicos",c:"Combina: porcentaje básico, aumentos, descuentos y valor base oculto.",ej:"Revisa aplicando lo de los días 8 a 13.",docs:[

function generateFinal(){
    const pool=[];const src=[1,4,8,10,12,15,17,19,22,24,26,28];
    src.forEach(d=>{const day=DAYS.find(x=>x.d===d);if(day){const i=Math.floor(Math.random()*day.docs.length);pool.push({...day.docs[i]});}});
    while(pool.length<5){const rd=DAYS[Math.floor(Math.random()*29)];const ri=Math.floor(Math.random()*rd.docs.length);if(!pool.find(p=>p.title===rd.docs[ri].title))pool.push({...rd.docs[ri]});}
    return pool.slice(0,5);
}

/* ============================================================
   ESTADO
   ============================================================ */
let S={dia:0,di:0,warn:0,ok:0,err:0,time:60,tmr:null};
const $=id=>document.getElementById(id);
const GA=()=>document.getElementById('game-area');

/* ============================================================
   PANTALLAS
   ============================================================ */
function showIntro(){
    GA().innerHTML=`<div class="screen active intro">
        <div class="intro-icon"><i class="fas fa-stamp"></i></div>
        <h2>Inspectoría de Tasas Cambiarias</h2>
        <p>Eres un Analista de Datos y Control Cambiario. Tu misión: auditar documentos ciudadanos verificando que la lógica matemática sea impecable.</p>
        <div class="intro-rules"><h3><i class="fas fa-gavel"></i> Manual de Operaciones</h3>
        <ul>
            <li>Sobrevive <strong>30 días hábiles</strong> para cobrar tu sueldo.</li>
            <li>Tienes <strong>60 segundos</strong> por día para procesar los documentos.</li>
            <li>Acumulas <strong>3 advertencias</strong> en un día y eres <strong>despedido</strong>.</li>
            <li>Aprobar un documento con <strong>falacia crítica</strong> = <strong>Arresto inmediato</strong>.</li>
            <li>Semana 1: 3 docs/día. Semana 2-3: 4 docs/día. Semana 4: 5 docs/día.</li>
        </ul></div>
        <button class="btn-start" onclick="startGame()"><i class="fas fa-play"></i> Iniciar Jornada</button>
    </div>`;
}

function showDiaStart(){
    const dia=DAYS[S.dia-1];
    const bn={1:"Proporciones y Razones",2:"Porcentajes Básicos",3:"Porcentajes Sucesivos",4:"Tablas y Gráficas",0:"Examen Final"};
    GA().innerHTML=`<div class="screen active dia-start">
        <div class="ds-num">${String(S.dia).padStart(2,'0')}</div>
        <div class="ds-label">Día ${S.dia<30?'de Auditoría':'de Examen Final'}</div>
        ${dia.b?`<div class="ds-bloque">Bloque ${dia.b}: ${bn[dia.b]}</div>`:'<div class="ds-bloque">Sin red de seguridad</div>'}
    </div>`;
    setTimeout(()=>showCircular(),1000);
}

function showCircular(){
    const dia=DAYS[S.dia-1];
    GA().innerHTML=`<div class="screen active">
        <div class="circular">
            <div class="cir-hdr"><i class="fas fa-book-open"></i><h3>Circular del Día</h3><span class="cir-dia">Día ${S.dia}</span></div>
            <p><strong>${dia.t}</strong></p><p>${dia.c}</p>
            <div class="cir-ej"><h4><i class="fas fa-lightbulb"></i> Ejemplo</h4><p>${dia.ej}</p></div>
        </div>
        <div style="text-align:center;margin-top:14px;"><button class="btn-start" onclick="startDay()" style="font-size:.92rem;padding:12px 32px;"><i class="fas fa-briefcase"></i> Abrir Bandeja</button></div>
    </div>`;
}

function startDay(){S.di=0;S.warn=0;startTimer();renderDay();}

function renderDay(){
    const dia=DAYS[S.dia-1];const docs=dia.docs;
    const whtml=Array.from({length:3},(_,i)=>`<div class="wdot${i<S.warn?' on':''}"></div>`).join('');
    let h=`<div class="stats-bar-wrap" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
        <div style="background:#fff;border-radius:var(--radius-sm);padding:10px 12px;box-shadow:0 1px 4px var(--sombra);text-align:center;"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--oliva-claro);font-weight:600;">Día</div><div style="font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--oliva-oscuro);">${S.dia}/30</div></div>
        <div style="background:#fff;border-radius:var(--radius-sm);padding:10px 12px;box-shadow:0 1px 4px var(--sombra);text-align:center;"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--oliva-claro);font-weight:600;">Docs</div><div style="font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--dorado);">${S.di}/${docs.length}</div></div>
        <div style="background:#fff;border-radius:var(--radius-sm);padding:10px 12px;box-shadow:0 1px 4px var(--sombra);text-align:center;"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--oliva-claro);font-weight:600;">Aciertos</div><div style="font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--verde);">${S.ok}</div></div>
    </div>
    <div class="clock-bar"><span class="cb-label">Turno</span><div class="cb-track"><div class="cb-fill${S.time<=10?' low':''}" id="cbf" style="width:${(S.time/60)*100}%"></div></div><span class="cb-time${S.time<=10?' low':''}" id="cbt">${S.time}s</span></div>
    <div class="warnings">${whtml}</div>
    <div class="bandeja">`;
    docs.forEach((_,i)=>{let c='sobre';if(i<S.di)c+=' done';else if(i===S.di)c+=' now';h+=`<div class="${c}"><i class="fas fa-envelope${i===S.di?'-open-text':''}"></i></div>`;});
    h+=`</div>`;
    if(S.di<docs.length){h+=renderDoc(docs[S.di]);}
    else{h+=`<div class="day-done"><i class="fas fa-check-circle"></i><h3>Día ${S.dia} completado</h3><p>Todos los documentos procesados.</p></div>`;}
    GA().innerHTML=h;
    const inp=$('f-input');if(inp)setTimeout(()=>inp.focus(),80);
}

function renderDoc(doc){
    const ico=doc.type==='form'?'fa-file-pen':'fa-file-lines';
    const icls=doc.type==='form'?'form':'info';
    const lbl=doc.type==='form'?'Formulario Incompleto':'Informe de Terceros';
    let acts='';
    if(doc.type==='form'){acts=`<button class="act-btn env" onclick="submitForm()"><i class="fas fa-paper-plane"></i> Enviar a Carpeta</button>`;}
    else{acts=`<button class="act-btn no" onclick="decide(false)"><i class="fas fa-trash"></i> Papelera</button><button class="act-btn ok" onclick="decide(true)"><i class="fas fa-folder-plus"></i> Carpeta</button>`;}
    return `<div class="documento"><div class="doc-hdr"><div class="dh-ico ${icls}"><i class="fas ${ico}"></i></div><div><h4>${doc.title}</h4><p>${lbl} — ${doc.desc}</p></div></div><div class="doc-body">${doc.content}</div><div class="doc-fb" id="dfb"></div><div class="doc-acts" id="dacts">${acts}</div></div>`;
}

/* ============================================================
   LÓGICA
   ============================================================ */
function startTimer(){clearInterval(S.tmr);S.time=60;S.tmr=setInterval(()=>{if(document.hidden)return;S.time--;const f=$('cbf'),t=$('cbt');if(f)f.style.width=`${(S.time/60)*100}%`;if(t)t.textContent=`${S.time}s`;if(S.time<=10){if(f)f.classList.add('low');if(t)t.classList.add('low');}if(S.time<=0){clearInterval(S.tmr);timeUp();}},1000);}

function timeUp(){const dia=DAYS[S.dia-1];const rem=dia.docs.length-S.di;if(rem>0){S.warn+=rem;S.err+=rem;}endDay();}

function submitForm(){const inp=$('f-input');if(!inp)return;const v=inp.value.trim();if(!v){showFb(false,'Escribe un valor.');return;}const doc=DAYS[S.dia-1].docs[S.di];process(doc.check(v),doc);}

function decide(approved){const doc=DAYS[S.dia-1].docs[S.di];process(approved===doc.correct,doc);}

function process(ok,doc){
    showFb(ok,ok?doc.fbOk:doc.fbErr);
    const acts=$('dacts');if(acts)acts.innerHTML='';
    if(ok){S.ok++;}
    else{
        S.err++;S.warn++;
        if(doc.type==='info'&&!doc.correct){clearInterval(S.tmr);showArrest(doc);return;}
    }
    const sobres=document.querySelectorAll('.sobre');
    if(sobres[S.di]){sobres[S.di].classList.add('done');sobres[S.di].classList.remove('now');}
    S.di++;
    setTimeout(()=>{const dia=DAYS[S.dia-1];if(S.di<dia.docs.length)renderDay();else endDay();},1200);
}

function showFb(ok,msg){const fb=$('dfb');if(!fb)return;fb.className=`doc-fb show ${ok?'ok':'err'}`;fb.innerHTML=`<i class="fas ${ok?'fa-check-circle':'fa-times-circle'}" style="margin-right:6px;"></i>${msg}`;}

function showArrest(doc){
    GA().innerHTML+=`<div class="gameover"><i class="fas fa-handcuffs"></i><h3>ARRESTADO / DESTITUIDO</h3><p>Aprobaste un documento con falacia matemática crítica.<br>"${doc.title}"</p></div>`;
    setTimeout(()=>showResults(false),2200);
}

function endDay(){
    clearInterval(S.tmr);
    if(S.warn>=3){GA().innerHTML=`<div class="gameover"><i class="fas fa-user-slash"></i><h3>DESPEDIDO</h3><p>Acumulaste 3 advertencias. Llegaste al día ${S.dia}.</p></div>`;setTimeout(()=>showResults(false),1800);return;}
    if(S.dia>=30){setTimeout(()=>showResults(true),800);return;}
    S.dia++;showDiaStart();
}

function showResults(won){
    const tot=S.ok+S.err;const pct=tot>0?Math.round(S.ok/tot*100):0;
    GA().innerHTML=`<div class="screen active results">
        <div class="r-icon ${won?'win':'lose'}"><i class="fas ${won?'fa-trophy':'fa-skull-crossbones'}"></i></div>
        <h2 class="${won?'w':'l'}">${won?'Auditor Senior':'Fin de la Jornada'}</h2>
        <p class="r-sub">${won?'Superaste los 30 días. Sueldo completo garantizado.':`Llegaste al día ${S.dia} de 30. Repasa los conceptos.`}</p>
        <div class="r-stats"><div><div class="rv">${S.dia}</div><div class="rl">Días</div></div><div><div class="rv">${S.ok}</div><div class="rl">Correctos</div></div><div><div class="rv">${pct}%</div><div class="rl">Precisión</div></div></div>
        <div class="r-btns"><a href="porcentajes-razones.html" class="r-btn sec"><i class="fas fa-th-list"></i> Ir a los demás temas</a><a href="tasa-cambio-examen.html" class="r-btn pri"><i class="fas fa-pen-alt"></i> Ir al examen ICFES</a></div>
    </div>`;
}

function startGame(){S={dia:1,di:0,warn:0,ok:0,err:0,time:60,tmr:null};showDiaStart();}
showIntro();
</script>
