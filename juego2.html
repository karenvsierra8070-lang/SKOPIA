<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ráfaga Numérica: Operaciones Fundamentales - Skópia</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGEwwuGLP0ULmsJkAhwwmNSlWAotGu_wY",
            projectId: "skopia-aa786",
            storageBucket: "skopia-aa786.firebasestorage.app",
            messagingSenderId: "719823055099",
            appId: "1:719823055099:web:7d91ea29e4b2dcbb9b685e"
        };

        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            firebaseConfig.authDomain = "localhost";
        } else {
            firebaseConfig.authDomain = "skopia-aa786.firebaseapp.com";
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.auth = auth;

        onAuthStateChanged(auth, (user) => {

            window.dispatchEvent(new CustomEvent('userReady', { detail: { user } }));

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a2e0a 0%, #1a4d1a 50%, #0d3d0d 100%);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efectos de fondo animados */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(76, 255, 76, 0.3);
            border-radius: 50%;
            animation: float-up 8s infinite linear;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .game-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Pantalla de presentación */
        .intro-screen {
            text-align: center;
            animation: fadeInScale 1s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #4cff4c;
            text-shadow: 0 0 20px rgba(76, 255, 76, 0.5);
            margin-bottom: 20px;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(76, 255, 76, 0.5);
            }
            50% {
                text-shadow: 0 0 30px rgba(76, 255, 76, 0.8);
            }
        }

        .game-subtitle {
            font-size: 1.5rem;
            color: #a0ffa0;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(45deg, #2d7a2d, #4cff4c);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(76, 255, 76, 0.3);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(76, 255, 76, 0.5);
            background: linear-gradient(45deg, #3d8a3d, #5cff5c);
        }

        /* Pantalla de juego */
        .game-screen {
            display: none;
            width: 100%;
            max-width: 900px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Header del juego */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #4cff4c;
        }

        .timer {
            font-weight: bold;
            font-size: 2rem;
            min-width: 60px;
            text-align: center;
        }

        .timer.warning {
            color: #ffaa00;
            animation: pulse-warning 1s infinite;
        }

        .timer.danger {
            color: #ff4444;
            animation: pulse-danger 0.5s infinite;
        }

        @keyframes pulse-warning {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes pulse-danger {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lives {
            display: flex;
            gap: 5px;
        }

        .life {
            width: 25px;
            height: 25px;
            background: #4cff4c;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .life.lost {
            background: #444;
            transform: scale(0.8);
        }

        .question-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
        }

        /* Contenedor de pregunta */
        .question-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(76, 255, 76, 0.3);
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Opciones de respuesta */
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option {
            background: rgba(76, 255, 76, 0.1);
            border: 2px solid rgba(76, 255, 76, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            background: rgba(76, 255, 76, 0.2);
            border-color: #4cff4c;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 255, 76, 0.2);
        }

        .option.selected {
            background: rgba(76, 255, 76, 0.3);
            border-color: #4cff4c;
            border-width: 3px;
        }

        .option.correct {
            background: rgba(76, 255, 76, 0.4);
            border-color: #4cff4c;
            animation: correct-pulse 0.5s;
        }

        .option.incorrect {
            background: rgba(255, 68, 68, 0.3);
            border-color: #ff4444;
            animation: shake 0.5s;
        }

        @keyframes correct-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .option-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #4cff4c;
            color: #0a2e0a;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
        }

        /* Feedback */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            z-index: 1000;
            pointer-events: none;
            animation: feedback-pop 0.8s ease-out;
        }

        @keyframes feedback-pop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        .feedback.correct {
            color: #4cff4c;
        }

        .feedback.incorrect {
            color: #ff4444;
        }

        /* Pantalla de resultados */
        .results-screen {
            display: none;
            text-align: center;
            animation: fadeInScale 1s ease-out;
        }

        .results-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #4cff4c;
            margin-bottom: 30px;
        }

        .results-stats {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .stat-label {
            color: #a0ffa0;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            color: #4cff4c;
        }

        .next-level-btn {
            background: linear-gradient(45deg, #2d7a2d, #4cff4c);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(76, 255, 76, 0.3);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px;
        }

        .next-level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(76, 255, 76, 0.5);
        }

        .next-level-btn:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Botón de volver */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid #4cff4c;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(76, 255, 76, 0.2);
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5rem;
            }
            
            .options-container {
                grid-template-columns: 1fr;
            }
            
            .game-header {
                flex-direction: column;
                gap: 20px;
            }
            
            .question-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Partículas de fondo -->
    <div class="bg-particles" id="particles"></div>

    <!-- Botón de volver -->
    <button class="back-btn" onclick="goToModules()">
        <i class="fas fa-arrow-left"></i> Volver a Módulos
    </button>

    <!-- Contenedor principal del juego -->
    <div class="game-container">
        <!-- Pantalla de presentación -->
        <div class="intro-screen" id="introScreen">
            <h1 class="game-title">RÁFAGA NUMÉRICA</h1>
            <p class="game-subtitle">Operaciones Fundamentales</p>
            <p style="margin-bottom: 30px; color: #a0ffa0;">
                Desafía tu mente con preguntas tipo ICFES Saber Pro<br>
                ¡Tienes 30 segundos por pregunta!
            </p>
            <button class="start-btn" onclick="startGame()">
                <i class="fas fa-play"></i> INICIAR JUEGO
            </button>
        </div>

        <!-- Pantalla de juego -->
        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <div class="timer-container">
                    <i class="fas fa-clock"></i>
                    <span class="timer" id="timer">30</span>
                </div>
                <div class="progress-container">
                    <div class="lives" id="lives">
                        <div class="life"></div>
                        <div class="life"></div>
                        <div class="life"></div>
                    </div>
                    <div class="question-counter">
                        Pregunta <span id="currentQuestion">1</span> de <span id="totalQuestions">10</span>
                    </div>
                </div>
            </div>

            <div class="question-container">
                <div class="question-text" id="questionText">
                    Cargando pregunta...
                </div>
                <div class="options-container" id="optionsContainer">
                    <!-- Las opciones se generarán dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Pantalla de resultados -->
        <div class="results-screen" id="resultsScreen">
            <h2 class="results-title">¡JUEGO COMPLETADO!</h2>
            <div class="results-stats">
                <div class="stat-row">
                    <span class="stat-label">Puntuación:</span>
                    <span class="stat-value" id="scoreDisplay">0/10</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Tiempo total:</span>
                    <span class="stat-value" id="timeDisplay">0s</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Precisión:</span>
                    <span class="stat-value" id="accuracyDisplay">0%</span>
                </div>
            </div>
            <div id="nextLevelContainer">
                <!-- El botón de siguiente nivel se agregará dinámicamente -->
            </div>
            <button class="next-level-btn" onclick="restartGame()">
                <i class="fas fa-redo"></i> Jugar de Nuevo
            </button>
        </div>
    </div>

    <!-- Contenedor para feedback -->
    <div id="feedbackContainer"></div>

    <script>
        // Base de datos de preguntas (50 preguntas)
        const questions = [
            {
                question: "Una empresa de mensajería cobra una tarifa fija de $5.000 por el envío de paquetes de hasta 2 kg. Por cada kilogramo adicional o fracción, se cobra un recargo de $1.500. Un cliente desea enviar tres paquetes que pesan 1,5 kg, 3,2 kg y 0,8 kg respectivamente. ¿Cuál es el costo total que el cliente debe pagar por el envío de los tres paquetes?",
                options: ["$15.000", "$18.000", "$19.500", "$21.000"],
                correct: 1
            },
            {
                question: "Un estudiante compra 3 cuadernos a $2.500 cada uno y 2 bolígrafos a $1.800 cada uno. Si paga con un billete de $20.000, ¿cuánto dinero recibe de cambio?",
                options: ["$8.900", "$9.100", "$10.400", "$11.200"],
                correct: 1
            },
            {
                question: "En una tienda, el precio de un producto es $12.000. Si hay un descuento del 20% y luego se aplica un IVA del 19%, ¿cuál es el precio final del producto?",
                options: ["$11.424", "$11.568", "$12.000", "$13.200"],
                correct: 0
            },
            {
                question: "Una persona recorre 120 km en 2 horas. Si mantiene la misma velocidad, ¿cuánto tiempo tardará en recorrer 180 km?",
                options: ["2.5 horas", "3 horas", "3.5 horas", "4 horas"],
                correct: 1
            },
            {
                question: "Un tanque contiene 500 litros de agua. Se consumen 75 litros por día durante 4 días. ¿Cuántos litros quedan en el tanque?",
                options: ["150 litros", "200 litros", "300 litros", "425 litros"],
                correct: 1
            },
            {
                question: "Una fábrica produce 250 unidades por día. Si trabaja 6 días a la semana, ¿cuántas unidades produce en 3 semanas?",
                options: ["3.500", "4.500", "5.250", "6.000"],
                correct: 1
            },
            {
                question: "Un celular cuesta $800.000. Si se paga en cuotas, se aplica un recargo del 15% sobre el precio de contado. ¿Cuál es el precio total en cuotas?",
                options: ["$880.000", "$920.000", "$960.000", "$1.000.000"],
                correct: 1
            },
            {
                question: "En un estacionamiento, la primera hora cuesta $2.000 y cada hora adicional $1.500. Si un vehículo estacionó durante 4 horas, ¿cuánto debe pagar?",
                options: ["$5.500", "$6.500", "$7.500", "$8.000"],
                correct: 1
            },
            {
                question: "Una receta para 4 personas requiere 200g de harina. ¿Cuántos gramos de harina se necesitan para 10 personas?",
                options: ["400g", "450g", "500g", "600g"],
                correct: 2
            },
            {
                question: "Un trabajador gana $25.000 por hora y trabaja 8 horas diarias, 5 días a la semana. ¿Cuál es su salario mensual (4 semanas)?",
                options: ["$3.000.000", "$4.000.000", "$4.500.000", "$5.000.000"],
                correct: 1
            },
            {
                question: "Un producto aumenta su precio de $80.000 a $96.000. ¿Cuál fue el porcentaje de aumento?",
                options: ["15%", "18%", "20%", "25%"],
                correct: 2
            },
            {
                question: "En una competencia, el primer lugar recibe $500.000, el segundo $300.000 y el tercero $100.000. Si el premio total es $1.200.000, ¿cuánto recibe el cuarto lugar?",
                options: ["$150.000", "$200.000", "$250.000", "$300.000"],
                correct: 3
            },
            {
                question: "Una piscina rectangular mide 8m de largo y 4m de ancho. Si se llena con agua hasta una altura de 1.5m, ¿cuántos metros cúbicos de agua contiene?",
                options: ["32 m³", "48 m³", "64 m³", "96 m³"],
                correct: 1
            },
            {
                question: "Un vehículo consume 12 litros de gasolina por cada 100 km. Si realiza un viaje de 350 km, ¿cuántos litros consumirá?",
                options: ["36 litros", "42 litros", "45 litros", "48 litros"],
                correct: 1
            },
            {
                question: "En una bodega hay 15 cajas con 24 unidades cada una. Si se venden 180 unidades, ¿cuántas cajas completas quedan?",
                options: ["6 cajas", "7 cajas", "8 cajas", "9 cajas"],
                correct: 1
            },
            {
                question: "Una película dura 2 horas y 15 minutos. Si comienza a las 3:45 PM, ¿a qué hora termina?",
                options: ["5:45 PM", "6:00 PM", "6:15 PM", "6:30 PM"],
                correct: 1
            },
            {
                question: "Un edificio tiene 12 pisos, cada piso mide 3.5m de altura. ¿Cuál es la altura total del edificio?",
                options: ["36m", "42m", "45m", "48m"],
                correct: 1
            },
            {
                question: "En una oferta, 3 artículos cuestan $9.000. ¿Cuánto costarían 5 artículos?",
                options: ["$12.000", "$13.000", "$15.000", "$18.000"],
                correct: 2
            },
            {
                question: "Una persona camina 5 km en 1 hora. Si aumenta su velocidad en 20%, ¿cuánto tiempo tardará en recorrer 6 km?",
                options: ["50 minutos", "54 minutos", "60 minutos", "72 minutos"],
                correct: 0
            },
            {
                question: "Un restaurante ofrece un menú por $15.000 con bebida incluida. Si la bebida por separado cuesta $2.500, ¿cuál es el precio del menú sin bebida?",
                options: ["$10.500", "$12.500", "$13.500", "$14.000"],
                correct: 1
            },
            {
                question: "Una empresa tiene 120 empleados. Si el 30% son mujeres, ¿cuántos hombres trabajan en la empresa?",
                options: ["72", "84", "90", "96"],
                correct: 1
            },
            {
                question: "Un libro tiene 300 páginas. Si una persona lee 25 páginas por día, ¿en cuántos días terminará el libro?",
                options: ["10 días", "11 días", "12 días", "13 días"],
                correct: 2
            },
            {
                question: "En una tienda, 2 camisas cuestan $30.000. Si hay una promoción de 3x2, ¿cuánto costarán 4 camisas?",
                options: ["$45.000", "$50.000", "$60.000", "$75.000"],
                correct: 0
            },
            {
                question: "Un tren viaja a 80 km/h durante 2.5 horas. ¿Qué distancia recorre?",
                options: ["180 km", "200 km", "220 km", "250 km"],
                correct: 1
            },
            {
                question: "Una persona tiene $500.000 y gasta el 35% en comida. ¿Cuánto dinero le queda?",
                options: ["$175.000", "$300.000", "$325.000", "$350.000"],
                correct: 2
            },
            {
                question: "En una granja hay 80 gallinas que producen 4 huevos cada una por semana. ¿Cuántos huevos se producen en un mes (4 semanas)?",
                options: ["960", "1.080", "1.200", "1.280"],
                correct: 3
            },
            {
                question: "Un automóvil disminuye su velocidad de 100 km/h a 60 km/h en 5 segundos. ¿Cuál fue la reducción de velocidad por segundo?",
                options: ["6 km/h", "8 km/h", "10 km/h", "12 km/h"],
                correct: 1
            },
            {
                question: "Una oferta dice: 'Compra 2 y lleva 3' en productos de $5.000 cada uno. ¿Cuánto ahorras por cada 3 productos?",
                options: ["$3.333", "$5.000", "$10.000", "$15.000"],
                correct: 1
            },
            {
                question: "Un estadio tiene 50 filas con 30 asientos cada una. Si está lleno al 80%, ¿cuántas personas asisten?",
                options: ["1.000", "1.200", "1.500", "2.000"],
                correct: 1
            },
            {
                question: "Una bombilla consume 60W y está encendida 6 horas diarias. ¿Cuántos kWh consume en un mes (30 días)?",
                options: ["9.6 kWh", "10.8 kWh", "12.0 kWh", "13.2 kWh"],
                correct: 1
            },
            {
                question: "En una carrera de 10 km, un corredor lleva 5 km en 20 minutos. Si mantiene el mismo ritmo, ¿en qué tiempo completará la carrera?",
                options: ["35 minutos", "40 minutos", "45 minutos", "50 minutos"],
                correct: 1
            },
            {
                question: "Un teléfono cuesta $1.200.000. Si se financia en 12 cuotas sin interés, ¿cuánto se paga por cuota?",
                options: ["$80.000", "$90.000", "$100.000", "$120.000"],
                correct: 2
            },
            {

            },
            {
                question: "Un edificio de 20 pisos tiene 4 apartamentos por piso. Si cada apartamento aloja 4 personas, ¿cuántas personas viven en el edificio?",
                options: ["240", "280", "320", "360"],
                correct: 2
            },
            {
                question: "Una computadora cuesta $1.800.000. Si se paga el 40% de cuota inicial, ¿cuánto se financia?",
                options: ["$720.000", "$1.080.000", "$1.200.000", "$1.400.000"],
                correct: 1
            },
            {
                question: "En una fábrica, 3 máquinas producen 150 unidades por hora. ¿Cuántas unidades producen 5 máquinas en 2 horas?",
                options: ["400", "500", "600", "750"],
                correct: 1
            },
            {
                question: "Un paquete de 500g de café cuesta $12.000. ¿Cuál es el precio por kilogramo?",
                options: ["$20.000", "$22.000", "$24.000", "$26.000"],
                correct: 2
            },
            {
                question: "Una persona ahorra $200.000 mensuales. ¿Cuánto ahorrará en 2 años?",
                options: ["$2.400.000", "$4.000.000", "$4.800.000", "$5.200.000"],
                correct: 2
            },
            {
                question: "En un supermercado, 3 kg de manzanas cuestan $9.000. ¿Cuánto costarán 5 kg?",
                options: ["$12.000", "$13.000", "$15.000", "$18.000"],
                correct: 2
            },
            {
                question: "Un bus transporta 40 pasajeros y hace 8 viajes diarios. ¿Cuántos pasajeros transporta en una semana (5 días)?",
                options: ["1.200", "1.400", "1.600", "1.800"],
                correct: 2
            },
            {
                question: "Una impresora imprime 20 páginas por minuto. ¿Cuánto tiempo tardará en imprimir un documento de 150 páginas?",
                options: ["6.5 minutos", "7 minutos", "7.5 minutos", "8 minutos"],
                correct: 2
            },
            {
                question: "En una tienda, el precio de un producto disminuye de $50.000 a $40.000. ¿Cuál fue el porcentaje de descuento?",
                options: ["15%", "18%", "20%", "25%"],
                correct: 2
            },
            {
                question: "Una persona corre 3 km en 15 minutos. ¿Cuál es su velocidad en km/h?",
                options: ["10 km/h", "12 km/h", "15 km/h", "18 km/h"],
                correct: 1
            },
            {
                question: "Un tanque de agua se llena en 4 horas con un grifo. ¿Cuánto tiempo tomará llenarlo con 2 grifos iguales?",
                options: ["1 hora", "1.5 horas", "2 horas", "2.5 horas"],
                correct: 2
            },
            {
                question: "En una oficina, 5 personas consumen 25 tazas de café al día. ¿Cuántas tazas consumen 8 personas?",
                options: ["30", "35", "40", "45"],
                correct: 2
            },
            {
                question: "Un producto cuesta $8.000. Si se aplica un impuesto del 16%, ¿cuál es el precio final?",
                options: ["$8.800", "$9.280", "$9.600", "$10.400"],
                correct: 1
            },
            {
                question: "Una persona recorre 15 km en bicicleta. Si cada pedal completo avanza 2 metros, ¿cuántos pedaleos realiza?",
                options: ["5.000", "6.000", "7.500", "8.000"],
                correct: 2
            },
            {
                question: "En un concierto, las entradas cuestan $50.000. Si hay un descuento del 20% para estudiantes, ¿cuánto paga un estudiante?",
                options: ["$30.000", "$35.000", "$40.000", "$45.000"],
                correct: 2
            },
            {
                question: "Un celular tiene una batería de 4.000 mAh. Si consume 200 mAh por hora, ¿cuántas horas dura la batería?",
                options: ["15 horas", "18 horas", "20 horas", "25 horas"],
                correct: 2
            },
            {
                question: "Una pizzería vende 50 pizzas al día a $12.000 cada una. ¿Cuáles son sus ventas semanales (6 días)?",
                options: ["$2.400.000", "$3.000.000", "$3.600.000", "$4.200.000"],
                correct: 2
            },
            {
                question: "Un estudiante obtiene 85, 90 y 80 en tres exámenes. Si el cuarto examen vale el doble, ¿qué nota necesita para promediar 85?",
                options: ["82", "85", "88", "90"],
                correct: 1
            },
            {
                question: "En una granja, 12 vacas producen 96 litros de leche diarios. ¿Cuántos litros produce una vaca por día?",
                options: ["6 litros", "8 litros", "10 litros", "12 litros"],
                correct: 1
            },
            {
                question: "Una persona compra 3 artículos por $45.000. Si el primero cuesta $10.000 y el segundo $15.000, ¿cuánto cuesta el tercero?",
                options: ["$15.000", "18.000", "$20.000", "$25.000"],
                correct: 2
            },
            {
                question: "Un tren sale de una estación a las 8:00 AM y llega a su destino a las 11:30 AM. Si el viaje es de 210 km, ¿cuál fue la velocidad promedio?",
                options: ["50 km/h", "55 km/h", "60 km/h", "65 km/h"],
                correct: 2
            },
            {
                question: "En una oferta, 2 litros de jugo cuestan $6.000. ¿Cuánto cuestan 5 litros?",
                options: ["$12.000", "$13.000", "$15.000", "$18.000"],
                correct: 2
            },
            {
                question: "Una empresa tiene 24 empleados. Si el 25% trabaja en administración, ¿cuántos empleados trabajan en otras áreas?",
                options: ["12", "14", "16", "18"],
                correct: 3
            },
            {
                question: "Un automóvil recorre 180 km con 12 litros de gasolina. ¿Cuál es su consumo en litros por cada 100 km?",
                options: ["5.5", "6.7", "7.2", "8.0"],
                correct: 1
            },
            {
                question: "Una persona gana $2.500 por hora y trabaja 40 horas semanales. ¿Cuál es su salario semanal?",
                options: ["$80.000", "$90.000", "$100.000", "$120.000"],
                correct: 2
            }
        ];

        // Variables del juego
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let timer = null;
        let timeLeft = 30;
        let selectedQuestions = [];
        let totalGameTime = 0;
        let questionStartTime = 0;
        let currentScreen = 'intro';

        // Inicializar partículas de fondo
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = Math.random() * 4 + 2 + 'px';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 5) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Seleccionar preguntas aleatorias
        function selectRandomQuestions() {
            const shuffled = [...questions].sort(() => Math.random() - 0.5);
            selectedQuestions = shuffled.slice(0, 10);
        }

        // Iniciar juego
        function startGame() {
            currentScreen = 'game';
            score = 0;
            lives = 3;
            currentQuestionIndex = 0;
            totalGameTime = 0;
            
            selectRandomQuestions();
            
            document.getElementById('introScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('resultsScreen').style.display = 'none';
            
            document.getElementById('totalQuestions').textContent = selectedQuestions.length;
            updateLives();
            loadQuestion();
        }

        // Cargar pregunta
        function loadQuestion() {
            if (currentQuestionIndex >= selectedQuestions.length) {
                endGame();
                return;
            }

            const question = selectedQuestions[currentQuestionIndex];
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('questionText').textContent = question.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <span class="option-label">${String.fromCharCode(65 + index)}</span>
                    ${option}
                `;
                optionDiv.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(optionDiv);
            });
            
            startTimer();
            questionStartTime = Date.now();
        }

        // Iniciar temporizador
        function startTimer() {
            timeLeft = 30;
            updateTimerDisplay();
            
            if (timer) clearInterval(timer);
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeUp();
                }
            }, 1000);
        }

        // Actualizar display del temporizador
        function updateTimerDisplay() {
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeLeft;
            
            timerElement.classList.remove('warning', 'danger');
            if (timeLeft <= 10) {
                timerElement.classList.add('warning');
            }
            if (timeLeft <= 5) {
                timerElement.classList.add('danger');
            }
        }

        // Seleccionar respuesta
        function selectAnswer(index) {
            if (currentScreen !== 'game') return;
            
            clearInterval(timer);
            
            const question = selectedQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            // Calcular tiempo usado en esta pregunta
            const timeUsed = 30 - timeLeft;
            totalGameTime += timeUsed;
            
            // Deshabilitar opciones
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            // Marcar respuesta seleccionada
            options[index].classList.add('selected');
            
            // Mostrar feedback
            if (index === question.correct) {
                options[index].classList.add('correct');
                score++;
                showFeedback(true);
            } else {
                options[index].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                showFeedback(false);
                lives--;
                updateLives();
            }
            
            // Siguiente pregunta después de un delay
            setTimeout(() => {
                currentQuestionIndex++;
                if (lives > 0) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 2000);
        }

        // Tiempo agotado
        function timeUp() {
            const question = selectedQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[question.correct].classList.add('correct');
            
            showFeedback(false);
            lives--;
            updateLives();
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (lives > 0) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 2000);
        }

        // Mostrar feedback
        function showFeedback(isCorrect) {
            const feedback = document.createElement('div');
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = isCorrect ? '✓' : '✗';
            document.getElementById('feedbackContainer').appendChild(feedback);
            
            setTimeout(() => {
                feedback.remove();
            }, 800);
        }

        // Actualizar vidas
        function updateLives() {
            const livesElements = document.querySelectorAll('.life');
            livesElements.forEach((life, index) => {
                if (index >= lives) {
                    life.classList.add('lost');
                } else {
                    life.classList.remove('lost');
                }
            });
        }

        // Terminar juego
        function endGame() {
            currentScreen = 'results';
            clearInterval(timer);
            
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            
            const accuracy = Math.round((score / selectedQuestions.length) * 100);
            
            document.getElementById('scoreDisplay').textContent = `${score}/${selectedQuestions.length}`;
            document.getElementById('timeDisplay').textContent = `${totalGameTime}s`;
            document.getElementById('accuracyDisplay').textContent = `${accuracy}%`;
            
            // Guardar progreso
            saveProgress();
            
            // Mostrar botón de siguiente nivel si se aprobaron 10 ejercicios
            const nextLevelContainer = document.getElementById('nextLevelContainer');
            nextLevelContainer.innerHTML = '';
            
            if (score >= 10) {
                const nextLevelBtn = document.createElement('button');
                nextLevelBtn.className = 'next-level-btn';
                nextLevelBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Siguiente Nivel: Jerarquía de Operaciones';
                nextLevelBtn.onclick = () => window.location.href = 'juego2fase2.html';
                nextLevelContainer.appendChild(nextLevelBtn);
            } else {
                const message = document.createElement('p');
                message.style.color = '#ffaa00';
                message.style.fontSize = '1.2rem';
                message.style.marginTop = '20px';
                message.textContent = 'Necesitas 10 respuestas correctas para desbloquear el siguiente nivel';
                nextLevelContainer.appendChild(message);
            }
        }

        // Guardar progreso
        function saveProgress() {
            const progress = {
                level: 1,
                score: score,
                totalQuestions: selectedQuestions.length,
                completed: score >= 10,
                timestamp: Date.now()
            };
            
            // Guardar en localStorage
            localStorage.setItem('skopia_game_progress', JSON.stringify(progress));
            
            // También guardar el estado de este nivel específico
            const levelProgress = {
                'level1_operations': {
                    completed: score >= 10,
                    score: score,
                    bestScore: Math.max(score, parseInt(localStorage.getItem('level1_bestScore') || '0'))
                }
            };
            
            localStorage.setItem('skopia_level_progress', JSON.stringify(levelProgress));
            localStorage.setItem('level1_bestScore', levelProgress['level1_operations'].bestScore);
        }

        // Reiniciar juego
        function restartGame() {
            startGame();
        }

        // Volver a módulos
        function goToModules() {
            if (confirm('¿Estás seguro de que quieres salir? Perderás el progreso actual.')) {
                window.location.href = 'modulos.html';
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
        });

        // Prevenir que el usuario se vaya por accidente
        window.addEventListener('beforeunload', (e) => {
            if (currentScreen === 'game') {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
