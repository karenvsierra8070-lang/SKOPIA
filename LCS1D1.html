    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Estado de la aplicación
            let currentQuestionIndex = 0;
            let score = 0;
            let attempts = 0;
            let selectedOption = null;
            let questions = [];
            let hintsUsed = 0;
            let startTime = Date.now();
            let currentView = 'quiz'; // quiz, tip, theory, results
            
            // Consejos y teorías para cada pregunta
            const tips = [
                {
                    content: "Para identificar la idea principal, enfócate en la conclusión o tesis que el autor presenta al final del texto. Generalmente, las ideas principales se encuentran en la primera o última oración de un párrafo.",
                    example: "En el texto sobre el reciclaje, la idea principal no es que el reciclaje es malo, sino que la reducción y reutilización son más efectivas."
                },
                {
                    content: "Cuando un texto presenta múltiples beneficios de algo (como el ajedrez), la idea principal suele ser la que integra todos esos beneficios de manera concisa.",
                    example: "En lugar de centrarte solo en un aspecto (lógica o creatividad), busca la opción que mencione ambos elementos como parte del valor del ajedrez."
                },
                {
                    content: "Los textos que conectan dos temas aparentemente distintos (como cambio climático y desigualdad) suelen tener como idea principal precisamente esa conexión o relación causal.",
                    example: "Fíjate en las palabras clave que unen ambos conceptos, como 'inseparable', 'consecuencia' o 'impacta desproporcionadamente'."
                },
                {
                    content: "En textos sobre conceptos científicos o metodologías, la idea principal suele girar en torno al principio fundamental o característica más importante que define ese concepto.",
                    example: "En el caso del método científico, la falsabilidad es presentada como la característica 'más importante', lo que sugiere que debe ser parte de la idea principal."
                },
                {
                    content: "Cuando un texto describe algo como 'más que' o 'su esencia reside en', la idea principal suele ser el componente añadido que da profundidad al tema.",
                    example: "La dieta mediterránea no es solo una lista de alimentos, sino un 'estilo de vida' que incluye hábitos culturales. Esa es la idea principal."
                },
                {
                    content: "Los textos que presentan un fenómeno con un doble estado (natural pero problemático) suelen tener como idea principal la distinción entre ambos estados y la causa del problema.",
                    example: "El efecto invernadero es 'natural y esencial' pero su 'exacerbación' es el problema. La idea principal debe capturar esta dualidad."
                },
                {
                    content: "Cuando un texto rechaza una interpretación superficial de algo ('no debe ser vista simplemente como...'), la idea principal suele ser la interpretación más profunda o el valor trascendental que el autor atribuye al tema.",
                    example: "El arte rupestre no es solo 'expresión estética', sino una 'ventana al pensamiento simbólico'. Esa es la idea principal."
                },
                {
                    content: "Para conceptos definidos por múltiples principios o pilares, la idea principal debe englobar tanto el objetivo central como una referencia a esos principios.",
                    example: "La economía circular se define por tres principios: eliminar residuos, mantener uso y regenerar sistemas. La idea principal debe mencionar estos elementos."
                },
                {
                    content: "Cuando un elemento (como el fuego) se describe como un 'factor determinante' o 'hito', la idea principal suele ser la identificación de ese factor y la enumeración de sus consecuencias clave.",
                    example: "El dominio del fuego impulsó tanto la evolución biológica (cerebro) como social (lenguaje). La idea principal debe integrar ambos aspectos."
                },
                {
                    content: "En textos sobre corrientes artísticas o conceptos definidos por negación ('a diferencia del arte figurativo...'), la idea principal suele centrarse en las características propias del concepto y su valor único.",
                    example: "El arte abstracto no imita la realidad, sino que 'comunica emociones y sensaciones' a través de un lenguaje visual interno. Esa es su esencia."
                }
            ];
            
            const theories = [
                {
                    content: "La identificación de ideas principales es una habilidad fundamental en la comprensión lectora. Las ideas principales representan el mensaje central que el autor quiere comunicar, y diferenciarlas de los detalles secundarios es clave para una comprensión profunda.",
                    points: [
                        "Las ideas principales suelen encontrarse en la primera o última oración de un párrafo.",
                        "Busca palabras clave que indiquen importancia: 'principalmente', 'esencialmente', 'fundamentalmente'.",
                        "Las ideas principales responden a la pregunta: ¿Qué es lo más importante que el autor quiere decirme?"
                    ]
                },
                {
                    content: "Los textos que presentan múltiples beneficios o características de un tema requieren una lectura integradora para identificar la idea principal. Esta suele ser la opción que sintetiza los diferentes elementos mencionados de manera coherente.",
                    points: [
                        "Identifica todos los beneficios o características mencionados en el texto.",
                        "Busca la opción que integre la mayor cantidad de estos elementos.",
                        "Descarta las opciones que se centren en un solo aspecto o que contradigan lo mencionado."
                    ]
                },
                {

                {

                        "La idea principal debe reflejar tanto el objetivo central como los principios que lo definen."
                    ]
                },
                {
                    content: "En la historia y la evolución, ciertos hitos o factores tienen un impacto determinante en el desarrollo posterior. Identificar estos factores y sus consecuencias es clave para comprender los procesos históricos o evolutivos.",
                    points: [
                        "Busca expresiones que indiquen importancia: 'factor determinante', 'hito', 'impacto crucial'.",
                        "Identifica todas las consecuencias mencionadas en el texto.",
                        "La idea principal debe conectar el factor con sus consecuencias de manera clara."
                    ]
                },
                {
                    content: "Las corrientes artísticas o conceptos abstractos suelen definirse tanto por sus características propias como por su contraste con otras corrientes o conceptos. Comprender esta dualidad es esencial para identificar la idea principal.",
                    points: [
                        "Identifica las características propias del concepto mencionadas en el texto.",
                        "Presta atención a las frases que lo definen por negación: 'a diferencia de...'.",
                        "La idea principal debe centrarse en las características únicas y el valor del concepto."

            ];
            
            // Elementos del DOM
            const quizContainer = document.getElementById('quiz-container');
            const tipContainer = document.getElementById('tip-container');
            const theoryContainer = document.getElementById('theory-container');
            const resultsContainer = document.getElementById('results-container');
            
            const questionNumber = document.getElementById('question-number');
            const totalQuestionsHeader = document.getElementById('total-questions-header');
            const questionText = document.getElementById('question-text');
            const textPassage = document.getElementById('text-passage');
            const optionsContainer = document.getElementById('options-container');
            const hintContainer = document.getElementById('hint-container');
            const hintText = document.getElementById('hint-text');
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const trickBox = document.getElementById('trick-box');
            const trickText = document.getElementById('trick-text');
            const hintBtn = document.getElementById('hint-btn');
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn');
            const backBtn = document.getElementById('back-btn');
            const continueToTheoryBtn = document.getElementById('continue-to-theory-btn');
            const continueQuizBtn = document.getElementById('continue-quiz-btn');
            const finishBtn = document.getElementById('finish-btn');
            
            const currentScore = document.getElementById('current-score');
            const totalQuestions = document.getElementById('total-questions');
            const progressFill = document.getElementById('progress-fill');
            const attempt1 = document.getElementById('attempt-1');
            const attempt2 = document.getElementById('attempt-2');
            
            const tipContent = document.getElementById('tip-content');
            const tipExample = document.getElementById('tip-example');
            const theoryContent = document.getElementById('theory-content');
            const theoryPoints = document.getElementById('theory-points');
            
            const resultsScore = document.getElementById('results-score');
            const resultsMessage = document.getElementById('results-message');
            const starsContainer = document.getElementById('stars-container');
            const correctAnswers = document.getElementById('correct-answers');
            const hintsUsedStat = document.getElementById('hints-used');
            const timeSpent = document.getElementById('time-spent');
            
            const toast = document.getElementById('toast');
            
            // Cargar preguntas desde JSON
            async function loadQuestions() {
                try {
                    const response = await fetch('preguntas.json');
                    const data = await response.json();
                    questions = data;
                    totalQuestions.textContent = questions.length;
                    totalQuestionsHeader.textContent = questions.length;
                    loadQuestion();
                } catch (error) {
                    console.error('Error al cargar las preguntas:', error);
                    showToast('Error al cargar las preguntas. Por favor, recarga la página.');
                }
            }
            
            // Cargar pregunta actual
            function loadQuestion() {
                if (currentQuestionIndex >= questions.length) {
                    showResults();
                    return;
                }
                
                const question = questions[currentQuestionIndex];
                questionNumber.textContent = currentQuestionIndex + 1;
                questionText.textContent = question.pregunta;
                textPassage.textContent = question.pregunta.split('\n\n')[0];
                
                // Cargar opciones
                optionsContainer.innerHTML = '';
                question.opciones.forEach((option, index) => {
                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option-btn';
                    optionBtn.innerHTML = `
                        <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                        <span>${option}</span>
                    `;
                    optionBtn.onclick = () => selectOption(index);
                    optionsContainer.appendChild(optionBtn);
                });
                
                // Resetear estado
                selectedOption = null;
                attempts = 0;
                attempt1.classList.remove('used');
                attempt2.classList.remove('used');
                hintContainer.style.display = 'none';
                feedbackContainer.style.display = 'none';
                nextBtn.style.display = 'none';
                checkBtn.disabled = true;
                hintBtn.disabled = false;
                
                // Actualizar progreso
                updateProgress();
            }
            
            // Seleccionar opción
            function selectOption(index) {
                selectedOption = index;
                const options = document.querySelectorAll('.option-btn');
                options.forEach((opt, i) => {
                    opt.classList.toggle('selected', i === index);
                });
                checkBtn.disabled = false;
            }
            
            // Verificar respuesta
            function checkAnswer() {
                if (selectedOption === null) return;
                
                attempts++;
                const question = questions[currentQuestionIndex];
                const isCorrect = selectedOption === question.respuestaCorrecta;
                const options = document.querySelectorAll('.option-btn');
                
                // Actualizar indicador de intentos
                if (attempts === 1) {
                    attempt1.classList.add('used');
                } else if (attempts === 2) {
                    attempt2.classList.add('used');
                }
                
                // Mostrar respuesta correcta e incorrecta
                options.forEach((opt, i) => {
                    if (i === question.respuestaCorrecta) {
                        opt.classList.add('correct');
                        opt.innerHTML += '<span class="option-icon correct">✓</span>';
                    } else if (i === selectedOption && i !== question.respuestaCorrecta) {
                        opt.classList.add('incorrect');
                        opt.innerHTML += '<span class="option-icon incorrect">✗</span>';
                    }
                    opt.onclick = null; // Deshabilitar clics
                });
                
                if (isCorrect) {
                    // Respuesta correcta
                    score++;
                    currentScore.textContent = score;
                    
                    feedbackContainer.className = 'feedback-container correct';
                    feedbackTitle.innerHTML = '<i class="fas fa-check-circle"></i> ¡Correcto!';
                    feedbackText.textContent = question.explicacion;
                    trickBox.style.display = 'none';
                    
                    // Deshabilitar botón de pista
                    hintBtn.disabled = true;
                    
                    // Mostrar botón de siguiente
                    nextBtn.style.display = 'block';
                    checkBtn.style.display = 'none';
                    
                    // Actualizar progreso
                    updateProgress();
                } else {
                    // Respuesta incorrecta
                    feedbackContainer.className = 'feedback-container incorrect';
                    feedbackTitle.innerHTML = '<i class="fas fa-times-circle"></i> Incorrecto';
                    
                    if (attempts === 1) {
                        // Primer intento incorrecto, permitir volver a intentar
                        feedbackText.textContent = 'Inténtalo de nuevo. Puedes usar una pista si lo necesitas.';
                        trickBox.style.display = 'none';
                        
                        // Rehabilitar opciones para volver a intentar
                        options.forEach((opt, i) => {
                            if (i === selectedOption) {
                                opt.classList.remove('incorrect');
                                opt.querySelector('.option-icon')?.remove();
                            }
                            opt.onclick = () => selectOption(i);
                        });
                        
                        selectedOption = null;
                        checkBtn.disabled = true;
                    } else {
                        // Segundo intento incorrecto, mostrar explicación y truco
                        feedbackText.textContent = question.explicacion;
                        trickBox.style.display = 'block';
                        trickText.textContent = question.truco;
                        
                        // Deshabilitar botón de pista
                        hintBtn.disabled = true;
                        
                        // Mostrar botón de siguiente
                        nextBtn.style.display = 'block';
                        checkBtn.style.display = 'none';
                    }
                }
                
                feedbackContainer.style.display = 'block';
            }
            
            // Mostrar pista
            function showHint() {
                hintContainer.style.display = 'block';
                hintText.textContent = "Lee atentamente el texto y fíjate en las palabras clave que indican la idea principal. Busca la opción que capture la esencia del mensaje del autor.";
                hintsUsed++;
                hintsUsedStat.textContent = hintsUsed;
                hintBtn.disabled = true;
            }
            
            // Mostrar consejo
            function showTip() {
                currentView = 'tip';
                quizContainer.style.display = 'none';
                tipContainer.style.display = 'block';
                
                const tip = tips[currentQuestionIndex];
                tipContent.textContent = tip.content;
                tipExample.textContent = tip.example;
            }
            
            // Mostrar teoría
            function showTheory() {
                currentView = 'theory';
                tipContainer.style.display = 'none';
                theoryContainer.style.display = 'block';
                
                const theory = theories[currentQuestionIndex];
                theoryContent.textContent = theory.content;
                
                theoryPoints.innerHTML = '';
                theory.points.forEach(point => {
                    const li = document.createElement('li');
                    li.className = 'theory-point';
                    li.textContent = point;
                    theoryPoints.appendChild(li);
                });
            }
            
            // Continuar con el cuestionario
            function continueQuiz() {
                currentView = 'quiz';
                theoryContainer.style.display = 'none';
                quizContainer.style.display = 'block';
                
                currentQuestionIndex++;
                loadQuestion();
            }
            
            // Mostrar resultados
            function showResults() {
                currentView = 'results';
                quizContainer.style.display = 'none';
                resultsContainer.style.display = 'block';
                
                const percentage = Math.round((score / questions.length) * 100);
                resultsScore.textContent = `${score}/${questions.length}`;
                correctAnswers.textContent = score;
                
                // Calcular tiempo empleado
                const endTime = Date.now();
                const timeDiff = Math.floor((endTime - startTime) / 1000);
                const minutes = Math.floor(timeDiff / 60);
                const seconds = timeDiff % 60;
                timeSpent.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Mensaje y estrellas según resultado
                if (percentage >= 90) {
                    resultsMessage.textContent = '¡Excelente! Has dominado el concepto de ideas principales.';
                    starsContainer.innerHTML = '⭐⭐⭐';
                } else if (percentage >= 70) {
                    resultsMessage.textContent = '¡Buen trabajo! Tienes una comprensión sólida del tema.';
                    starsContainer.innerHTML = '⭐⭐';
                } else {
                    resultsMessage.textContent = 'Sigue practicando. Repasa los conceptos clave para mejorar.';
                    starsContainer.innerHTML = '⭐';
                }
                
                // Guardar progreso
                saveProgress();
            }
            
            // Actualizar progreso
            function updateProgress() {
                const progress = ((currentQuestionIndex + (attempts > 0 ? 1 : 0)) / questions.length) * 100;
                progressFill.style.width = progress + '%';
            }
            
            // Guardar progreso
            function saveProgress() {
                const progress = {
                    quiz: 'LCS1D1',
                    score: score,
                    total: questions.length,
                    percentage: Math.round((score / questions.length) * 100),
                    hintsUsed: hintsUsed,
                    completed: true,
                    timestamp: new Date().toISOString()
                };
                
                localStorage.setItem('skopia_quiz_progress', JSON.stringify(progress));
                
                // Completar misiones si corresponde
                if (progress.percentage >= 60) {
                    completeMission(1); // Misión de completar examen
                    if (progress.percentage >= 80) {
                        completeMission(2); // Misión de buen puntaje
                    }
                }
            }
            
            // Completar misión
            function completeMission(missionId) {
                // Lógica para completar misiones
                console.log(`Misión ${missionId} completada`);
                showToast(`¡Misión ${missionId} completada!`);
            }
            
            // Mostrar notificación
            function showToast(message, duration = 3000) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }
            
            // Event listeners
            hintBtn.addEventListener('click', showHint);
            checkBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', showTip);
            continueToTheoryBtn.addEventListener('click', showTheory);
            continueQuizBtn.addEventListener('click', continueQuiz);
            
            backBtn.addEventListener('click', () => {
                if (currentView === 'quiz') {
                    if (confirm('¿Estás seguro de que quieres salir? Perderás tu progreso actual.')) {
                        window.location.href = 'LCS1D.html';
                    }
                } else if (currentView === 'tip') {
                    currentView = 'quiz';
                    tipContainer.style.display = 'none';
                    quizContainer.style.display = 'block';
                } else if (currentView === 'theory') {
                    currentView = 'tip';
                    theoryContainer.style.display = 'none';
                    tipContainer.style.display = 'block';
                }
            });
            
            finishBtn.addEventListener('click', () => {
                window.location.href = 'LCS1D.html';
            });
            
            // Floating icons
            document.getElementById('btn-misiones').addEventListener('click', () => {
                showToast('🎯 Misiones próximamente...');
            });
            
            document.getElementById('btn-nivel').addEventListener('click', () => {
                showToast('⭐ Nivel actual: Aprendiz');
            });
            
            document.getElementById('btn-progreso').addEventListener('click', () => {
                showToast('📊 Progreso general: 45%');
            });
            
            // Inicializar
            loadQuestions();
        });
    </script>
</body>
