<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aumentos y Descuentos - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root {
            --crema:#fdfbf5;--crema-mid:#f5f0e3;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;
            --oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;
            --sombra:rgba(39,43,0,.08);--sombra-md:rgba(39,43,0,.12);
            --sidebar-w:310px;--topbar-h:72px;--radius:14px;--radius-sm:8px;
            --dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;--verde:#3e6b3a;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;
            background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,.1) 0%,transparent 50%);}
        a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}
        ul{list-style:none;}input{font-family:inherit;}

        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--oliva-oscuro);color:var(--crema);display:flex;flex-direction:column;z-index:900;transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
        .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
        .sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
        .sidebar-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--oliva-claro);}
        .sidebar-username{font-family:'Patrick Hand',cursive;font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-program{font-size:.75rem;color:var(--oliva-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-search{padding:12px 14px;flex-shrink:0;}
        .sidebar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--crema);font-size:.85rem;outline:none;transition:border .2s;}
        .sidebar-search input::placeholder{color:rgba(255,255,255,.35);}
        .sidebar-search input:focus{border-color:var(--oliva-claro);}
        .sidebar-search-wrap{position:relative;}
        .sidebar-search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:.8rem;}
        .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--oliva-medio) transparent;}
        .sidebar-nav::-webkit-scrollbar{width:5px;}.sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}
        .menu-group-label{padding:14px 18px 6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);display:flex;align-items:center;gap:8px;}
        .menu-group-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
        .menu-cat{user-select:none;}
        .menu-cat-btn{width:100%;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--crema);transition:background .2s;text-align:left;}
        .menu-cat-btn:hover{background:rgba(255,255,255,.06);}
        .menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
        .menu-cat-btn .chevron{margin-left:auto;font-size:.6rem;transition:transform .25s;color:var(--oliva-claro);}
        .menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
        .menu-cat-children{max-height:0;overflow:hidden;transition:max-height .35s ease;}
        .menu-cat.open>.menu-cat-children{max-height:2000px;}
        .menu-sub{user-select:none;}
        .menu-sub-btn{width:100%;padding:8px 18px 8px 44px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:rgba(253,251,245,.75);transition:all .2s;text-align:left;}
        .menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,.04);}
        .menu-sub-btn .chevron{margin-left:auto;font-size:.55rem;transition:transform .25s;opacity:.5;}
        .menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
        .menu-sub-children{max-height:0;overflow:hidden;transition:max-height .3s ease;}
        .menu-sub.open>.menu-sub-children{max-height:800px;}
        .menu-link{display:block;padding:7px 18px 7px 62px;font-size:.78rem;color:rgba(253,251,245,.55);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .menu-link:hover{color:var(--crema);background:rgba(255,255,255,.06);padding-left:68px;}
        .menu-link::before{content:'›';margin-right:6px;color:var(--oliva-claro);font-weight:700;}
        .menu-link.active{color:#fff;background:rgba(255,255,255,.1);padding-left:68px;}
        .menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
        .menu-no-result{padding:20px 18px;text-align:center;font-size:.8rem;color:rgba(255,255,255,.3);display:none;}
        .menu-no-result.show{display:block;}
        .menu-note{padding:8px 18px 8px 44px;font-size:.72rem;color:rgba(253,251,245,.35);font-style:italic;}
        .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);}
        .sidebar-footer a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:rgba(253,251,245,.6);transition:all .2s;}
        .sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,.06);}
        .sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:899;opacity:0;visibility:hidden;transition:all .3s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}

        .main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .35s cubic-bezier(.4,0,.2,1);}
        .main-wrap.expanded{margin-left:0;}
        .topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(253,251,245,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,.06);display:flex;align-items:center;padding:0 28px;gap:16px;}
        .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.1rem;color:var(--oliva-oscuro);transition:background .2s;flex-shrink:0;}
        .topbar-toggle:hover{background:rgba(39,43,0,.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{font-family:'Patrick Hand',cursive;font-size:1.5rem;line-height:1.2;}
        .topbar-greeting .sub{font-size:.82rem;color:var(--oliva-medio);}
        .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
        .topbar-clock{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;color:var(--oliva-oscuro);letter-spacing:1px;}
        .topbar-stars{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:rgba(201,162,39,.1);font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;color:var(--dorado);}
        .topbar-stars i{font-size:.75rem;}

        .theory{padding:28px 32px 40px;}
        .theory-section{display:none;animation:fadeUp .4s ease;}
        .theory-section.active{display:block;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        .comp-box{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));color:var(--crema);border-radius:var(--radius);padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden;}
        .comp-box::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);}
        .comp-box h2{font-family:'Patrick Hand',cursive;font-size:1.4rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .comp-box h2 i{color:var(--dorado-claro);}
        .comp-box p{font-size:.88rem;line-height:1.6;opacity:.85;}
        .comp-box ul{margin-top:10px;padding-left:0;}
        .comp-box ul li{font-size:.85rem;line-height:1.5;opacity:.8;padding:3px 0;padding-left:18px;position:relative;}
        .comp-box ul li::before{content:'●';position:absolute;left:0;color:var(--dorado-claro);font-size:.5rem;top:9px;}

        .panda-msg{background:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;box-shadow:0 2px 12px var(--sombra);border-left:4px solid var(--dorado);display:flex;gap:16px;align-items:flex-start;}
        .panda-msg img{width:56px;height:64px;flex-shrink:0;}
        .panda-msg p{font-size:.9rem;line-height:1.55;color:var(--oliva-oscuro);}
        .panda-msg p strong{color:var(--oliva-medio);}

        .formula-card{background:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;box-shadow:0 2px 10px var(--sombra);border:1px solid rgba(39,43,0,.04);}
        .formula-card h3{font-family:'Patrick Hand',cursive;font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--oliva-medio);}
        .formula-card h3 i{font-size:.9rem;}
        .formula-card .katex-display{margin:12px 0;font-size:1.05rem;}
        .formula-card .formula-note{font-size:.82rem;color:var(--oliva-claro);margin-top:8px;line-height:1.4;}

        .no-entiendo-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;background:var(--oliva-super);color:var(--oliva-medio);font-size:.82rem;font-weight:600;transition:all .2s;margin-top:12px;}
        .no-entiendo-btn:hover{background:var(--oliva-palido);transform:translateY(-1px);}

        .type-card{background:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;box-shadow:0 2px 10px var(--sombra);border-left:4px solid var(--oliva-medio);}
        .type-card h4{font-size:.95rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .type-card h4 i{color:var(--oliva-medio);font-size:.85rem;}
        .type-card p{font-size:.85rem;line-height:1.5;color:#444;}

        .popup-overlay{position:fixed;inset:0;background:rgba(39,43,0,.5);backdrop-filter:blur(4px);z-index:5000;display:none;place-items:center;padding:20px;}
        .popup-overlay.active{display:grid;}
        .popup-box{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(39,43,0,.25);animation:popIn .3s ease;}
        @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        .popup-header{background:var(--oliva-oscuro);color:var(--crema);padding:20px 24px;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;gap:12px;}
        .popup-header img{width:40px;height:46px;}
        .popup-header div h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;}
        .popup-header div p{font-size:.78rem;opacity:.7;}
        .popup-close{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--crema);font-size:.9rem;transition:background .2s;}
        .popup-close:hover{background:rgba(255,255,255,.15);}
        .popup-body{padding:24px;}
        .popup-body p{font-size:.9rem;line-height:1.6;margin-bottom:14px;}
        .popup-body .katex-display{margin:14px 0;font-size:1rem;}
        .popup-example{background:var(--crema);border-radius:var(--radius-sm);padding:16px 18px;margin:14px 0;border:1px solid rgba(39,43,0,.06);}
        .popup-example h4{font-size:.88rem;font-weight:700;color:var(--oliva-medio);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
        .popup-example h4 i{font-size:.75rem;}
        .popup-example p{font-size:.85rem;line-height:1.5;margin-bottom:8px;}

        .exercise-box{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 2px 12px var(--sombra);margin-top:16px;border:2px solid var(--oliva-palido);}
        .exercise-box h4{font-family:'Patrick Hand',cursive;font-size:1.1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .exercise-box h4 i{color:var(--dorado);}
        .exercise-box .problem{font-size:.92rem;line-height:1.5;margin-bottom:16px;padding:14px 18px;background:var(--crema);border-radius:var(--radius-sm);}
        .ex-input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
        .ex-input-row label{font-size:.85rem;font-weight:600;white-space:nowrap;}
        .ex-input{padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--oliva-palido);font-size:1rem;font-family:'Orbitron',monospace;width:160px;outline:none;transition:border .2s;text-align:center;}
        .ex-input:focus{border-color:var(--oliva-medio);}
        .ex-check{padding:10px 24px;border-radius:var(--radius-sm);background:var(--oliva-oscuro);color:var(--crema);font-size:.88rem;font-weight:600;transition:all .2s;}
        .ex-check:hover{background:var(--oliva-medio);}
        .ex-feedback{margin-top:14px;padding:14px 18px;border-radius:var(--radius-sm);font-size:.88rem;line-height:1.5;display:none;}
        .ex-feedback.correct{display:block;background:rgba(62,107,58,.1);color:var(--verde);border:1px solid rgba(62,107,58,.2);}
        .ex-feedback.wrong{display:block;background:rgba(184,92,56,.08);color:var(--rojo-suave);border:1px solid rgba(184,92,56,.15);}
        .ex-solution{margin-top:10px;padding:14px 18px;background:var(--crema);border-radius:var(--radius-sm);font-size:.85rem;line-height:1.6;display:none;border:1px dashed var(--oliva-palido);}
        .ex-solution.show{display:block;}

        .practice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
        .practice-header h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;display:flex;align-items:center;gap:8px;}
        .practice-header h3 i{color:var(--dorado);}
        .practice-counter{font-family:'Orbitron',monospace;font-size:.85rem;color:var(--oliva-medio);background:var(--oliva-super);padding:6px 14px;border-radius:20px;}
        .q-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 2px 12px var(--sombra);margin-bottom:14px;display:none;}
        .q-card.active{display:block;animation:fadeUp .35s ease;}
        .q-card .q-num{font-family:'Orbitron',monospace;font-size:.72rem;color:var(--oliva-claro);margin-bottom:6px;}
        .q-card .q-text{font-size:.95rem;line-height:1.5;margin-bottom:16px;}
        .q-options{display:flex;flex-direction:column;gap:8px;}
        .q-opt{padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--oliva-palido);font-size:.88rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;}
        .q-opt:hover{border-color:var(--oliva-medio);background:rgba(90,97,51,.04);}
        .q-opt.selected{border-color:var(--oliva-medio);background:rgba(90,97,51,.08);font-weight:600;}
        .q-opt.correct-answer{border-color:var(--verde);background:rgba(62,107,58,.08);color:var(--verde);}
        .q-opt.wrong-answer{border-color:var(--rojo-suave);background:rgba(184,92,56,.06);color:var(--rojo-suave);}
        .q-opt .opt-letter{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;background:var(--oliva-super);color:var(--oliva-medio);flex-shrink:0;transition:all .2s;}
        .q-opt.correct-answer .opt-letter{background:var(--verde);color:#fff;}
        .q-opt.wrong-answer .opt-letter{background:var(--rojo-suave);color:#fff;}
        .q-explanation{margin-top:14px;padding:14px 18px;background:var(--crema);border-radius:var(--radius-sm);font-size:.84rem;line-height:1.5;display:none;border-left:3px solid var(--oliva-medio);}
        .q-explanation.show{display:block;animation:fadeUp .3s ease;}
        .q-nav{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap;}
        .q-nav-btn{padding:10px 22px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;transition:all .2s;}
        .q-nav-btn.next{background:var(--oliva-oscuro);color:var(--crema);}
        .q-nav-btn.next:hover{background:var(--oliva-medio);}
        .q-nav-btn.next:disabled{opacity:.4;cursor:not-allowed;}
        .q-nav-btn.skip{background:var(--oliva-super);color:var(--oliva-medio);}
        .q-nav-btn.skip:hover{background:var(--oliva-palido);}

        .results-card{background:#fff;border-radius:var(--radius);padding:32px;text-align:center;box-shadow:0 4px 20px var(--sombra-md);display:none;}
        .results-card.active{display:block;animation:fadeUp .4s ease;}
        .results-score{font-family:'Orbitron',monospace;font-size:3rem;font-weight:700;line-height:1;}
        .results-score.good{color:var(--verde);}
        .results-score.mid{color:var(--dorado);}
        .results-score.low{color:var(--rojo-suave);}
        .results-label{font-size:.9rem;color:var(--oliva-medio);margin-top:6px;}
        .results-bar{width:100%;max-width:400px;height:12px;background:var(--oliva-super);border-radius:6px;margin:20px auto;overflow:hidden;}
        .results-bar-fill{height:100%;border-radius:6px;transition:width 1.2s ease;width:0;}
        .results-msg{font-size:1.1rem;margin-top:16px;line-height:1.5;}
        .results-detail{display:flex;justify-content:center;gap:32px;margin-top:20px;}
        .results-detail div{text-align:center;}
        .results-detail .rd-num{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
        .results-detail .rd-label{font-size:.75rem;color:var(--oliva-claro);margin-top:2px;}

        .nav-buttons{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
        .nav-btn{padding:14px 28px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:8px;}
        .nav-btn.primary{background:var(--oliva-oscuro);color:var(--crema);}
        .nav-btn.primary:hover{background:var(--oliva-medio);transform:translateY(-2px);box-shadow:0 4px 16px rgba(39,43,0,.2);}
        .nav-btn.secondary{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .nav-btn.secondary:hover{background:var(--oliva-palido);}
        .nav-btn.dorado{background:var(--dorado);color:var(--oliva-oscuro);}
        .nav-btn.dorado:hover{background:var(--dorado-claro);transform:translateY(-2px);}
        .nav-btn.ghost{background:transparent;color:var(--oliva-claro);border:1.5px solid var(--oliva-palido);font-size:.82rem;padding:10px 18px;}
        .nav-btn.ghost:hover{border-color:var(--oliva-medio);color:var(--oliva-medio);}

        .review-menu{background:#fff;border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px var(--sombra);display:none;}
        .review-menu.active{display:block;animation:fadeUp .4s ease;}
        .review-menu h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .review-menu h3 i{color:var(--dorado);}
        .review-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:8px;border:1.5px solid var(--oliva-super);cursor:pointer;transition:all .2s;}
        .review-item:hover{border-color:var(--oliva-medio);background:rgba(90,97,51,.04);transform:translateX(4px);}
        .review-item i.ri-icon{width:36px;height:36px;border-radius:10px;background:var(--oliva-super);display:grid;place-items:center;color:var(--oliva-medio);font-size:.9rem;flex-shrink:0;}
        .review-item .ri-text{flex:1;}
        .review-item .ri-text h4{font-size:.9rem;font-weight:600;}
        .review-item .ri-text p{font-size:.75rem;color:var(--oliva-claro);}
        .review-item .ri-arrow{color:var(--oliva-claro);font-size:.75rem;}

        .toast{position:fixed;bottom:24px;right:24px;background:#fff;padding:14px 20px;border-radius:var(--radius-sm);border-left:4px solid var(--dorado);box-shadow:0 8px 24px var(--sombra-md);z-index:6000;font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .35s ease;max-width:380px;display:flex;align-items:center;gap:10px;}
        .toast.show{transform:translateY(0);opacity:1;}
        .toast i{color:var(--dorado);font-size:1rem;}

        .loading-spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:16px;}
        .spinner{width:32px;height:32px;border:3px solid var(--oliva-super);border-top-color:var(--oliva-medio);border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg)}}

        .panda-mini{width:56px;height:64px;flex-shrink:0;}

function checkEx1(){
    const input=document.getElementById('ex1-input'),fb=document.getElementById('ex1-fb'),sol=document.getElementById('ex1-sol');
    const val=parseFloat((input.value||'').replace(/\./g,'').replace(/,/g,'.'));
    if(isNaN(val)){fb.className='ex-feedback wrong';fb.style.display='block';fb.textContent='Escribe un valor numérico.';return;}
    if(Math.abs(val-100000)<100){
        fb.className='ex-feedback correct';fb.style.display='block';
        fb.innerHTML='<i class="fas fa-check-circle" style="margin-right:6px;"></i> Asi es! $80.000 x 1,25 = $100.000. Ahora lo entiendes? Multiplicar por 1,25 es lo mismo que sumar el 25%.';
        sol.style.display='none';
    } else {
        fb.className='ex-feedback wrong';fb.style.display='block';
        fb.innerHTML='<i class="fas fa-times-circle" style="margin-right:6px;"></i> Oww, no te preocupes, te explico paso a paso.';
        sol.className='ex-solution show';
        sol.innerHTML='<strong>Paso a paso:</strong><br>1. El 25% en decimal es 0,25.<br>2. Factor de aumento: 1 + 0,25 = <strong>1,25</strong>.<br>3. Multiplicamos: $80.000 x 1,25 = <strong>$100.000</strong>.<br><br>Piensa tambien: el 25% de 80.000 es 20.000. Entonces 80.000 + 20.000 = 100.000.';
    }
}

    variacion:{title:'Variacion porcentual: otra forma',sub:'Que tanto cambio respecto a lo que era',html:'<p>Si algo paso de 200 a 250, subio 50. Pero 50 respecto a 200 es el 25%.</p><p>Positivo = aumento. Negativo = disminucion.</p><div class="popup-example"><h4><i class="fas fa-graduation-cap"></i> Ejemplo</h4><p>Poblacion: 8.000 a 9.200.</p><p>(9.200 - 8.000) / 8.000 x 100 = <strong>15%</strong></p></div>'},
    sucesivos:{title:'Sucesivos: explicacion detallada',sub:'Paso a paso con numeros claros',html:'<p><strong>Cada porcentaje se aplica sobre el resultado anterior.</strong></p><div class="popup-example"><h4><i class="fas fa-graduation-cap"></i> Ejemplo ICFES</h4><p>Producto de $200.000 sube 20% y baja 15%.</p><p>Paso 1: 200.000 x 1,20 = 240.000</p><p>Paso 2: 240.000 x 0,85 = <strong>204.000</strong></p><p>El descuento del 15% se aplico sobre 240.000, no sobre 200.000.</p></div><p><strong>Distractor:</strong> $200.000 (asumiendo que se anulan) o $210.000 (sumando/restando porcentajes). Ambos incorrectos.</p>'},
    promociones:{title:'Comparacion de promociones',sub:'Como calcular el descuento real',html:'<p><strong>"Lleve 3 pague 2"</strong> = descuento de 1/3 = 33,33%.</p><p><strong>"Lleve 4 pague 3"</strong> = 1/4 = 25%.</p><p><strong>"2x1"</strong> = 50%.</p><div class="popup-example"><h4><i class="fas fa-graduation-cap"></i> Ejemplo ICFES</h4><p>Producto: $15.000. Promo A: "lleve 3 pague 2". Promo B: 30% descuento.</p><p>Promo A: pagas 30.000 por 3 = $10.000/unidad (33,33% descuento).</p><p>Promo B: 15.000 x 0,70 = $10.500/unidad (30% descuento).</p><p><strong>Promo A es mejor</strong> ($500 menos por unidad).</p></div>'},
    tablas:{title:'Datos desde tablas y graficas',sub:'Como identificar el valor base',html:'<p>En una tabla, el valor base suele ser la primera fila o "Año base".</p><p>En una grafica de barras, el enunciado te dice cual es la barra base.</p><div class="popup-example"><h4><i class="fas fa-graduation-cap"></i> Ejemplo</h4><p>Barra 2020: 400. Barra 2021: 480.</p><p>(480 - 400) / 400 x 100 = <strong>20%</strong></p><p><strong>Distractor:</strong> decir que crecio 80 unidades sin convertir a porcentaje.</p></div>'},
    encadenamiento:{title:'Encadenamiento: otra explicacion',sub:'Con numeros diferentes',html:'<p>Precio de $50.000 sube 20% y luego baja 20%.</p><p>Paso 1: 50.000 x 1,20 = 60.000</p><p>Paso 2: 60.000 x 0,80 = 48.000</p><p>Termino en $48.000, <strong>menos que el original</strong>. El descuento se calculo sobre 60.000 (mas grande), asi que quito mas de lo que sumo el aumento.</p><p><strong>Un aumento y descuento del mismo % NUNCA se anulan si primero sube y luego baja.</strong></p>'},

    graficas:{title:'Graficas de barras: otra explicacion',sub:'El truco para no caer en distractores',html:'<p><strong>Siempre calcula el porcentaje</strong>, nunca compares absolutos.</p><div class="popup-example"><h4><i class="fas fa-graduation-cap"></i> Ejemplo trampa</h4><p>Tienda A: 100 a 130 (aumento de 30 unidades).</p><p>Tienda B: 50 a 75 (aumento de 25 unidades).</p><p>Tienda A: 30/100 = 30%.</p><p>Tienda B: 25/50 = 50%.</p><p><strong>Tienda B tuvo mayor aumento porcentual</strong> aunque subio menos en absoluto. "Tienda A" es el distractor.</p></div>'},
    recibos:{title:'Recibos: otra explicacion',sub:'Desglosando un recibo',html:'<p>Un recibo muestra: consumo anterior, consumo actual, tarifa por kWh, subtotal, IVA (19% del subtotal), total.</p><p>El IVA se calcula sobre el <strong>subtotal</strong>, no sobre el total.</p><p>Si te dan el total y piden el IVA, divide entre 1,19 primero.</p>'}

/* ===== ESTADO DE SESIONES ===== */
function makeState(qs){return{current:0,answers:new Array(qs.length).fill(null),answered:new Array(qs.length).fill(false),done:false,score:0};}
let s1=makeState(S1_QS), s2=makeState(S2_QS);

/* ===== CONSTRUIR PREGUNTAS ===== */
function buildSession(qs,state,cid){
    const c=document.getElementById(cid);if(!c)return;
    const letters=['A','B','C','D'];
    let h='';
    qs.forEach((q,i)=>{
        h+=`<div class="q-card${i===0?' active':''}" data-qi="${i}" id="${cid}-q${i}">
            <div class="q-num">Pregunta ${i+1} de ${qs.length}</div>
            <div class="q-text">${q.q}</div>
            <div class="q-options">${q.opts.map((o,j)=>`<div class="q-opt" data-qi="${i}" data-oi="${j}" onclick="selOpt('${cid}',${i},${j})"><span class="opt-letter">${letters[j]}</span><span>${o}</span></div>`).join('')}</div>
            <div class="q-explanation" id="${cid}-exp${i}"><i class="fas fa-lightbulb" style="color:var(--dorado);margin-right:6px;"></i>${q.exp}</div>
            <div class="q-nav">
                ${i<qs.length-1?`<button class="q-nav-btn skip" onclick="skipSession('${cid}')"><i class="fas fa-forward"></i> Saltar sesion</button><button class="q-nav-btn next" id="${cid}-next${i}" disabled onclick="nextQ('${cid}',${i})">Siguiente <i class="fas fa-arrow-right"></i></button>`:`<button class="q-nav-btn skip" onclick="skipSession('${cid}')"><i class="fas fa-forward"></i> Saltar sesion</button><button class="q-nav-btn next" id="${cid}-next${i}" disabled onclick="finishSession('${cid}')">Ver resultados <i class="fas fa-flag-checkered"></i></button>`}
            </div>
        </div>`;
    });
    c.innerHTML=h;
}

function getState(cid){
    if(cid==='s1q')return{state:s1,qs:S1_QS,resId:'s1r',scId:'s1sc',barId:'s1bar',msgId:'s1msg',corId:'s1cor',wrgId:'s1wrg',pctId:'s1pct',cntId:'s1cnt',navId:'s1nav'};
    return{state:s2,qs:S2_QS,resId:'s2r',scId:'s2sc',barId:'s2bar',msgId:'s2msg',corId:'s2cor',wrgId:'s2wrg',pctId:'s2pct',cntId:'s2cnt',navId:'s2nav'};
}

function selOpt(cid,qi,oi){
    const{state,qs}=getState(cid);
    if(state.answered[qi])return;
    state.answers[qi]=oi;
    state.answered[qi]=true;
    const correct=qs[qi].correct;
    document.querySelectorAll(`#${cid} [data-qi="${qi}"].q-opt`).forEach(el=>{
        const idx=parseInt(el.dataset.oi);el.style.pointerEvents='none';
        if(idx===correct)el.classList.add('correct-answer');
        else if(idx===oi)el.classList.add('wrong-answer');
    });
    document.getElementById(`${cid}-exp${qi}`).classList.add('show');
    const nb=document.getElementById(`${cid}-next${qi}`);if(nb)nb.disabled=false;
}
window.selOpt=selOpt;

function nextQ(cid,qi){
    const{state,qs,cntId}=getState(cid);
    document.getElementById(`${cid}-q${qi}`).classList.remove('active');
    state.current=qi+1;
    document.getElementById(`${cid}-q${state.current}`).classList.add('active');
    document.getElementById(cntId).textContent=`${state.current+1} / ${qs.length}`;
    window.scrollTo({top:document.getElementById(`${cid}-q${state.current}`).offsetTop-120,behavior:'smooth'});
}
window.nextQ=nextQ;

/* ===== SALTAR SESIÓN ===== */
function skipSession(cid){
    const{state,qs,resId,navId,cntId}=getState(cid);
    qs.forEach((_,i)=>{const el=document.getElementById(`${cid}-q${i}`);if(el)el.classList.remove('active');});
    document.getElementById(navId).style.display='flex';
    document.getElementById(cntId).textContent=`${qs.length} / ${qs.length}`;
    state.done=true;
    state.score=0;
    showResults(cid,0,0,qs.length);
    window.scrollTo({top:document.getElementById(resId).offsetTop-120,behavior:'smooth'});
    saveTheoryComplete(0,0,qs.length);
}
window.skipSession=skipSession;

/* ===== TERMINAR SESIÓN ===== */
function finishSession(cid){
    const{state,qs,resId,navId,cntId}=getState(cid);
    let cor=0;qs.forEach((q,i)=>{if(state.answers[i]===q.correct)cor++;});
    qs.forEach((_,i)=>{const el=document.getElementById(`${cid}-q${i}`);if(el)el.classList.remove('active');});
    document.getElementById(navId).style.display='flex';
    document.getElementById(cntId).textContent=`${qs.length} / ${qs.length}`;
    const score=Math.round(cor/qs.length*300);
    state.done=true;state.score=score;
    showResults(cid,score,cor,qs.length);
    window.scrollTo({top:document.getElementById(resId).offsetTop-120,behavior:'smooth'});
    if(s1.done&&s2.done){
        saveTheoryComplete(Math.round((s1.score+s2.score)/2),s1.score+s2.score,20);
    } else {
        saveTheoryComplete(score,cor,qs.length);
    }
}
window.finishSession=finishSession;

function showResults(cid,score,cor,total){
    const{resId,scId,barId,msgId,corId,wrgId,pctId}=getState(cid);
    const pct=Math.round(cor/total*100);
    document.getElementById(corId).textContent=cor;
    document.getElementById(wrgId).textContent=total-cor;
    document.getElementById(pctId).textContent=pct+'%';
    const se=document.getElementById(scId);se.textContent=score;
    se.className='results-score '+(score>=240?'good':score>=180?'mid':'low');
    document.getElementById(msgId).textContent=score>=240?'Excelente rendimiento.':score>=180?'Buen trabajo, repasa los temas donde fallaste.':'Necesitas practicar mas. Vuelve a la teoria.';
    document.getElementById(resId).classList.add('active');
    setTimeout(()=>{const b=document.getElementById(barId);b.style.width=pct+'%';b.style.background=score>=240?'var(--verde)':score>=180?'var(--dorado)':'var(--rojo-suave)';},200);
}

/* ===== FIREBASE ===== */
async function saveTheoryComplete(score,correct,total){
    if(!uid)return;
    try{
        await setDoc(doc(db,'users',uid,'theoryProgress','aumentos-descuentos'),{completed:true,score,correct,total,completedAt:new Date().toISOString(),usedNoEntiendo},{merge:true});
        await checkTheoryMissions(score);
    }catch(e){console.error('Error guardando:',e);}
}

async function checkTheoryMissions(score){
    if(!uid)return;
    const streak=userData?.streak||{current:0,lastDate:''};
    const today=getTodayKey();
    let sc=streak.current||0;if(streak.lastDate!==today)sc++;

    /* Contar misiones YA completadas en Firebase */
    const completedCount=Object.keys(missionData).filter(k=>missionData[k].completed).length;

    /* Calcular puntos que se van a dar en esta ronda */
    let pendingPoints=0;
    const checks=[
        {id:3,cond:true,pts:40},
        {id:14,cond:score>0,pts:40},
        {id:24,cond:!usedNoEntiendo,pts:40}
    ];
    checks.forEach(c=>{if(!missionData[c.id]?.completed&&c.cond)pendingPoints+=c.pts;});

    /* Estrellas proyectadas para verificar misiones que dependen de estrellas */
    const projectedStars=(userData?.stars||0)+pendingPoints;
    if(!missionData[9]?.completed&&projectedStars>=200){checks.push({id:9,cond:true,pts:30});pendingPoints+=30;}
    if(!missionData[17]?.completed&&projectedStars>=500){checks.push({id:17,cond:true,pts:50});pendingPoints+=50;}
    if(!missionData[26]?.completed&&projectedStars>=1000){checks.push({id:26,cond:true,pts:50});pendingPoints+=50;}
    if(!missionData[10]?.completed&&completedCount>=2){checks.push({id:10,cond:true,pts:50});pendingPoints+=50;}
    if(!missionData[45]?.completed&&completedCount>=9){checks.push({id:45,cond:true,pts:140});pendingPoints+=140;}
    if(!missionData[44]?.completed&&sc>=10){checks.push({id:44,cond:true,pts:130});pendingPoints+=130;}

    /* Ejecutar las que cumplen */
    const batch=writeBatch(db);
    const newCompleted=[];

    for(const c of checks){
        if(missionData[c.id]?.completed||!c.cond)continue;
        const info=getMissionInfo(c.id);
        missionData[c.id]={completed:true,completedAt:new Date().toISOString()};
        batch.set(doc(db,'users',uid,'missions','mission_'+c.id),{completed:true,completedAt:new Date().toISOString()});
        userData.stars=(userData.stars||0)+(info.points||0);
        newCompleted.push(info);
    }

    /* Siempre actualizar estrellas y stats/main para que el dashboard lea el conteo */
    const newTotalMissions=Object.keys(missionData).filter(k=>missionData[k].completed).length;
    batch.update(doc(db,'users',uid),{stars:userData.stars});
    batch.set(doc(db,'users',uid,'stats','main'),{
        totalStars:userData.stars,
        totalMissionsCompleted:newTotalMissions,
        currentStreak:sc,
        lastDate:today
    },{merge:true});

    try{
        await batch.commit();
        document.getElementById('top-stars').textContent=userData.stars||0;
        /* Mostrar toast por CADA misión completada */
        newCompleted.forEach((m,i)=>{
            setTimeout(()=>{
                showToast('Misión completada: "'+m.title+'" +'+m.points+' pts');
            },i*800);
        });
    }catch(e){
        console.error('Error guardando misiones:',e);
        showToast('Error de conexion. Las misiones se guardaran al recargar.');
    }
}

function getMissionInfo(id){const m={3:{title:'Lee toda la teoria de una leccion',points:40},9:{title:'Acumula tus primeras 200 estrellas',points:30},10:{title:'Completa 3 misiones seguidas',points:50},14:{title:'Termina una teoria con ejemplo practico',points:40},17:{title:'Obtén 500 estrellas acumuladas',points:50},24:{title:'Lee toda la teoria sin usar pistas',points:40},26:{title:'Suma 1000 estrellas totales',points:50},44:{title:'Estudia 10 dias seguidos',points:130},45:{title:'Completa 10 misiones',points:140}};return m[id]||{title:'Mision '+id,points:0};}
function getTodayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

async function updateStreak(){if(!uid)return;const today=getTodayKey();const s=userData.streak||{current:0,lastDate:'',totalDays:0};if(s.lastDate===today)return;const y=new Date();y.setDate(y.getDate()-1);const yk=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;if(s.lastDate===yk)s.current=(s.current||0)+1;else if(s.lastDate!==today)s.current=1;s.lastDate=today;s.totalDays=(s.totalDays||0)+1;userData.streak=s;try{await updateDoc(doc(db,'users',uid),{streak});}catch(e){}}

onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='index.html';return;}
    uid=user.uid;
    try{
        const us=await getDoc(doc(db,'users',uid));
        userData=us.exists()?us.data():{stars:0,streak:{current:0,lastDate:'',totalDays:0}};
        const ms=await getDocs(collection(db,'users',uid,'missions'));
        ms.forEach(d=>{missionData[parseInt(d.id.replace('mission_',''))]=d.data();});
        document.getElementById('sidebar-username').textContent=userData.name||userData.nombre||userData.displayName||'Estudiante';
        document.getElementById('sidebar-program').textContent=userData.program||userData.programa||'';
        document.getElementById('top-stars').textContent=userData.stars||0;
        const ts=await getDoc(doc(db,'users',uid,'theoryProgress','aumentos-descuentos'));
        if(ts.exists()&&ts.data().completed)usedNoEntiendo=ts.data().usedNoEntiendo||false;
        buildContent();
        await updateStreak();
    }catch(err){
        console.error('Error:',err);
        document.getElementById('page-content').innerHTML=`<div class="loading-spinner"><p style="color:var(--rojo-suave)">Error al cargar. Recarga la pagina.</p></div>`;
    }
});
</script>
