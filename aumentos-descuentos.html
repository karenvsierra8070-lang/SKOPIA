<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aumentos y Descuentos - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --crema:#fdfbf5;--crema-mid:#f5f0e3;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;
            --oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;
            --sombra:rgba(39,43,0,.08);--sombra-md:rgba(39,43,0,.12);
            --sidebar-w:310px;--topbar-h:72px;--radius:14px;--radius-sm:8px;
            --dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;--verde:#3e6b3a;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,.1) 0%,transparent 50%);}
        a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}
        ul{list-style:none;}input{font-family:inherit;}

        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--oliva-oscuro);color:var(--crema);display:flex;flex-direction:column;z-index:900;transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
        .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
        .sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
        .sidebar-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--oliva-claro);}
        .sidebar-username{font-family:'Patrick Hand',cursive;font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-program{font-size:.75rem;color:var(--oliva-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-search{padding:12px 14px;flex-shrink:0;}
        .sidebar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--crema);font-size:.85rem;outline:none;transition:border .2s;}
        .sidebar-search input::placeholder{color:rgba(255,255,255,.35);}
        .sidebar-search input:focus{border-color:var(--oliva-claro);}
        .sidebar-search-wrap{position:relative;}
        .sidebar-search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:.8rem;}
        .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--oliva-medio) transparent;}
        .sidebar-nav::-webkit-scrollbar{width:5px;}.sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}
        .menu-group-label{padding:14px 18px 6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);display:flex;align-items:center;gap:8px;}
        .menu-group-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
        .menu-cat{user-select:none;}
        .menu-cat-btn{width:100%;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--crema);transition:background .2s;text-align:left;}
        .menu-cat-btn:hover{background:rgba(255,255,255,.06);}
        .menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
        .menu-cat-btn .chevron{margin-left:auto;font-size:.6rem;transition:transform .25s;color:var(--oliva-claro);}
        .menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
        .menu-cat-children{max-height:0;overflow:hidden;transition:max-height .35s ease;}
        .menu-cat.open>.menu-cat-children{max-height:2000px;}
        .menu-sub{user-select:none;}
        .menu-sub-btn{width:100%;padding:8px 18px 8px 44px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:rgba(253,251,245,.75);transition:all .2s;text-align:left;}
        .menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,.04);}
        .menu-sub-btn .chevron{margin-left:auto;font-size:.55rem;transition:transform .25s;opacity:.5;}
        .menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
        .menu-sub-children{max-height:0;overflow:hidden;transition:max-height .3s ease;}
        .menu-sub.open>.menu-sub-children{max-height:800px;}
        .menu-link{display:block;padding:7px 18px 7px 62px;font-size:.78rem;color:rgba(253,251,245,.55);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .menu-link:hover{color:var(--crema);background:rgba(255,255,255,.06);padding-left:68px;}
        .menu-link::before{content:'›';margin-right:6px;color:var(--oliva-claro);font-weight:700;}
        .menu-link.active{color:#fff;background:rgba(255,255,255,.1);padding-left:68px;}
        .menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
        .menu-no-result{padding:20px 18px;text-align:center;font-size:.8rem;color:rgba(255,255,255,.3);display:none;}
        .menu-no-result.show{display:block;}
        .menu-note{padding:8px 18px 8px 44px;font-size:.72rem;color:rgba(253,251,245,.35);font-style:italic;}
        .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);}
        .sidebar-footer a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:rgba(253,251,245,.6);transition:all .2s;}
        .sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,.06);}
        .sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:899;opacity:0;visibility:hidden;transition:all .3s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}

        .main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .35s cubic-bezier(.4,0,.2,1);}
        .main-wrap.expanded{margin-left:0;}
        .topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(253,251,245,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,.06);display:flex;align-items:center;padding:0 28px;gap:16px;}
        .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.1rem;color:var(--oliva-oscuro);transition:background .2s;flex-shrink:0;}
        .topbar-toggle:hover{background:rgba(39,43,0,.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{font-family:'Patrick Hand',cursive;font-size:1.5rem;line-height:1.2;}
        .topbar-greeting .breadcrumb{font-size:.82rem;color:var(--oliva-medio);}
        .topbar-greeting .breadcrumb span{color:var(--oliva-oscuro);font-weight:600;}
        .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
        .topbar-clock{font-family:'Orbitron',monospace;font-size:1.15rem;font-weight:700;color:var(--oliva-oscuro);letter-spacing:1px;}

        /* ===== CONTENIDO TEORÍA ===== */
        .theory-wrap{padding:28px 32px 60px;max-width:860px;}
        .theory-card{background:#fff;border-radius:var(--radius);padding:28px 30px;box-shadow:0 2px 12px var(--sombra);margin-bottom:24px;border-left:4px solid var(--oliva-medio);opacity:0;transform:translateY(16px);animation:cardIn .5s forwards;}
        @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
        .theory-card h2{font-family:'Patrick Hand',cursive;font-size:1.4rem;margin-bottom:14px;display:flex;align-items:center;gap:10px;line-height:1.3;}
        .theory-card h2 i{color:var(--oliva-medio);font-size:1rem;flex-shrink:0;}
        .theory-card h3{font-family:'Patrick Hand',cursive;font-size:1.15rem;margin:18px 0 10px;color:var(--oliva-medio);display:flex;align-items:center;gap:8px;}
        .theory-card h3 i{font-size:.85rem;}
        .theory-card p{font-size:.92rem;line-height:1.7;color:#3a3a2a;margin-bottom:10px;}
        .theory-card .formula-box{background:var(--oliva-super);border:1.5px solid var(--oliva-palido);border-radius:var(--radius-sm);padding:16px 20px;margin:14px 0;overflow-x:auto;}
        .formula-box .katex-display{margin:8px 0 !important;}
        .competencia-box{background:linear-gradient(135deg,rgba(90,97,51,.08),rgba(62,107,58,.06));border:1px solid rgba(90,97,51,.15);border-radius:var(--radius-sm);padding:16px 20px;margin:12px 0;}
        .competencia-box ul{list-style:disc;padding-left:20px;}
        .competencia-box li{font-size:.88rem;line-height:1.6;color:#3a3a2a;margin-bottom:4px;}
        .no-entiendo-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;background:rgba(184,92,56,.08);color:var(--rojo-suave);font-size:.82rem;font-weight:500;transition:all .2s;margin-top:12px;border:1px solid rgba(184,92,56,.15);}
        .no-entiendo-btn:hover{background:rgba(184,92,56,.15);transform:translateY(-1px);}
        .no-entiendo-btn i{font-size:.75rem;}
        .hint-used{font-size:.72rem;color:var(--oliva-claro);font-style:italic;margin-top:6px;}

        /* ===== EJERCICIO INTERACTIVO ===== */
        .exercise-box{background:var(--crema-mid);border-radius:var(--radius-sm);padding:20px;margin:16px 0;border:1px solid var(--oliva-palido);}
        .exercise-box p{font-size:.9rem;line-height:1.6;margin-bottom:12px;}
        .exercise-box label{font-size:.85rem;font-weight:600;display:block;margin-bottom:6px;}
        .exercise-input{width:140px;padding:10px 14px;border:2px solid var(--oliva-palido);border-radius:var(--radius-sm);font-size:1rem;font-weight:600;outline:none;transition:border .2s;background:#fff;}
        .exercise-input:focus{border-color:var(--oliva-medio);}
        .exercise-input.correct{border-color:var(--verde);background:rgba(62,107,58,.05);}
        .exercise-input.wrong{border-color:var(--rojo-suave);background:rgba(184,92,56,.05);}
        .exercise-check{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:var(--radius-sm);background:var(--oliva-oscuro);color:var(--crema);font-size:.85rem;font-weight:600;transition:all .2s;margin-top:8px;}
        .exercise-check:hover{background:var(--oliva-medio);}
        .exercise-feedback{margin-top:12px;padding:14px 18px;border-radius:var(--radius-sm);font-size:.88rem;line-height:1.5;display:none;}
        .exercise-feedback.success{display:block;background:rgba(62,107,58,.08);color:var(--verde);border:1px solid rgba(62,107,58,.15);}
        .exercise-feedback.fail{display:block;background:rgba(184,92,56,.08);color:var(--rojo-suave);border:1px solid rgba(184,92,56,.15);}
        .exercise-feedback .step{display:flex;gap:8px;margin:6px 0;font-size:.85rem;}
        .exercise-feedback .step i{margin-top:3px;flex-shrink:0;font-size:.7rem;color:var(--oliva-medio);}

        /* ===== SESIÓN DE PRÁCTICA ===== */
        .session-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
        .session-progress{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;}
        .session-bar{flex:1;height:8px;border-radius:4px;background:var(--oliva-super);overflow:hidden;}
        .session-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--oliva-medio),var(--dorado));transition:width .4s ease;}
        .session-count{font-family:'Orbitron',monospace;font-size:.78rem;color:var(--oliva-medio);font-weight:700;white-space:nowrap;}
        .session-score{font-family:'Orbitron',monospace;font-size:.9rem;color:var(--oliva-oscuro);font-weight:700;display:flex;align-items:center;gap:6px;}
        .session-score i{color:var(--dorado);}
        .q-card{background:#fff;border-radius:var(--radius);padding:24px 28px;box-shadow:0 2px 12px var(--sombra);margin-bottom:16px;border:1px solid rgba(39,43,0,.04);}
        .q-card .q-text{font-size:.95rem;line-height:1.6;margin-bottom:16px;font-weight:500;}
        .q-options{display:flex;flex-direction:column;gap:8px;}
        .q-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);border:2px solid var(--oliva-super);cursor:pointer;transition:all .2s;font-size:.9rem;}
        .q-opt:hover{border-color:var(--oliva-claro);background:var(--oliva-super);}
        .q-opt.selected{border-color:var(--oliva-medio);background:rgba(90,97,51,.06);}
        .q-opt.correct-answer{border-color:var(--verde);background:rgba(62,107,58,.08);color:var(--verde);font-weight:600;}
        .q-opt.wrong-answer{border-color:var(--rojo-suave);background:rgba(184,92,56,.06);color:var(--rojo-suave);}
        .q-opt-letter{width:28px;height:28px;border-radius:50%;background:var(--oliva-super);display:grid;place-items:center;font-weight:700;font-size:.78rem;color:var(--oliva-medio);flex-shrink:0;transition:all .2s;}
        .q-opt.selected .q-opt-letter{background:var(--oliva-medio);color:#fff;}
        .q-opt.correct-answer .q-opt-letter{background:var(--verde);color:#fff;}
        .q-opt.wrong-answer .q-opt-letter{background:var(--rojo-suave);color:#fff;}
        .q-next{display:none;margin-top:16px;padding:12px 28px;border-radius:var(--radius-sm);background:var(--oliva-oscuro);color:var(--crema);font-size:.88rem;font-weight:600;transition:all .2s;}
        .q-next:hover{background:var(--oliva-medio);}
        .q-next.show{display:inline-flex;align-items:center;gap:8px;}

        /* ===== RESULTADOS SESIÓN ===== */
        .results-card{background:#fff;border-radius:var(--radius);padding:32px;text-align:center;box-shadow:0 4px 20px var(--sombra-md);border-top:4px solid var(--dorado);}
        .results-card .r-score{font-family:'Orbitron',monospace;font-size:3rem;font-weight:700;color:var(--oliva-oscuro);line-height:1;margin:8px 0;}
        .results-card .r-score small{font-size:1rem;font-weight:400;color:var(--oliva-claro);}
        .results-card .r-label{font-size:.95rem;color:var(--oliva-medio);margin-bottom:20px;}
        .results-card .r-msg{font-family:'Patrick Hand',cursive;font-size:1.3rem;color:var(--oliva-oscuro);margin-bottom:24px;}

        /* ===== PANDA MINI ===== */
        .panda-mini{width:60px;height:68px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));}
        .panda-msg{display:flex;align-items:flex-start;gap:14px;margin:18px 0;padding:16px 18px;background:var(--crema);border-radius:var(--radius-sm);border:1px solid var(--oliva-palido);}
        .panda-msg p{font-size:.9rem;line-height:1.6;margin:0;}

        /* ===== MODAL "NO ENTIENDO" ===== */
        .ne-overlay{position:fixed;inset:0;background:rgba(39,43,0,.5);backdrop-filter:blur(4px);z-index:5000;display:none;place-items:center;}
        .ne-overlay.active{display:grid;}
        .ne-modal{background:#fff;border-radius:var(--radius);padding:0;max-width:560px;width:92%;box-shadow:0 20px 60px rgba(39,43,0,.25);overflow:hidden;animation:neIn .35s ease;}
        @keyframes neIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .ne-modal-top{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));padding:24px 28px;color:var(--crema);}
        .ne-modal-top h3{font-family:'Patrick Hand',cursive;font-size:1.35rem;margin-bottom:4px;}
        .ne-modal-top p{font-size:.82rem;opacity:.7;}
        .ne-modal-body{padding:24px 28px;max-height:60vh;overflow-y:auto;}
        .ne-modal-body p{font-size:.9rem;line-height:1.7;margin-bottom:10px;}
        .ne-modal-body .formula-box{margin:12px 0;}
        .ne-modal-body .example-box{background:var(--crema);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;border:1px solid var(--oliva-palido);}
        .ne-modal-body .example-box strong{color:var(--oliva-medio);}
        .ne-modal-footer{padding:16px 28px;border-top:1px solid rgba(39,43,0,.06);display:flex;gap:10px;justify-content:flex-end;}
        .ne-btn{padding:10px 24px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;transition:all .2s;}
        .ne-btn.primary{background:var(--oliva-oscuro);color:var(--crema);}
        .ne-btn.primary:hover{background:var(--oliva-medio);}
        .ne-btn.secondary{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .ne-btn.secondary:hover{background:var(--oliva-palido);}

        /* ===== MODAL FINAL ===== */
        .final-overlay{position:fixed;inset:0;background:rgba(39,43,0,.5);backdrop-filter:blur(4px);z-index:5000;display:none;place-items:center;}
        .final-overlay.active{display:grid;}
        .final-modal{background:#fff;border-radius:var(--radius);padding:0;max-width:520px;width:92%;box-shadow:0 20px 60px rgba(39,43,0,.25);overflow:hidden;animation:neIn .35s ease;}
        .final-modal-top{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));padding:28px 28px 24px;color:var(--crema);text-align:center;}
        .final-modal-top .panda-mini{margin:0 auto 12px;display:block;}
        .final-modal-top h3{font-family:'Patrick Hand',cursive;font-size:1.5rem;margin-bottom:6px;}
        .final-modal-top p{font-size:.9rem;opacity:.8;}
        .final-modal-body{padding:24px 28px;}
        .final-menu-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;transition:all .2s;border:1px solid transparent;}
        .final-menu-item:hover{background:var(--crema);border-color:var(--oliva-palido);}
        .final-menu-item i{width:20px;text-align:center;color:var(--oliva-medio);font-size:.85rem;}
        .final-menu-item span{font-size:.88rem;flex:1;}
        .final-menu-item .fa-chevron-right{color:var(--oliva-claro);font-size:.6rem;}
        .final-modal-footer{padding:16px 28px;border-top:1px solid rgba(39,43,0,.06);display:flex;gap:10px;justify-content:flex-end;}
        .final-btn{padding:12px 28px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
        .final-btn.go{background:var(--dorado);color:var(--oliva-oscuro);}
        .final-btn.go:hover{background:var(--dorado-claro);}
        .final-btn.stay{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .final-btn.stay:hover{background:var(--oliva-palido);}

        /* ===== TOAST ===== */
        .toast{position:fixed;bottom:24px;right:24px;background:#fff;padding:14px 20px;border-radius:var(--radius-sm);border-left:4px solid var(--dorado);box-shadow:0 8px 24px var(--sombra-md);z-index:6000;font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .35s ease;max-width:360px;display:flex;align-items:center;gap:10px;}
        .toast.show{transform:translateY(0);opacity:1;}
        .toast i{color:var(--dorado);font-size:1rem;}

        /* ===== NAV SECCIONES (ocultar/mostrar) ===== */
        .section-block{display:none;}.section-block.active{display:block;}

        @media(max-width:768px){
            .sidebar{transform:translateX(calc(-1 * var(--sidebar-w)));}.sidebar.open{transform:translateX(0);}
            .main-wrap{margin-left:0 !important;}.topbar{padding:0 16px;}
            .theory-wrap{padding:20px 16px 40px;}.theory-card{padding:20px 18px;}
            .ne-modal-body,.ne-modal-footer{padding-left:18px;padding-right:18px;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s !important;transition-duration:0s !important;}}
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="dashboard.html"><img src="logo.jpeg" alt="Skopia" class="sidebar-logo"></a>
        <span class="sidebar-username" id="sidebar-username">Cargando...</span>
        <span class="sidebar-program" id="sidebar-program"></span>
    </div>
    <div class="sidebar-search"><div class="sidebar-search-wrap"><i class="fas fa-search"></i><input type="text" id="sidebar-search" placeholder="Buscar contenido..." aria-label="Buscar contenido"></div></div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Menú de contenido"></nav>
    <div class="sidebar-footer">
        <a href="cuenta.html"><i class="fas fa-user-circle"></i> Mi Cuenta</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main-wrap" id="main-wrap">
    <header class="topbar">

function buildContent(){
    const wrap=document.getElementById('theory-content');
    wrap.innerHTML=`
    <!-- SECCIÓN 1: Competencias -->
    <div class="section-block active" id="sec-competencias">
        <div class="theory-card">
            <h2><i class="fas fa-bullseye"></i> Competencias ICFES Saber Pro</h2>
            <p>Este tema evalúa tu capacidad de <strong>interpretar y resolver situaciones que involucran variaciones porcentuales</strong> en contextos económicos, financieros y cotidianos. Las competencias específicas son:</p>
            <div class="competencia-box">
                <ul>
                    <li><strong>Interpretación de porcentajes:</strong> Comprender qué representa un porcentaje como razón y como fracción de una totalidad.</li>
                    <li><strong>Aplicación de factores multiplicativos:</strong> Usar correctamente los factores $(1+r)$ y $(1-r)$ para calcular valores finales.</li>
                    <li><strong>Proceso inverso:</strong> Dado un valor final y un porcentaje de variación, hallar el valor original.</li>
                    <li><strong>Encadenamiento de variaciones:</strong> Aplicar sucesivamente aumentos y/o descuentos sin sumar los porcentajes directamente.</li>
                    <li><strong>Comparación de estrategias comerciales:</strong> Evaluar numéricamente cuál oferta resulta más conveniente.</li>
                    <li><strong>Extracción de datos de tablas y gráficas:</strong> Identificar el valor base (100%) antes de aplicar cualquier operación.</li>
                </ul>
            </div>
            <div class="panda-msg">${PANDA_MINI}<p>Estas son las habilidades que el ICFES quiere ver en ti. No te asustes, paso a paso las dominamos todas.</p></div>
            <button class="exercise-check" onclick="goTo('sec-paso1')"><i class="fas fa-arrow-right"></i> Empezar con las fórmulas</button>
        </div>
    </div>

    <!-- SECCIÓN 2: Paso 1 - Fórmulas -->
    <div class="section-block" id="sec-paso1">
        <div class="theory-card" style="animation-delay:0s">
            <h2><i class="fas fa-calculator"></i> Paso 1: Fórmulas y operaciones clave</h2>
            <p>El ICFES siempre trabaja con <strong>factores multiplicativos</strong>. En lugar de calcular el porcentaje y sumarlo/restarlo, se multiplica directamente por un factor. Es más rápido y evita errores.</p>

            <h3><i class="fas fa-arrow-up"></i> Factor multiplicativo de aumento</h3>
            <p>Para aumentar un valor en un porcentaje $r$ (en decimal), se multiplica por $(1+r)$:</p>
            <div class="formula-box">$$\\text{Valor Final} = \\text{Valor Inicial} \\times (1 + r)$$</div>
            <p><strong>Ejemplo:</strong> Un producto de $\\$80.000$ aumenta el 15%. El factor es $1 + 0,15 = 1,15$.</p>
            <p>$$80.000 \\times 1,15 = \\$92.000$$</p>

            <h3><i class="fas fa-arrow-down"></i> Factor multiplicativo de descuento</h3>
            <p>Para descontar un porcentaje $r$, se multiplica por $(1-r)$:</p>
            <div class="formula-box">$$\\text{Valor Final} = \\text{Valor Inicial} \\times (1 - r)$$</div>
            <p><strong>Ejemplo:</strong> Un artículo de $\\$50.000$ tiene un descuento del 30%. El factor es $1 - 0,30 = 0,70$.</p>
            <p>$$50.000 \\times 0,70 = \\$35.000$$</p>

            <h3><i class="fas fa-undo"></i> Cálculo del valor inicial (Proceso inverso)</h3>
            <p>Cuando conoces el final y el porcentaje, divides entre el factor:</p>
            <div class="formula-box">$$\\text{Valor Inicial} = \\frac{\\text{Valor Final}}{1 \\pm r}$$</div>
            <p><strong>Ejemplo:</strong> El precio con IVA (19%) es $\\$119.000$. El factor es $1,19$.</p>
            <p>$$\\frac{119.000}{1,19} = \\$100.000$$</p>

            <h3><i class="fas fa-percentage"></i> Variación porcentual</h3>
            <div class="formula-box">$$\\text{Variación \\%} = \\frac{\\text{Valor Final} - \\text{Valor Inicial}}{\\text{Valor Inicial}} \\times 100$$</div>
            <p>Si el resultado es positivo es un aumento; si es negativo, un descuento.</p>

            <button class="no-entiendo-btn" onclick="openNoEntiendo('Otra forma de ver los factores multiplicativos','Piensa en partes de 100','<p>Imagina que el precio original son <strong>100 partes</strong>.</p><p>Si hay un <strong>aumento del 20%</strong>, agregas 20 partes más. En total tienes <strong>120 partes</strong>, es decir, $1,20$.</p><p>Si hay un <strong>descuento del 30%</strong>, quitas 30 partes. Quedan <strong>70 partes</strong>, es decir, $0,70$.</p><div class=\\'example-box\\'><strong>Ejemplo ICFES:</strong> Una camisa cuesta $\\$45.000$ y le hacen un descuento del 12%.<br>Factor: $1 - 0,12 = 0,88$<br>$45.000 \\times 0,88 = \\$39.600$</div>')"><i class="fas fa-question-circle"></i> No entiendo</button>

/* ===== EJERCICIO INTERACTIVO ===== */
function setupExercise(id,answer,stepsHtml){
    const input=document.getElementById(id+'-input');
    const btn=document.getElementById(id+'-btn');
    const fb=document.getElementById(id+'-fb');
    btn.addEventListener('click',()=>{
        const val=parseInt(input.value.replace(/\./g,''));
        if(isNaN(val)){fb.className='exercise-feedback fail';fb.innerHTML='<i class="fas fa-times-circle"></i> Ingresa un valor numérico.';return;}
        if(val===answer){
            input.classList.add('correct');input.classList.remove('wrong');
            fb.className='exercise-feedback success';
            fb.innerHTML=`<i class="fas fa-check-circle"></i> <strong>Así es!</strong> ¿Ahora lo entiendes? ${stepsHtml}`;
            setTimeout(()=>{if(typeof renderMathInElement==='function')renderMathInElement(fb,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});},50);
        }else{
            input.classList.add('wrong');input.classList.remove('correct');
            fb.className='exercise-feedback fail';
            fb.innerHTML=`<i class="fas fa-heart"></i> Oww, no te preocupes, te explico este ejercicio paso a paso:<br>${stepsHtml}`;
            setTimeout(()=>{if(typeof renderMathInElement==='function')renderMathInElement(fb,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});},50);
        }
    });
}

/* ===== GENERAR PREGUNTAS SESIÓN 1 (agilidad) ===== */
function generateSession1Questions(){
    const pool=[];
    const vals=[10000,25000,40000,60000,80000,120000,150000,200000,350000,500000,750000,1000000];
    const pcts=[0.05,0.08,0.10,0.12,0.15,0.18,0.20,0.25,0.30,0.35,0.40];
    for(let i=0;i<10;i++){
        const v=vals[Math.floor(Math.random()*vals.length)];
        const p=pcts[Math.floor(Math.random()*pcts.length)];
        const isIncrease=Math.random()>.5;
        const factor=isIncrease?(1+p):(1-p);
        const correct=Math.round(v*factor);
        const pctStr=(p*100).toFixed(0).replace('.0','');
        const wrong1=Math.round(v*(factor+0.05+Math.random()*0.05));
        const wrong2=Math.round(v*(factor-0.05-Math.random()*0.05));
        const wrong3=Math.round(v+(isIncrease?v*p:-v*p));
        const opts=shuffle([correct,wrong1,wrong2,wrong3].map((v,j)=>({val:v,correct:j===0})));
        pool.push({text:`Un valor de $\\$${v.toLocaleString('es-CO')}$ ${isIncrease?'aumenta':'disminuye'} el ${pctStr}%. ¿Cuál es el resultado?`,options:opts.map(o=>`$\\$${o.val.toLocaleString('es-CO')}$`),correctIdx:opts.findIndex(o=>o.correct)});
    }
    return pool;
}

/* ===== GENERAR PREGUNTAS SESIÓN 2 (compuestas) ===== */
function generateSession2Questions(){
    const pool=[];
    const vals=[50000,100000,200000,300000,500000,800000,1200000,2000000];
    /* 4 de encadenamiento */
    for(let i=0;i<4;i++){
        const v=vals[Math.floor(Math.random()*vals.length)];
        const p1=[0.10,0.15,0.20,0.25][Math.floor(Math.random()*4)];
        const p2=[0.05,0.10,0.15,0.20][Math.floor(Math.random()*4)];
        const isSecondIncrease=Math.random()>.5;
        const f1=1+p1,f2=isSecondIncrease?(1+p2):(1-p2);
        const correct=Math.round(v*f1*f2);
        const p1s=(p1*100).toFixed(0),p2s=(p2*100).toFixed(0);
        const action2=isSecondIncrease?'aumenta':'disminuye';
        const wrong1=Math.round(v*(1+p1+p2*(isSecondIncrease?1:-1)));
        const wrong2=Math.round(v*f1*(isSecondIncrease?(1+p2*1.1):(1-p2*0.9)));
        const wrong3=Math.round(v*f2*f1*1.01);
        const opts=shuffle([correct,wrong1,wrong2,wrong3].map((v,j)=>({val:v,correct:j===0})));
        pool.push({text:`Un valor de $\\$${v.toLocaleString('es-CO')}$ aumenta el ${p1s}% y luego ${action2} el ${p2s}%. ¿Cuál es el valor final?`,options:opts.map(o=>`$\\$${o.val.toLocaleString('es-CO')}$`),correctIdx:opts.findIndex(o=>o.correct)});
    }
    /* 3 de proceso inverso */
    for(let i=0;i<3;i++){
        const base=vals[Math.floor(Math.random()*vals.length)];
        const p=[0.19,0.16,0.08,0.12][Math.floor(Math.random()*4)];
        const final_=Math.round(base*(1+p));
        const wrong1=base;
        const wrong2=Math.round(final_*(1-p));
        const wrong3=Math.round(final_-final_*p);
        const opts=shuffle([base,wrong1,wrong2,wrong3].map((v,j)=>({val:v,correct:j===0})));
        pool.push({text:`Un precio con un aumento del ${(p*100).toFixed(0)}% incluido es $\\$${final_.toLocaleString('es-CO')}$. ¿Cuál era el precio original?`,options:opts.map(o=>`$\\$${o.val.toLocaleString('es-CO')}$`),correctIdx:opts.findIndex(o=>o.correct)});
    }
    /* 3 de comparación */
    for(let i=0;i<3;i++){
        const v=vals[Math.floor(Math.random()*5)];
        const pA=Math.floor(10+Math.random()*25);
        const pB=Math.floor(10+Math.random()*25);
        const rA=v*(1-pA/100),rB=v*(1-pB/100);
        const better=pA>pB?'A':'B';
        const correct=better==='A'?rA:rB;
        const wrong=better==='A'?rB:rA;
        const wrong2=Math.round((rA+rB)/2);
        const wrong3=Math.round(v*0.85);
        const opts=shuffle([correct,wrong,wrong2,wrong3].map((v,j)=>({val:v,correct:j===0})));
        pool.push({text:`Un producto de $\\$${v.toLocaleString('es-CO')}$ tiene dos ofertas: A) ${pA}% de descuento, B) ${pB}% de descuento. ¿Cuál es el precio en la mejor oferta?`,options:opts.map(o=>`$\\$${o.val.toLocaleString('es-CO')}$`),correctIdx:opts.findIndex(o=>o.correct)});
    }
    return pool;
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

        container.innerHTML=`
        <div class="session-header">
            <div class="session-progress"><span class="session-count">${qIdx+1}/${questions.length}</span><div class="session-bar"><div class="session-bar-fill" style="width:${(qIdx/questions.length)*100}%"></div></div></div>
            <div class="session-score"><i class="fas fa-star"></i> <span id="${sessionId}-score">${score}</span></div>
        </div>
        <div class="q-card">
            <p class="q-text">${q.text}</p>
            <div class="q-options">${q.options.map((opt,i)=>`<div class="q-opt" data-idx="${i}"><span class="q-opt-letter">${letters[i]}</span><span>${opt}</span></div>`).join('')}</div>
            <button class="q-next" id="${sessionId}-next"><i class="fas fa-arrow-right"></i> Siguiente</button>
        </div>`;
        setTimeout(()=>{if(typeof renderMathInElement==='function')renderMathInElement(container,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});},50);

        container.querySelectorAll('.q-opt').forEach(opt=>{
            opt.addEventListener('click',()=>{
                if(answered[qIdx])return;
                answered[qIdx]=true;
                const idx=parseInt(opt.dataset.idx);
                container.querySelectorAll('.q-opt').forEach((o,j)=>{
                    if(j===q.correctIdx)o.classList.add('correct-answer');
                    else if(j===idx&&idx!==q.correctIdx)o.classList.add('wrong-answer');
                    o.style.pointerEvents='none';
                });
                if(idx===q.correctIdx){score+=30;document.getElementById(sessionId+'-score').textContent=score;}
                document.getElementById(sessionId+'-next').classList.add('show');
            });
        });

        document.getElementById(sessionId+'-next').addEventListener('click',()=>{qIdx++;renderQ();});
    }

    function showResults(){
        const nextSec=sessionId==='sesion1'?'sec-sesion2':'sec-sesion3';
        container.innerHTML=`
        <div class="results-card">
            <div class="r-label">Tu puntaje en esta sesión</div>
            <div class="r-score">${score} <small>/ 300</small></div>
            <div class="r-msg">${score>=240?'Excelente, dominas este tema':score>=180?'Buen trabajo, pero puedes mejorar':score>=120:'Necesitas más práctica, repasa la teoría':'Sigue estudiando, puedes hacerlo mejor'}</div>
            <button class="exercise-check" onclick="goTo('${nextSec}')"><i class="fas fa-arrow-right"></i> Continuar</button>
        </div>`;
    }
    renderQ();
}

/* ===== MODAL FINAL ===== */

    <div class="final-menu-item" onclick="closeFinal();goTo('sec-competencias')"><i class="fas fa-bullseye"></i><span>Competencias ICFES</span><i class="fas fa-chevron-right"></i></div>
    <div class="final-menu-item" onclick="closeFinal();goTo('sec-paso1')"><i class="fas fa-calculator"></i><span>Fórmulas y operaciones clave</span><i class="fas fa-chevron-right"></i></div>
    <div class="final-menu-item" onclick="closeFinal();goTo('sec-paso2')"><i class="fas fa-list-check"></i><span>Situaciones tipo ICFES</span><i class="fas fa-chevron-right"></i></div>
    <div class="final-menu-item" onclick="closeFinal();goTo('sec-sesion1')"><i class="fas fa-bolt"></i><span>Sesión 1: Agilidad con factores</span><i class="fas fa-chevron-right"></i></div>
    <div class="final-menu-item" onclick="closeFinal();goTo('sec-sesion2')"><i class="fas fa-layer-group"></i><span>Sesión 2: Variaciones compuestas</span><i class="fas fa-chevron-right"></i></div>
    <div class="final-menu-item" onclick="closeFinal();goTo('sec-sesion3')"><i class="fas fa-chart-bar"></i><span>Sesión 3: Gráficas y distractores</span><i class="fas fa-chevron-right"></i></div>`;
    document.getElementById('final-overlay').classList.add('active');

function closeFinal(){document.getElementById('final-overlay').classList.remove('active');}
window.showFinalModal=showFinalModal;window.closeFinal=closeFinal;

/* ===== RASTREAR HINTS ===== */
const observer=new MutationObserver((mutations)=>{
    mutations.forEach(m=>{
        if(m.target.classList.contains('hint-used')&&m.target.style.display!=='none')usedHints=true;
    });
});
document.querySelectorAll('.hint-used').forEach(el=>observer.observe(el,{attributes:true,attributeFilter:['style']}));

/* También marcar al abrir modal no entiendo */
const origOpen=openNoEntiendo;
/* Ya se marca dentro de openNoEntiendo */

/* ===== MISIONES ===== */
const RELEVANT_MISSIONS=[
    {id:3,title:'Lee toda la teoría de una lección',pts:40},
    {id:9,title:'Acumula tus primeras 200 estrellas',pts:30},
    {id:10,title:'Completa 3 misiones seguidas',pts:50},
    {id:14,title:'Termina una teoría con ejemplo práctico',pts:40},
    {id:17,title:'Obtén 500 estrellas acumuladas',pts:50},
    {id:24,title:'Lee toda la teoría sin usar pistas',pts:40},
    {id:26,title:'Suma 1000 estrellas totales',pts:50},
    {id:44,title:'Estudia 10 días seguidos',pts:130},
    {id:45,title:'Completa 10 misiones',pts:140}
];

async function completeTheoryMissions(){
    if(!uid)return;
    const stars=userData?.stars||0;
    const completedMissions=Object.keys(missionData).filter(k=>missionData[k].completed).length;
    const streak=userData?.streak||{current:0};

    const checks=[
        {id:3,cond:true}, // Leer toda la teoría
        {id:9,cond:stars>=200},
        {id:10,cond:completedMissions>=2}, // Esta + 2 anteriores
        {id:14,cond:true}, // Terminar con ejemplo práctico
        {id:17,cond:stars>=500},
        {id:24,cond:!usedHints},
        {id:26,cond:stars>=1000},
        {id:44,cond:(streak.current||0)>=10},
        {id:45,cond:completedMissions>=9}
    ];

    const batch=writeBatch(db);
    let newCount=0;
    for(const c of checks){
        if(missionData[c.id]?.completed)continue;
        if(!c.cond)continue;
        const info=RELEVANT_MISSIONS.find(m=>m.id===c.id);
        if(!info)continue;
        missionData[c.id]={completed:true,completedAt:new Date().toISOString()};
        batch.set(doc(db,'users',uid,'missions','mission_'+c.id),{completed:true,completedAt:new Date().toISOString()});
        userData.stars=(userData.stars||0)+info.pts;
        newCount++;
        showToast(`Misión completada: ${info.title} (+${info.pts} estrellas)`);
    }
    if(newCount>0){
        batch.update(doc(db,'users',uid),{stars:userData.stars,totalMissionsCompleted:Object.keys(missionData).filter(k=>missionData[k].completed).length});
        try{await batch.commit();}catch(e){console.error('Error misiones:',e);}
        /* Re-verificar estrellas */
        const s=userData.stars||0;
        const cm=Object.keys(missionData).filter(k=>missionData[k].completed).length;
        const rechecks=[{id:9,cond:s>=200},{id:17,cond:s>=500},{id:26,cond:s>=1000},{id:45,cond:cm>=10}];
        for(const rc of rechecks){
            if(missionData[rc.id]?.completed)continue;
            if(!rc.cond)continue;
            const info=RELEVANT_MISSIONS.find(m=>m.id===rc.id);
            if(!info)continue;
            missionData[rc.id]={completed:true,completedAt:new Date().toISOString()};
            const b2=writeBatch(db);
            b2.set(doc(db,'users',uid,'missions','mission_'+rc.id),{completed:true,completedAt:new Date().toISOString()});
            userData.stars+=info.pts;
            b2.update(doc(db,'users',uid),{stars:userData.stars});
            try{await b2.commit();}catch(e){break;}
            showToast(`Misión completada: ${info.title} (+${info.pts} estrellas)`);
        }
    }

    /* Marcar teoría como leída en Firebase */
    try{await updateDoc(doc(db,'users',uid),{'theoryRead.aumentos-descuentos':true,stars:userData.stars});}catch(e){}
}

/* ===== CARGA INICIAL ===== */
async function loadUserData(){
    if(!uid)return;
    const userSnap=await getDoc(doc(db,'users',uid));
    userData=userSnap.exists()?userSnap.data():{stars:0,streak:{current:0,lastDate:'',totalDays:0}};
    missionData={};
    const ms=await getDocs(collection(db,'users',uid,'missions'));
    ms.forEach(d=>{missionData[parseInt(d.id.replace('mission_',''))]=d.data();});
}

/* ===== INICIO ===== */
onAuthStateChanged(auth,async(user)=>{
    if(!user){window.location.href='index.html';return;}
    uid=user.uid;
    try{
        await loadUserData();
        document.getElementById('sidebar-username').textContent=userData.name||userData.nombre||userData.displayName||'Estudiante';
        document.getElementById('sidebar-program').textContent=userData.program||userData.programa||'';
        buildContent();
        await completeTheoryMissions();
    }catch(err){
        console.error('Error:',err);
        document.getElementById('theory-content').innerHTML=`<div style="text-align:center;padding:60px 20px;"><p style="color:var(--rojo-suave);">Error al cargar. Recarga la página.</p></div>`;
    }
});
</script>
