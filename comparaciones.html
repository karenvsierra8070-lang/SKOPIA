<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaciones y Razones - Viendo - Skopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root{--crema:#fdfbf5;--oliva-oscuro:#272b00;--oliva-medio:#5a6133;--oliva-claro:#bec092;--oliva-palido:#d4d6b0;--oliva-super:#e8e9d4;--sombra:rgba(39,43,0,.08);--sombra-md:rgba(39,43,0,.12);--sidebar-w:310px;--topbar-h:72px;--radius:14px;--radius-sm:8px;--dorado:#c9a227;--dorado-claro:#f5e6a3;--rojo-suave:#b85c38;--verde:#3e6b3a;--azul-razon:#2e6b9e;--rojo-razon:#c0392b;--naranja-tasa:#e67e22;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Roboto',sans-serif;background:var(--crema);color:var(--oliva-oscuro);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 10% 20%,rgba(190,192,146,.18) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(90,97,51,.1) 0%,transparent 50%);}
        a{text-decoration:none;color:inherit;}button{cursor:pointer;border:none;background:none;font-family:inherit;}ul{list-style:none;}input{font-family:inherit;}
        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--oliva-oscuro);color:var(--crema);display:flex;flex-direction:column;z-index:900;transition:transform .35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
        .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));}
        .sidebar-header{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
        .sidebar-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--oliva-claro);}
        .sidebar-username{font-family:'Patrick Hand',cursive;font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-program{font-size:.75rem;color:var(--oliva-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sidebar-search{padding:12px 14px;flex-shrink:0;}
        .sidebar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--crema);font-size:.85rem;outline:none;transition:border .2s;}
        .sidebar-search input::placeholder{color:rgba(255,255,255,.35);}
        .sidebar-search input:focus{border-color:var(--oliva-claro);}
        .sidebar-search-wrap{position:relative;}
        .sidebar-search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:.8rem;}
        .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--oliva-medio) transparent;}
        .sidebar-nav::-webkit-scrollbar{width:5px;}.sidebar-nav::-webkit-scrollbar-thumb{background:var(--oliva-medio);border-radius:3px;}
        .menu-group-label{padding:14px 18px 6px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--oliva-claro);display:flex;align-items:center;gap:8px;}
        .menu-group-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
        .menu-cat{user-select:none;}
        .menu-cat-btn{width:100%;padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--crema);transition:background .2s;text-align:left;}
        .menu-cat-btn:hover{background:rgba(255,255,255,.06);}
        .menu-cat-btn i.cat-icon{width:18px;text-align:center;font-size:.82rem;color:var(--oliva-claro);}
        .menu-cat-btn .chevron{margin-left:auto;font-size:.6rem;transition:transform .25s;color:var(--oliva-claro);}
        .menu-cat.open>.menu-cat-btn .chevron{transform:rotate(90deg);}
        .menu-cat-children{max-height:0;overflow:hidden;transition:max-height .35s ease;}
        .menu-cat.open>.menu-cat-children{max-height:2000px;}
        .menu-sub{user-select:none;}
        .menu-sub-btn{width:100%;padding:8px 18px 8px 44px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:rgba(253,251,245,.75);transition:all .2s;text-align:left;}
        .menu-sub-btn:hover{color:var(--crema);background:rgba(255,255,255,.04);}
        .menu-sub-btn .chevron{margin-left:auto;font-size:.55rem;transition:transform .25s;opacity:.5;}
        .menu-sub.open>.menu-sub-btn .chevron{transform:rotate(90deg);opacity:1;}
        .menu-sub-children{max-height:0;overflow:hidden;transition:max-height .3s ease;}
        .menu-sub.open>.menu-sub-children{max-height:800px;}
        .menu-link{display:block;padding:7px 18px 7px 62px;font-size:.78rem;color:rgba(253,251,245,.55);transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .menu-link:hover{color:var(--crema);background:rgba(255,255,255,.06);padding-left:68px;}
        .menu-link::before{content:'›';margin-right:6px;color:var(--oliva-claro);font-weight:700;}
        .menu-link.active{color:#fff;background:rgba(255,255,255,.1);padding-left:68px;}
        .menu-link.hidden,.menu-cat.hidden,.menu-sub.hidden{display:none;}
        .menu-no-result{padding:20px 18px;text-align:center;font-size:.8rem;color:rgba(255,255,255,.3);display:none;}
        .menu-no-result.show{display:block;}
        .menu-note{padding:8px 18px 8px 44px;font-size:.72rem;color:rgba(253,251,245,.35);font-style:italic;}
        .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);}
        .sidebar-footer a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.82rem;color:rgba(253,251,245,.6);transition:all .2s;}
        .sidebar-footer a:hover{color:var(--crema);background:rgba(255,255,255,.06);}
        .sidebar-footer a i{width:18px;text-align:center;font-size:.85rem;}
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:899;opacity:0;visibility:hidden;transition:all .3s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}
        .main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .35s cubic-bezier(.4,0,.2,1);}
        .main-wrap.expanded{margin-left:0;}
        .topbar{position:sticky;top:0;z-index:100;height:var(--topbar-h);background:rgba(253,251,245,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(39,43,0,.06);display:flex;align-items:center;padding:0 28px;gap:16px;}
        .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.1rem;color:var(--oliva-oscuro);transition:background .2s;flex-shrink:0;}
        .topbar-toggle:hover{background:rgba(39,43,0,.06);}
        .topbar-greeting{flex:1;min-width:0;}
        .topbar-greeting h1{font-family:'Patrick Hand',cursive;font-size:1.5rem;line-height:1.2;}
        .topbar-greeting .sub{font-size:.82rem;color:var(--oliva-medio);}
        .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
        .topbar-clock{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;color:var(--oliva-oscuro);letter-spacing:1px;}
        .topbar-stars{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:rgba(201,162,39,.1);font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;color:var(--dorado);}
        .topbar-stars i{font-size:.75rem;}
        .theory{padding:28px 32px 40px;}
        .theory-section{display:none;animation:fadeUp .4s ease;}
        .theory-section.active{display:block;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        @keyframes medalPop{from{opacity:0;transform:scale(.65) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .comp-box{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));color:var(--crema);border-radius:var(--radius);padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden;}
        .comp-box::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);}
        .comp-box h2{font-family:'Patrick Hand',cursive;font-size:1.4rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .comp-box h2 i{color:var(--dorado-claro);}
        .comp-box p{font-size:.88rem;line-height:1.6;opacity:.85;}
        .panda-msg{background:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;box-shadow:0 2px 12px var(--sombra);border-left:4px solid var(--dorado);display:flex;gap:16px;align-items:flex-start;}
        .panda-msg img{width:56px;height:64px;flex-shrink:0;}
        .panda-msg p{font-size:.9rem;line-height:1.55;color:var(--oliva-oscuro);}
        .panda-msg p strong{color:var(--oliva-medio);}
        .nav-buttons{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
        .nav-btn{padding:14px 28px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:8px;}
        .nav-btn.primary{background:var(--oliva-oscuro);color:var(--crema);}
        .nav-btn.primary:hover{background:var(--oliva-medio);transform:translateY(-2px);box-shadow:0 4px 16px rgba(39,43,0,.2);}
        .nav-btn.secondary{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .nav-btn.secondary:hover{background:var(--oliva-palido);}
        .nav-btn.dorado{background:var(--dorado);color:var(--oliva-oscuro);}
        .nav-btn.dorado:hover{background:var(--dorado-claro);transform:translateY(-2px);}
        .nav-btn.exam{background:linear-gradient(135deg,var(--verde),#5a9e3e);color:#fff;}
        .nav-btn.exam:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(62,107,58,.3);}
        .review-menu{background:#fff;border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px var(--sombra);display:none;}
        .review-menu.active{display:block;animation:fadeUp .4s ease;}
        .review-menu h3{font-family:'Patrick Hand',cursive;font-size:1.2rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .review-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:8px;border:1.5px solid var(--oliva-super);cursor:pointer;transition:all .2s;}
        .review-item:hover{border-color:var(--oliva-medio);background:rgba(90,97,51,.04);transform:translateX(4px);}
        .review-item i.ri-icon{width:36px;height:36px;border-radius:10px;background:var(--oliva-super);display:grid;place-items:center;color:var(--oliva-medio);font-size:.9rem;flex-shrink:0;}
        .review-item .ri-text{flex:1;}
        .review-item .ri-text h4{font-size:.9rem;font-weight:600;}
        .review-item .ri-text p{font-size:.75rem;color:var(--oliva-claro);}
        .medal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:8000;display:none;place-items:center;padding:20px;}
        .medal-overlay.active{display:grid;}
        .medal-box{background:#fff;border-radius:var(--radius);padding:40px 36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35);animation:medalPop .45s cubic-bezier(.2,.8,.3,1.2);}
        .medal-box .medal-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--dorado),#e8c84a);display:grid;place-items:center;margin:0 auto 20px;font-size:2.2rem;color:var(--oliva-oscuro);box-shadow:0 8px 28px rgba(201,162,39,.4);}
        .medal-box h3{font-family:'Patrick Hand',cursive;font-size:1.5rem;color:var(--oliva-oscuro);margin-bottom:4px;}
        .medal-box .medal-pts{font-family:'Orbitron',monospace;font-size:2rem;font-weight:700;color:var(--dorado);margin:12px 0 4px;}
        .medal-box .medal-label{font-size:.72rem;color:var(--oliva-claro);margin-bottom:24px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}
        .medal-box .medal-btn{padding:12px 40px;border-radius:28px;background:var(--oliva-oscuro);color:var(--crema);font-size:.92rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
        .medal-box .medal-btn:hover{background:var(--oliva-medio);transform:translateY(-2px);}
        .loading-spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:16px;}
        .spinner{width:32px;height:32px;border:3px solid var(--oliva-super);border-top-color:var(--oliva-medio);border-radius:50%;animation:spin .7s linear infinite;}
        .panda-mini{width:56px;height:64px;flex-shrink:0;}
        .fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:16px 0;}
        .fc-card{perspective:800px;height:190px;cursor:pointer;}
        .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
        .fc-card.flipped .fc-inner{transform:rotateY(180deg);}
        .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 2px 12px var(--sombra);}
        .fc-front{background:linear-gradient(135deg,var(--oliva-oscuro),var(--oliva-medio));color:var(--crema);}
        .fc-front .fc-icon{font-size:2rem;margin-bottom:10px;color:var(--dorado-claro);}
        .fc-front .fc-title{font-family:'Patrick Hand',cursive;font-size:1.1rem;font-weight:600;}
        .fc-front .fc-hint{font-size:.72rem;opacity:.5;margin-top:8px;}
        .fc-back{background:#fff;color:var(--oliva-oscuro);transform:rotateY(180deg);border:2px solid var(--oliva-palido);font-size:.85rem;line-height:1.55;padding:18px 20px;}
        .fc-back .fc-back-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--oliva-claro);margin-bottom:8px;}
        .fc-back strong{color:var(--oliva-medio);}
        .vis-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 2px 12px var(--sombra);margin:16px 0;border:1px solid rgba(39,43,0,.04);}
        .vis-card h4{font-family:'Patrick Hand',cursive;font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--oliva-medio);}
        .reading-card{background:linear-gradient(135deg,#fff9e6,#fff3cc);border-radius:var(--radius);padding:20px 24px;margin:16px 0;border-left:4px solid var(--naranja-tasa);box-shadow:0 2px 10px rgba(230,126,34,.1);}
        .reading-card h5{font-family:'Patrick Hand',cursive;font-size:1rem;color:var(--naranja-tasa);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .reading-card p{font-size:.87rem;line-height:1.6;color:#5a4a2a;}
        .data-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.88rem;}
        .data-table th{background:var(--oliva-oscuro);color:var(--crema);padding:10px 14px;text-align:center;font-weight:600;}
        .data-table td{padding:9px 14px;text-align:center;border-bottom:1px solid var(--oliva-super);transition:background .2s;}
        .data-table tr:hover td{background:rgba(190,192,146,.15);}
        .data-table td:first-child{font-weight:600;color:var(--oliva-medio);}
        .pct-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:340px;margin:0 auto;}
        .pct-cell{aspect-ratio:1;border-radius:3px;background:var(--oliva-super);cursor:pointer;transition:all .15s;border:1px solid rgba(39,43,0,.06);}
        .pct-cell:hover{transform:scale(1.15);z-index:2;}
        .pct-cell.active{background:var(--azul-razon);border-color:var(--azul-razon);box-shadow:0 0 6px rgba(46,107,158,.3);}
        .pct-cell.active:hover{background:#24608a;}
        .pct-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0;flex-wrap:wrap;}
        .pct-slider{-webkit-appearance:none;appearance:none;width:200px;height:8px;border-radius:4px;background:var(--oliva-super);outline:none;}
        .pct-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--azul-razon);cursor:pointer;box-shadow:0 2px 6px rgba(46,107,158,.3);}
        .pct-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--azul-razon);cursor:pointer;border:none;}
        .pct-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;color:var(--azul-razon);min-width:60px;text-align:center;}
        .formula-box{background:var(--crema);border-radius:var(--radius-sm);padding:14px 20px;margin:14px 0;text-align:center;border:1px dashed var(--oliva-palido);}
        .pie-wrap{display:flex;align-items:center;justify-content:center;gap:32px;margin:20px 0;flex-wrap:wrap;}
        .pie-legend{display:flex;flex-direction:column;gap:10px;}
        .pie-legend-item{display:flex;align-items:center;gap:10px;font-size:.85rem;}
        .pie-legend-color{width:16px;height:16px;border-radius:4px;flex-shrink:0;}
        .pie-legend-val{font-family:'Orbitron',monospace;font-weight:700;font-size:.82rem;}
        .arrow-visual{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0;}
        .arrow-box{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 2px 12px var(--sombra);text-align:center;}
        .arrow-box h5{font-family:'Patrick Hand',cursive;font-size:1.05rem;margin-bottom:12px;}
        .arrow-box.direct{border-top:5px solid var(--verde);}
        .arrow-box.direct h5{color:var(--verde);}
        .arrow-box.inverse{border-top:5px solid var(--rojo-suave);}
        .arrow-box.inverse h5{color:var(--rojo-suave);}
        .matrix-2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:260px;margin:12px auto;font-family:'Orbitron',monospace;}
        .matrix-cell{padding:14px;text-align:center;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;}
        .matrix-cell.top{background:var(--oliva-super);color:var(--oliva-oscuro);}
        .matrix-cell.bot{background:var(--oliva-palido);color:var(--oliva-medio);}
        .module-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
        .module-badge.m1{background:rgba(46,107,158,.12);color:var(--azul-razon);}
        .module-badge.m2{background:rgba(230,126,34,.12);color:var(--naranja-tasa);}
        .module-badge.m3{background:rgba(62,107,58,.12);color:var(--verde);}
        .module-badge.m4{background:rgba(201,162,39,.12);color:var(--dorado);}
        @media(max-width:768px){
            .sidebar{transform:translateX(calc(-1 * var(--sidebar-w)));}.sidebar.open{transform:translateX(0);}
            .main-wrap{margin-left:0!important;}.topbar{padding:0 16px;}
            .theory{padding:20px 16px 32px;}.comp-box{padding:20px;}
            .panda-msg{flex-direction:column;align-items:center;text-align:center;}
            .fc-grid{grid-template-columns:1fr;}.arrow-visual{grid-template-columns:1fr;}
            .pie-wrap{flex-direction:column;}.pct-grid{max-width:280px;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important;}}
    </style>
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="dashboard.html"><img src="logo.jpeg" alt="Skopia" class="sidebar-logo"></a>
        <span class="sidebar-username" id="sidebar-username">Cargando...</span>
        <span class="sidebar-program" id="sidebar-program"></span>
    </div>
    <div class="sidebar-search"><div class="sidebar-search-wrap"><i class="fas fa-search"></i><input type="text" id="sidebar-search" placeholder="Buscar contenido..." aria-label="Buscar contenido"></div></div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Menú de contenido"></nav>
    <div class="sidebar-footer">
        <a href="cuenta.html"><i class="fas fa-user-circle"></i> Mi Cuenta</a>
        <a href="configuracion.html"><i class="fas fa-cog"></i> Configuración</a>
        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="main-wrap" id="main-wrap">
    <header class="topbar">
        <button class="topbar-toggle" id="topbar-toggle" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
        <div class="topbar-greeting">
            <h1>Comparaciones y Razones — Viendo</h1>
            <p class="sub">Porcentajes y Razones <i class="fas fa-chevron-right" style="font-size:.5rem;margin:0 4px;opacity:.4"></i> Comparaciones y Razones</p>
        </div>

/* === Cuadrícula de porcentajes interactiva === */
var pctState = new Array(100).fill(false);
function initPctGrid() {
    var container = document.getElementById('pct-grid-container');
    var slider = document.getElementById('pct-slider');
    var valEl = document.getElementById('pct-val-display');
    var formulaEl = document.getElementById('pct-formula-display');
    if (!container) return;
    if (container.children.length === 0) {
        for (var i = 0; i < 100; i++) {
            (function(idx) {
                var cell = document.createElement('div');
                cell.className = 'pct-cell';
                cell.setAttribute('data-idx', idx);
                cell.addEventListener('click', function() { togglePctCell(idx); });
                container.appendChild(cell);
            })(i);
        }
    }
    if (slider && !slider._bound) {
        slider._bound = true;
        slider.addEventListener('input', function() {
            var v = parseInt(slider.value);
            setPctValue(v);
        });
    }
    updatePctVisuals();
}

function togglePctCell(idx) {
    pctState[idx] = !pctState[idx];
    updatePctVisuals();
}

function setPctValue(v) {
    for (var i = 0; i < 100; i++) pctState[i] = i < v;
    var slider = document.getElementById('pct-slider');
    if (slider) slider.value = v;
    updatePctVisuals();
}

function updatePctVisuals() {
    var count = pctState.filter(function(x) { return x; }).length;
    var pct = count;
    var cells = document.querySelectorAll('.pct-cell');
    cells.forEach(function(c, i) { c.classList.toggle('active', pctState[i]); });
    var valEl = document.getElementById('pct-val-display');
    if (valEl) valEl.textContent = pct + '%';
    var slider = document.getElementById('pct-slider');
    if (slider && !slider.matches(':active')) slider.value = pct;
    updatePieChart(pct);
    var formulaEl = document.getElementById('pct-formula-display');
    if (formulaEl) {
        var total = 500;
        var parte = (total * pct / 100).toFixed(0);
        tex(formulaEl, '\\text{Parte} = ' + total + ' \\times \\frac{' + pct + '}{100} = ' + parte);
    }
}

function updatePieChart(pct) {
    var svg = document.getElementById('pie-svg');
    if (!svg) return;
    var cx = 90, cy = 90, r = 72;
    var angle = (pct / 100) * 360;
    var startAngle = -90;
    var endAngle = startAngle + angle;
    var startRad = startAngle * Math.PI / 180;
    var endRad = endAngle * Math.PI / 180;
    var x1 = cx + r * Math.cos(startRad);
    var y1 = cy + r * Math.sin(startRad);
    var x2 = cx + r * Math.cos(endRad);
    var y2 = cy + r * Math.sin(endRad);
    var largeArc = angle > 180 ? 1 : 0;
    var pathD, restD;
    if (pct === 0) {
        pathD = '';
        restD = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#e8e9d4" stroke="#d4d6b0" stroke-width="1"/>';
    } else if (pct === 100) {
        pathD = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#2e6b9e"/>';
        restD = '';
    } else {
        pathD = '<path d="M' + cx + ',' + cy + ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' A' + r + ',' + r + ' 0 ' + largeArc + ',1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' Z" fill="#2e6b9e"/>';
        var restEnd = startAngle + 360;
        var restEndRad = restEnd * Math.PI / 180;
        var rx2 = cx + r * Math.cos(restEndRad);
        var ry2 = cy + r * Math.sin(restEndRad);
        var restLarge = (360 - angle) > 180 ? 1 : 0;
        restD = '<path d="M' + cx + ',' + cy + ' L' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' A' + r + ',' + r + ' 0 ' + restLarge + ',1 ' + rx2.toFixed(2) + ',' + ry2.toFixed(2) + ' Z" fill="#e8e9d4" stroke="#d4d6b0" stroke-width="0.5"/>';
    }
    var labelHtml = '';
    if (pct > 8) {
        var midAngle = (startAngle + angle / 2) * Math.PI / 180;
        var lx = cx + (r * 0.55) * Math.cos(midAngle);
        var ly = cy + (r * 0.55) * Math.sin(midAngle);
        labelHtml = '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" dominant-baseline="central" fill="white" font-size="16" font-weight="700" font-family="Orbitron,monospace">' + pct + '%</text>';
    }
    svg.innerHTML = restD + pathD + labelHtml;
    var legendFill = document.getElementById('pie-legend-fill');
    var legendRest = document.getElementById('pie-legend-rest');
    if (legendFill) legendFill.textContent = pct + '%';
    if (legendRest) legendRest.textContent = (100 - pct) + '%';
}

async function saveStats(updates) { if (!uid) return; try { await setDoc(doc(db, 'users', uid, 'stats', 'main'), updates, {merge: true}); } catch(e) {} }
async function completeMissionInDB(id) { if (!uid || completedMissions['mission_' + id]) return; completedMissions['mission_' + id] = true; try { await setDoc(doc(db, 'users', uid, 'missions', 'mission_' + id), {completed: true, completedAt: serverTimestamp()}); } catch(e) {} }

async function updateStreak() {
    if (!uid) return; var today = new Date().toISOString().split('T')[0], last = userStats.lastStudyDate;
    var newStreak = userStats.currentStreak || 0, newDays = userStats.totalDays || 0, newLongest = userStats.longestStreak || 0;
    if (last !== today) { var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); var yStr = yesterday.toISOString().split('T')[0]; if (last === yStr) { newStreak++; } else { newStreak = 1; newDays++; } newLongest = Math.max(newLongest, newStreak); }
    return {currentStreak: newStreak, longestStreak: newLongest, totalDays: newDays, lastStudyDate: today};
}

async function checkAndCompleteTheoryMissions() {
    var newMissions = [], newStars = userStats.totalStars;
    var realCount = Object.keys(completedMissions).filter(function(k) { return completedMissions[k]; }).length;
    var newTotalMissions = Math.max(realCount, userStats.totalMissionsCompleted || 0);
    if (!completedMissions['mission_3']) newMissions.push(3);
    if (!completedMissions['mission_14']) newMissions.push(14);
    if (!usedNoEntiendo && !completedMissions['mission_24']) newMissions.push(24);
    if (newMissions.length >= 3 && !completedMissions['mission_10']) newMissions.push(10);
    var missionPts = 0;
    newMissions.forEach(function(id) { if (MC[id]) missionPts += MC[id].pts; });
    newStars += missionPts; newTotalMissions += newMissions.length;
    STAR_THRESHOLDS.forEach(function(t) { if (newStars >= t.n && !completedMissions['mission_' + t.id]) { newMissions.push(t.id); newStars += MC[t.id].pts; newTotalMissions++; } });
    MISSION_COUNT_THRESHOLDS.forEach(function(t) { if (newTotalMissions >= t.n && !completedMissions['mission_' + t.id]) { newMissions.push(t.id); newStars += MC[t.id].pts; newTotalMissions++; } });
    var streakData = await updateStreak();
    STREAK_THRESHOLDS.forEach(function(t) { if ((streakData && streakData.currentStreak || 0) >= t.n && !completedMissions['mission_' + t.id]) { newMissions.push(t.id); newStars += MC[t.id].pts; newTotalMissions++; } });
    if (newTotalMissions >= 84 && !completedMissions['mission_97']) { newMissions.push(97); newStars += MC[97].pts; newTotalMissions++; }
    if (newTotalMissions >= 95 && !completedMissions['mission_94']) { newMissions.push(94); newStars += MC[94].pts; newTotalMissions++; }
    if (newTotalMissions >= 100 && !completedMissions['mission_95']) { newMissions.push(95); newStars += MC[95].pts; newTotalMissions++; }
    if (newTotalMissions >= 100 && !completedMissions['mission_100']) { newMissions.push(100); newStars += MC[100].pts; newTotalMissions++; }
    await saveStats({totalStars: newStars, totalMissionsCompleted: newTotalMissions});
    if (streakData) await saveStats(streakData);
    for (var i = 0; i < newMissions.length; i++) { await completeMissionInDB(newMissions[i]); showMedal(newMissions[i]); }
    $('top-stars').textContent = newStars;
}

/* === RENDERIZADO E INICIALIZACIÓN === */

function renderContent() {
    $('page-content').innerHTML = HTML_CONTENT;
    $('loading').style.display = 'none';
    /* Inicializar KaTeX en las secciones */
    setTimeout(function() {
        tex($('razon-formula-1'), '\\text{Raz&oacute;n} = \\dfrac{a}{b} = \\dfrac{\\text{parte azul}}{\\text{parte roja}} = \\dfrac{2}{3}', true);
        tex($('razon-result-text'), '2 : 3', false);
        tex($('razon-fc-1'), '\\dfrac{3}{5} = 3 : 5', true);
        tex($('razon-fc-2'), '\\dfrac{7}{2} = 7 : 2', true);
        tex($('razon-fc-3'), '\\dfrac{4}{10} = \\dfrac{2}{5} = 2 : 5', true);
        tex($('tasa-a'), '\\dfrac{40 - 0}{5 - 0} = 8 \\;\\text{uds/hora}', true);
        tex($('tasa-b'), '\\dfrac{25 - 0}{5 - 0} = 5 \\;\\text{uds/hora}', true);
        tex($('prop-directa-formula'), 'A_1 \\times B_2 = A_2 \\times B_1', true);
        tex($('prop-inversa-formula'), 'A_1 \\times B_1 = A_2 \\times B_2', true);
        tex($('ej-directo'), '\\dfrac{5 \\times x}{8 \\times 200} \\;\\Rightarrow\\; x = \\dfrac{8 \\times 200}{5} = 320\\;\\text{km}', true);
        tex($('ej-inverso'), '\\dfrac{10 \\times 6}{4 \\times x} \\;\\Rightarrow\\; x = \\dfrac{10 \\times 6}{4} = 15\\;\\text{d&iacute;as}', true);
        tex($('formula-parte'), '\\text{Parte} = \\text{Total} \\times \\left(\\dfrac{\\%}{100}\\right)', true);
        tex($('formula-total'), '\\text{Total} = \\dfrac{\\text{Parte}}{\\%/100}', true);
    }, 100);
}

/* === AUTENTICACIÓN === */
onAuthStateChanged(auth, async function(user) {
    if (user) {
        uid = user.uid;
        $('sidebar-username').textContent = user.displayName || 'Estudiante';
        await loadFirebaseData();
        $('top-stars').textContent = userStats.totalStars || 0;
        if (userStats.programa) $('sidebar-program').textContent = userStats.programa;
        renderContent();
        await saveTheoryComplete();
    } else {
        window.location.href = 'index.html';
    }
});
