<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Ideas Principales - Skópia</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@400;500;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGEwwuGLP0ULmsJkAhwwmNSlWAotGu_wY",
            projectId: "skopia-aa786",
            storageBucket: "skopia-aa786.firebasestorage.app",
            messagingSenderId: "719823055099",
            appId: "1:719823055099:web:7d91ea29e4b2dcbb9b685e"
        };

        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            firebaseConfig.authDomain = "localhost";
        } else {
            firebaseConfig.authDomain = "skopia-aa786.firebaseapp.com";
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.auth = auth;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            window.dispatchEvent(new CustomEvent('userReady', { detail: { user } }));
        });
    </script>

    <style>
        :root {
            --color-crema: #fdfbf5;
            --color-oliva-claro: #bec092;
            --color-oliva-medio: #5a6133;
            --color-oliva-oscuro: #272b00;
            --color-sombra: rgba(39, 43, 0, 0.15);
            --color-correcto: #4caf50;
            --color-incorrecto: #f44336;
            --color-azul: #2196f3;
            --color-amarillo: #ffeb3b;
            --float-color: var(--color-oliva-oscuro);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: linear-gradient(135deg, #e8e6df 0%, #fdfbf5 100%); 
            color: var(--color-oliva-oscuro); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
        }

        /* --- NUEVO DISEÑO: HEADER --- */
        .navbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 40px; height: 70px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(190, 192, 146, 0.3);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-oliva-oscuro);
            display: flex; align-items: center; gap: 10px;
        }

        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { 
            width: 45px; height: 45px; border-radius: 50%; 
            background: linear-gradient(135deg, var(--color-oliva-medio), var(--color-oliva-claro)); 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .user-name { font-weight: 700; color: var(--color-oliva-medio); }

        /* --- NUEVO DISEÑO: LAYOUT GRID --- */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr; /* Sidebar fijo | Contenido fluido */
            gap: 0;
            min-height: 100vh;
            padding-top: 70px; /* Espacio para el navbar fijo */
        }

        /* --- SIDEBAR IZQUIERDO (Panel de Estado) --- */
        .sidebar {
            background: white;
            border-right: 1px solid rgba(190, 192, 146, 0.3);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-section h3 {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.4rem;
            color: var(--color-oliva-medio);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-display {
            text-align: center;
            background: linear-gradient(135deg, var(--color-crema), #fff);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid var(--color-oliva-claro);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
        }
        
        .score-big {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--color-oliva-medio);
            line-height: 1;
        }
        .score-label { font-size: 0.9rem; color: #888; margin-top: 5px; font-weight: 500; }

        .challenge-status {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            display: none; /* Oculto por defecto */
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .challenge-status.active { display: block; }
        .challenge-status.vanish { background: #607d8b; }
        .challenge-status.risk { background: #c0392b; }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--color-amarillo);
        }

        .back-btn-sidebar {
            background: white; border: 2px solid var(--color-oliva-oscuro);
            color: var(--color-oliva-oscuro); padding: 12px;
            border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: auto; /* Empujar al fondo */
        }
        .back-btn-sidebar:hover { background: var(--color-oliva-oscuro); color: white; }


        /* --- CONTENIDO DERECHO (Quiz) --- */
        .content-area {
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-card {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(39, 43, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .quiz-header {
            background: var(--color-oliva-oscuro);
            padding: 30px 40px;
            color: white;
            position: relative;
        }
        
        .question-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            opacity: 0.7;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-family: 'Patrick Hand', cursive;
            font-size: 2.2rem;
            line-height: 1.3;
        }

        .quiz-body { padding: 40px; }

        .text-passage-box {
            background: var(--color-crema);
            border-left: 5px solid var(--color-azul);
            padding: 25px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 30px;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #444;
            transition: all 0.5s ease;
            position: relative;
        }
        
        /* Animación para el texto desapareciendo */
        .text-passage-box.vanished {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            border: none;
        }

        .options-grid { display: grid; gap: 15px; }
        
        .option-btn {
            background: white;
            border: 2px solid #eee;
            padding: 20px 25px;
            border-radius: 16px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            font-weight: 500;
            color: var(--color-oliva-oscuro);
        }
        
        .option-btn:hover {
            border-color: var(--color-azul);
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.1);
        }
        
        .option-btn.selected { border-color: var(--color-azul); background-color: #f0f8ff; }
        .option-btn.correct { border-color: var(--color-correcto); background-color: #e8f5e9; }
        .option-btn.incorrect { border-color: var(--color-incorrecto); background-color: #ffebee; }
        
        .option-circle {
            width: 30px; height: 30px; border-radius: 50%;
            background: #eee; color: #777;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-family: 'Orbitron';
        }
        .option-btn.selected .option-circle { background: var(--color-azul); color: white; }
        .option-btn.correct .option-circle { background: var(--color-correcto); color: white; }
        .option-btn.incorrect .option-circle { background: var(--color-incorrecto); color: white; }

        .feedback-panel {
            background: #f8f9fa; border-radius: 12px; padding: 25px; margin-top: 25px;
            display: none; border-left: 5px solid #ccc;
        }
        .feedback-panel.correct { background: #e8f5e9; border-left-color: var(--color-correcto); }
        .feedback-panel.incorrect { background: #ffebee; border-left-color: var(--color-incorrecto); }

        .action-row { display: flex; justify-content: flex-end; margin-top: 30px; gap: 15px; }

        .btn {
            padding: 15px 35px; border-radius: 30px; border: none; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-primary { background: var(--color-azul); color: white; }
        .btn-primary:hover { background: #1976d2; transform: translateY(-2px); }
        .btn-secondary { background: var(--color-oliva-medio); color: white; }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Contenedores (Video, Resultados) */
        .full-width-card {
            background: white; border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%; max-width: 900px; text-align: center;
            display: none;
        }
        .full-width-card.active { display: block; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Video Wrapper */
        .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; background: #000; margin: 20px 0; }
        .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Modales */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 5000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: white; padding: 50px; border-radius: 20px; text-align: center;
            max-width: 600px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border-top: 10px solid var(--color-azul);
        }
        .modal-box h2 { font-family: 'Patrick Hand'; font-size: 3rem; color: var(--color-oliva-oscuro); margin-bottom: 20px; }
        .modal-box p { font-size: 1.3rem; color: #555; margin-bottom: 30px; line-height: 1.6; }
        .modal-btn { padding: 15px 50px; font-size: 1.3rem; border-radius: 50px; border: none; cursor: pointer; color: white; font-weight: bold; }
        .modal-btn.start { background: var(--color-azul); }
        .modal-btn.lost { background: var(--color-incorrecto); }

        /* Results */
        .final-score { font-family: 'Orbitron'; font-size: 5rem; font-weight: 700; color: var(--color-oliva-medio); margin: 20px 0; }

        /* Media Queries */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { display: none; /* En móvil ocultar sidebar o hacerlo desplegable, por simplicidad oculto */ }
            .content-area { padding: 20px; }
            .quiz-header { padding: 20px; }
            .question-text { font-size: 1.6rem; }
            .quiz-body { padding: 20px; }
            /* Botón flotante para volver en móvil */
            .mobile-back { display: block; position: fixed; bottom: 20px; left: 20px; z-index: 2000; background: var(--color-oliva-oscuro); color: white; width: 50px; height: 50px; border-radius: 50%; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 1.2rem; }
        }
        @media (min-width: 901px) { .mobile-back { display: none; } }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">
            <i class="fas fa-brain"></i> SKOPIA
        </div>
        <div class="user-info">
            <div class="user-name" id="display-username">Usuario</div>
            <div class="user-avatar" id="display-avatar">U</div>
        </div>
    </nav>

    <div class="main-layout">
        <!-- SIDEBAR IZQUIERDO -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>Puntaje</h3>
                <div class="score-display">
                    <div class="score-big" id="score-val">0</div>
                    <div class="score-label">PUNTOS / 300</div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Racha Actual</h3>
                <div style="text-align: center; font-size: 3rem; color: #ff9800;">
                    <i class="fas fa-fire"></i> <span id="streak-val" style="font-family: 'Orbitron'; font-weight: bold; color: var(--color-oliva-oscuro);">0</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Estado del Desafío</h3>
                <div class="challenge-status" id="challenge-status-box">
                    <div id="challenge-icon" style="font-size: 3rem; margin-bottom: 10px;">⚠️</div>
                    <div id="challenge-name" style="font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">Ninguno</div>
                    <div class="timer-display" id="challenge-timer">00</div>
                    <div style="font-size: 0.8rem; opacity: 0.8;">SEGUNDOS RESTANTES</div>
                </div>
            </div>

            <button class="back-btn-sidebar" id="back-btn-main">
                <i class="fas fa-arrow-left"></i> SALIR DEL DESAFÍO
            </button>
        </aside>

        <!-- CONTENIDO DERECHO -->
        <main class="content-area">
            
            <!-- Video -->
            <div class="full-width-card active" id="video-view">
                <h2 style="font-family: 'Patrick Hand'; font-size: 2.5rem; margin-bottom: 20px; color: var(--color-oliva-oscuro);">Intro al Desafío</h2>
                <div class="video-responsive">
                    <iframe src="https://edpuzzle.com/embed/media/691b9cb7a786fdf61851697c" frameborder="0" allowfullscreen></iframe>
                </div>
                <button class="btn btn-primary" id="start-btn" style="margin: 0 auto;">COMENZAR <i class="fas fa-play"></i></button>
            </div>

            <!-- Quiz -->
            <div class="quiz-card" id="quiz-view" style="display: none;">
                <div class="quiz-header">
                    <div class="question-number">PREGUNTA <span id="q-num">1</span>/10</div>
                    <div class="question-text" id="q-text">Cargando pregunta...</div>
                </div>
                
                <div class="quiz-body">
                    <div class="text-passage-box" id="q-passage">
                        <!-- Texto aquí -->
                    </div>
                    
                    <div class="options-grid" id="q-options">
                        <!-- Opciones generadas por JS -->
                    </div>

                    <div class="feedback-panel" id="feedback-box">
                        <h3 id="fb-title" style="margin-bottom: 10px; font-size: 1.2rem;"></h3>
                        <p id="fb-text" style="margin-bottom: 15px; line-height: 1.6;"></p>
                        <div id="trick-box" style="background: white; border: 1px dashed var(--color-oliva-claro); padding: 15px; border-radius: 8px; display: none;">
                            <strong><i class="fas fa-lightbulb"></i> Truco:</strong> <span id="fb-trick"></span>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="btn btn-secondary" id="hint-btn"><i class="far fa-lightbulb"></i> Pista</button>
                        <button class="btn btn-primary" id="check-btn" disabled>VERIFICAR</button>
                        <button class="btn" id="next-btn" style="display: none; background: var(--color-oliva-oscuro); color: white;">SIGUIENTE <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="full-width-card" id="results-view">
                <i class="fas fa-trophy" style="font-size: 5rem; color: #ffd700; margin-bottom: 20px;"></i>
                <h2 style="font-family: 'Patrick Hand'; font-size: 3rem; color: var(--color-oliva-oscuro);">¡Desafío Completado!</h2>
                <div class="final-score" id="final-score-val">0</div>
                <p id="final-msg" style="font-size: 1.5rem; color: #666; margin-bottom: 40px;">Resultado...</p>
                <button class="btn btn-primary" id="finish-btn" style="margin: 0 auto;">FINALIZAR Y VOLVER</button>
            </div>

        </main>
    </div>

    <!-- Botón móvil para salir -->
    <button class="mobile-back" id="mobile-back-btn"><i class="fas fa-arrow-left"></i></button>

    <!-- Modales -->
    <div class="modal-overlay" id="modal-start">
        <div class="modal-box">
            <h2 id="modal-title">DESAFÍO</h2>
            <p id="modal-desc">Descripción.</p>
            <button class="modal-btn start" id="modal-accept-btn">¡ACEPTAR!</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-lost">
        <div class="modal-box" style="border-top-color: var(--color-incorrecto);">
            <i class="fas fa-times-circle" style="font-size: 4rem; color: var(--color-incorrecto); margin-bottom: 20px;"></i>
            <h2>¡PERDISTE!</h2>
            <p id="lost-desc">Razon.</p>
            <button class="modal-btn lost" id="modal-continue-btn">CONTINUAR NORMAL</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- ESTADO ---
            let questions = [];
            let currentIdx = 0;
            let score = 0;
            let streak = 0;
            let activeChallenge = null; // 'vanish', 'risk'
            let challengeTimerInterval = null;
            let timeLeft = 0;
            let selectedOptionIdx = null;
            let isAnswered = false;

            // --- DOM ELEMENTS ---
            const views = {
                video: document.getElementById('video-view'),
                quiz: document.getElementById('quiz-view'),
                results: document.getElementById('results-view')
            };
            
            const els = {
                qNum: document.getElementById('q-num'),
                qText: document.getElementById('q-text'),
                qPassage: document.getElementById('q-passage'),
                qOptions: document.getElementById('q-options'),
                scoreVal: document.getElementById('score-val'),
                streakVal: document.getElementById('streak-val'),
                challengeBox: document.getElementById('challenge-status-box'),
                challengeName: document.getElementById('challenge-name'),
                challengeIcon: document.getElementById('challenge-icon'),
                challengeTimer: document.getElementById('challenge-timer'),
                checkBtn: document.getElementById('check-btn'),
                nextBtn: document.getElementById('next-btn'),
                hintBtn: document.getElementById('hint-btn'),
                feedbackBox: document.getElementById('feedback-box'),
                fbTitle: document.getElementById('fb-title'),
                fbText: document.getElementById('fb-text'),
                trickBox: document.getElementById('trick-box'),
                fbTrick: document.getElementById('fb-trick'),
                userName: document.getElementById('display-username'),
                userAvatar: document.getElementById('display-avatar')
            };

            // --- CARGAR PREGUNTAS (CON FILTRO Y FALLBACK) ---
            async function init() {
                try {
                    const res = await fetch('preguntas.json');
                    const data = await res.json();
                    
                    // Filtros: "basico medio" Y "ideas principales"
                    const filtered = data.filter(q => 
                        q.tags && 
                        q.tags.includes("basico medio") && 
                        q.tags.includes("ideas principales")
                    );

                    if (filtered.length > 0) {
                        // Si hay JSON real con tags, usarlo (aleatorio 10)
                        questions = filtered.sort(() => 0.5 - Math.random()).slice(0, 10);
                    } else {
                        // Fallback: Solo se usa si NO encuentra el JSON o no tiene los tags
                        console.warn("Usando preguntas de prueba (Mock Data) porque no se encontraron preguntas válidas en el JSON.");
                        questions = Array.from({length:10}, (_,i)=>({
                            pregunta: `Pregunta ${i+1}. ¿Cuál es la idea principal de este texto académico?`,
                            opciones: ["La opción correcta según el análisis", "Un detalle irrelevante del proceso", "Una opinión subjetiva del autor", "Un dato falso introducido para confundir"],
                            respuestaCorrecta: 0,
                            explicacion: "Esta es la explicación simulada para la pregunta de prueba.",
                            truco: "Lee la primera y última oración del párrafo."
                        }));
                    }
                } catch (e) {
                    console.error("Error cargando JSON, usando modo prueba:", e);
                    questions = Array.from({length:10}, (_,i)=>({
                        pregunta: `Demo Pregunta ${i+1}`,
                        opciones: ["A", "B", "C", "D"],
                        respuestaCorrecta: 0,
                        explicacion: "...", truco: "..."
                    }));
                }
                
                // Listener Botones
                document.getElementById('start-btn').onclick = () => switchView('quiz');
                document.getElementById('back-btn-main').onclick = confirmExit;
                document.getElementById('mobile-back-btn').onclick = confirmExit;
                els.checkBtn.onclick = verifyAnswer;
                els.nextBtn.onclick = nextQuestion;
                els.hintBtn.onclick = () => alert("Pista: Fíjate en las palabras clave.");

                // Modal Listeners
                document.getElementById('modal-accept-btn').onclick = acceptChallenge;
                document.getElementById('modal-continue-btn').onclick = closeLostModal;

                // Usuario
                window.addEventListener('userReady', (e) => {
                    const u = e.detail.user;
                    const name = u.displayName || u.email.split('@')[0];
                    els.userName.textContent = name;
                    els.userAvatar.textContent = name.charAt(0).toUpperCase();
                });
            }

            // --- LÓGICA DEL JUEGO ---

            function switchView(viewName) {
                Object.values(views).forEach(el => el.classList.remove('active'));
                views[viewName].classList.add('active');
                if(viewName === 'quiz') loadQuestion();
                if(viewName === 'results') showResults();
            }

            function loadQuestion() {
                if (currentIdx >= questions.length) {
                    switchView('results');
                    return;
                }

                const q = questions[currentIdx];
                isAnswered = false;
                selectedOptionIdx = null;
                els.checkBtn.disabled = true;
                els.checkBtn.style.display = 'inline-flex';
                els.nextBtn.style.display = 'none';
                els.feedbackBox.style.display = 'none';
                els.hintBtn.disabled = false;
                
                // Reset UI Texto
                els.qPassage.classList.remove('vanished');
                
                // Render
                els.qNum.textContent = currentIdx + 1;
                
                // Separar texto de pregunta si existe salto de línea
                if (q.pregunta.includes('\n\n')) {
                    const parts = q.pregunta.split('\n\n');
                    els.qPassage.textContent = parts[0];
                    els.qText.textContent = parts[1];
                } else {
                    els.qPassage.textContent = "Texto académico de ejemplo para analizar...";
                    els.qText.textContent = q.pregunta;
                }

                els.qOptions.innerHTML = '';
                q.opciones.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<div class="option-circle">${String.fromCharCode(65+i)}</div><span>${opt}</span>`;
                    btn.onclick = () => selectOption(i, btn);
                    els.qOptions.appendChild(btn);
                });

                // Verificar si hay un desafío activo para esta pregunta
                checkActiveChallenge();
            }

            function selectOption(idx, btn) {
                if(isAnswered) return;
                selectedOptionIdx = idx;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                els.checkBtn.disabled = false; // Habilitar verificar
            }

            function verifyAnswer() {
                if (selectedOptionIdx === null) return;
                
                // IMPORTANTE: Deshabilitar botón inmediatamente para evitar trampa de puntos
                els.checkBtn.disabled = true; 
                isAnswered = true;

                const q = questions[currentIdx];
                const isCorrect = selectedOptionIdx === q.respuestaCorrecta;
                const opts = document.querySelectorAll('.option-btn');

                els.feedbackBox.style.display = 'block';
                
                if (isCorrect) {
                    // PUNTUACIÓN
                    let points = 30;
                    let title = "¡Correcto!";
                    let cssClass = "correct";

                    if (activeChallenge === 'risk') {
                        points = 60; // Doble puntos
                        title = "¡RIESGO EXITOSO! (+60)";
                    }

                    score += points;
                    updateStreak(true);

                    els.fbTitle.innerHTML = `<i class="fas fa-check-circle"></i> ${title}`;
                    els.fbTitle.style.color = "var(--color-correcto)";
                    els.feedbackBox.className = "feedback-panel correct";
                    els.trickBox.style.display = 'none';

                    opts[selectedOptionIdx].classList.add('correct');
                } else {
                    // FALLO
                    let pointsLost = 0;
                    let title = "Incorrecto";
                    let cssClass = "incorrect";

                    if (activeChallenge === 'risk') {
                        pointsLost = 30;
                        title = "¡FALLASTE EL RIESGO! (-30)";
                        triggerLostModal("Has perdido la apuesta y puntos.");
                    } else if (activeChallenge) {
                        triggerLostModal("Has fallado el desafío activo.");
                    }

                    score = Math.max(0, score - pointsLost);
                    updateStreak(false); // Reset racha y desafío si falla

                    els.fbTitle.innerHTML = `<i class="fas fa-times-circle"></i> ${title}`;
                    els.fbTitle.style.color = "var(--color-incorrecto)";
                    els.feedbackBox.className = "feedback-panel incorrect";
                    
                    els.trickBox.style.display = 'block';
                    els.fbTrick.textContent = q.truco;

                    opts[selectedOptionIdx].classList.add('incorrect');
                    opts[q.respuestaCorrecta].classList.add('correct');
                }

                els.scoreVal.textContent = score;
                els.fbText.textContent = q.explicacion;
                
                els.checkBtn.style.display = 'none';
                els.nextBtn.style.display = 'inline-flex';
                els.hintBtn.disabled = true;
            }

            // --- LÓGICA DE DESAFÍOS ---

            function updateStreak(isCorrect) {
                if (isCorrect) {
                    streak++;
                    els.streakVal.textContent = streak;
                    
                    // TRIGGER DESAFÍO FANTASMA (2 aciertos)
                    if (streak === 2 && activeChallenge === null) {
                        prepareChallenge('vanish');
                    } 
                    // TRIGGER DESAFÍO AMBICIOSO (4 aciertos)
                    else if (streak === 4 && activeChallenge === null) {
                        prepareChallenge('risk');
                    }
                } else {
                    streak = 0;
                    els.streakVal.textContent = streak;
                    // activeChallenge se resetea en triggerLostModal o si no hay modal
                    if(!activeChallenge) activeChallenge = null; 
                }
            }

            function prepareChallenge(type) {
                const modal = document.getElementById('modal-start');
                const title = document.getElementById('modal-title');
                const desc = document.getElementById('modal-desc');
                
                if (type === 'vanish') {
                    title.textContent = "DESAFÍO FANTASMA";
                    desc.textContent = "¡Buenas racha! En la siguiente pregunta tendrás 30 segundos para leer el texto. Luego desaparecerá.";
                } else {
                    title.textContent = "DESAFÍO AMBICIOSO";
                    desc.textContent = "¡Eres imparable! La siguiente pregunta vale el doble (60 pts), pero si fallas pierdes 30.";
                }

                modal.style.display = 'flex';
                
                // Guardamos el tipo en el botón para usarlo al aceptar
                document.getElementById('modal-accept-btn').onclick = () => {
                    modal.style.display = 'none';
                    activeChallenge = type;
                    // La lógica del desafío se aplica en checkActiveChallenge() al cargar la SIGUIENTE pregunta
                };
            }

            function checkActiveChallenge() {
                if (!activeChallenge) {
                    els.challengeBox.classList.remove('active');
                    clearInterval(challengeTimerInterval);
                    return;
                }

                els.challengeBox.classList.add('active');
                
                if (activeChallenge === 'vanish') {
                    els.challengeBox.className = 'challenge-status active vanish';
                    els.challengeName.textContent = "Modo Fantasma";
                    els.challengeIcon.textContent = "👻";
                    
                    // Iniciar cuenta regresiva
                    timeLeft = 30;
                    updateTimerDisplay();
                    
                    challengeTimerInterval = setInterval(() => {
                        timeLeft--;
                        updateTimerDisplay();
                        if (timeLeft <= 0) {
                            clearInterval(challengeTimerInterval);
                            els.qPassage.classList.add('vanished'); // Desaparecer texto
                            els.challengeTimer.textContent = "OCULTO";
                        }
                    }, 1000);

                } else if (activeChallenge === 'risk') {
                    els.challengeBox.className = 'challenge-status active risk';
                    els.challengeName.textContent = "Modo Ambicioso";
                    els.challengeIcon.textContent = "💣";
                    els.challengeTimer.textContent = "+60 / -30";
                    clearInterval(challengeTimerInterval);
                }
            }

            function updateTimerDisplay() {
                els.challengeTimer.textContent = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            }

            function triggerLostModal(reason) {
                document.getElementById('lost-desc').textContent = reason;
                document.getElementById('modal-lost').style.display = 'flex';
            }

            function closeLostModal() {
                document.getElementById('modal-lost').style.display = 'none';
                // Resetear desafío
                activeChallenge = null;
                clearInterval(challengeTimerInterval);
                els.challengeBox.classList.remove('active');
                els.challengeTimer.textContent = "00";
                
                // Mostrar botón siguiente si estaba oculto por la lógica del modal
                els.nextBtn.style.display = 'inline-flex';
            }

            function nextQuestion() {
                currentIdx++;
                loadQuestion();
            }

            function showResults() {
                els.finalScoreVal.textContent = score;
                const msg = document.getElementById('final-msg');
                if (score >= 250) msg.textContent = "¡Legendario! Has dominado los desafíos.";
                else if (score >= 150) msg.textContent = "¡Excelente trabajo!";
                else msg.textContent = "Sigue practicando para mejorar.";
                
                // Limpiar desafíos
                activeChallenge = null;
                clearInterval(challengeTimerInterval);
            }

            function confirmExit() {
                if (confirm("¿Seguro que quieres salir? Perderás tu progreso.")) {
                    window.location.href = 'LCS1D.html';
                }
            }

            // Iniciar
            init();
        });
    </script>
</body>
</html>
