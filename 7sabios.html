<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Sabios del Dato - El Desafío Panda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'ZCOOL QingKe HuangYou', cursive;
            background: linear-gradient(135deg, #1a5f3f 0%, #0e3a2a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Bambú de fondo */
        .bamboo-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.2;
        }
        
        .bamboo {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(to top, #2a7f4f, #1a5f3f);
            border-radius: 5px;
        }
        
        .bamboo::before, .bamboo::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 20px;
            background: #0e3a2a;
            border-radius: 5px;
        }
        
        .bamboo::before {
            top: 20%;
        }
        
        .bamboo::after {
            top: 50%;
        }
        
        .bamboo:nth-child(1) { left: 5%; height: 80%; }
        .bamboo:nth-child(2) { left: 15%; height: 90%; }
        .bamboo:nth-child(3) { left: 25%; height: 75%; }
        .bamboo:nth-child(4) { left: 35%; height: 85%; }
        .bamboo:nth-child(5) { left: 45%; height: 95%; }
        .bamboo:nth-child(6) { left: 55%; height: 80%; }
        .bamboo:nth-child(7) { left: 65%; height: 90%; }
        .bamboo:nth-child(8) { left: 75%; height: 85%; }
        .bamboo:nth-child(9) { left: 85%; height: 75%; }
        .bamboo:nth-child(10) { left: 95%; height: 95%; }
        
        /* Header */
        header {
            background: rgba(14, 58, 42, 0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panda-icon {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        
        .panda-icon::before, .panda-icon::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            top: 15px;
        }
        
        .panda-icon::before {
            left: 10px;
        }
        
        .panda-icon::after {
            right: 10px;
        }
        
        .panda-icon .nose {
            position: absolute;
            width: 10px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2rem;
            color: #f0f0f0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .level-indicator {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .timer {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .timer-icon {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            position: relative;
        }
        
        .timer-icon::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 8px;
            background: #000;
            top: 5px;
            left: 9px;
            transform: rotate(45deg);
        }
        
        .timer-icon::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 5px;
            background: #000;
            top: 5px;
            left: 9px;
        }
        
        .exit-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .exit-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .game-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #f0f0f0;
        }
        
        .game-instructions {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #d0d0d0;
        }
        
        .data-table {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: center;
            color: #333;
        }
        
        .data-table th {
            background: #2a7f4f;
            color: white;
        }
        
        .data-table tr:nth-child(even) {
            background: rgba(42, 127, 79, 0.1);
        }
        
        .data-table .empty-cell {
            background: rgba(231, 76, 60, 0.2) !important;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .option-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .option-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .option-btn.correct {
            background: #27ae60;
            animation: pulse 0.5s;
        }
        
        .option-btn.incorrect {
            background: #e74c3c;
            animation: shake 0.5s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        /* Minijuegos específicos */
        .camouflage-game {
            position: relative;
            height: 400px;
            background: #1a5f3f;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .camouflage-btn {
            position: absolute;
            background: #1a5f3f;
            color: #1a5f3f;
            border: 1px solid #1a5f3f;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .camouflage-btn:hover {
            background: #2a7f4f;
            color: white;
        }
        
        .color-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #2a7f4f;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }
        
        .flashlight {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        
        .balance-tables {
            display: flex;
            justify-content: space-around;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .balance-table {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .balance-table:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .balance-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .balance-table th, .balance-table td {
            padding: 10px;
            text-align: center;
            color: #333;
        }
        
        .balance-table th {
            background: #2a7f4f;
            color: white;
        }
        
        .balance-table tr:nth-child(even) {
            background: rgba(42, 127, 79, 0.1);
        }
        
        .panda-eating {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .intruder-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .intruder-btn {
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            animation: moveLeftRight 5s infinite linear;
        }
        
        @keyframes moveLeftRight {
            0% { transform: translateX(0); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(0); }
        }
        
        .mirror-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .mirror-btn {
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .mirror-btn.mirror {
            transform: scaleX(-1);
        }
        
        .quick-change-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .quick-change-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .quick-change-letter {
            width: 60px;
            height: 60px;
            background: #2a7f4f;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .quick-change-value {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .system-error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(231, 76, 60, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 10px;
        }
        
        .error-message {
            font-size: 2rem;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .error-close {
            width: 40px;
            height: 40px;
            background: white;
            color: #e74c3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .error-close:hover {
            transform: scale(1.1);
        }
        
        .rotating-table {
            animation: rotate 10s infinite linear;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fugitive-btn {
            position: absolute;
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s ease;
            z-index: 10;
        }
        
        .lying-question {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .pandas-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            position: relative;
            height: 150px;
        }
        
        .panda {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        
        .panda::before, .panda::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            top: 25px;
        }
        
        .panda::before {
            left: 15px;
        }
        
        .panda::after {
            right: 15px;
        }
        
        .panda .nose {
            position: absolute;
            width: 15px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .panda-number {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a7f4f;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.5s ease;
        }
        
        .panda-number.hidden {
            opacity: 0;
        }
        
        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #2a7f4f;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 20;
            border-radius: 10px;
            display: none;
        }
        
        .shaking {
            animation: shake 0.5s infinite;
        }
        
        .invisible-btn {
            background: transparent !important;
            color: transparent !important;
            border: 2px dashed rgba(255, 255, 255, 0.3) !important;
        }
        
        .walking-panda {
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            bottom: 20px;
            left: -60px;
            animation: walk 10s infinite linear;
            z-index: 15;
        }
        
        .walking-panda::before, .walking-panda::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            top: 20px;
        }
        
        .walking-panda::before {
            left: 12px;
        }
        
        .walking-panda::after {
            right: 12px;
        }
        
        .walking-panda .nose {
            position: absolute;
            width: 10px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        @keyframes walk {
            0% { left: -60px; }
            100% { left: 100%; }
        }
        
        .maze-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .maze-key {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #f39c12;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .maze-key:hover {
            transform: scale(1.1);
        }
        
        .maze-key.collected {
            background: #2a7f4f;
            pointer-events: none;
        }
        
        .submit-btn {
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        
        .submit-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
        
        .submit-btn:enabled:hover {
            background: #1a5f3f;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .fast-moving-btn {
            position: absolute;
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .game-over-message {
            font-size: 3rem;
            color: #e74c3c;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-over-emoji {
            font-size: 4rem;
            margin-bottom: 30px;
        }
        
        .restart-btn {
            background: #2a7f4f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .restart-btn:hover {
            background: #1a5f3f;
            transform: scale(1.05);
        }
        
        .level-complete-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .level-complete-message {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .level-complete-emoji {
            font-size: 4rem;
            margin-bottom: 30px;
        }
        
        .next-level-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .next-level-btn:hover {
            background: #1e8449;
            transform: scale(1.05);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .game-container {
                padding: 20px;
            }
            
            .data-table {
                font-size: 0.9rem;
            }
            
            .data-table th, .data-table td {
                padding: 8px 5px;
            }
            
            .option-btn {
                padding: 10px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Bambú de fondo -->
    <div class="bamboo-bg">
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
        <div class="bamboo"></div>
    </div>
    
    <header>
        <div class="logo">
            <div class="panda-icon">
                <div class="nose"></div>
            </div>
            <h1>7 Sabios del Dato</h1>
        </div>
        <div class="game-info">
            <div class="level-indicator">Nivel: <span id="current-level">1</span></div>
            <div class="timer">
                <div class="timer-icon"></div>
                <span id="time-remaining">2:00</span>
            </div>
            <button class="exit-btn" onclick="exitGame()">Salir</button>
        </div>
    </header>
    
    <main>
        <div class="game-container" id="game-container">
            <!-- El contenido del juego se generará dinámicamente con JavaScript -->
        </div>
    </main>
    
    <!-- Overlay de Game Over -->
    <div class="game-over-overlay" id="game-over-overlay" style="display: none;">
        <div class="game-over-message">¡Perdiste!</div>
        <div class="game-over-emoji">😂</div>
        <button class="restart-btn" onclick="restartGame()">Reiniciar Juego</button>
    </div>
    
    <!-- Overlay de Nivel Completado -->
    <div class="level-complete-overlay" id="level-complete-overlay" style="display: none;">

        // Inicializar el juego
        function initGame() {
            selectRandomGame();
            startTimer();
        }
        
        // Seleccionar un juego aleatorio del nivel actual
        function selectRandomGame() {
            const availableGames = gamesByLevel[currentLevel];
            const unplayedGames = availableGames.filter(game => !gamesPlayed.includes(game));
            
            // Si todos los juegos del nivel han sido jugados, reiniciar la lista
            if (unplayedGames.length === 0) {
                gamesPlayed = [];
                currentGame = availableGames[Math.floor(Math.random() * availableGames.length)];
            } else {
                currentGame = unplayedGames[Math.floor(Math.random() * unplayedGames.length)];
            }
            
            gamesPlayed.push(currentGame);
            gameData = tableData[currentGame];
            renderGame();
        }
        
        // Renderizar el juego actual
        function renderGame() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            
            // Actualizar indicador de nivel
            document.getElementById('current-level').textContent = currentLevel;
            
            switch(currentGame) {
                case 'elEscondite':
                    renderElEscondite(container);
                    break;
                case 'elCamuflaje':
                    renderElCamuflaje(container);
                    break;
                case 'laBalanza':
                    renderLaBalanza(container);
                    break;

            // Crear encabezados
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            gameData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Crear filas
            const tbody = document.createElement('tbody');
            
            gameData.rows.forEach(row => {
                const tr = document.createElement('tr');
                
                row.forEach(cell => {
                    const td = document.createElement('td');
                    if (cell === '___') {
                        td.className = 'empty-cell';
                        td.textContent = '?';
                    } else {
                        td.textContent = cell;
                    }
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            container.appendChild(tableContainer);
            
            // Crear opciones
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            
            gameData.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                
                // Animación de aparición y desaparición
                let visible = true;
                const visibilityInterval = setInterval(() => {
                    if (visible) {
                        btn.style.opacity = '0';
                        visible = false;
                    } else {
                        btn.style.opacity = '1';
                        visible = true;
                    }
                }, 2000);
                
                btn.addEventListener('click', () => {
                    clearInterval(visibilityInterval);
                    checkAnswer(option, btn);
                });
                
                optionsContainer.appendChild(btn);
            });
            
            container.appendChild(optionsContainer);
        }
        
        // Renderizar minijuego: El Camuflaje
        function renderElCamuflaje(container) {
            const title = document.createElement('h2');
            title.className = 'game-title';
            title.textContent = 'El Camuflaje';
            container.appendChild(title);
            
            const instructions = document.createElement('p');
            instructions.className = 'game-instructions';
            instructions.textContent = 'Usa tu ingenio para encontrar la respuesta correcta. ¡Está camuflada!';
            container.appendChild(instructions);
            
            const gameArea = document.createElement('div');
            gameArea.className = 'camouflage-game';
            gameArea.id = 'camouflage-game';
            
            // Botón para cambiar el color de fondo
            const colorSwitcher = document.createElement('div');
            colorSwitcher.className = 'color-switcher';
            colorSwitcher.title = 'Cambiar color de fondo';
            colorSwitcher.addEventListener('click', () => {
                const currentColor = gameArea.style.backgroundColor;
                if (currentColor === 'rgb(26, 95, 63)' || currentColor === '') {
                    gameArea.style.backgroundColor = '#f0f0f0';
                } else {
                    gameArea.style.backgroundColor = '#1a5f3f';
                }
            });
            gameArea.appendChild(colorSwitcher);
            
            // Linterna
            const flashlight = document.createElement('div');
            flashlight.className = 'flashlight';
            flashlight.id = 'flashlight';
            gameArea.appendChild(flashlight);
            
            // Activar linterna con el mouse
            gameArea.addEventListener('mousemove', (e) => {
                const rect = gameArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                flashlight.style.left = (x - 50) + 'px';
                flashlight.style.top = (y - 50) + 'px';
                flashlight.style.display = 'block';
            });
            
            gameArea.addEventListener('mouseleave', () => {
                flashlight.style.display = 'none';
            });
            
            // Crear botones camuflados
            const positions = [
                { top: '50px', left: '100px' },
                { top: '150px', left: '300px' },
                { top: '250px', left: '200px' },
                { top: '100px', left: '400px' },
                { top: '200px', left: '500px' },
                { top: '300px', left: '100px' },
                { top: '80px', left: '250px' },
                { top: '180px', left: '450px' },
                { top: '280px', left: '350px' },
                { top: '120px', left: '150px' }
            ];
            
            // Añadir la respuesta correcta en una posición aleatoria
            const correctIndex = Math.floor(Math.random() * positions.length);
            
            positions.forEach((pos, index) => {
                const btn = document.createElement('button');
                btn.className = 'camouflage-btn';
                
                if (index === correctIndex) {
                    btn.textContent = gameData.answer;
                    btn.dataset.correct = 'true';
                } else {
                    // Generar respuestas incorrectas
                    const incorrectValue = parseInt(gameData.answer) + (index - correctIndex) * 10;
                    btn.textContent = incorrectValue.toString();
                    btn.dataset.correct = 'false';
                }
                
                btn.style.top = pos.top;
                btn.style.left = pos.left;
                
                btn.addEventListener('click', () => {
                    checkAnswer(btn.textContent, btn);
                });
                
                gameArea.appendChild(btn);
            });
            
            container.appendChild(gameArea);
        }

            const optionsContainer = document.createElement('div');

            const duplicatedOptions = [...gameData.options, ...gameData.options];
            
            // Barajar opciones
            duplicatedOptions.sort(() => Math.random() - 0.5);
            
            duplicatedOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'mirror-btn';
                btn.textContent = option;
                
                // Hacer que una de las respuestas correctas esté reflejada
                if (option === gameData.answer && index % 2 === 0) {
                    btn.classList.add('mirror');
                    btn.dataset.mirror = 'true';
                }
                
                btn.addEventListener('click', () => {
                    // Si es el botón reflejado, pierde
                    if (btn.dataset.mirror === 'true') {
                        gameOver();
                    } else {
                        checkAnswer(option, btn);
                    }
                });
                
                optionsContainer.appendChild(btn);

            container.appendChild(title);
            
            const instructions = document.createElement('p');
            instructions.className = 'game-instructions';
            instructions.textContent = 'Sigue la letra correcta con la mirada. ¡Las opciones cambian de posición rápidamente!';
            container.appendChild(instructions);
            
            // Pregunta
            const question = document.createElement('p');
            question.className = 'game-instructions';
            question.textContent = gameData.question;
            container.appendChild(question);
            
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'quick-change-options';
            
            // Crear opciones
            gameData.options.forEach((option, index) => {
                const optionContainer = document.createElement('div');
                optionContainer.className = 'quick-change-option';
                
                const letter = document.createElement('div');
                letter.className = 'quick-change-letter';
                letter.id = `letter-${index}`;
                letter.textContent = gameData.options[index].letter;
                
                const value = document.createElement('div');
                value.className = 'quick-change-value';
                value.textContent = gameData.options[index].value;
                
                optionContainer.appendChild(letter);
                optionContainer.appendChild(value);
                optionsContainer.appendChild(optionContainer);
            });
            
            container.appendChild(optionsContainer);
            
            // Cambiar las letras de posición cada 2 segundos
            const changeInterval = setInterval(() => {
                const letters = document.querySelectorAll('.quick-change-letter');
                const values = document.querySelectorAll('.quick-change-value');
                
                // Barajar valores
                const shuffledValues = Array.from(values).sort(() => Math.random() - 0.5);
                
                // Asignar valores barajados a las letras
                letters.forEach((letter, index) => {
                    const parent = letter.parentElement;
                    const valueElement = parent.querySelector('.quick-change-value');
                    
                    // Reemplazar el valor actual con uno barajado
                    valueElement.textContent = shuffledValues[index].textContent;
                    
                    // Guardar el valor real en un atributo de datos
                    valueElement.dataset.realValue = shuffledValues[index].textContent;
                });
            }, 2000);
            
            // Botón para verificar respuesta
            const submitBtn = document.createElement('button');
            submitBtn.className = 'option-btn';
            submitBtn.textContent = 'Verificar Respuesta';
            submitBtn.style.margin = '0 auto';
            submitBtn.style.display = 'block';
            
            submitBtn.addEventListener('click', () => {
                clearInterval(changeInterval);
                
                // Encontrar la letra correcta
                let correctLetter = '';
                gameData.options.forEach(option => {
                    if (option.value === gameData.answer) {
                        correctLetter = option.letter;
                    }
                });

            container.appendChild(instructions);
            
            const tableContainer = document.createElement('div');
            tableContainer.className = 'data-table';
            
            const table = document.createElement('table');
            
            // Crear encabezados
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            gameData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Crear filas
            const tbody = document.createElement('tbody');
            
            gameData.rows.forEach(row => {
                const tr = document.createElement('tr');

                    const td = document.createElement('td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            container.appendChild(tableContainer);
            
            // Pregunta
            const question = document.createElement('p');
            question.className = 'game-instructions';
            question.textContent = gameData.question;
            container.appendChild(question);
            
            // Área de juego para el botón fugitivo
            const gameArea = document.createElement('div');
            gameArea.style.position = 'relative';
            gameArea.style.height = '200px';
            gameArea.style.width = '100%';
            gameArea.style.border = '2px dashed rgba(255, 255, 255, 0.3)';
            gameArea.style.borderRadius = '10px';
            gameArea.style.marginBottom = '20px';
            
            // Botón fugitivo
            const fugitiveBtn = document.createElement('button');
            fugitiveBtn.className = 'fugitive-btn';
            fugitiveBtn.textContent = gameData.answer;
            fugitiveBtn.style.top = '50px';
            fugitiveBtn.style.left = '50px';
            
            // Posición inicial aleatoria
            const randomTop = Math.floor(Math.random() * 150) + 'px';
            const randomLeft = Math.floor(Math.random() * (gameArea.offsetWidth - 150)) + 'px';
            fugitiveBtn.style.top = randomTop;
            fugitiveBtn.style.left = randomLeft;
            
            // Hacer que el botón huya del cursor
            gameArea.addEventListener('mousemove', (e) => {
                const rect = gameArea.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const btnRect = fugitiveBtn.getBoundingClientRect();
                const btnX = btnRect.left - rect.left + btnRect.width / 2;
                const btnY = btnRect.top - rect.top + btnRect.height / 2;
                
                // Calcular distancia entre el cursor y el botón
                const distance = Math.sqrt(Math.pow(mouseX - btnX, 2) + Math.pow(mouseY - btnY, 2));
                
                // Si el cursor está cerca del botón, moverlo
                if (distance < 100) {
                    // Calcular nueva posición
                    let newTop = parseInt(fugitiveBtn.style.top);
                    let newLeft = parseInt(fugitiveBtn.style.left);
                    
                    // Moverse en dirección opuesta al cursor
                    if (mouseY < btnY) {
                        newTop = Math.min(newTop + 20, gameArea.offsetHeight - fugitiveBtn.offsetHeight);
                    } else {
                        newTop = Math.max(newTop - 20, 0);
                    }
                    
                    if (mouseX < btnX) {
                        newLeft = Math.min(newLeft + 20, gameArea.offsetWidth - fugitiveBtn.offsetWidth);
                    } else {
                        newLeft = Math.max(newLeft - 20, 0);
                    }
                    
                    fugitiveBtn.style.top = newTop + 'px';
                    fugitiveBtn.style.left = newLeft + 'px';
                }
            });
            
            // Para dispositivos móviles, hacer que el botón se escape después del primer clic
            let firstClick = true;
            fugitiveBtn.addEventListener('click', () => {
                if (firstClick) {
                    firstClick = false;
                    
                    // Mover el botón a una posición aleatoria
                    const randomTop = Math.floor(Math.random() * 150) + 'px';
                    const randomLeft = Math.floor(Math.random() * (gameArea.offsetWidth - 150)) + 'px';
                    fugitiveBtn.style.top = randomTop;
                    fugitiveBtn.style.left = randomLeft;
                } else {
                    checkAnswer(gameData.answer, fugitiveBtn);
                }
            });
            
            gameArea.appendChild(fugitiveBtn);
            container.appendChild(gameArea);
            
            // Opciones incorrectas
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            
            gameData.options.forEach(option => {
                if (option !== gameData.answer) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    
                    btn.addEventListener('click', () => {
                        checkAnswer(option, btn);
                    });
                    
                    optionsContainer.appendChild(btn);
                }
            });
            
            container.appendChild(optionsContainer);
        }

                    answerVerified = true;
                    
                    // Ocultar los números
                    document.querySelectorAll('.panda-number').forEach(label => {
                        label.classList.add('hidden');
                    });
                    
                    // Mostrar botón de mezclar
                    shuffleBtn.style.display = 'block';
                    
                    // Deshabilitar input y botón de verificar
                    answerInput.disabled = true;
                    checkBtn.disabled = true;
                } else {
                    // Respuesta incorrecta
                    answerInput.style.borderColor = '#e74c3c';
                    answerInput.style.animation = 'shake 0.5s';
                    
                    setTimeout(() => {
                        answerInput.style.borderColor = '#2a7f4f';
                        answerInput.style.animation = '';
                    }, 1000);
                }
            });
            
            // Event listener para el botón de mezclar
            shuffleBtn.addEventListener('click', () => {
                // Mezclar posiciones de los pandas
                const pandas = document.querySelectorAll('.panda-container');
                const positions = [];
                
                // Guardar posiciones actuales
                pandas.forEach(panda => {
                    positions.push({
                        top: panda.style.top,
                        left: panda.style.left
                    });
                });
                
                // Barajar posiciones
                positions.sort(() => Math.random() - 0.5);
                
                // Asignar nuevas posiciones
                pandas.forEach((panda, index) => {
                    panda.style.top = positions[index].top;
                    panda.style.left = positions[index].left;
                });
                
                // Habilitar clic en pandas
                document.querySelectorAll('.panda').forEach(panda => {
                    panda.style.cursor = 'pointer';
                    
                    panda.addEventListener('click', function() {
                        if (answerVerified && this.dataset.number === gameData.answer) {
                            // Respuesta correcta
                            levelComplete();
                        } else if (answerVerified) {
                            // Respuesta incorrecta
                            gameOver();
                        }
                    });
                });
                
                // Ocultar botón de mezclar
                shuffleBtn.style.display = 'none';
            });
            
            container.appendChild(shuffleBtn);
            container.appendChild(checkBtn);
        }

            walkingPanda.appendChild(nose);

            // Hacer visible la respuesta correcta cuando el panda pasa
            const pandaObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // El panda está visible, hacer visible los botones
                        document.querySelectorAll('.invisible-btn').forEach(btn => {
                            if (btn.textContent === gameData.answer) {
                                btn.style.color = 'white';
                                btn.style.background = '#2a7f4f';

                        });

                        document.querySelectorAll('.invisible-btn').forEach(btn => {
                            btn.style.color = 'transparent';
                            btn.style.background = 'transparent';
                        });
                    }
                });
            }, { threshold: 0.5 });
            
            pandaObserver.observe(walkingPanda);
        }
        
        // Renderizar minijuego: El Laberinto
        function renderElLaberinto(container) {
            const title = document.createElement('h2');
            title.className = 'game-title';
            title.textContent = 'El Laberinto';
            container.appendChild(title);
            
            const instructions = document.createElement('p');
            className = 'game-instructions';
            instructions.textContent = 'Encuentra las 3 llaves numéricas en orden ascendente para desbloquear el botón de enviar.';
            container.appendChild(instructions);
            
            const tableContainer = document.createElement('div');
            tableContainer.className = 'data-table';
            
            const table = document.createElement('table');
            
            // Crear encabezados
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            gameData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Crear filas con llaves ocultas
            const tbody = document.createElement('tbody');
            
            gameData.rows.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                
                row.forEach((cell, cellIndex) => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    
                    // Añadir llaves ocultas en celdas específicas
                    if (rowIndex === 0 && cellIndex === 2) {
                        const key = document.createElement('div');
                        key.className = 'maze-key';
                        key.textContent = gameData.keys[0];
                        key.dataset.key = gameData.keys[0];
                        td.style.position = 'relative';
                        td.appendChild(key);
                    } else if (rowIndex === 1 && cellIndex === 1) {
                        const key = document.createElement('div');
                        key.className = 'maze-key';
                        key.textContent = gameData.keys[1];
                        key.dataset.key = gameData.keys[1];
                        td.style.position = 'relative';
                        td.appendChild(key);
                    } else if (rowIndex === 2 && cellIndex === 0) {
                        const key = document.createElement('div');
                        key.className = 'maze-key';
                        key.textContent = gameData.keys[2];
                        key.dataset.key = gameData.keys[2];
                        td.style.position = 'relative';
                        td.appendChild(key);
                    }
                    
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            container.appendChild(tableContainer);
            
            // Pregunta
            const question = document.createElement('p');
            question.className = 'game-instructions';
            question.textContent = gameData.question;
            container.appendChild(question);
            
            // Input para la respuesta
            const answerInput = document.createElement('input');
            answerInput.type = 'text';
            answerInput.className = 'answer-input';
            answerInput.placeholder = 'Escribe tu respuesta aquí';
            container.appendChild(answerInput);
            
            // Botón de enviar (inicialmente deshabilitado)
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-btn';
            submitBtn.textContent = 'Enviar Respuesta';
            submitBtn.disabled = true;
            container.appendChild(submitBtn);
            
            // Variables para controlar las llaves recolectadas
            let collectedKeys = [];
            let expectedKey = 0;
            
            // Event listeners para las llaves
            document.querySelectorAll('.maze-key').forEach(key => {
                key.addEventListener('click', function() {
                    const keyValue = this.dataset.key;
                    
                    // Verificar si es la llave correcta en orden
                    if (keyValue === gameData.keys[expectedKey]) {
                        // Marcar como recolectada
                        this.classList.add('collected');
                        collectedKeys.push(keyValue);
                        expectedKey++;
                        
                        // Si se han recolectado todas las llaves, habilitar el botón
                        if (collectedKeys.length === gameData.keys.length) {
                            submitBtn.disabled = false;
                        }
                    } else {
                        // Llave incorrecta, reiniciar
                        collectedKeys = [];
                        expectedKey = 0;
                        document.querySelectorAll('.maze-key').forEach(k => {
                            k.classList.remove('collected');
                        });
                        submitBtn.disabled = true;
                    }
                });
            });
            
            // Event listener para el botón de enviar
            submitBtn.addEventListener('click', () => {
                if (answerInput.value === gameData.answer) {
                    levelComplete();
                } else {
                    gameOver();
                }
            });
        }
        
        // Renderizar minijuego: Simulacro Total
        function renderSimulacroTotal(container) {
            const title = document.createElement('h2');
            title.className = 'game-title';
            title.textContent = 'Simulacro Total';
            container.appendChild(title);
            
            const instructions = document.createElement('p');
            instructions.className = 'game-instructions';
            instructions.textContent = '¡Los botones se mueven a la velocidad de la luz! ¡Atrapa el correcto!';
            container.appendChild(instructions);
            
            const tableContainer = document.createElement('div');
            tableContainer.className = 'data-table';
            
            const table = document.createElement('table');
            
            // Crear encabezados
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            gameData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            // Crear filas
            const tbody = document.createElement('tbody');
            
            gameData.rows.forEach(row => {
                const tr = document.createElement('tr');
                
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            container.appendChild(tableContainer);
            
            // Pregunta
            const question = document.createElement('p');
            question.className = 'game-instructions';
            question.textContent = gameData.question;
            container.appendChild(question);
            
            // Área de juego para los botones rápidos
            const gameArea = document.createElement('div');
            gameArea.style.position = 'relative';
            gameArea.style.height = '200px';
            gameArea.style.width = '100%';
            gameArea.style.border = '2px dashed rgba(255, 255, 255, 0.3)';
            gameArea.style.borderRadius = '10px';
            gameArea.style.marginBottom = '20px';
            gameArea.style.overflow = 'hidden';
            
            // Crear botones rápidos
            gameData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'fast-moving-btn';
                btn.textContent = option;
                
                // Posición inicial aleatoria
                const randomTop = Math.floor(Math.random() * 150) + 'px';
                const randomLeft = Math.floor(Math.random() * (gameArea.offsetWidth - 150)) + 'px';
                btn.style.top = randomTop;
                btn.style.left = randomLeft;
                
                // Movimiento aleatorio
                const moveInterval = setInterval(() => {
                    const newTop = Math.floor(Math.random() * 150) + 'px';
                    const newLeft = Math.floor(Math.random() * (gameArea.offsetWidth - 150)) + 'px';
                    
                    btn.style.top = newTop;
                    btn.style.left = newLeft;
                }, 500);
                
                btn.addEventListener('click', () => {
                    clearInterval(moveInterval);
                    checkAnswer(option, btn);
                });
                
                gameArea.appendChild(btn);
            });
            
            container.appendChild(gameArea);
        }
        
        // Verificar respuesta
        function checkAnswer(answer, element) {
            if (answer === gameData.answer) {
                // Respuesta correcta
                element.classList.add('correct');
                
                // Limpiar intervalos si existen
                if (container.dataset.errorInterval) {
                    clearInterval(container.dataset.errorInterval);
                }
                
                // Mostrar nivel completado después de un momento
                setTimeout(() => {
                    levelComplete();
                }, 1000);
            } else {
                // Respuesta incorrecta
                element.classList.add('incorrect');
                
                // Mostrar game over después de un momento
                setTimeout(() => {
                    gameOver();
                }, 1000);
            }
        }
        
        // Nivel completado
        function levelComplete() {
            clearInterval(timerInterval);
            
            // Mostrar overlay de nivel completado
            document.getElementById('level-complete-overlay').style.display = 'flex';
        }
        
        // Game Over
        function gameOver() {
            clearInterval(timerInterval);
            
            // Hacer que la pantalla se ponga roja
            document.body.style.background = 'linear-gradient(135deg, #c0392b 0%, #922b21 100%)';
            
            // Mostrar overlay de game over
            document.getElementById('game-over-overlay').style.display = 'flex';
        }
        
        // Siguiente nivel
        function nextLevel() {
            // Ocultar overlay de nivel completado
            document.getElementById('level-complete-overlay').style.display = 'none';
            
            // Incrementar nivel
            currentLevel++;
            
            // Reiniciar juegos jugados
            gamesPlayed = [];
            
            // Reiniciar tiempo
            timeRemaining = 120;
            
            // Seleccionar nuevo juego
            selectRandomGame();
            
            // Iniciar temporizador
            startTimer();
        }
        
        // Reiniciar juego
        function restartGame() {
            // Restaurar color de fondo
            document.body.style.background = 'linear-gradient(135deg, #1a5f3f 0%, #0e3a2a 100%)';
            
            // Ocultar overlay de game over
            document.getElementById('game-over-overlay').style.display = 'none';
            
            // Reiniciar nivel
            currentLevel = 1;
            
            // Reiniciar juegos jugados
            gamesPlayed = [];
            
            // Reiniciar tiempo
            timeRemaining = 120;
            
            // Seleccionar nuevo juego
            selectRandomGame();
            
            // Iniciar temporizador
            startTimer();
        }
        
        // Salir del juego
        function exitGame() {
            window.location.href = 'tablas.html';
        }
        
        // Iniciar temporizador
        function startTimer() {
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                // Actualizar visualización del tiempo
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('time-remaining').textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                // Si se acaba el tiempo, game over
                if (timeRemaining <= 0) {
                    gameOver();
                }
            }, 1000);
        }
        
        // Iniciar el juego cuando se carga la página
        window.onload = initGame;
    </script>
</body>
</html>
