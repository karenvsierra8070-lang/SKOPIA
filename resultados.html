<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Diagnóstico - Skópia</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGEwwuGLP0ULmsJkAhwwmNSlWAotGu_wY",
            authDomain: "skopia-aa786.firebaseapp.com",
            databaseURL: "https://skopia-aa786-default-rtdb.firebaseio.com",
            projectId: "skopia-aa786",
            storageBucket: "skopia-aa786.firebasestorage.app",
            messagingSenderId: "719823055099",
            appId: "1:719823055099:web:7d91ea29e4b2dcbb9b685e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        window.auth = auth;
        window.db = db;
        window.ref = ref;
        window.get = get;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            window.currentUser = user;
            window.dispatchEvent(new CustomEvent('userReady', { detail: { user } }));
        });
    </script>

    <style>
        :root {
            --color-crema: #fdfbf5;
            --color-oliva-claro: #bec092;
            --color-oliva-oscuro: #272b00;
            --color-oliva-medio: #5a6133;
            --color-verde: #4CAF50;
            --color-amarillo: #f1c40f;
            --color-naranja: #e67e22;
            --color-azul: #3498db;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-crema);
            color: var(--color-oliva-oscuro);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .results-card {
            background-color: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 40px;
            text-align: center;
            border-top: 10px solid var(--color-oliva-oscuro);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panda-result {
            font-size: 5rem;
            margin-bottom: 10px;
            display: block;
        }

        .score-title {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--color-oliva-medio);
        }

        .score-number {
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-oliva-oscuro);
            line-height: 1;
            margin: 10px 0;
        }

        .score-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 30px;
        }

        .level-badge {
            background-color: var(--color-oliva-claro);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Colores por nivel */
        .level-1 { background-color: #e74c3c; } /* Rojo suave */
        .level-2 { background-color: #e67e22; } /* Naranja */
        .level-3 { background-color: #f1c40f; color: #444; } /* Amarillo */
        .level-4 { background-color: #2ecc71; } /* Verde */

        .description-box {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .description-box p {
            margin: 0 0 15px 0;
            line-height: 1.6;
        }

        .goal-text {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.3rem;
            text-align: center;
            color: var(--color-oliva-oscuro);
            background-color: rgba(39, 43, 0, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .continue-btn {
            background-color: var(--color-oliva-oscuro);
            color: var(--color-crema);
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-family: 'Patrick Hand', cursive;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .continue-btn:hover {
            background-color: var(--color-oliva-medio);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--color-oliva-oscuro);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="results-container" class="results-card">
        <div class="loading-spinner"></div>
        <p>Cargando resultados...</p>
    </div>

    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('results-container');

            // Función para obtener los datos y pintar la UI
            async function fetchAndShowResults(user) {
                try {
                    const dbRef = window.ref(window.db, `users/${user.uid}/diagnostico`);
                    const snapshot = await window.get(dbRef);

                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        renderResults(data.score);
                    } else {
                        container.innerHTML = `
                            <span class="panda-result">🐼❓</span>
                            <h2>No encontramos resultados</h2>
                            <p>Parece que aún no has realizado la prueba inicial.</p>
                            <a href="prueba inicial.html" class="continue-btn">Hacer Prueba</a>
                        `;
                    }
                } catch (error) {
                    console.error("Error trayendo resultados:", error);
                    container.innerHTML = "<p>Error al cargar los datos. Intenta recargar la página.</p>";
                }
            }

            // Función para determinar nivel y mostrar HTML
            function renderResults(score) {
                let level = "";
                let levelClass = "";
                let description = "";
                let pandaEmoji = "🐼";

                // Lógica de Niveles
                if (score >= 0 && score <= 131) {
                    level = "Nivel 1: ¡Comenzando!";
                    levelClass = "level-1";
                    pandaEmoji = "🐼_seedling";
                    description = "¡No te preocupes! Todo experto fue alguna vez un principiante. Tienes un camino emocionante por delante lleno de descubrimientos. Este es el primer paso para construir tu fortaleza.";
                } else if (score >= 132 && score <= 155) {
                    level = "Nivel 2: En Progreso";
                    levelClass = "level-2";
                    pandaEmoji = "🐼_climbing";
                    description = "¡Vas por buen camino! Ya tienes las bases claras y estás construyendo tu conocimiento. Con un poco más de práctica y constancia, verás cómo todo empieza a encajar.";
                } else if (score >= 156 && score <= 198) {
                    level = "Nivel 3: ¡Casi allí!";
                    levelClass = "level-3";
                    pandaEmoji = "🐼_star";
                    description = "¡Excelente trabajo! Demuestras un buen dominio de los conceptos. Estás muy cerca de la maestría, solo necesitas pulir algunos detalles y ganar velocidad.";
                } else if (score >= 199 && score <= 300) {
                    level = "Nivel 4: ¡Experto!";
                    levelClass = "level-4";
                    pandaEmoji = "🐼_trophy";
                    description = "¡Increíble! Tienes un desempeño sobresaliente. Dominas los conceptos clave con seguridad. Tu reto ahora es mantener este nivel y seguir aprendiendo cosas nuevas.";
                }

                // Ajuste de emojis simple (los emojis de texto no soportan modificadores complejos, usaremos basicos)
                if (score <= 131) pandaEmoji = "🌱";
                else if (score <= 155) pandaEmoji = "🎋";
                else if (score <= 198) pandaEmoji = "⭐";
                else pandaEmoji = "🏆";

                container.innerHTML = `
                    <div class="panda-result">${pandaEmoji}</div>
                    <h2 class="score-title">Tu Puntaje</h2>
                    <div class="score-number">${score}</div>
                    <div class="score-label">Puntos</div>
                    
                    <div class="level-badge ${levelClass}">${level}</div>
                    
                    <div class="description-box">
                        <p>${description}</p>
                    </div>

                    <div class="goal-text">
                        🎯 Nuestro propósito en Skópia es que tú superes el <strong>Nivel 4</strong>.
                    </div>

                    <a href="modulos.html" class="continue-btn">Ir a Módulos</a>
                `;
            }

            // Detectar usuario
            if (window.currentUser) {
                fetchAndShowResults(window.currentUser);
            } else {
                window.addEventListener('userReady', (e) => {
                    fetchAndShowResults(e.detail.user);
                });
            }
        });
    </script>
</body>
</html>
